<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gaia Link Test</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b2a3a;--muted:#5b6b7a;--link:#1d5fd1;--line:#dce3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1a222b;--ink:#e6edf3;--muted:#9aa8b5;--link:#7fb0ff;--line:#2c3742}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);margin:0 0 16px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;color:var(--link);text-decoration:none;font-weight:600;word-break:break-all}
a small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
</style></head><body>
<h1>Which one shows the pin?</h1>
<p>Tap each on the iPhone. Come back here after each one and note the NUMBER that opens Gaia with the Marked Location pin.</p>
<div id="list"></div>
<script>
var lat='3.7250017', lng='113.7848868', q=lat+','+lng, e=encodeURIComponent(q);
var links=[
 ['gaiagps://map?lat='+lat+'&lng='+lng+'&z=17','what we use now'],
 ['gaiagps://search?q='+e,'app search'],
 ['gaiagps://search?query='+e,'app search (query)'],
 ['gaiagps://?q='+e,'app with q'],
 ['gaiagps://map?q='+e,'app map with q'],
 ['gaiagps://waypoint?lat='+lat+'&lng='+lng,'app waypoint'],
 ['https://www.gaiagps.com/map/?loc=17/'+lng+'/'+lat,'web map'],
 ['https://www.gaiagps.com/map/?q='+e,'web map search'],
 ['https://www.gaiagps.com/search/?q='+e,'web search'],
 ['geo:'+q+'?q='+q,'standard location link']
];
document.getElementById('list').innerHTML=links.map(function(l,i){
  return '<a href="'+l[0]+'">'+(i+1)+'. '+l[1]+'<small>'+l[0]+'</small></a>';}).join('');
</script></body></html>
