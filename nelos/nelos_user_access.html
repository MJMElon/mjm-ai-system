<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The page is the deploy: the tick list below lives in it, so a cached
     copy goes on offering yesterday's labels and yesterday's functions.
     These three are the only lever, the site being GitHub Pages with no
     build step and nowhere to set a header. One hard reload per machine
     to pick them up in the first place. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Assess Control — Nursery Case Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%238b5cf6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_staff_gate.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=4"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
MJMModuleAccess.init({
  module: 'nelos',
  title:  'Nursery Case Log',
  moduleLabel: 'Nelos',
  icon:   '🗂️',
  accent: 'violet',
  back:   { href: 'nelos_dashboard.html', label: 'Back' },
  note:   `This page is about the two doors under the Case Log, Automate Cases and
           User Setting — not about who may solve, edit, delete, close or raise a
           CASE. Those five rights are per seat, on User Setting &rarr; Case Handlers,
           and stay there; this screen does not touch them.`,
  pages: [
    { key:'automation', label:'Automate Cases', desc:'Rules that raise a case by itself on a schedule or a condition, and moving an automatic title between solvers',
      actions:[
        { key:'manage', label:'Open Automate Cases', desc:'See and change which conditions raise a case automatically',
          adminOnly:true, highlight:true, chip:'Automate Cases' }
      ]},
    { key:'settings', label:'User Setting', desc:'Case Handlers (who may solve, edit, delete, close and raise a case), seat assignment and Case Routing',
      actions:[
        { key:'manage', label:'Open User Setting', desc:'Set up case handlers and their rights, which systems a seat covers, and which solver a case category routes to',
          adminOnly:true, highlight:true, chip:'User Setting' }
      ]}
  ]
});
</script>
</body>
</html>
