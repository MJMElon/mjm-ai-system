<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The page is the deploy: the tick list below lives in it, so a cached
     copy goes on offering yesterday's labels and yesterday's functions.
     These three are the only lever, the site being GitHub Pages with no
     build step and nowhere to set a header. One hard reload per machine
     to pick them up in the first place. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Assess Control — Nursery Operation Manage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b4332'/%3E%3Cpath d='M20 44C20 26 32 18 46 18C46 32 38 44 20 44Z' fill='%23d8f3dc'/%3E%3Cpath d='M20 44L32 32' stroke='%23d8f3dc' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_staff_gate.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=4"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
MJMModuleAccess.init({
  module: 'nursery_ops',
  title:  'Nursery Operation Manage',
  moduleLabel: 'Nursery Ops',
  icon:   '🌿',
  accent: 'teal',
  back:   { href: 'nursery_ops_dashboard.html', label: 'Back' },
  pages: [
    { key:'schedule', label:'Work Schedule', desc:'The monthly nursery work schedule on the main board',
      actions:[
        { key:'edit_schedule', label:'Edit the schedule', desc:'Open Edit Schedule and change the month’s planned work' }
      ]},
    { key:'seeds', label:'Seeds Control', desc:'Seed lots, germination and sowing records',
      actions:[
        { key:'manage', label:'Add, edit & delete seed records', desc:'Key in new seed lots and change existing ones' }
      ]},
    { key:'plot_life', label:'Life of Plot', desc:'The history of every plot, stage by stage',
      actions:[
        { key:'manage', label:'Edit plot life records', desc:'Change the stages and dates recorded against a plot' }
      ]},
    { key:'maintenance', label:'Nursery Maintenance Schedule & Work Record', desc:'Work records, spraying schedule, dosage and the worker record',
      actions:[
        { key:'add_record',   label:'Add & edit work records', desc:'Key in a maintenance job, or change one already keyed' },
        { key:'tick_schedule',label:'Tick and save the schedule', desc:'Set which plots are treated in each week of the month' },
        { key:'worker_record',label:'Tick the Worker Record', desc:'Mark which worker did which job, feeding the salary claim' },
        /* THE STANDARD APPROVE TICK. A phone record the Field Conductor
           rejected can be overridden by the office and accepted anyway —
           approveSubmission() in plot_maintenance_script.js — and that had
           NO gate at all: anybody who could open this page could already
           press it. `fallbackTo:'view'` is what keeps that true for
           everybody already configured here: a row saved before this key
           existed has no opinion on 'approve', and reading an absent key
           as OFF would take the button away from people who have always
           had it. Once somebody explicitly saves this tick either way,
           their own answer is what is read — mayMaintAct('approve','view')
           in plot_maintenance_script.js is the same fallback, by name. */
        { key:'approve',      label:'Approve a submitted work record',
          desc:'Accept a Worker Portal submission the Field Conductor sent back, overriding the rejection',
          fallbackTo:'view' },
        /* VERIFY AND UNLOCK ARE TWO TICKS, the same split the payroll
           module's own strip has: being trusted to say a sheet is right is
           not the same as being trusted to unsay it.

           `fallbackTo` is what keeps the day this shipped from taking the
           button away. A row the office saved before these keys existed
           carries neither, and effectiveActions reads an absent key as OFF
           — so every configured person would have lost a button they never
           had taken from them. What they ANSWERED is the Worker Record
           tick: until this existed, whoever could tick the sheet could
           change anything on it. That is what is read until the row is
           saved again. plot_maintenance_script.js declares the same
           fallback in mayMaintAct(), and a test holds the two together. */
        { key:'verify',       label:'Verify & lock a Worker Record sheet',
          desc:'Sign off one job for one nursery and month, so its ticks and figures stop being editable',
          fallbackTo:'worker_record' },
        { key:'unverify',     label:'Unlock a verified Worker Record sheet',
          desc:'Take one sheet’s signature back so it can be corrected',
          fallbackTo:'worker_record' },
        /* THE LABEL IS WHAT THE TAB ACTUALLY HOLDS, and it took a wrong one
           to learn that. It read "Open Setting (piece rates, plots,
           workers)", which was true when it was written and has not been for
           a while: the PIECE RATES moved to Payroll → Settings → Piece Rate,
           on their own permission, and the WORKERS come off the payroll
           register through the Worker System board. The Setting tab is plot
           capacity, the chemical list and the fertiliser list, and nothing
           else. The office ticked this expecting rates, opened the tab and
           said so — a label naming two screens it does not open sends
           somebody looking for a fault that is not there. */
        { key:'setting',      label:'Open Setting (plot capacity, chemicals, fertilisers)',
          desc:'Change what a plot holds and the chemical and fertiliser lists. Piece rates are in Payroll → Settings',
          adminOnly:true, highlight:true, chip:'Maintenance Setting' }
      ]},
    { key:'motion', label:'Motion Study Settings', desc:'Standard timings used to plan the work',
      actions:[
        { key:'manage', label:'Edit motion study timings', desc:'Change the standard time allowed for each job' }
      ]},
    /* PALMS is recorded in the field on the 555 FC Portal; this page READS
       that record. There is no action under it — the office does not key plot
       status in, so open or closed is the whole question.

       The Plot Motion Study sat beside it and its page is gone, so its row is
       too: a tick for a page nobody can open is a permission that cannot be
       obeyed, which this system has a heading about. A tick somebody already
       saved under `palms_motion` is harmless and is deliberately not cleared
       — nothing reads it, and a file of SQL deleting somebody's saved answer
       is a worse thing than a dead key. */
    { key:'palms_board', label:'PALMS Plot Status Map', desc:'What every plot is on today, and what is running late' }
  ]
});
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
