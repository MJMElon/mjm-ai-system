<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>Life of Plot · MJM Nursery</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/shared_supabase.js"></script>
    <script src="../shared/shared_staff_gate.js"></script>
    <script src="../shared/shared_access.js"></script>
    <style>
        body { font-family: 'Outfit', system-ui, sans-serif; background: #f1f5f9; }
        .lp-wrap { overflow-x: auto; }
        table.lp { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 13px; }
        table.lp th, table.lp td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; white-space: nowrap; }
        table.lp th { background: #f8fafc; color: #64748b; font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
        table.lp td.name, table.lp th.name { position: sticky; left: 0; background: #fff; text-align: left; z-index: 1; }
        table.lp th.name { background: #f8fafc; z-index: 2; }
        table.lp tr.grp td { background: #ccfbf1; color: #134e4a; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
        table.lp tr.sub td { background: #f0fdfa; font-weight: 800; color: #0f766e; }
        table.lp tr.tot td { background: #134e4a; color: #fff; font-weight: 900; }
        table.lp tr.cum td { color: #64748b; font-style: italic; }
        table.lp td.yr { background: #f8fafc; font-weight: 800; }
        table.lp td.dash { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
    <div class="flex items-center justify-between gap-4 mb-5 flex-wrap">
        <div class="flex items-center gap-4">
            <a href="operation_dashboard.html" class="text-[10px] font-bold text-slate-500 hover:text-teal-700 uppercase tracking-widest bg-white px-4 py-2 rounded-full border border-slate-200 no-underline">&#8592; Dashboard</a>
            <div>
                <h1 class="text-xl font-black text-slate-800 uppercase tracking-widest">Life of Plot</h1>
                <p class="text-[11px] font-bold text-slate-400">Seedlings transplanted into each plot, month by month, read off the system.</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest" for="lp-year">Year</label>
            <select id="lp-year" class="h-10 px-3 rounded-xl border border-slate-200 bg-white font-bold text-slate-700 text-sm"></select>
        </div>
    </div>

    <div id="lp-status" class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm font-bold text-slate-400">Loading…</div>
    <div id="lp-body" class="hidden">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="lp-wrap"><table class="lp" id="lp-table"></table></div>
        </div>
        <p id="lp-note" class="text-[11px] font-bold text-slate-400 mt-3"></p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://kibqjztozokohqmhqqqf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const NURSERY_LABEL = { BNN: 'BNN', UNN1: 'UNN 1', UNN2: 'UNN 2', OTHER: 'Not in Seedling Stock' };
    const NURSERY_ORDER = ['BNN', 'UNN1', 'UNN2', 'OTHER'];

    // ── BEGIN build (pure: rows in, figures out — the test lifts this block) ──
    function lpNurKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
    function lpPlotKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(^|[A-Z])0+(\d)/g, '$1$2'); }
    function lpIsReplant(s) { return /-R/i.test(String(s || '')); }
    function lpNaturalCmp(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); }
    function buildLifePlot(plots, rows, year) {
        const yr = String(year);
        const nurOfPlot = new Map();
        (plots || []).forEach(p => {
            if (lpIsReplant(p.plot_name)) return;
            const n = lpNurKey(p.nursery_name);
            nurOfPlot.set(lpPlotKey(p.plot_name), { name: p.plot_name, nursery: NURSERY_ORDER.includes(n) ? n : 'OTHER' });
        });
        const byPlot = new Map();
        (rows || []).forEach(r => {
            const d = String(r.transaction_date || '').slice(0, 10);
            if (!d || d.slice(0, 4) !== yr) return;
            if (lpIsReplant(r.plot_name)) return;
            const k = lpPlotKey(r.plot_name);
            if (!byPlot.has(k)) {
                const known = nurOfPlot.get(k);
                byPlot.set(k, { name: known ? known.name : r.plot_name, nursery: known ? known.nursery : 'OTHER', m: Array(12).fill(0) });
            }
            byPlot.get(k).m[Number(d.slice(5, 7)) - 1] += Number(r.quantity_change) || 0;
        });
        // A plot in Seedling Stock with no transplant this year still gets its row, so an
        // empty plot is seen as empty rather than missing.
        nurOfPlot.forEach((v, k) => {
            if (!byPlot.has(k) && v.nursery !== 'OTHER') byPlot.set(k, { name: v.name, nursery: v.nursery, m: Array(12).fill(0) });
        });
        const groups = NURSERY_ORDER.map(key => {
            const list = [...byPlot.values()].filter(p => p.nursery === key).sort((a, b) => lpNaturalCmp(a.name, b.name));
            const m = Array(12).fill(0);
            list.forEach(p => p.m.forEach((v, i) => { m[i] += v; }));
            return { key, label: NURSERY_LABEL[key], plots: list.map(p => ({ plot: p.name, m: p.m, total: p.m.reduce((a, b) => a + b, 0) })), m, total: m.reduce((a, b) => a + b, 0) };
        }).filter(g => g.plots.length || g.key !== 'OTHER');
        const m = Array(12).fill(0);
        groups.forEach(g => g.m.forEach((v, i) => { m[i] += v; }));
        const cum = []; let run = 0;
        m.forEach(v => { run += v; cum.push(run); });
        return { groups, m, total: m.reduce((a, b) => a + b, 0), cum };
    }
    // ── END build ──

    async function lpFetchAll(build) {
        const out = [];
        for (let from = 0; ; from += 1000) {
            const { data, error } = await build().range(from, from + 999);
            if (error) throw error;
            out.push(...(data || []));
            if (!data || data.length < 1000) break;
        }
        return out;
    }

    const nf = n => (n ? Number(n).toLocaleString('en-MY') : '');

    function render(model) {
        const head = '<tr><th class="name">Plot</th>' + MONTHS.map(m => `<th>${m}</th>`).join('') + '<th class="yr">Total</th></tr>';
        let h = '<thead>' + head + '</thead><tbody>';
        model.groups.forEach(g => {
            h += `<tr class="grp"><td class="name" colspan="14">${g.label}</td></tr>`;
            g.plots.forEach(p => {
                h += '<tr><td class="name">' + p.plot + '</td>' + p.m.map(v => `<td class="${v ? '' : 'dash'}">${v ? nf(v) : '–'}</td>`).join('') + `<td class="yr">${nf(p.total) || '–'}</td></tr>`;
            });
            if (!g.plots.length) h += '<tr><td class="name" colspan="14" style="text-align:left;color:#94a3b8;font-weight:700">No plots.</td></tr>';
            h += '<tr class="sub"><td class="name">Total ' + g.label + '</td>' + g.m.map(v => `<td>${nf(v) || '–'}</td>`).join('') + `<td class="yr">${nf(g.total) || '–'}</td></tr>`;
        });
        h += '<tr class="tot"><td class="name">Total</td>' + model.m.map(v => `<td>${nf(v) || '–'}</td>`).join('') + `<td>${nf(model.total) || '–'}</td></tr>`;
        h += '<tr class="cum"><td class="name">Cumulative</td>' + model.cum.map(v => `<td>${nf(v) || '–'}</td>`).join('') + '<td></td></tr>';
        h += '</tbody>';
        document.getElementById('lp-table').innerHTML = h;
    }

    async function load() {
        const year = Number(document.getElementById('lp-year').value);
        const status = document.getElementById('lp-status');
        status.classList.remove('hidden');
        status.textContent = 'Loading…';
        document.getElementById('lp-body').classList.add('hidden');
        try {
            const [plots, rows, nodate] = await Promise.all([
                lpFetchAll(() => _supabase.from('shared_plots').select('plot_name, nursery_name, is_active').order('plot_name')),
                lpFetchAll(() => _supabase.from('shared_inventory_logs')
                    .select('id, plot_name, transaction_date, quantity_change')
                    .eq('transaction_type', 'Transplanted')
                    .gte('transaction_date', `${year}-01-01`).lt('transaction_date', `${year + 1}-01-01`)
                    .order('id', { ascending: true })),
                _supabase.from('shared_inventory_logs').select('id', { count: 'exact', head: true })
                    .eq('transaction_type', 'Transplanted').is('transaction_date', null),
            ]);
            if (nodate.error) throw nodate.error;
            const model = buildLifePlot(plots, rows, year);
            render(model);
            const noDate = nodate.count || 0;
            document.getElementById('lp-note').textContent = `Figures are the Transplanted records dated in ${year}. `
                + (noDate ? `${nf(noDate)} transplant record(s) have no date and are not counted in any month.` : '');
            status.classList.add('hidden');
            document.getElementById('lp-body').classList.remove('hidden');
        } catch (e) {
            status.textContent = 'Could not read the transplant records: ' + (e && e.message ? e.message : e);
        }
    }

    (async function boot() {
        const sel = document.getElementById('lp-year');
        const now = new Date().getFullYear();
        for (let y = now; y >= 2025; y--) sel.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`);
        sel.addEventListener('change', load);
        try {
            await MJMAccess.load(_supabase);
            if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
            if (!MJMAccess.canOpenOperationPage('lifeplot')) {
                document.getElementById('lp-status').textContent = 'You do not have access to Life of Plot.';
                return;
            }
            await load();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not sign you in: ' + (e && e.message ? e.message : e);
        }
    })();
</script>
</body>
</html>
