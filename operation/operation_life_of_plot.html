<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>Life of Plot · MJM Nursery</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/shared_supabase.js"></script>
    <script src="../shared/shared_staff_gate.js"></script>
    <script src="../shared/shared_access.js"></script>
    <script src="../shared/shared_palms.js?v=7"></script>
    <style>
        /* Batch Record's look, so the two read as one system. */
        body { background-color: #f8f4ec; margin: 0; font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
        .bg-pattern { position: fixed; inset: 0; background-image: radial-gradient(#e8dcc8 1px, transparent 1px); background-size: 24px 24px; z-index: -2; opacity: 0.5; }
        .panel { background-color: rgba(253, 250, 244, 0.95); border: 1px solid #ffffff; box-shadow: 0 25px 50px -12px rgba(61, 38, 16, 0.08); border-radius: 2rem; }
        .lp-back { font-size: 10px; font-weight: 700; color: #8a7a68; text-transform: uppercase; letter-spacing: .1em; background: #f8f4ec; padding: 10px 18px; border-radius: 12px; text-decoration: none; box-shadow: 0 1px 2px rgba(61,38,16,.06); }
        .lp-back:hover { background: #e8dcc8; color: #3d2610; }
        table.lp { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 13px; width: 100%; }
        table.lp th, table.lp td { padding: 16px; border-bottom: 1px solid #f8f4ec; text-align: right; white-space: nowrap; vertical-align: middle; }
        table.lp th { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #8a7a68; padding: 12px 16px; border-bottom: 2px solid #e8dcc8; }
        table.lp td { font-size: 13px; font-weight: 600; color: #1a150d; }
        table.lp td.l, table.lp th.l { text-align: left; }
        table.lp tbody tr.plotrow { cursor: pointer; }
        table.lp tbody tr.plotrow:hover td { background: #fdfaf4; }
        table.lp tr.grp td { background: #f1ead9; color: #5c3d1e; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 10px 16px; border-bottom: 1px solid #e8dcc8; }
        table.lp tfoot tr.tot td { font-weight: 900; color: #3d2610; border-top: 2px solid #e8dcc8; border-bottom: none; }
        table.lp td.batch { font-weight: 900; }
        table.lp td.dash { color: #c9bba8; }
        table.lp td.adj { color: #4a7a2e; font-weight: 800; }
        table.lp td.cull { color: #1a150d; }
        .lp-chip-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #8a7a68; }
        .lp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .lp-chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #e8dcc8; background: #fdfaf4; font-weight: 700; font-size: 12px; color: #5c3d1e; cursor: pointer; }
        .lp-chip:hover { border-color: #6aa83c; color: #4a7a2e; }
        .lp-chip.on { background: #4a7a2e; border-color: #4a7a2e; color: #fdfaf4; }
        /* Map view: the Inventory Map pattern, one shape per plot. */
        .lp-legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11px; font-weight:700; color:#8a7a68; }
        .lp-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
        .lp-tabs { display:flex; gap:8px; flex-wrap:wrap; background:#f1ead9; border:1px solid #e8dcc8; border-radius:16px; padding:6px; }
        .lp-tab { padding:8px 16px; font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.08em; border-radius:12px; color:#8a7a68; background:#fdfaf4; border:1.5px solid transparent; cursor:pointer; }
        .lp-tab:hover { color:#3d2610; }
        .lp-head-tabs { min-width:90px; justify-content:flex-end; }
        .lp-head-tabs:empty { display:none; }
        .lp-tab.on { background:#4a7a2e; color:#fdfaf4; border-color:#3f6a26; }
        /* The cats on the map, one stage each. They are part of the MAP, not
           of the label: sized off the plot and scattered over it, so they
           shrink when the map is zoomed out and are big enough to see what
           they are doing when it is zoomed in (the office asked for both). */
        .lp-cats { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
        .lp-cat { position:absolute; transform:translate(-50%,-100%); filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
        .lp-cat img { display:block; height:100%; width:auto; transform-origin:50% 100%; }
        .lp-cat picture { display:block; height:100%; }
        .lp-cat.wide picture { height:auto; width:100%; }
        .lp-cat.wide img { width:100%; height:auto; }
        .lp-map-row { display:flex; gap:16px; align-items:stretch; }
        .lp-map-row .lp-viewport { flex:1 1 auto; min-width:0; }
        .lp-key { flex:0 0 auto; min-width:200px; display:flex; flex-direction:column; gap:10px; padding:14px; border:1px solid #e8dcc8; border-radius:16px; background:#fffdf8; }
        .lp-key-h { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#8a7a68; }
        .lp-key-r { display:flex; gap:10px; align-items:center; }
        .lp-key-r i { flex:0 0 26px; height:26px; border-radius:7px; border:2px solid; }
        .lp-key-cat { flex:0 0 48px; width:48px; height:34px; object-fit:contain; }
        .lp-key-r b { display:block; font-size:13px; font-weight:900; color:#3d2610; white-space:nowrap; }
        @media (max-width: 900px) { .lp-map-row { flex-direction:column; } .lp-key { flex-basis:auto; flex-direction:row; flex-wrap:wrap; } }
        .lp-viewport { position:relative; width:100%; height:min(70vh, 640px); min-height:380px; overflow:hidden; background:#efe8d8; border-radius:16px; touch-action:none; }
        .lp-stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:grab; transform-origin:center center; }
        .lp-stage.drag { cursor:grabbing; }
        .lp-map-img { max-height:calc(min(70vh, 640px) - 24px); width:auto; display:block; user-select:none; -webkit-user-drag:none; }
        .lp-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
        .lp-shape { pointer-events:auto; cursor:pointer; transition:fill .2s, stroke-width .2s; }
        .lp-shape:hover { stroke-width:.8; }
        .lp-labels { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
        .lp-label { position:absolute; display:flex; flex-direction:column; align-items:center; text-align:center; transform:translate(-50%,-50%) scale(calc(1 / var(--lp-z, 1))); transform-origin:center center; max-width:140px; }
        .lp-tag { font-size:10px; font-weight:900; background:#fff; padding:2px 7px; border-radius:6px; color:#3d2610; border:1px solid #e8dcc8; text-transform:uppercase; letter-spacing:.04em; box-shadow:0 2px 6px rgba(61,38,16,.15); }
        .lp-zoom { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:4px; z-index:5; background:#fff; border-radius:10px; padding:4px; border:1px solid #e8dcc8; box-shadow:0 4px 10px rgba(61,38,16,.12); }
        .lp-zbtn { width:28px; height:28px; border:none; background:#fff; color:#5c3d1e; font-weight:900; font-size:14px; border-radius:6px; cursor:pointer; }
        .lp-zbtn:hover { background:#f1ead9; }
        .lp-zlvl { font-size:9px; font-weight:800; color:#8a7a68; text-align:center; padding:2px 0; border-top:1px solid #e8dcc8; border-bottom:1px solid #e8dcc8; }
        /* Side bar: the two ways into the plots. */
        .lp-shell { display:grid; grid-template-columns:230px minmax(0,1fr); gap:24px; align-items:start; }
        .lp-side { position:sticky; top:16px; padding:16px 12px; border-radius:1.5rem; display:flex; flex-direction:column; gap:4px; }
        .lp-side-h { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#8a7a68; padding:4px 10px 10px; }
        .lp-side-b { display:flex; align-items:center; gap:10px; text-align:left; padding:10px 12px; border-radius:12px; border:none; background:transparent; font-weight:700; font-size:13px; color:#5c3d1e; cursor:pointer; }
        .lp-side-b:hover { background:#f1ead9; }
        .lp-side-b.on { background:#4a7a2e; color:#fdfaf4; }
        .lp-side-i { width:18px; text-align:center; opacity:.85; }
        .lp-side-foot { margin-top:12px; position:relative; }
        .lp-side-foot::before { content:''; position:absolute; left:0; right:0; top:-7px; border-top:1px solid #e8dcc8; }
        .lp-palms-box { overflow:hidden; padding:0; }
        /* Settings: what the office set by hand, keyed here instead. */
        .lp-set-sec { padding:20px 24px; margin-bottom:18px; }
        .lp-set-h { font-size:13px; font-weight:900; color:#3d2610; margin-bottom:12px; }
        .lp-set-row { display:grid; grid-template-columns:230px auto 1fr; align-items:center; gap:12px; padding:6px 0; font-size:13px; font-weight:700; color:#5c3d1e; }
        @media (max-width: 640px) { .lp-set-row { grid-template-columns:1fr auto; } .lp-set-row > span:last-child { grid-column:1 / -1; } }
        .lp-set-row input[type=number] { width:76px; padding:6px 8px; border:1px solid #e8dcc8; border-radius:8px; font-weight:800; text-align:right; background:#fff; }
        .lp-set-row input[type=text] { width:220px; padding:6px 8px; border:1px solid #e8dcc8; border-radius:8px; font-weight:700; background:#fff; }
        .lp-set-row .lp-set-sw { position:relative; display:block; width:30px; height:30px; min-width:0; border-radius:8px; border:2px solid; cursor:pointer; }
        .lp-set-row .lp-set-sw.ro { cursor:default; }
        .lp-set-sw input[type=color] { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; cursor:inherit; }
        .lp-set-row select { padding:6px 8px; border:1px solid #e8dcc8; border-radius:8px; font-weight:700; background:#fff; }
        .lp-set-row i { display:inline-block; width:22px; height:22px; border-radius:6px; border:2px solid; }
        .lp-set-foot { display:flex; align-items:center; gap:8px; justify-content:flex-end; margin-top:6px; min-height:4px; }
        /* Cycles set by hand: the bar over a plot, and the editor. */
        .lp-cyc-bar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; }
        .lp-cyc-bar:empty { display:none; }
        .lp-cyc-bar { align-items:center; }
        .lp-ce-cyc { outline:2px dashed transparent; outline-offset:-2px; transition:outline-color .12s, background .12s; }
        .lp-ce-cyc.over { outline-color:#4a7a2e; background:#f3f7ec; }
        .lp-ce-row { cursor:grab; }
        .lp-ce-row td.batch::before { content:'⠿'; color:#b9a88e; margin-right:8px; font-weight:400; }
        .lp-ce-row:hover td { background:#f6efe2 !important; }
        .lp-ce-row.drag { opacity:.4; }
        .lp-ce-new { border:2px dashed #d9c8a8; background:#fffdf8; }
        .lp-ce-drop { padding:22px; text-align:center; font-size:12px; font-weight:800; color:#a8957a; }
        .lp-ce-x { margin-left:auto; border:1px solid #e8dcc8; background:#fff; color:#8a7a68; border-radius:8px; width:26px; height:26px; cursor:pointer; font-weight:900; }
        .lp-set-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
        .lp-set-top .lp-set-h { margin-bottom:0; }
        .lp-set-save, .lp-set-edit, .lp-set-cancel { padding:5px 14px; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer; }
        .lp-set-save { border:0; background:#4a7a2e; color:#fdfaf4; }
        .lp-set-edit, .lp-set-cancel { border:1px solid #e8dcc8; background:#fff; color:#5c3d1e; }
        .lp-set-edit:hover, .lp-set-cancel:hover { background:#f1ead9; }
        .lp-set-row input:disabled { background:#fbf7ef; color:#5c3d1e; }
        .lp-set-save:disabled { opacity:.5; cursor:default; }
        .lp-set-msg { font-size:12px; font-weight:700; color:#8a7a68; }
        #lp-palms-frame { display:block; width:100%; height:calc(100vh - 190px); min-height:620px; border:0; border-radius:2rem; background:#fff; }
        @media (max-width: 900px) {
            .lp-shell { grid-template-columns:1fr; }
            .lp-side { position:static; flex-direction:row; flex-wrap:wrap; }
            .lp-side-h { display:none; }
        }
        /* Cycles: one card per cycle, newest first, each with its own total. */
        .lp-cyc { margin-bottom:20px; }
        .lp-cyc-h { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; padding:16px 18px 6px; }
        .lp-cyc-n { font-size:15px; font-weight:900; color:#3d2610; }
        .lp-cyc-tag { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; background:#f1ead9; color:#8a7a68; }
        .lp-cyc-tag.cur { background:#e5f0dc; color:#3f6a26; }
        .lp-cyc-d { font-size:12px; font-weight:700; color:#5c3d1e; }
        .lp-cyc-cap { margin-left:auto; font-size:12px; font-weight:700; color:#8a7a68; }
        .lp-cyc-cap b { font-size:16px; color:#3d2610; font-weight:900; }
        /* Pusingan Jualan / Transplant: a plot per row, a month per column. */
        .lp-rot-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px 20px; margin-bottom:14px; }
        .lp-rot-t { font-size:15px; font-weight:900; color:#3d2610; }
        .lp-rot-s { font-size:11px; font-weight:700; color:#8a7a68; margin-top:2px; }
        .lp-rot-wrap { overflow-x:auto; }
        .lp-rot-grid { display:grid; grid-template-columns:110px repeat(12, minmax(62px,1fr)); gap:6px; min-width:960px; font-variant-numeric:tabular-nums; }
        .lp-rot-mh { text-align:center; font-size:11px; font-weight:800; color:#8a7a68; text-transform:uppercase; letter-spacing:.06em; padding:4px 0; }
        .lp-rot-mh.now { color:#a83020; }
        .lp-rot-plot { align-self:center; }
        .lp-rot-plot b { display:block; font-size:14px; font-weight:900; color:#3d2610; }
        .lp-rot-c { height:46px; border:1px solid #e8dcc8; border-radius:8px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#3d2610; }
        .lp-rot-c small { font-size:10px; font-weight:600; }
        .lp-rot-c.fut { background:#f1ede2; border-color:#f1ede2; }
        .lp-rot-c.c1 { background:#F5E6C8; border-color:#F5E6C8; color:#5B3F12; }
        .lp-rot-c.c2 { background:#DDA04B; border-color:#DDA04B; color:#3F2A08; }
        .lp-rot-c.c3 { background:#B8730E; border-color:#B8730E; color:#fff; }
        .lp-rot-c.t1 { background:#2E7D4F; border-color:#2E7D4F; color:#fff; }
        .lp-rot-c.old { background:#fff; border:1px solid #DDA04B; color:#8a7a68; font-weight:600; }
        .lp-rot-c.pc { border:2px dashed #B8732A; color:#8a7a68; font-weight:600; }
        .lp-rot-c.pt { border:2px dashed #2E7D4F; color:#8a7a68; font-weight:600; }
        /* One cycle, one table read across: a rule before each part, its heading coloured. */
        /* The cycle table is read for a long time, so it is calm: headings in
           ordinary case and muted, figures in a regular weight, the three
           sections each on a faint tint of their own, a soft stripe to keep
           the eye on the row, and a dash greyed out so empty reads as empty. */
        table.lp-x th, table.lp-x td { padding:10px 12px; white-space:nowrap; }
        table.lp-x td { font-weight:500; color:#3a3328; font-size:13px; }
        table.lp-x td.batch { font-weight:800; color:#1a150d; }
        table.lp-x td.cull { color:#3a3328; }
        table.lp-x .s1 { border-left:1px solid #e3d7c3; }
        table.lp-x thead th { text-transform:none; letter-spacing:0; font-size:11.5px; font-weight:600; color:#8a7a68; border-bottom:1px solid #e8dcc8; }
        table.lp-x thead tr:not(.grp-h) th { white-space:normal; line-height:1.3; vertical-align:bottom; }
        .lp-x-wrap { overflow-x:auto; }
        table.lp-x tr.grp-h th { text-align:center; font-size:12px; font-weight:800; letter-spacing:.02em; border-bottom:1px solid #e8dcc8; }
        table.lp-x th.g-t { color:#3f6a26; }
        table.lp-x th.g-c { color:#8a4a2a; }
        table.lp-x col.c-t { background:rgba(106,168,60,.05); }
        table.lp-x col.c-2 { background:rgba(217,119,6,.045); }
        table.lp-x col.c-3 { background:rgba(168,48,32,.04); }
        table.lp-x tbody tr:nth-child(even) td { background:rgba(61,38,16,.025); }
        table.lp-x td { border-bottom:1px solid #f1ead9; }
        table.lp-x td.est { text-align:center; color:#a8957c; font-weight:600; font-style:italic; }
        table.lp-x .mute { color:#c9bba8; font-weight:400; }
        table.lp-x tfoot td { font-weight:800; color:#1a150d; background:#f6f0e4; }
        /* Transplant record: the office sheet, a column per month. */
        table.lp tr.grp td { text-align:left; }
        /* The year record is a GRID (the office: "格子要分明一点"): every cell has
           its line, a soft stripe on the plot rows, the row under the pointer lit,
           the plot and Total columns set apart. */
        table.lp-rec { border-collapse:collapse; }
        table.lp-rec th, table.lp-rec td { padding:8px 10px; border:1px solid #e6dccb; }
        table.lp-rec thead th { background:#f3ecdf; color:#5c3d1e; font-size:11px; text-transform:none; letter-spacing:.02em; font-weight:800; border-bottom:2px solid #d9cbb2; }
        table.lp-rec td { font-weight:500; color:#3a3328; }
        table.lp-rec td:first-child, table.lp-rec th:first-child { border-right:2px solid #d9cbb2; }
        table.lp-rec tr.grp td { background:#efe5d2; color:#5c3d1e; border-top:2px solid #d9cbb2; }
        table.lp-rec tr.plotrow:nth-child(even) td { background:#faf6ee; }
        table.lp-rec tr.plotrow:hover td { background:#eaf3e0; }
        table.lp-rec tbody tr.plotrow { cursor:default; }
        table.lp-rec tr.plotrow td.batch { cursor:pointer; color:#2f6b1f; text-decoration:underline; text-decoration-color:rgba(47,107,31,.35); text-underline-offset:3px; }
        table.lp-rec tr.plotrow td.batch:hover { text-decoration-color:#2f6b1f; }
        table.lp-rec td.has-tip { cursor:help; }
        table.lp-x td.var-tip { cursor:help; text-decoration:underline dotted #b07a3a; text-underline-offset:3px; }
        #lp-tip { white-space:pre-wrap !important; max-width:360px; }
        table.lp-rec td.has-tip:hover { background:#e4efd6 !important; }
        #lp-tip { position:fixed; z-index:50; pointer-events:none; background:#2b2116; color:#fdfaf4; font-size:12px; font-weight:600; line-height:1.5; padding:8px 11px; border-radius:10px; white-space:pre; box-shadow:0 8px 20px rgba(0,0,0,.25); display:none; }
        table.lp-rec td.sum { color:#5c3d1e; }
        table.lp-rec tr.sumrow td { background:#fbf6ec; }
        table.lp-rec tr.tot td { font-weight:900; color:#3d2610; border-top:2px solid #d9cbb2; background:#f4ecdc; }
        table.lp-rec td.yt, table.lp-rec th:last-child { font-weight:900; background:#f4ecdc; border-left:2px solid #d9cbb2; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative">
<div class="bg-pattern"></div>

<div class="max-w-[1400px] mx-auto py-4">
    <!-- Back sits ABOVE the heading, the heading panel carries the title and
         nothing else, and the nursery choice is BELOW it (the office: "back
         在上面一点 BNN UNN1 UNN2在下面 中间只会有标题"). -->
    <div class="mb-3"><a id="lp-back" href="operation_dashboard.html" class="lp-back inline-block">&#8592; Back</a></div>
    <div class="panel p-6 mb-3 text-center">
        <h1 class="text-2xl md:text-3xl font-black uppercase tracking-widest text-[#3d2610]" id="lp-title" style="word-spacing:.2em">Life of Plot</h1>
        <p class="text-[11px] font-bold text-[#8a7a68] mt-1" id="lp-sub"></p>
    </div>
    <!-- ONE nursery choice for the whole page: the plot map and PALMS both
         follow it, so neither draws tabs of its own. -->
    <div class="flex justify-end mb-6"><div id="lp-head-nur" class="lp-tabs lp-head-tabs"></div></div>

    <div class="lp-shell">
    <aside class="lp-side panel" id="lp-side">
        <div class="lp-side-h">Life of Plot</div>
        <button type="button" class="lp-side-b on" data-view="plots"><span class="lp-side-i">&#9638;</span>Plots &amp; cycles</button>
        <button type="button" class="lp-side-b" data-view="record"><span class="lp-side-i">&#9776;</span>Transplant record by year</button>

    function lpNurKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    function lpTransplantDay(r) {

        if (m) return m[1];

    /* A culling: Tabs 5 and 6 keep ONE saved figure per plot and destination

       across destinations, as Tab 5 merges MAIN and D-TONE of one plot.
       Day: the CullDate in the remark. Tab 5 falls back to the day it was
       saved; Tab 6 shows no date, so `day` is null there and `sortDay` (the
       last session, else the save day) is used only to split the cycles. */
    function lpCullFigure(rows, saveDayFallback, nTransplants) {
        const sorted = (rows || []).slice().sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
        const keyed = {}, legacy = [];
        sorted.forEach(r => {
            const rem = String(r.remark || '');

            if (dm) keyed[dm[1]] = r; else legacy.push(r);
        });

        // Older saves: one per transplant row, oldest first, the way Tabs 5 and 6 hand them out.
        if (!use.length && legacy.length) use = legacy.slice(0, Math.max(1, nTransplants || 0));
        if (!use.length) return { qty: 0, day: null, sortDay: null, rows: 0 };
        const dayOf = r => {
            const rem = String(r.remark || '');
            const m = rem.match(/CullDate:\s*(\d{4}-\d{2}-\d{2})/);
            if (m) return m[1];
            return saveDayFallback ? (String(r.created_at || '').slice(0, 10) || null) : null;
        };
        const sessDay = r => {
            const m = String(r.remark || '').match(/CullSessions:(\S+)/);
            if (!m) return null;
            return lpLatest(m[1].split(';').map(x => (x.match(/^(\d{4}-\d{2}-\d{2})/) || [])[1]));
        };
        const main = keyed.main || use[0];
        const day = dayOf(main) || lpEarliest(use.map(dayOf));
        const num = (re) => use.reduce((a, r) => { const m = String(r.remark || '').match(re); return m ? a + Number(m[1]) : a; }, 0);
        const has = (re) => use.some(r => re.test(String(r.remark || '')));

            qty: use.reduce((a, r) => a + Math.abs(Number(r.quantity_change) || 0), 0),
            // Tab 5 writes Alive:, Tab 6 writes MapQty: (the drone count of what was culled).
            alive: has(/Alive:\s*\d/) ? num(/Alive:\s*(\d+)/) : null,
            map: has(/MapQty:\s*\d/) ? num(/MapQty:\s*(\d+)/) : null,
            day,
            sortDay: day || lpLatest(use.map(sessDay)) || lpLatest(use.map(r => String(r.created_at || '').slice(0, 10))),
            rows: use.length,
            // Why the drone map and the culled qty disagree: Tab 6 own MismatchNote.
            note: use.map(r => { const m = String(r.remark || '').match(/MismatchNote:(\S+)/); if (!m) return ''; try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } })
                     .filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join('\n') || null,
        };
    }
    function lpEarliest(days) { return days.filter(Boolean).sort()[0] || null; }
    function lpLatest(days) { return days.filter(Boolean).sort().slice(-1)[0] || null; }
    // An approved calibration against the transplanting report, keyed to the batch it corrects.
    function lpIsApprovedTransplantCal(r) {

    }
    /* A plot is filled, grown and 3rd culled, then filled again: each of those

       batch transplanted AFTER the latest 3rd culling of the cycle before it
       starts a new cycle. A batch with no transplant date of its own (a cull
       with nothing transplanted here) stays in the cycle it falls in. */
    /* THE OFFICE MAY SET A PLOT'S CYCLES BY HAND (the office: "我可以自己加cycle
       然后drag来drag去"): `override` is the cycles as lists of batch keys. A batch
       it does not name (one transplanted since) goes into the latest cycle that
       had started by its transplant day. Without one, the rule below decides. */
    /* The day a batch is placed in time by: its transplant day, else (a batch the
       plot never had a transplant row for, one that came by transfer) the first
       thing that happened to it there, its 2nd culling, then its 3rd. A batch with
       no transplant day used to sort LAST, so a cycle made of one read as the
       newest whatever its dates said (the office: "你应该auto区分哪一个才是最新的
       cycle"). */
    function lpBatchDay(b) { return (b && (b.tDate || b.c2Date || b.c3Sort || b.c3Date)) || null; }
    function lpCyclesByHand(batches, override) {
        const groups = override.map(() => []), at = {}, loose = [];
        override.forEach((list, i) => (list || []).forEach(k => { at[String(k)] = i; }));
        (batches || []).forEach(b => { const i = at[lpBatchKey(b.batch)]; if (i != null) groups[i].push(b); else loose.push(b); });
        loose.forEach(b => {
            let best = -1;
            groups.forEach((g, i) => { const st = lpEarliest(g.map(lpBatchDay)); if (st && lpBatchDay(b) && st <= lpBatchDay(b)) best = i; });
            if (best < 0) best = groups.findIndex(g => g.length);
            groups[best < 0 ? 0 : best].push(b);
        });
        const byDay = (x, y) => (lpBatchDay(x) || '9999').localeCompare(lpBatchDay(y) || '9999') || lpNatural(x.batch, y.batch);
        return groups.filter(g => g.length).map(g => g.slice().sort(byDay))
            .sort((x, y) => (lpEarliest(x.map(lpBatchDay)) || '9999').localeCompare(lpEarliest(y.map(lpBatchDay)) || '9999'));
    }
    function lpCycles(batches, override) {
        const cycles = [];
        let cur = null;
        if (override && override.length) lpCyclesByHand(batches, override).forEach(g => cycles.push({ batches: g }));
        else (batches || []).forEach(b => {
            /* A new cycle starts with a batch transplanted after the plot's 3rd
               culling BEGAN: the FIRST real culling of the cycle (one carrying a
               Cull Date or a drone map), not the last. B1: 234 culled 1 Jun 2026,
               252 went in 14 Jun, while 237 and 241 were culled on 2 Aug; asked of
               the last culling, 252 to 268 were read as the same cycle. A Tab 6 row
               saved with neither is not a culling and is not asked; a cycle with
               only such rows falls back to its latest, as before. */
            const real = cur ? cur.batches.filter(x => x.c3Sort && (x.c3Date || x.c3Map != null)).map(x => x.c3Sort) : [];
            const cutC3 = cur ? (real.length ? lpEarliest(real) : lpLatest(cur.batches.map(x => x.c3Sort))) : null;
            if (!cur || (b.tDate && cutC3 && b.tDate > cutC3)) { cur = { batches: [] }; cycles.push(cur); }
            cur.batches.push(b);
        });
        return cycles.map((c, i) => {
            const bs = c.batches;
            const done = bs.some(b => b.c3Sort) && (i < cycles.length - 1 || bs.every(b => b.c3Sort || !b.tAdj));
            return {
                n: i + 1, batches: bs, current: i === cycles.length - 1,
                start: lpEarliest(bs.map(b => b.tDate)) || lpEarliest(bs.map(lpBatchDay)),
                end: done ? lpLatest(bs.map(b => b.c3Sort)) : null,
                tQty: bs.reduce((a, b) => a + b.tQty, 0),
                adj: bs.reduce((a, b) => a + b.adj, 0),
                tAdj: bs.reduce((a, b) => a + b.tAdj, 0),
                c2: bs.reduce((a, b) => a + b.c2Qty, 0),
                c3: bs.reduce((a, b) => a + b.c3Qty, 0),

    }
    /* The Transplant Record for one year, laid out the way the office sheet is:
       a row per plot, a column per month, a total per nursery, and the year with
       the one before it on top. Every plot Seedling Stock holds gets its row,
       transplanted into or not. */
    function buildTransplantYear(model, year) {
        const Y = String(year), P = String(Number(year) - 1);
        const months = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));
        const yearTotals = (yy) => months.map(mm => {
            let t = 0;
            model.groups.forEach(g => g.plots.forEach(p => p.batches.forEach(b => { t += b.tByMonth[yy + '-' + mm] || 0; })));
            return t;
        });
        const cum = (xs) => { let a = 0; return xs.map(x => (a += x)); };
        const groups = model.groups.map(g => {
            const plots = g.plots.map(p => {
                const m = months.map(mm => p.batches.reduce((a, b) => a + (b.tByMonth[Y + '-' + mm] || 0), 0));
                // which batches make each month's figure (the hover on the cell)
                const who = months.map(mm => p.batches.filter(b => b.tByMonth[Y + '-' + mm]).map(b => ({ batch: b.batch, qty: b.tByMonth[Y + '-' + mm] })));
                return { plot: p.plot, months: m, who, total: m.reduce((a, x) => a + x, 0) };
            });
            const tot = months.map((_, i) => plots.reduce((a, p) => a + p.months[i], 0));
            return { key: g.key, label: g.label, plots, months: tot, total: tot.reduce((a, x) => a + x, 0) };
        }).filter(gr => gr.key !== 'OTHER' || gr.total);
        const thisY = yearTotals(Y), prevY = yearTotals(P);
        return { year: Y, prev: P, groups, thisY, thisCum: cum(thisY), prevY, prevCum: cum(prevY),
                 total: thisY.reduce((a, x) => a + x, 0), prevTotal: prevY.reduce((a, x) => a + x, 0) };
    }
    /* Pusingan Jualan and Pusingan Transplant, per plot and month of `year`.
       Transplanted is THIS record (tByMonth: the Tab 3 day plus approved
       calibration); collected is the delivery-order lines of that plot by the
       delivery date; capacity is Work Maintenance > Setting. The rule is the
       Nursery Dashboard Site Audit own (buildRotation): collection plan = 90%
       of the transplant 9 months earlier, transplanting plan = the transplant
       10 months earlier, % = collected over capacity, rounded down.
       the_site_audit_dashboard.cjs compares the two. */
    function lpShiftYM(ym, by) {
        const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + by;
        return (y + Math.floor(m / 12)) + '-' + String(((m % 12) + 12) % 12 + 1).padStart(2, '0');
    }
    /* The collection % is CUMULATIVE over the CURRENT ROUND only: the batches
       transplanted into the plot from the same month a year before (the
       plans count). A sale of an older batch is the round before, counted apart
       (`older`). SHARED RULE: saRound on the Nursery Dashboard. */
    const lpBatchKey = v => String(v == null ? '' : v).trim().toUpperCase().replace(/^BATCH\s*:?\s*/, '').split(/[\s(,\[]/)[0].replace(/[^0-9A-Z]/g, '');
    function lpRound(fills, sales, ym) {
        const from = lpShiftYM(ym, -13);   // the same month last year counts
        let cum = 0, older = 0, mine = 0; const olderB = [];
        Object.keys(sales || {}).forEach(b => {
            const inRound = Object.keys((fills || {})[b] || {}).some(m => m > from && m <= ym);
            Object.keys(sales[b]).forEach(m => {
                if (m > ym) return;
                if (inRound) { cum += sales[b][m]; if (m === ym) mine += sales[b][m]; } else if (m === ym) { older += sales[b][m]; if (sales[b][m] && !olderB.includes(b)) olderB.push(b); }
            });
        });
        return { cum, older, mine, olderB: olderB.sort((x, y) => (parseInt(x, 10) || 0) - (parseInt(y, 10) || 0) || x.localeCompare(y)) };
    }
    function lpRotation(model, nursery, year, sales, caps, todayYM, plan) {
        // plan: the Settings figures (collection: months back and %, transplanting: months back).
        const P = Object.assign({ colMonths: 9, colPct: 90, trMonths: 10 }, plan || {});
        const g = model.groups.find(x => x.key === nursery);
        const S = {}, SB = {};
        (sales || []).forEach(r => {
            const k = lpPlotKey(r.plot), ym = String(r.day || '').slice(0, 7);
            if (!k || ym.length !== 7) return;
            (S[k] = S[k] || {})[ym] = (S[k][ym] || 0) + (Number(r.qty) || 0);
            const pb = ((SB[k] = SB[k] || {})[lpBatchKey(r.batch)] = (SB[k] || {})[lpBatchKey(r.batch)] || {});
            pb[ym] = (pb[ym] || 0) + (Number(r.qty) || 0);
        });
        return (g ? g.plots : []).map(p => {
            const k = lpPlotKey(p.plot), cap = Number((caps || {})[k]) || 0;
            const tm = {};
            const fills = {};
            p.batches.forEach(b => Object.keys(b.tByMonth).forEach(ym => {
                tm[ym] = (tm[ym] || 0) + b.tByMonth[ym];
                const f = (fills[lpBatchKey(b.batch)] = fills[lpBatchKey(b.batch)] || {});
                f[ym] = (f[ym] || 0) + b.tByMonth[ym];
            }));
            const t = ym => tm[ym] || 0, c = ym => (S[k] && S[k][ym]) || 0;
            const months = [];
            for (let m = 1; m <= 12; m++) {
                const ym = year + '-' + String(m).padStart(2, '0');
                const col = c(ym), rd = col > 0 ? lpRound(fills, SB[k], ym) : { cum: 0, older: 0, mine: 0, olderB: [] }, cum = rd.cum;
                months.push({ ym, future: !!todayYM && ym > todayYM, col, colCum: cum, colOlder: rd.older, colOlderB: rd.olderB, colMine: rd.mine,
                    colPct: cap > 0 && cum > 0 ? Math.floor(cum / cap * 100) : null,
                    colPlan: Math.round(t(lpShiftYM(ym, -P.colMonths)) * P.colPct / 100), tr: t(ym), trPlan: t(lpShiftYM(ym, -P.trMonths)) });
            }
            return { plot: p.plot, key: k, cap, months };
        });
    }
    function lpYears(model) {
        const ys = new Set();
        model.groups.forEach(g => g.plots.forEach(p => p.batches.forEach(b => Object.keys(b.tByMonth).forEach(k => ys.add(k.slice(0, 4))))));
        return [...ys].filter(y => /^\d{4}$/.test(y)).sort();

    function buildPlotHistory(plots, rows) {
        const nurOfPlot = new Map();

            }

            const b = String(r.batch_name || '—');

            return plot.batches.get(b);

        });

        nurOfPlot.forEach((v, k) => { if (!byPlot.has(k) && v.nursery !== 'OTHER') byPlot.set(k, { name: v.name, nursery: v.nursery, batches: new Map(), cards: {} }); });

        const sum = (xs, f) => xs.reduce((a, r) => a + (Number(f(r)) || 0), 0);
        const out = NURSERY_ORDER.map(key => {
            const list = [...byPlot.values()].filter(p => p.nursery === key).sort((a, b) => lpNatural(a.name, b.name));
            return { key, label: NURSERY_LABEL[key], plots: list.map(p => {
                const batches = [...p.batches.values()].map(b => {
                    const tQty = sum(b.tRows, r => r.quantity_change);
                    const adj = sum(b.adjRows, r => r.quantity_change);
                    const tDate = lpEarliest(b.tRows.map(lpTransplantDay));
                    // Each transplant row lands in the month it was done; an approved
                    // calibration corrects the transplant, so it lands with it.
                    const tByMonth = {};
                    b.tRows.forEach(r => {
                        const ym = String(lpTransplantDay(r) || '').slice(0, 7);
                        if (ym) tByMonth[ym] = (tByMonth[ym] || 0) + (Number(r.quantity_change) || 0);
                    });
                    if (adj && tDate) tByMonth[tDate.slice(0, 7)] = (tByMonth[tDate.slice(0, 7)] || 0) + adj;
                    // Each day this batch went into the plot, the census of that day; an
                    // approved calibration sits on the first day, as the office sheet has it.
                    const tDays = {};
                    b.tRows.forEach(r => {
                        const d = lpTransplantDay(r) || '';
                        const e = tDays[d] || (tDays[d] = { day: d, qty: 0, at: '' });
                        e.qty += Number(r.quantity_change) || 0;
                        if (String(r.created_at || '') > e.at) e.at = String(r.created_at || '');
                    });
                    if (adj && tDays[tDate || '']) tDays[tDate || ''].qty += adj;
                    const c2 = lpCullFigure(b.c2Rows, true, b.tRows.length), c3 = lpCullFigure(b.c3Rows, false, b.tRows.length);
                    return {
                        batch: b.batch,
                        tDate, tByMonth, tDays: Object.values(tDays).sort((x, y) => x.day.localeCompare(y.day)),
                        tQty, adj, tAdj: tQty + adj,
                        c2Date: c2.day, c2Qty: c2.qty, c2Alive: c2.alive, c2Has: c2.rows > 0,
                        c3Date: c3.day, c3Sort: c3.sortDay, c3Qty: c3.qty, c3Map: c3.map, c3Has: c3.rows > 0, c3Note: c3.note,
                    };
                }).sort((x, y) => (lpBatchDay(x) || '9999').localeCompare(lpBatchDay(y) || '9999') || lpNatural(x.batch, y.batch));
                return {
                    plot: p.name, nursery: p.nursery, batches, cycles: lpCycles(batches), cards: p.cards || {},
                    tAdj: batches.reduce((a, b) => a + b.tAdj, 0),
                    c2: batches.reduce((a, b) => a + b.c2Qty, 0),
                    c3: batches.reduce((a, b) => a + b.c3Qty, 0),
                };
            }) };
        }).filter(g => g.plots.length || g.key !== 'OTHER');
        return { groups: out };
    }
    // ── END build ──

    async function lpFetchAll(build) {
        const out = [];

            const { data, error } = await build().range(from, from + 999);

    const nf = n => (n ? Number(n).toLocaleString('en-MY') : '');

    let MODEL = null;

    const MAP_ZOOM = {};
    /* THE MAP SAYS WHERE THE PLOT IS IN ITS ROUND, four stages (the office:

    const LP_STAGES = [
        { key: 'empty',   label: 'Empty',                 fill: 'rgba(148,163,184,.30)', stroke: '#94a3b8' },
        { key: 'growing', label: 'Growing',               fill: 'rgba(74,222,128,.45)',  stroke: '#16a34a' },

    const LP_SET_KEY = 'life_of_plot_settings';

    let LP_SET = JSON.parse(JSON.stringify(LP_SET_DEFAULT));
    const lpHexA = (hex, a) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); if (!m) return null; const n = parseInt(m[1], 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
    function lpApplySet(v) {
        const int = (x, d, lo, hi) => { const n = Math.round(Number(x)); return Number.isFinite(n) && n >= lo && n <= hi ? n : d; };
        const D = LP_SET_DEFAULT, o = v || {};
        LP_SET = {
            est2: int(o.est2, D.est2, 1, 24), est3: int(o.est3, D.est3, 1, 36), soonMonth: int(o.soonMonth, D.soonMonth, 1, 36),
            colMonths: int(o.colMonths, D.colMonths, 1, 36), colPct: int(o.colPct, D.colPct, 1, 100), trMonths: int(o.trMonths, D.trMonths, 1, 36),
            stages: Object.assign({}, o.stages || {}),
        };
        LP_EST_C2 = LP_SET.est2; LP_EST_C3 = LP_SET.est3; LP_SOON_MONTHS = LP_SET.soonMonth - 1;
        LP_STAGES.forEach((x, i) => {
            const b = LP_STAGES_BUILTIN[i], st = LP_SET.stages[x.key] || {};
            x.label = String(st.label || '').trim() || b.label;
            const f = lpHexA(st.color, .45);
            x.fill = f || b.fill; x.stroke = f ? st.color : b.stroke;

    }
    lpApplySet(null);

    // ── Map view ──────────────────────────────────────────────
    function curCycle(p) { return p && p.cycles && p.cycles.length ? p.cycles[p.cycles.length - 1] : null; }
    /* THE STAGE IS PALMS (the office): the stage a plot is on in PALMS decides,
         Membersih, Meracun secara selingan, Angkat tanah, Isi polibeg, Lining,
         Transplanting (and Saringan, Tunggu buat culling, Culling before them) -> Empty
         Membesar -> Growing, or Collecting in 1 month from the 8th month after transplant
         Pengambilan (collecting) -> Collecting
       Matched by NAME, as PALMS anchors its round. A plot PALMS has nothing open
       for falls back to the ledger: no current cycle or 3rd culled is Empty, a
       batch of the cycle on a delivery order is Collecting, else by age. */
    const lpStageName = s => String(s || '').trim().toLowerCase();
    function lpPalmsStage(actName, months) {
        const n = lpStageName(actName);
        if (!n) return null;
        if (n === 'pengambilan' || n.indexOf('collect') >= 0) return 'selling';
        if (n === 'membesar') return months != null && months >= LP_SOON_MONTHS ? 'soon' : 'growing';
        return 'empty';
    }
    let PALMS_NOW = null; // plot key -> { name, start } : the furthest stage open in PALMS
    let PALMS_P = null;
    function ensurePalms() {
        if (PALMS_P) return PALMS_P;
        PALMS_P = (async () => {
            const P = window.MJMPalms;
            if (!P) return;
            await P.loadStages(_supabase);
            const logs = await P.loadLogs(_supabase);
            const now = {};
            Object.keys(logs).forEach(unit => {
                const open = P.openActivities(logs, unit);
                if (!open.length) return;
                const a = open[open.length - 1];
                const k = lpPlotKey(P.plotOf(unit));
                const e = (logs[unit] || []).find(x => x.end === null && x.actN === a.n);
                if (!now[k] || a.n > now[k].n) now[k] = { name: a.name, n: a.n, start: e ? e.start : null };
            });
            PALMS_NOW = now;
        })().catch(e => { console.warn('[life of plot] PALMS not read, the map reads the ledger:', (e && e.message) || e); });
        return PALMS_P;
    }
    function mapStateOf(p, plotName) {
        const c = curCycle(p);
        const k = lpPlotKey(plotName || (p && p.plot) || '');
        const pal = PALMS_NOW && PALMS_NOW[k];
        const since = d => d ? (Date.now() - Date.parse(String(d).slice(0, 10) + 'T00:00:00Z')) / 86400000 / 30.44 : null;
        const liveC = c && c.tAdj > 0 && !c.end ? c : null;
        if (pal) {
            const months = since(liveC ? liveC.start : pal.start);
            const key = lpPalmsStage(pal.name, months);
            if (key) return { key, months, palms: pal.name };
        }
        if (!liveC) return { key: 'empty', months: null };
        const months = since(liveC.start) || 0;
        const mine = new Set(liveC.batches.map(b => lpBatchKey(b.batch)));
        const sold = (ROT && ROT.sales.some(r => lpPlotKey(r.plot) === k && mine.has(lpBatchKey(r.batch)) && String(r.day) >= String(liveC.start)));
        if (sold) return { key: 'selling', months };
        return { key: months >= LP_SOON_MONTHS ? 'soon' : 'growing', months };
    }
    const fmtN = n => Number(n || 0).toLocaleString('en-MY');
    function mapPlotIndex() {
        const idx = {};
        MODEL.groups.forEach(g => g.plots.forEach(p => { idx[lpPlotKey(p.plot)] = p; }));
        return idx;
    }

    /* The tabs top right. Shown on the views that are about one nursery (the

    function renderHeadTabs() {

    /* PALMS draws its own tabs (hidden when embedded); press the one that

    let _palmsSyncT = null;
    function syncPalmsNursery(tries) {
        clearTimeout(_palmsSyncT);

    function openPlotFromMap(name) {

    /* ── The scenes: the office own MJM cats, moved by the stylesheet. ──
       Growing is the three working cats taking turns (watering, fertiliser,
       weeding); Empty is the cat digging soil; Collecting in 1 month is the
       cat sitting happy; Collecting is the cat driving the lorry of seedlings.
       The pictures are lifeplot/cat_*.png, cut out of the sheet the office
       handed over. */
    /* The office own animation (their Canva video, cut cat by cat): each cat is an
       animated picture that moves by itself. Under reduced motion the still first
       frame is shown instead. */
    const LP_CAT = n => `lifeplot/cat_${n}.png`;
    const LP_CAT_ANIM = n => `lifeplot/cat_${n}.webp`;
    const lpCatImg = (n, cls) => `<picture><source media="(prefers-reduced-motion: reduce)" srcset="${LP_CAT(n)}"><img class="${cls || ''}" src="${LP_CAT_ANIM(n)}" alt=""></picture>`;
    // Where the cats stand in one plot: spread over the shape, the label
    // spot left clear. Points are in the map's own percent units.
    function lpCatSpots(pts, n) {
        const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
        const inside = (x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; };
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = x1 - x0, h = y1 - y0;
        const cand = [];
        for (let i = 1; i < 8; i++) for (let j = 1; j < 8; j++) {
            const x = x0 + w * i / 8, y = y0 + h * j / 8;
            // the base AND the top of the cat inside the plot, and off the label
            if (inside(x, y) && inside(x, y - h * 0.18) && !(Math.abs(x - cx) < w * 0.2 && Math.abs(y - cy) < h * 0.22)) cand.push({ x, y });
        }
        const out = [];
        while (out.length < n && cand.length) {
            let best = 0, bd = -1;
            cand.forEach((c, i) => { const d = out.length ? Math.min(...out.map(o => (o.x - c.x) ** 2 + (o.y - c.y) ** 2)) : -((c.x - x0) ** 2 + (c.y - y0) ** 2); if (d > bd) { bd = d; best = i; } });
            out.push(cand.splice(best, 1)[0]);
        }
        return { spots: out, x0, x1, y0, y1, w, h, cx, cy };
    }
    // One stage's cats for one plot: growing is the three working cats
    // (watering, fertiliser, weeding) spread over the plot, empty is cats
    // digging, ready for collection is one big cat sitting happy in the
    // middle, collecting is the lorry driving across it.
    function lpCats(key, pts, big) {
        // Membesar: three cats, one per job. Empty: two, three on a big plot.
        const g = lpCatSpots(pts, key === 'growing' ? 3 : key === 'empty' ? (big ? 3 : 2) : 0);
        const cat = (x, y, hgt, img) => `<div class="lp-cat" data-scene="${key}" style="left:${x}%;top:${y}%;height:${hgt}%">${lpCatImg(img)}</div>`;
        const small = Math.min(g.h * 0.28, g.w * 0.55);
        if (key === 'growing') return g.spots.map((p, i) => cat(p.x, p.y, small, ['grow_water', 'grow_feed', 'grow_weed'][i % 3])).join('');
        if (key === 'empty') return g.spots.map(p => cat(p.x, p.y, small, 'empty_dig')).join('');
        if (key === 'soon') return cat(g.cx, Math.min(g.y1 - g.h * 0.1, g.cy + g.h * 0.4), Math.min(g.h * 0.45, g.w * 0.8), 'ready');
        if (key === 'selling') return `<div class="lp-cat wide" data-scene="selling" style="left:${g.cx}%;top:${Math.min(g.y1 - g.h * 0.1, g.cy + g.h * 0.38)}%;width:${g.w * 0.6}%">${lpCatImg('collecting')}</div>`;
        return '';
    }
    function drawMap() {
        const k = MAP_NUR;
        const body = document.getElementById('lp-map-body');
        const idx = mapPlotIndex();
        const z = MAP_ZOOM[k] || (MAP_ZOOM[k] = { z: 1, x: 0, y: 0 });
        const key = '<div class="lp-key"><div class="lp-key-h">Stage</div>' + LP_STAGES.map(x =>
            `<div class="lp-key-r" data-stage="${x.key}"><i style="background:${x.fill};border-color:${x.stroke}"></i>${lpCatImg({ empty: 'empty_dig', growing: 'grow_water', soon: 'ready', selling: 'collecting' }[x.key], 'lp-key-cat')}<div><b>${x.label}</b></div></div>`).join('') + '</div>';
        body.innerHTML = `<div class="lp-map-row">
            <div class="lp-viewport" id="lp-viewport">
                <div class="lp-stage" id="lp-stage">
                    <div class="relative inline-block">
                        <img class="lp-map-img" src="${MAPS[k]}" alt="Map ${NURSERY_LABEL[k]}" draggable="false">
                        <svg class="lp-svg" id="lp-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                        <div class="lp-cats" id="lp-cats"></div>
                        <div class="lp-labels" id="lp-labels"></div>
                    </div>
                </div>
                <div class="lp-zoom">
                    <button type="button" class="lp-zbtn" data-z="0.25" title="Zoom in">+</button>
                    <div class="lp-zlvl" id="lp-zlvl"></div>
                    <button type="button" class="lp-zbtn" data-z="-0.25" title="Zoom out">−</button>
                    <button type="button" class="lp-zbtn" data-z="reset" title="Reset zoom">↺</button>
                </div>

        const svg = document.getElementById('lp-svg');
        const labels = document.getElementById('lp-labels');
        const catsEl = document.getElementById('lp-cats');
        const vp = document.getElementById('lp-viewport');
        const stage = document.getElementById('lp-stage');

        // a plot at or above the median size of this nursery is a big one
        const lpArea = pts => { let a = 0; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y); return Math.abs(a / 2); };
        const areas = Object.values(PLOT_SHAPES).filter(s => s.nur === k).map(s => lpArea(s.pts)).sort((a, b) => a - b);
        const bigArea = areas.length ? areas[Math.floor(areas.length / 2)] : 0;
        Object.values(PLOT_SHAPES).filter(s => s.nur === k).forEach(s => {
            const p = idx[lpPlotKey(s.name)];
            const st = mapStateOf(p, s.name);
            const stg = LP_STAGES.find(x => x.key === st.key);
            const [fill, stroke] = MAP_FILL[st.key];
            const ptsStr = s.pts.map(pt => pt.x + ',' + pt.y).join(' ');
            const cx = s.pts.reduce((a, pt) => a + pt.x, 0) / s.pts.length;
            const cy = s.pts.reduce((a, pt) => a + pt.y, 0) / s.pts.length;
            const cc = curCycle(p);
            const tip = cc ? `Cycle ${cc.n} of ${p.cycles.length} · transplanted ${fmtN(cc.tAdj)} · 2nd cull ${fmtN(cc.c2)} · 3rd cull ${fmtN(cc.c3)}` : 'Nothing recorded';
            svg.insertAdjacentHTML('beforeend',
                `<polygon class="lp-shape" data-plot="${s.name.replace(/"/g, '&quot;')}" data-stage="${st.key}" points="${ptsStr}" fill="${fill}" stroke="${stroke}" stroke-width=".4"><title>${s.name} · ${stg.label}${st.palms ? ' (PALMS: ' + st.palms + ')' : ''}${st.months != null ? ' · ' + Math.floor(st.months) + ' months' : ''}: ${tip}</title></polygon>`);
            // The label is the plot name and nothing else (the office: "cycle 2 xxx不用
            // 只需要看plot名字"); the cycle is on the hover of the shape.
            labels.insertAdjacentHTML('beforeend',
                `<div class="lp-label" style="left:${cx}%; top:${cy}%"><div class="lp-tag">${s.name}</div></div>`);
            catsEl.insertAdjacentHTML('beforeend', lpCats(st.key, s.pts, lpArea(s.pts) >= bigArea));
        });
        svg.addEventListener('click', e => {
            const el = e.target.closest && e.target.closest('.lp-shape');
            if (el) openPlotFromMap(el.dataset.plot);
        });

        const apply = () => {
            stage.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.z})`;
            labels.style.setProperty('--lp-z', z.z);
            document.getElementById('lp-zlvl').textContent = Math.round(z.z * 100) + '%';
        };
        const zoomTo = (nz, cx = 0, cy = 0) => {
            const old = z.z;
            z.z = Math.max(0.6, Math.min(5, nz));
            const f = z.z / old;
            z.x = (z.x - cx) * f + cx;
            z.y = (z.y - cy) * f + cy;
            if (z.z <= 1.01) { z.z = 1; z.x = 0; z.y = 0; }
            apply();
        };
        body.querySelectorAll('.lp-zbtn').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.z === 'reset') { z.z = 1; z.x = 0; z.y = 0; apply(); }
            else zoomTo(z.z + Number(b.dataset.z));
        }));
        vp.addEventListener('wheel', e => {
            e.preventDefault();
            const r = vp.getBoundingClientRect();
            zoomTo(z.z + (e.deltaY < 0 ? 0.15 : -0.15), e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
        }, { passive: false });
        let last = null;
        vp.addEventListener('pointerdown', e => {
            if (e.target.closest('.lp-zoom')) return;
            last = { x: e.clientX, y: e.clientY };
            stage.classList.add('drag');
        });
        vp.addEventListener('pointermove', e => {
            if (!last) return;
            z.x += e.clientX - last.x;
            z.y += e.clientY - last.y;
            last = { x: e.clientX, y: e.clientY };

        vp.addEventListener('pointerup', endDrag);
        vp.addEventListener('pointerleave', endDrag);
        vp.addEventListener('pointercancel', endDrag);
        apply();
    }
    function setNursery(k) {

    function fillNurserySelect() {

        document.getElementById('lp-nursery-row').classList.toggle('hidden', byMap);
        const keys = MODEL.groups.filter(g => g.plots.length).map(g => g.key);
        document.getElementById('lp-nursery-row').innerHTML =
            chip('nur', '', 'All nurseries', !NUR) + keys.map(k => chip('nur', k, NURSERY_LABEL[k], NUR === k)).join('');
    }
    function fillPlotSelect(keep) {
        const names = MODEL.groups.filter(g => !NUR || g.key === NUR).flatMap(g => g.plots.map(p => p.plot));
        const cur = keep && names.includes(keep) ? keep : '';
        document.getElementById('lp-plot-row').innerHTML =
            names.map(n => chip('plot', n, n, cur === n)).join('');
    }


    function lpDays(a, b) {
        if (!a) return null;
        const t0 = Date.parse(a + 'T00:00:00Z'), t1 = b ? Date.parse(b + 'T00:00:00Z') : Date.now();
        return Math.max(0, Math.round((t1 - t0) / 86400000));
    }
    function cycleSpan(c) {
        return `${c.start || '–'} → ${c.end || 'now'}`;
    }
    const lpPct = (n, d) => (d > 0 ? ((n || 0) / d * 100).toFixed(2) + '%' : '–');
    const lpVar = v => (v == null ? '–' : (v > 0 ? '+' : '') + nf(v) || '0');
    /* A 3rd culling variance carries the batch report own explanation on hover
       (the office: "如果3rd culling有variance 这个variance也是加一个hover"). */
    const lpAttr = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const lpVarCell = (v, tip) => v ? `<td class="has-tip var-tip" data-tip="${lpAttr(tip)}">${lpVar(v)}</td>` : `<td>${lpVar(v)}</td>`;
    function lpBindTips(root) {
        let tip = document.getElementById('lp-tip');
        if (!tip) { tip = document.createElement('div'); tip.id = 'lp-tip'; document.body.appendChild(tip); }
        root.querySelectorAll('td.has-tip').forEach(td => {
            td.addEventListener('mouseenter', () => { tip.textContent = td.dataset.tip; tip.style.display = 'block'; });
            td.addEventListener('mousemove', e => {
                const w = tip.offsetWidth, x = e.clientX + 14 + w > innerWidth ? e.clientX - w - 14 : e.clientX + 14;
                tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
            });
            td.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
        });
    }
    // A card saved before the drone count existed has the picture and no number,
    // and reads as tallying — shown, never stored (the batch report T3_DRONE_FROM rule).
    const LP_DRONE_FROM = '2026-10-23T00:00:00Z';
    /* One card per cycle, ONE table read across (the office: "改成横着的吧 …
       batch就不用写那么多次"): a row per batch, the batch written once, then
       the three parts of the office plot sheet side by side — Transplanting
       (Map Date, Census, Total Drone Count, Variance), the 7th month 2nd
       culling (Date, Alive, Dead, Variance, Culling rate) and the 3rd culling
       (Map Date, Pending culling, Drone Count, Variance, both rates). Census
       is the transplant after approved calibration and every rate is over it;
       the Total row carries the plot culling rates. A drone count belongs to
       a Tab 3 card (one plot, one day), so batches that went in on the same
       first day share one drone cell. */
    /* When a culling not yet keyed is due: the month that many months after the
       batch went in (2nd: the 4th month, 3rd: the 9th). */
    function lpEst(day, add) {
        if (!day) return '';
        const y = +day.slice(0, 4), m = +day.slice(5, 7) - 1 + add;
        const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return 'Est. ' + M[m % 12] + ' ' + (y + Math.floor(m / 12));
    }
    function cycleHtml(c, p) {
        const d = lpDays(c.start, c.end);
        const bs = c.batches;
        const cards = (p && p.cards) || {};
        let h = `<div class="panel lp-cyc" data-cycle="${c.n}"><div class="lp-cyc-h">`
              + `<span class="lp-cyc-n">Cycle ${c.n}</span>`
              + `<span class="lp-cyc-tag${c.end ? '' : ' cur'}">${c.end ? 'Finished' : 'Current'}</span>`
              + `<span class="lp-cyc-d">${c.start || '–'} → ${c.end || 'now'}${d != null ? ' · ' + d + ' days' : ''}</span>`
              + `<span class="lp-cyc-cap">Transplanted this cycle <b>${nf(c.tAdj) || '0'}</b></span></div>`;

        // Drone groups: batches sharing their first transplant day.
        const groups = [];
        bs.forEach(b => {
            const key = b.tDate || '';
            let g = groups.find(x => x.key === key);
            if (!g) { g = { key, batches: [], days: new Set(), census: 0, at: '' }; groups.push(g); }
            g.batches.push(b); g.census += b.tAdj;
            (b.tDays || []).forEach(t => { g.days.add(t.day); if (t.at > g.at) g.at = t.at; });
        });
        let droneAll = 0, droneKnown = true;
        groups.forEach(g => {
            let drone = 0, known = true;
            g.days.forEach(day => {
                const card = cards[day];
                const census = g.batches.reduce((a, b) => a + ((b.tDays || []).filter(t => t.day === day).reduce((x, t) => x + t.qty, 0)), 0);
                let v = card && card.drone != null ? card.drone : null;
                if (v == null && ((card ? card.at : g.at) || '9') < LP_DRONE_FROM) v = census;
                if (v == null) known = false; else drone += v;
            });
            g.drone = known && g.days.size ? drone : null;
            if (g.drone == null) droneKnown = false; else droneAll += g.drone;
        });

        /* A 3rd culling is shown once the batch has started selling out of this
           plot, and only then (the office: "3rd cull开不开取决于开始sale了没有").
           Tab 6 saves its 3rd Culled as 2nd culled + what is left, so a row saved
           before any sale reads the whole balance, or nought, and is not a
           culling. Sales not read yet: shown, and drawn again once they are. */
        const pk = lpPlotKey((p && p.plot) || '');
        const salesKnown = !!(ROT && ROT.done && !ROT.missing.some(m => m.indexOf('delivery orders') === 0));
        const c3On = b => (b.c3Has || b.c3Map != null) && (!salesKnown
            || ROT.sales.some(r => lpPlotKey(r.plot) === pk && lpBatchKey(r.batch) === lpBatchKey(b.batch)));
        let alive2 = 0;
        const map3 = bs.reduce((a, b) => a + (c3On(b) ? (b.c3Map || 0) : 0), 0);
        const c3Tot = bs.reduce((a, b) => a + (c3On(b) && b.c3Has ? b.c3Qty : 0), 0);
        const rows = [];
        groups.forEach(g => g.batches.forEach(b => {
            const alive = b.c2Has ? (b.c2Alive != null ? b.c2Alive : b.tAdj - b.c2Qty) : b.tAdj;
            alive2 += alive;
            const c2 = b.c2Has ? b.c2Qty : 0, c3 = c3On(b) && b.c3Has ? b.c3Qty : 0, m3 = b.c3Map || 0;
            rows.push({
                head: `<tr data-b="${lpBatchKey(b.batch)}"><td class="l batch">${b.batch}</td>`
                    // Transplanting: the day and how many went in (the office: only these two)
                    + `<td class="l s1">${b.tDate || '–'}</td><td>${nf(b.tAdj) || '0'}</td>`,
                // 2nd culling: alive, dead, culling rate. Nothing keyed yet is one blank
                // cell carrying when it is due: the 4th month after transplant.
                c2: b.c2Has ? `<td class="l s1">${b.c2Date || '–'}</td><td>${nf(alive) || '0'}</td><td class="cull">${nf(b.c2Qty) || '0'}</td><td class="cull">${lpPct(c2, b.tAdj)}</td>` : null,
                c2Est: b.c2Has ? null : lpEst(b.tDate, LP_EST_C2),
                // 3rd culling: pending culling, drone count, variance, culling rate; nothing
                // keyed yet is due the 9th month after transplant.
                c3: c3On(b) ? `<td class="l s1">${b.c3Date || '–'}</td><td class="cull">${b.c3Has ? nf(b.c3Qty) || '0' : '–'}</td><td>${b.c3Map != null ? nf(b.c3Map) || '0' : '–'}</td>`
                      + lpVarCell(m3 - c3, 'Batch ' + b.batch + '\n' + (b.c3Note || 'No reason written on the batch report')) + `<td class="cull">${lpPct(c3, b.tAdj)}</td>` : null,
                c3Est: c3On(b) ? null : lpEst(b.tDate, LP_EST_C3),
            });
        }));
        /* Rows next to each other due in the same month share ONE estimate cell
           (the office: "一样的日期可以merge起来"). */
        const span = (k, i) => { let n = 1; while (i + n < rows.length && rows[i + n][k] != null && rows[i + n][k] === rows[i][k]) n++; return n; };
        let body = '';
        rows.forEach((r, i) => {
            body += r.head;
            if (r.c2 != null) body += r.c2;
            else if (!(i > 0 && rows[i - 1].c2Est === r.c2Est)) { const n = span('c2Est', i); body += `<td class="l s1 est" colspan="4"${n > 1 ? ` rowspan="${n}"` : ''}>${r.c2Est}</td>`; }
            if (r.c3 != null) body += r.c3;
            else if (!(i > 0 && rows[i - 1].c3Est === r.c3Est)) { const n = span('c3Est', i); body += `<td class="l s1 est" colspan="5"${n > 1 ? ` rowspan="${n}"` : ''}>${r.c3Est}</td>`; }
            body += '</tr>';
        });
        h += `<div class="lp-x-wrap"><table class="lp lp-x">`
           + `<colgroup><col><col span="2" class="c-t"><col span="4" class="c-2"><col span="5" class="c-3"></colgroup>`
           + `<thead><tr class="grp-h"><th class="l" rowspan="2">Batch</th>`
           + `<th class="s1 g-t" colspan="2">Transplanting</th><th class="s1 g-c" colspan="4">2nd Culling</th><th class="s1 g-c" colspan="5">3rd Culling</th></tr>`
           + `<tr><th class="l s1">Date</th><th>Transplanted</th>`
           + `<th class="l s1">Date</th><th>Alive</th><th>Dead</th><th>Culling rate (%)</th>`
           + `<th class="l s1">Date</th><th>Pending culling</th><th>Drone Count</th><th>Variance</th><th>Culling rate (%)</th></tr></thead>`
           + `<tbody>${body}</tbody>`
           + `<tfoot><tr class="tot"><td class="l">Total · plot</td>`
           + `<td class="s1"></td><td>${dash(c.tAdj)}</td>`
           + (bs.some(b => b.c2Has) ? `<td class="s1"></td><td>${dash(alive2)}</td><td>${dash(c.c2)}</td><td>${lpPct(c.c2, c.tAdj)}</td>` : `<td class="s1" colspan="4"></td>`)
           + (bs.some(c3On) ? `<td class="s1"></td><td>${dash(c3Tot)}</td><td>${dash(map3)}</td>${lpVarCell(map3 - c3Tot, bs.filter(b => c3On(b) && (b.c3Map || 0) !== (b.c3Has ? b.c3Qty : 0)).map(b => 'Batch ' + b.batch + ': ' + (b.c3Note || 'No reason written on the batch report')).join('\n'))}<td>${lpPct(c3Tot, c.tAdj)}</td>` : `<td class="s1" colspan="5"></td>`)
           + `</tr></tfoot>`
           + `</table></div>`;
        h = h.replace(/>–</g, '><span class="mute">–</span><');
        return h + '</div>';
    }

    function showPlot(name) {
        const p = MODEL.groups.flatMap(g => g.plots).find(x => x.plot === name);
        if (!p) return;
        setView('plots', true);
        NUR = p.nursery;
        if (MAPS[p.nursery]) MAP_NUR = p.nursery;
        renderMap();
        fillNurserySelect();
        fillPlotSelect(p.plot);
        document.getElementById('lp-detail').classList.remove('hidden');
        // The heading is ALWAYS Life of Plot (the office: "标题永远都是life of plot");
        // which plot or view is open is the line under it.

        const nurLabel = NURSERY_LABEL[p.nursery];

        history.replaceState(null, '', '#plot=' + encodeURIComponent(p.plot));
