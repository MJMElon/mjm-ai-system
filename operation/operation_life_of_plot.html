<script>
    const SUPABASE_URL = 'https://kibqjztozokohqmhqqqf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const NURSERY_LABEL = { BNN: 'BNN', UNN1: 'UNN 1', UNN2: 'UNN 2', OTHER: 'Not in Seedling Stock' };
    const NURSERY_ORDER = ['BNN', 'UNN1', 'UNN2', 'OTHER'];

    // ── BEGIN build (pure: rows in, figures out — the test lifts this block) ──
    function lpNurKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
    function lpPlotKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(^|[A-Z])0+(\d)/g, '$1$2'); }
    function lpIsReplant(s) { return /-R/i.test(String(s || '')); }
    function lpNatural(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); }
    // A row's day: its own transaction_date, else the Date: written in its remark, else the day it was saved.
    function lpDayOf(r, key) {
        const td = String(r.transaction_date || '').slice(0, 10);
        if (td) return td;
        const rem = String(r.remark || '');
        const m = rem.match(new RegExp(key + ':\\s*(\\d{4}-\\d{2}-\\d{2})'));
        if (m) return m[1];
        return String(r.created_at || '').slice(0, 10) || null;
    }
    function lpEarliest(days) { return days.filter(Boolean).sort()[0] || null; }
    function lpLatest(days) { return days.filter(Boolean).sort().slice(-1)[0] || null; }
    // An approved calibration against the transplanting report, keyed to the batch it corrects.
    function lpIsApprovedTransplantCal(r) {
        const rem = String(r.remark || '');
        return r.transaction_type === 'Stock_Calibration' && /^Report:\s*Transplanting/i.test(rem) && /APPROVED/i.test(rem);
    }
    /* A plot is filled, grown and 3rd culled, then filled again: each of those
       is a CYCLE, and its capacity is what was transplanted in that cycle, never
       the plot's whole history added up. Batches run in transplant-date order; a
       batch transplanted AFTER the latest 3rd culling of the cycle before it
       starts a new cycle. A batch with no transplant date of its own (a cull
       with nothing transplanted here) stays in the cycle it falls in. */
    function lpCycles(batches) {
        const cycles = [];
        let cur = null;
        (batches || []).forEach(b => {
            const lastC3 = cur ? lpLatest(cur.batches.map(x => x.c3Date)) : null;
            if (!cur || (b.tDate && lastC3 && b.tDate > lastC3)) { cur = { batches: [] }; cycles.push(cur); }
            cur.batches.push(b);
        });
        return cycles.map((c, i) => {
            const bs = c.batches;
            const done = bs.some(b => b.c3Date) && (i < cycles.length - 1 || bs.every(b => b.c3Date || !b.tAdj));
            return {
                n: i + 1, batches: bs, current: i === cycles.length - 1,
                start: lpEarliest(bs.map(b => b.tDate)),
                end: done ? lpLatest(bs.map(b => b.c3Date)) : null,
                tQty: bs.reduce((a, b) => a + b.tQty, 0),
                adj: bs.reduce((a, b) => a + b.adj, 0),
                tAdj: bs.reduce((a, b) => a + b.tAdj, 0),
                c2: bs.reduce((a, b) => a + b.c2Qty, 0),
                c3: bs.reduce((a, b) => a + b.c3Qty, 0),
            };
        });
    }
    /* The Transplant Record for one year, laid out the way the office sheet is:
       a row per plot, a column per month, a total per nursery, and the year with
       the one before it on top. Every plot Seedling Stock holds gets its row,
       transplanted into or not. */
    function buildTransplantYear(model, year) {
        const Y = String(year), P = String(Number(year) - 1);
        const months = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));
        const yearTotals = (yy) => months.map(mm => {
            let t = 0;
            model.groups.forEach(g => g.plots.forEach(p => p.batches.forEach(b => { t += b.tByMonth[yy + '-' + mm] || 0; })));
            return t;
        });
        const cum = (xs) => { let a = 0; return xs.map(x => (a += x)); };
        const groups = model.groups.map(g => {
            const plots = g.plots.map(p => {
                const m = months.map(mm => p.batches.reduce((a, b) => a + (b.tByMonth[Y + '-' + mm] || 0), 0));
                return { plot: p.plot, months: m, total: m.reduce((a, x) => a + x, 0) };
            });
            const tot = months.map((_, i) => plots.reduce((a, p) => a + p.months[i], 0));
            return { key: g.key, label: g.label, plots, months: tot, total: tot.reduce((a, x) => a + x, 0) };
        }).filter(gr => gr.key !== 'OTHER' || gr.total);
        const thisY = yearTotals(Y), prevY = yearTotals(P);
        return { year: Y, prev: P, groups, thisY, thisCum: cum(thisY), prevY, prevCum: cum(prevY),
                 total: thisY.reduce((a, x) => a + x, 0), prevTotal: prevY.reduce((a, x) => a + x, 0) };
    }
    function lpYears(model) {
        const ys = new Set();
        model.groups.forEach(g => g.plots.forEach(p => p.batches.forEach(b => Object.keys(b.tByMonth).forEach(k => ys.add(k.slice(0, 4))))));
        return [...ys].filter(y => /^\d{4}$/.test(y)).sort();
    }
    function buildPlotHistory(plots, rows) {
        const nurOfPlot = new Map();
        (plots || []).forEach(p => {
            if (lpIsReplant(p.plot_name)) return;
            const n = lpNurKey(p.nursery_name);
            nurOfPlot.set(lpPlotKey(p.plot_name), { name: p.plot_name, nursery: NURSERY_ORDER.includes(n) ? n : 'OTHER' });
        });
        const byPlot = new Map();
        const plotOf = (r) => {
            const k = lpPlotKey(r.plot_name);
            if (!byPlot.has(k)) {
                const known = nurOfPlot.get(k);
                byPlot.set(k, { name: known ? known.name : r.plot_name, nursery: known ? known.nursery : 'OTHER', batches: new Map() });
            }
            return byPlot.get(k);
        };
        const batchOf = (plot, r) => {
            const b = String(r.batch_name || '—');
            if (!plot.batches.has(b)) plot.batches.set(b, { batch: b, tRows: [], adjRows: [], c2Rows: [], c3Rows: [] });
            return plot.batches.get(b);
        };
        (rows || []).forEach(r => {
            if (lpIsReplant(r.plot_name)) return;
            const t = r.transaction_type;
            if (t === 'Transplanted') batchOf(plotOf(r), r).tRows.push(r);
            else if (lpIsApprovedTransplantCal(r)) batchOf(plotOf(r), r).adjRows.push(r);
            else if (t === '2nd_Culling') batchOf(plotOf(r), r).c2Rows.push(r);
            else if (t === '3rd_Culling') batchOf(plotOf(r), r).c3Rows.push(r);
        });
        // A plot in Seedling Stock with nothing recorded still gets a row, so an empty plot shows as empty.
        nurOfPlot.forEach((v, k) => { if (!byPlot.has(k) && v.nursery !== 'OTHER') byPlot.set(k, { name: v.name, nursery: v.nursery, batches: new Map() }); });

        const sum = (xs, f) => xs.reduce((a, r) => a + (Number(f(r)) || 0), 0);
        const out = NURSERY_ORDER.map(key => {
            const list = [...byPlot.values()].filter(p => p.nursery === key).sort((a, b) => lpNatural(a.name, b.name));
            return { key, label: NURSERY_LABEL[key], plots: list.map(p => {
                const batches = [...p.batches.values()].map(b => {
                    const tQty = sum(b.tRows, r => r.quantity_change);
                    const adj = sum(b.adjRows, r => r.quantity_change);
                    const tDate = lpEarliest(b.tRows.map(r => lpDayOf(r, 'Date')));
                    // Each transplant row lands in the month it was done; an approved
                    // calibration corrects the transplant, so it lands with it.
                    const tByMonth = {};
                    b.tRows.forEach(r => {
                        const ym = String(lpDayOf(r, 'Date') || '').slice(0, 7);
                        if (ym) tByMonth[ym] = (tByMonth[ym] || 0) + (Number(r.quantity_change) || 0);
                    });
                    if (adj && tDate) tByMonth[tDate.slice(0, 7)] = (tByMonth[tDate.slice(0, 7)] || 0) + adj;
                    return {
                        batch: b.batch,
                        tDate, tByMonth,
                        tQty, adj, tAdj: tQty + adj,
                        c2Date: lpEarliest(b.c2Rows.map(r => lpDayOf(r, 'CullDate'))),
                        c2Qty: sum(b.c2Rows, r => r.quantity_change),
                        c3Date: lpEarliest(b.c3Rows.map(r => lpDayOf(r, 'CullDate'))),
                        c3Qty: sum(b.c3Rows, r => r.quantity_change),
                    };
                }).sort((x, y) => (x.tDate || '9999').localeCompare(y.tDate || '9999') || lpNatural(x.batch, y.batch));
                return {
                    plot: p.name, nursery: p.nursery, batches, cycles: lpCycles(batches),
                    tAdj: batches.reduce((a, b) => a + b.tAdj, 0),
                    c2: batches.reduce((a, b) => a + b.c2Qty, 0),
                    c3: batches.reduce((a, b) => a + b.c3Qty, 0),
                };
            }) };
        }).filter(g => g.plots.length || g.key !== 'OTHER');
        return { groups: out };
    }
    // ── END build ──

    async function lpFetchAll(build) {
        const out = [];
        for (let from = 0; ; from += 1000) {
            const { data, error } = await build().range(from, from + 999);
            if (error) throw error;
            out.push(...(data || []));
            if (!data || data.length < 1000) break;
        }
        return out;
    }

    const nf = n => (n ? Number(n).toLocaleString('en-MY') : '');
    const dash = v => (v ? nf(v) : '–');
    let MODEL = null;
    let MAPS = {};        // nursery key -> map image url
    let PLOT_SHAPES = {}; // plot key -> { name, nur, pts } from shared_plots.map_top
    let MAP_NUR = '';
    const MAP_ZOOM = {};
    const MAP_FILL = {
        none:     ['rgba(148,163,184,.22)', '#94a3b8'],
        field:    ['rgba(251,191,36,.40)',  '#f59e0b'],
        culling:  ['rgba(96,165,250,.40)',  '#3b82f6'],
        finished: ['rgba(74,222,128,.40)',  '#22c55e'],
    };

    // ── Map view ──────────────────────────────────────────────
    // Colour is how far the plot has got through its 3rd cull, read off the
    // same figures the list shows. The pct is 3rd culled over the adjusted
    // transplant, so it is the same answer the table gives.
    // Asked of the CURRENT cycle: a plot culled last year and filled again is in the field.
    function curCycle(p) { return p && p.cycles && p.cycles.length ? p.cycles[p.cycles.length - 1] : null; }
    function mapStateOf(p) {
        const c = curCycle(p);
        if (!c || c.tAdj <= 0) return { key: 'none', pct: 0 };
        const pct = Math.round(Math.min(100, (c.c3 / c.tAdj) * 100));
        if (c.c3 <= 0) return { key: 'field', pct };
        if (c.end || c.c3 >= c.tAdj) return { key: 'finished', pct: Math.max(pct, c.end ? 100 : pct) };
        return { key: 'culling', pct };
    }
    const fmtN = n => Number(n || 0).toLocaleString('en-MY');
    /* ── PALMS on the same map ──────────────────────────────────
       The plot log is READ here (shared_palms.js, the same reader the PALMS
       board uses) and never written: changing a stage stays on the PALMS
       board, which "Update stage" opens. PLOGS is null when the log could not
       be read, and the page is then exactly the cycle map it was. */
    let PLOGS = null;
    let MAP_MODE = 'cycle';
    const PRANK = st => (st === 'overdue' ? 0 : st === 'ontrack' ? 1 : 2);
    const P_NONE = '#94a3b8', P_LATE = '#b91c1c';
    function palmsUnits(plot) {
        if (!PLOGS) return [];
        const want = lpPlotKey(plot);
        return Object.keys(PLOGS).filter(k => lpPlotKey(MJMPalms.plotOf(k)) === want).sort(lpNatural);
    }
    // A split plot is as healthy as its worst area, the board's own rule.
    function palmsLine(plot) {
        let best = null;
        palmsUnits(plot).forEach(k => {
            const ln = MJMPalms.plotLine(PLOGS, k);
            if (!ln) return;
            if (!best || PRANK(ln.state) < PRANK(best.state)
                || (PRANK(ln.state) === PRANK(best.state) && (ln.left == null ? 1e9 : ln.left) < (best.left == null ? 1e9 : best.left))) best = ln;
        });
        return best;
    }
    function stageColour(actN) { const a = MJMPalms.actByN(actN); return (a && a.color) || P_NONE; }
    function rgba(hex, a) {
        const h = String(hex || '').replace('#', '');
        const f = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
        const n = parseInt(f, 16);
        return isNaN(n) || f.length !== 6 ? `rgba(148,163,184,${a})` : `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }
    const leftTxt = ln => (ln.left < 0 ? (-ln.left) + 'd over' : ln.left + 'd left');
    // Every stage spell this plot has had, each filed under the cycle it began in:
    // the first cycle not yet finished by that day, else the newest one.
    function palmsSpells(plot) {
        const out = [];
        palmsUnits(plot).forEach(k => MJMPalms.mergeSpells(PLOGS[k]).forEach(e => {
            const a = MJMPalms.actByN(e.actN);
            out.push({ unit: k, split: String(k).indexOf('#') !== -1, actN: e.actN, name: a ? a.name : 'Stage ' + e.actN, start: e.start, end: e.end, by: e.by });
        }));
        return out.sort((a, b) => String(a.start).localeCompare(String(b.start)));
    }
    function spellsOfCycle(spells, cycles, c) {
        return spells.filter(e => {
            const home = cycles.find(x => x.end && String(e.start) <= String(x.end)) || cycles[cycles.length - 1];
            return home === c;
        });
    }
    function spellChip(e) {
        const d = lpDays(e.start, e.end);
        return `<span class="lp-stg-c${e.end ? '' : ' run'}"><i style="background:${stageColour(e.actN)}"></i>`
             + `${e.split ? MJMPalms.keyLabel(e.unit) + ' · ' : ''}${e.name} <span class="d">${e.start || '–'} → ${e.end || 'now'}${d != null ? ' · ' + d + 'd' : ''}</span></span>`;
    }
    function stageStrip(spells) {
        return `<div class="lp-stg"><span class="lp-stg-k">PALMS</span>`
             + (spells.length ? spells.map(spellChip).join('') : '<span class="lp-stg-none">No stage recorded in this cycle.</span>') + '</div>';
    }
    function renderLegend() {
        const el = document.getElementById('lp-legend');
        document.querySelectorAll('#lp-mode button').forEach(b => {
            b.classList.toggle('on', b.dataset.mode === MAP_MODE);
            if (b.dataset.mode === 'palms') b.classList.toggle('hidden', !PLOGS);
        });
        if (MAP_MODE === 'palms') {
            const groups = [];
            (MJMPalms.ACTIVITIES || []).forEach(a => {
                const c = String(a.color || P_NONE).toLowerCase();
                let g = groups.find(x => x.c === c);
                if (!g) { g = { c, names: [] }; groups.push(g); }
                g.names.push(a.name);
            });
            el.innerHTML = groups.map(g => `<span><i style="background:${g.c}"></i>${g.names.join(' · ')}</span>`).join('')
                + `<span><i style="background:#fff;border:2px solid ${P_LATE}"></i>Overdue</span>`;
        } else {
            el.innerHTML = '<span><i style="background:#f59e0b"></i>In the field</span><span><i style="background:#3b82f6"></i>Being culled</span>'
                + '<span><i style="background:#22c55e"></i>3rd culled</span><span><i style="background:#94a3b8"></i>No batch</span>';
        }
    }
    function mapPlotIndex() {
        const idx = {};
        MODEL.groups.forEach(g => g.plots.forEach(p => { idx[lpPlotKey(p.plot)] = p; }));
        return idx;
    }
    function renderMap() {
        const box = document.getElementById('lp-map');
        const keys = NURSERY_ORDER.filter(k => MAPS[k]);
        if (!keys.length) { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        if (!keys.includes(MAP_NUR)) MAP_NUR = keys.includes(NUR) ? NUR : keys[0];
        renderHeadTabs();
        renderLegend();
        drawMap();
    }
    /* The tabs top right. Shown on the views that are about one nursery (the
       plots and PALMS), not on the year record (every nursery) or Settings. */
    function renderHeadTabs() {
        const el = document.getElementById('lp-head-nur');
        const keys = NURSERY_ORDER.filter(k => MAPS[k] && k !== 'OTHER');
        const show = keys.length && (VIEW === 'plots' || VIEW === 'palms-board');
        el.innerHTML = show ? keys.map(k =>
            `<button type="button" class="lp-tab${k === MAP_NUR ? ' on' : ''}" data-map="${k}">${NURSERY_LABEL[k]}</button>`).join('') : '';
    }
    /* PALMS draws its own tabs (hidden when embedded); press the one that
       matches. The map loads after the page, so keep asking for a while. */
    let _palmsSyncT = null;
    function syncPalmsNursery(tries) {
        clearTimeout(_palmsSyncT);
        if (VIEW !== 'palms-board' || !MAP_NUR) return;
        let done = false;
        try {
            const doc = document.getElementById('lp-palms-frame').contentDocument;
            const tabs = doc ? [...doc.querySelectorAll('.pm-tab')] : [];
            const t = tabs.find(b => lpNurKey(b.dataset.pmTab || b.textContent) === MAP_NUR);
            if (t) { if (!t.classList.contains('active')) t.click(); done = true; }
        } catch (e) { /* not loaded yet */ }
        const n = tries == null ? 60 : tries;
        if (!done && n > 0) _palmsSyncT = setTimeout(() => syncPalmsNursery(n - 1), 300);
    }
    function openPlotFromMap(name) {
        showPlot(name);
        document.getElementById('lp-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function drawMap() {
        const k = MAP_NUR;
        const body = document.getElementById('lp-map-body');
        const idx = mapPlotIndex();
        const z = MAP_ZOOM[k] || (MAP_ZOOM[k] = { z: 1, x: 0, y: 0 });
        body.innerHTML = `
            <div class="lp-viewport" id="lp-viewport">
                <div class="lp-stage" id="lp-stage">
                    <div class="relative inline-block">
                        <img class="lp-map-img" src="${MAPS[k]}" alt="Map ${NURSERY_LABEL[k]}" draggable="false">
                        <svg class="lp-svg" id="lp-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                        <div class="lp-labels" id="lp-labels"></div>
                    </div>
                </div>
                <div class="lp-zoom">
                    <button type="button" class="lp-zbtn" data-z="0.25" title="Zoom in">+</button>
                    <div class="lp-zlvl" id="lp-zlvl"></div>
                    <button type="button" class="lp-zbtn" data-z="-0.25" title="Zoom out">−</button>
                    <button type="button" class="lp-zbtn" data-z="reset" title="Reset zoom">↺</button>
                </div>
            </div>`;
        const svg = document.getElementById('lp-svg');
        const labels = document.getElementById('lp-labels');
        const vp = document.getElementById('lp-viewport');
        const stage = document.getElementById('lp-stage');

        Object.values(PLOT_SHAPES).filter(s => s.nur === k).forEach(s => {
            const p = idx[lpPlotKey(s.name)];
            const st = mapStateOf(p);
            let [fill, stroke] = MAP_FILL[st.key];
            let sw = '.4';
            const ln = PLOGS ? palmsLine(s.name) : null;
            if (MAP_MODE === 'palms') {
                if (ln && ln.state !== 'none') {
                    const col = stageColour(ln.actN);
                    fill = rgba(col, .55); stroke = ln.state === 'overdue' ? P_LATE : col;
                    if (ln.state === 'overdue') sw = '.9';
                } else { [fill, stroke] = MAP_FILL.none; }
            }
            const ptsStr = s.pts.map(pt => pt.x + ',' + pt.y).join(' ');
            const cx = s.pts.reduce((a, pt) => a + pt.x, 0) / s.pts.length;
            const cy = s.pts.reduce((a, pt) => a + pt.y, 0) / s.pts.length;
            const cc = curCycle(p);
            const tip = cc ? `Cycle ${cc.n} of ${p.cycles.length} · transplanted ${fmtN(cc.tAdj)} · 2nd cull ${fmtN(cc.c2)} · 3rd cull ${fmtN(cc.c3)}` : 'Nothing recorded';
            svg.insertAdjacentHTML('beforeend',
                `<polygon class="lp-shape" data-plot="${s.name.replace(/"/g, '&quot;')}" points="${ptsStr}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"><title>${s.name}: ${tip}</title></polygon>`);
            const cycLine = st.key === 'none'
                ? '<div class="lp-line empty">No batch</div>'
                : `<div class="lp-line" title="${tip}">Cycle ${cc.n} · ${fmtN(cc.tAdj)}</div>`;
            const stgLine = ln && ln.state !== 'none'
                ? `<div class="lp-line${ln.state === 'overdue' ? ' late' : ''}">${ln.status} · ${leftTxt(ln)}</div>` : '';
            labels.insertAdjacentHTML('beforeend',
                `<div class="lp-label" style="left:${cx}%; top:${cy}%"><div class="lp-tag">${s.name}</div>${MAP_MODE === 'palms' ? stgLine + cycLine : cycLine + stgLine}</div>`);
        });
        svg.addEventListener('click', e => {
            const el = e.target.closest && e.target.closest('.lp-shape');
            if (el) openPlotFromMap(el.dataset.plot);
        });

        const apply = () => {
            stage.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.z})`;
            labels.style.setProperty('--lp-z', z.z);
            document.getElementById('lp-zlvl').textContent = Math.round(z.z * 100) + '%';
        };
        const zoomTo = (nz, cx = 0, cy = 0) => {
            const old = z.z;
            z.z = Math.max(0.6, Math.min(5, nz));
            const f = z.z / old;
            z.x = (z.x - cx) * f + cx;
            z.y = (z.y - cy) * f + cy;
            if (z.z <= 1.01) { z.z = 1; z.x = 0; z.y = 0; }
            apply();
        };
        body.querySelectorAll('.lp-zbtn').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.z === 'reset') { z.z = 1; z.x = 0; z.y = 0; apply(); }
            else zoomTo(z.z + Number(b.dataset.z));
        }));
        vp.addEventListener('wheel', e => {
            e.preventDefault();
            const r = vp.getBoundingClientRect();
            zoomTo(z.z + (e.deltaY < 0 ? 0.15 : -0.15), e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
        }, { passive: false });
        let last = null;
        vp.addEventListener('pointerdown', e => {
            if (e.target.closest('.lp-zoom')) return;
            last = { x: e.clientX, y: e.clientY };
            stage.classList.add('drag');
        });
        vp.addEventListener('pointermove', e => {
            if (!last) return;
            z.x += e.clientX - last.x;
            z.y += e.clientY - last.y;
            last = { x: e.clientX, y: e.clientY };
            apply();
        });
        const endDrag = () => { last = null; stage.classList.remove('drag'); };
        vp.addEventListener('pointerup', endDrag);
        vp.addEventListener('pointerleave', endDrag);
        vp.addEventListener('pointercancel', endDrag);
        apply();
    }
    function setNursery(k) {
        NUR = k;
        if (MAPS[k]) MAP_NUR = k;
        fillNurserySelect();
        fillPlotSelect('');

        document.getElementById('lp-sub').textContent = 'Every plot, and what happened to it. Click a plot for its timeline.';

    }

    let NUR = '';
    const chip = (attr, val, label, on) =>
        `<button type="button" class="lp-chip${on ? ' on' : ''}" data-${attr}="${String(val).replace(/"/g, '&quot;')}">${label}</button>`;
    function fillNurserySelect() {

    function renderList() {
        let h = '<thead><tr><th class="l">Plot</th><th class="l">Nursery</th>' + (PLOGS ? '<th class="l">PALMS stage</th><th class="l">Due</th><th class="l">Last update</th>' : '') + '<th>Cycles</th><th class="l">Current cycle</th><th>Transplanted (adjusted)</th><th>2nd cull</th><th>3rd cull</th></tr></thead><tbody>';

    function stageCells(plot) {
        if (!PLOGS) return '';
        const ln = palmsLine(plot);
        if (!ln || ln.state === 'none') return '<td class="l dash">–</td><td class="l dash">–</td><td class="l dash">' + (ln && ln.lastDate ? ln.lastDate : '–') + '</td>';
        return `<td class="l"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:${stageColour(ln.actN)}"></i>${ln.status}</td>`
             + `<td class="l">${ln.due || '–'} <span class="${ln.state === 'overdue' ? 'stage-late' : ''}">· ${leftTxt(ln)}</span></td>`
             + `<td class="l">${ln.lastDate || '–'}${ln.lastBy ? ' · ' + ln.lastBy : ''}</td>`;
    }
    function lpDays(a, b) {
        if (!a) return null;
        const t0 = Date.parse(a + 'T00:00:00Z'), t1 = b ? Date.parse(b + 'T00:00:00Z') : Date.now();
        return Math.max(0, Math.round((t1 - t0) / 86400000));
    }
    function cycleSpan(c) {
        return `${c.start || '–'} → ${c.end || 'now'}`;
    }
    function cycleHtml(c, strip) {
        const d = lpDays(c.start, c.end);
        let h = `<div class="panel overflow-x-auto lp-cyc" data-cycle="${c.n}"><div class="lp-cyc-h">`
              + `<span class="lp-cyc-n">Cycle ${c.n}</span>`
              + `<span class="lp-cyc-tag${c.end ? '' : ' cur'}">${c.end ? 'Finished' : 'Current'}</span>`
              + `<span class="lp-cyc-d">${c.start || '–'} → ${c.end || 'now'}${d != null ? ' · ' + d + ' days' : ''}</span>`
              + `<span class="lp-cyc-cap">Transplanted this cycle <b>${nf(c.tAdj) || '0'}</b></span></div>` + (strip || '');
        h += '<table class="lp"><thead><tr><th class="l">Batch</th><th class="l">Transplant date</th><th>Transplant qty</th><th>Calibration</th><th>Adjusted</th>'
           + '<th class="l">2nd cull date</th><th>2nd cull qty</th><th class="l">3rd cull date</th><th>3rd cull qty</th></tr></thead><tbody>';
        c.batches.forEach(b => {
            h += `<tr><td class="l batch">${b.batch}</td><td class="l">${b.tDate || '–'}</td><td>${dash(b.tQty)}</td>`
               + `<td class="${b.adj ? 'adj' : 'dash'}">${b.adj ? (b.adj > 0 ? '+' : '') + nf(b.adj) : '–'}</td><td>${dash(b.tAdj)}</td>`
               + `<td class="l">${b.c2Date || '–'}</td><td class="cull">${dash(b.c2Qty)}</td><td class="l">${b.c3Date || '–'}</td><td class="cull">${dash(b.c3Qty)}</td></tr>`;
        });
        h += `</tbody><tfoot><tr class="tot"><td class="l">Cycle ${c.n} total</td><td></td><td>${dash(c.tQty)}</td>`
           + `<td>${c.adj ? (c.adj > 0 ? '+' : '') + nf(c.adj) : '–'}</td><td>${dash(c.tAdj)}</td><td></td><td>${dash(c.c2)}</td><td></td><td>${dash(c.c3)}</td></tr></tfoot></table></div>`;
        return h;
    }

    // Where the plot is NOW on PALMS, above its cycles. Changing it is the PALMS board's job.
    function nowHtml(p) {
        if (!PLOGS) return '';
        const ln = palmsLine(p.plot);
        const v = (k, val, late) => `<span><span class="lp-now-k">${k}</span> <span class="lp-now-v${late ? ' late' : ''}">${val}</span></span>`;
        const on = ln && ln.state !== 'none';
        return `<div class="panel lp-now">`
            + v('PALMS stage', on ? `<i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${stageColour(ln.actN)}"></i>${ln.status}` : 'No stage running')
            + (on ? v('Due', `${ln.due} · ${leftTxt(ln)}`, ln.state === 'overdue') : '')
            + v('Last update', ln && ln.lastDate ? ln.lastDate + (ln.lastBy ? ' · ' + ln.lastBy : '') : '–')
            + `<button type="button" class="lp-now-go" id="lp-now-go">Update stage in PALMS &#8594;</button></div>`;
    }
    function showPlot(name) {
        const p = MODEL.groups.flatMap(g => g.plots).find(x => x.plot === name);
        if (!p) return;
        setView('plots', true);
        NUR = p.nursery;
        if (MAPS[p.nursery]) MAP_NUR = p.nursery;
        renderMap();
        fillNurserySelect();
        fillPlotSelect(p.plot);
        document.getElementById('lp-list').classList.add('hidden');
        document.getElementById('lp-detail').classList.remove('hidden');
        document.getElementById('lp-title').textContent = 'Life of Plot · ' + p.plot;
        const nurLabel = NURSERY_LABEL[p.nursery];
        document.getElementById('lp-sub').textContent = nurLabel + ' · ' + (p.cycles.length ? p.cycles.length + ' cycle' + (p.cycles.length === 1 ? '' : 's') + ', newest first. Transplant includes approved calibration.' : 'nothing recorded yet.');
        history.replaceState(null, '', '#plot=' + encodeURIComponent(p.plot));
        const spells = PLOGS ? palmsSpells(p.plot) : [];
        document.getElementById('lp-now-box').innerHTML = nowHtml(p);
        const go = document.getElementById('lp-now-go');
        if (go) go.addEventListener('click', () => { NUR = MAP_NUR = p.nursery; setView('palms-board'); });
        document.getElementById('lp-timeline-box').innerHTML = p.cycles.length
            ? p.cycles.slice().reverse().map(c => cycleHtml(c, PLOGS ? stageStrip(spellsOfCycle(spells, p.cycles, c)) : '')).join('')
            : (spells.length ? `<div class="panel lp-cyc">${stageStrip(spells)}</div>` : '')
              + '<div class="panel p-8 text-center text-sm font-bold text-[#94a3b8]">Nothing recorded on this plot yet.</div>';
        document.getElementById('lp-note').textContent = 'Dates come from the transplant and cull records: the record\'s own date, else the Date / CullDate written in its remark, else the day it was saved.';
    }

    // ── Side bar: Plots & cycles, or the Transplant record by year ──
    let VIEW = 'plots';
    let REC_YEAR = '';
    const PALMS_PAGES = {
        'palms-board':  { href: '../nursery_ops/nursery_ops_palms_board.html?embed=1',  title: 'PALMS', sub: 'Change a plot stage here. Plot Map in the side bar brings you back.' },
        'palms-stages': { href: '../nursery_ops/nursery_ops_palms_stages.html?embed=1', title: 'Settings',  sub: 'Life of Plot · the stages a plot moves through.' },
    };
    function setView(v, quiet) {
        VIEW = v === 'record' ? 'record' : (PALMS_PAGES[v] ? v : 'plots');
        // The stage editor is reached from the Plot Map, so the Plot Map stays lit while it is open.
        const lit = VIEW === 'palms-board' ? 'plots' : VIEW;
        document.querySelectorAll('#lp-side .lp-side-b').forEach(b => b.classList.toggle('on', b.dataset.view === lit));
        document.getElementById('lp-record').classList.toggle('hidden', VIEW !== 'record');
        document.getElementById('lp-plots-view').classList.toggle('hidden', VIEW !== 'plots');
        document.getElementById('lp-palms').classList.toggle('hidden', !PALMS_PAGES[VIEW]);
        if (MODEL) renderHeadTabs();
        if (PALMS_PAGES[VIEW]) {
            const pg = PALMS_PAGES[VIEW];
            const fr = document.getElementById('lp-palms-frame');
            if (fr.getAttribute('src') !== pg.href) fr.setAttribute('src', pg.href);
            document.getElementById('lp-title').textContent = pg.title;
            document.getElementById('lp-sub').textContent = pg.sub;
            if (!quiet) history.replaceState(null, '', '#view=' + VIEW);
            syncPalmsNursery();
        } else if (VIEW === 'record') {
            document.getElementById('lp-title').textContent = 'Transplant Record ' + REC_YEAR;
            document.getElementById('lp-sub').textContent = 'Every main plot, transplanted by month.';
            if (!quiet) history.replaceState(null, '', '#view=record&year=' + REC_YEAR);
            renderRecord();
        } else if (!quiet) {
            showList();
        }
    }
    function renderRecord() {
        if (!MODEL) return;
        const years = lpYears(MODEL);
        const nowY = String(new Date().getFullYear());
        if (!years.includes(nowY)) years.push(nowY);
        years.sort();
        if (!REC_YEAR || !years.includes(REC_YEAR)) REC_YEAR = years.includes(nowY) ? nowY : years[years.length - 1];
        document.getElementById('lp-title').textContent = 'Transplant Record ' + REC_YEAR;
        document.getElementById('lp-year-row').innerHTML = years.slice().reverse().map(y => chip('year', y, y, y === REC_YEAR)).join('');
        const R = buildTransplantYear(MODEL, REC_YEAR);
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const cell = v => (v ? `<td>${nf(v)}</td>` : '<td class="dash"></td>');
        const sumRow = (label, xs, total) => `<tr class="sumrow"><td class="l batch">${label}</td>${xs.map(v => `<td class="sum">${v ? nf(v) : '–'}</td>`).join('')}<td class="yt">${total == null ? '' : nf(total) || '0'}</td></tr>`;
        let h = `<thead><tr><th class="l">Month</th>${MON.map(m => `<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
        h += '<tr class="grp"><td colspan="14">Summary</td></tr>';
        h += sumRow('Total transplanted ' + R.year, R.thisY, R.total);
        h += sumRow('Cumulative ' + R.year, R.thisCum, null);
        h += sumRow('Total transplanted ' + R.prev, R.prevY, R.prevTotal);
        h += sumRow('Cumulative ' + R.prev, R.prevCum, null);
        R.groups.forEach(g => {
            h += `<tr class="grp"><td colspan="14">${g.label}</td></tr>`;
            g.plots.forEach(p => {
                h += `<tr class="plotrow" data-plot="${p.plot.replace(/"/g, '&quot;')}"><td class="l batch">${p.plot}</td>${p.months.map(cell).join('')}<td class="yt">${p.total ? nf(p.total) : ''}</td></tr>`;
            });
            h += `<tr class="tot"><td class="l">Total ${g.label}</td>${g.months.map(v => `<td>${nf(v) || '0'}</td>`).join('')}<td>${nf(g.total) || '0'}</td></tr>`;
        });
        h += '</tbody>';
        const t = document.getElementById('lp-rec-table');
        t.innerHTML = h;
        t.querySelectorAll('tr.plotrow').forEach(tr => tr.addEventListener('click', () => {
            showPlot(tr.dataset.plot);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
    }

    async function load() {
        document.getElementById('lp-status').classList.remove('hidden');
        document.getElementById('lp-status').textContent = 'Loading…';
        try {
            const palmsP = (async () => {
                if (!window.MJMPalms) return null;
                try {
                    await MJMPalms.loadStages(_supabase);
                    const logs = await MJMPalms.loadLogs(_supabase);
                    await MJMPalms.loadSaves(_supabase);
                    return logs;
                } catch (e) { console.warn('[lifeplot] PALMS log not read, the map shows cycles only:', (e && e.message) || e); return null; }
            })();
            const [plots, rows, nurs] = await Promise.all([
                lpFetchAll(() => _supabase.from('shared_plots').select('plot_name, nursery_name, map_top').order('plot_name')),
                lpFetchAll(() => _supabase.from('shared_inventory_logs')
                    .select('id, plot_name, transaction_type, transaction_date, quantity_change, batch_name, remark, created_at')
                    .in('transaction_type', ['Transplanted', 'Stock_Calibration', '2nd_Culling', '3rd_Culling'])
                    .order('id', { ascending: true })),
                _supabase.from('operation_nurseries').select('name, map_image_url').then(r => (r.data || []), () => []),
            ]);
            MAPS = {};
            (nurs || []).forEach(n => { if (n.map_image_url) MAPS[lpNurKey(n.name)] = n.map_image_url; });
            PLOT_SHAPES = {};
            (plots || []).forEach(p => {
                if (lpIsReplant(p.plot_name) || !String(p.map_top || '').startsWith('[')) return;
                try {
                    const nk = lpNurKey(p.nursery_name);
                    PLOT_SHAPES[lpPlotKey(p.plot_name)] = { name: p.plot_name, nur: NURSERY_ORDER.includes(nk) ? nk : 'OTHER', pts: JSON.parse(p.map_top) };
                } catch (e) { /* a shape that will not parse is simply not drawn */ }
            });
            MODEL = buildPlotHistory(plots, rows);
            PLOGS = await palmsP;
            let saved = '';
            try { saved = localStorage.getItem('lp_map_mode') || ''; } catch (e) { /* storage blocked */ }
            MAP_MODE = PLOGS && Object.keys(PLOGS).length && saved !== 'cycle' ? 'palms' : 'cycle';
            // With the map choosing the nursery there is no "All nurseries", so
            // the list opens on the nursery the map opens on.
            if (!NUR) { const k0 = NURSERY_ORDER.find(k => MAPS[k]); if (k0) NUR = k0; }
            document.getElementById('lp-status').classList.add('hidden');
            fillNurserySelect();
            fillPlotSelect('');
            renderList();
            renderMap();
            const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
            REC_YEAR = (location.hash.match(/year=(\d{4})/) || [])[1] || '';
            const viewIn = (location.hash.match(/view=([a-z-]+)/) || [])[1] || '';
            if (deep) showPlot(deep);
            else if (viewIn === 'record' || PALMS_PAGES[viewIn]) setView(viewIn);
            else showList();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not read the plot records: ' + (e && e.message ? e.message : e);
        }
    }

    document.getElementById('lp-up').addEventListener('click', showList);
    document.getElementById('lp-mode').addEventListener('click', e => {
        const b = e.target.closest('button[data-mode]');
        if (!b || (b.dataset.mode === 'palms' && !PLOGS)) return;
        MAP_MODE = b.dataset.mode;
        try { localStorage.setItem('lp_map_mode', MAP_MODE); } catch (err) { /* storage blocked */ }
        renderLegend();
        drawMap();
    });
    document.getElementById('lp-side').addEventListener('click', e => {
        const b = e.target.closest('button[data-view]');
        if (b) setView(b.dataset.view);
    });
    document.getElementById('lp-year-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-year]');
        if (!b) return;
        REC_YEAR = b.dataset.year;
        history.replaceState(null, '', '#view=record&year=' + REC_YEAR);
        renderRecord();
    });
    document.getElementById('lp-nursery-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-nur]');
        if (!b) return;
        setNursery(b.dataset.nur);
    });
    document.getElementById('lp-head-nur').addEventListener('click', e => {
        const b = e.target.closest('button[data-map]');
        if (!b) return;
        if (VIEW === 'palms-board') {
            NUR = MAP_NUR = b.dataset.map;
            fillNurserySelect(); fillPlotSelect(''); renderList(); renderMap();
            syncPalmsNursery();
        } else setNursery(b.dataset.map);
    });
    document.getElementById('lp-palms-frame').addEventListener('load', () => syncPalmsNursery());
    document.getElementById('lp-plot-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-plot]');
        if (!b) return;
        if (b.dataset.plot) showPlot(b.dataset.plot); else showList();
    });
    window.addEventListener('hashchange', () => {
        const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
        const viewIn = (location.hash.match(/view=([a-z-]+)/) || [])[1] || '';
        if (MODEL && deep) showPlot(deep);
        else if (MODEL && (viewIn === 'record' || PALMS_PAGES[viewIn])) setView(viewIn);
        else if (MODEL) showList();
    });

    (async function boot() {
        try {
            await MJMAccess.load(_supabase);
            if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
            if (!MJMAccess.canOpenOperationPage('lifeplot')) {
                document.getElementById('lp-status').textContent = 'You do not have access to Life of Plot.';
                return;
            }
            await load();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not sign you in: ' + (e && e.message ? e.message : e);
        }
    })();
</script>
</body>
</html>
