<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>Life of Plot · MJM Nursery</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/shared_supabase.js"></script>
    <script src="../shared/shared_staff_gate.js"></script>
    <script src="../shared/shared_access.js"></script>
    <style>
        /* Batch Record's look, so the two read as one system. */
        body { background-color: #f8f4ec; margin: 0; font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
        .bg-pattern { position: fixed; inset: 0; background-image: radial-gradient(#e8dcc8 1px, transparent 1px); background-size: 24px 24px; z-index: -2; opacity: 0.5; }
        .panel { background-color: rgba(253, 250, 244, 0.95); border: 1px solid #ffffff; box-shadow: 0 25px 50px -12px rgba(61, 38, 16, 0.08); border-radius: 2rem; }
        .lp-back { font-size: 10px; font-weight: 700; color: #8a7a68; text-transform: uppercase; letter-spacing: .1em; background: #f8f4ec; padding: 10px 18px; border-radius: 12px; text-decoration: none; box-shadow: 0 1px 2px rgba(61,38,16,.06); }
        .lp-back:hover { background: #e8dcc8; color: #3d2610; }
        table.lp { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 13px; width: 100%; }
        table.lp th, table.lp td { padding: 16px; border-bottom: 1px solid #f8f4ec; text-align: right; white-space: nowrap; vertical-align: middle; }
        table.lp th { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #8a7a68; padding: 12px 16px; border-bottom: 2px solid #e8dcc8; }
        table.lp td { font-size: 13px; font-weight: 600; color: #1a150d; }
        table.lp td.l, table.lp th.l { text-align: left; }
        table.lp tbody tr.plotrow { cursor: pointer; }
        table.lp tbody tr.plotrow:hover td { background: #fdfaf4; }
        table.lp tr.grp td { background: #f1ead9; color: #5c3d1e; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 10px 16px; border-bottom: 1px solid #e8dcc8; }
        table.lp tfoot tr.tot td { font-weight: 900; color: #3d2610; border-top: 2px solid #e8dcc8; border-bottom: none; }
        table.lp td.batch { font-weight: 900; }
        table.lp td.dash { color: #c9bba8; }
        table.lp td.adj { color: #4a7a2e; font-weight: 800; }
        table.lp td.cull { color: #1a150d; }
        .lp-chip-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #8a7a68; }
        .lp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .lp-chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #e8dcc8; background: #fdfaf4; font-weight: 700; font-size: 12px; color: #5c3d1e; cursor: pointer; }
        .lp-chip:hover { border-color: #6aa83c; color: #4a7a2e; }
        .lp-chip.on { background: #4a7a2e; border-color: #4a7a2e; color: #fdfaf4; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative">
<div class="bg-pattern"></div>

<div class="max-w-[1400px] mx-auto py-4">
    <div class="panel p-6 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
        <a id="lp-back" href="operation_dashboard.html" class="lp-back">&#8592; Back</a>
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-black uppercase tracking-widest text-[#3d2610]" id="lp-title" style="word-spacing:.2em">Life of Plot</h1>
            <p class="text-[11px] font-bold text-[#8a7a68] mt-1" id="lp-sub">Every plot, and what happened to it.</p>
        </div>
        <div class="hidden md:block w-[90px]"></div>
    </div>

    <div class="panel p-6 mb-6 space-y-3">
        <div class="lp-chip-label">Nursery</div>
        <div id="lp-nursery-row" class="lp-chips"></div>
        <div class="lp-chip-label">Plot</div>
        <div id="lp-plot-row" class="lp-chips"></div>
    </div>

    <div id="lp-status" class="panel p-8 text-center text-sm font-bold text-[#8a7a68]">Loading…</div>

    <div id="lp-list" class="hidden panel overflow-x-auto">
        <table class="lp" id="lp-plots"></table>
    </div>

    <div id="lp-detail" class="hidden">
        <button id="lp-up" class="lp-back mb-4">&#8592; All plots</button>
        <div class="panel overflow-x-auto">
            <table class="lp" id="lp-timeline"></table>
        </div>
        <p id="lp-note" class="text-[11px] font-bold text-[#8a7a68] mt-3"></p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://kibqjztozokohqmhqqqf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const NURSERY_LABEL = { BNN: 'BNN', UNN1: 'UNN 1', UNN2: 'UNN 2', OTHER: 'Not in Seedling Stock' };
    const NURSERY_ORDER = ['BNN', 'UNN1', 'UNN2', 'OTHER'];

    // ── BEGIN build (pure: rows in, figures out — the test lifts this block) ──
    function lpNurKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
    function lpPlotKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(^|[A-Z])0+(\d)/g, '$1$2'); }
    function lpIsReplant(s) { return /-R/i.test(String(s || '')); }
    function lpNatural(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); }
    // A row's day: its own transaction_date, else the Date: written in its remark, else the day it was saved.
    function lpDayOf(r, key) {
        const td = String(r.transaction_date || '').slice(0, 10);
        if (td) return td;
        const rem = String(r.remark || '');
        const m = rem.match(new RegExp(key + ':\\s*(\\d{4}-\\d{2}-\\d{2})'));
        if (m) return m[1];
        return String(r.created_at || '').slice(0, 10) || null;
    }
    function lpEarliest(days) { return days.filter(Boolean).sort()[0] || null; }
    function lpLatest(days) { return days.filter(Boolean).sort().slice(-1)[0] || null; }
    // An approved calibration against the transplanting report, keyed to the batch it corrects.
    function lpIsApprovedTransplantCal(r) {
        const rem = String(r.remark || '');
        return r.transaction_type === 'Stock_Calibration' && /^Report:\s*Transplanting/i.test(rem) && /APPROVED/i.test(rem);
    }
    function buildPlotHistory(plots, rows) {
        const nurOfPlot = new Map();
        (plots || []).forEach(p => {
            if (lpIsReplant(p.plot_name)) return;
            const n = lpNurKey(p.nursery_name);
            nurOfPlot.set(lpPlotKey(p.plot_name), { name: p.plot_name, nursery: NURSERY_ORDER.includes(n) ? n : 'OTHER' });
        });
        const byPlot = new Map();
        const plotOf = (r) => {
            const k = lpPlotKey(r.plot_name);
            if (!byPlot.has(k)) {
                const known = nurOfPlot.get(k);
                byPlot.set(k, { name: known ? known.name : r.plot_name, nursery: known ? known.nursery : 'OTHER', batches: new Map() });
            }
            return byPlot.get(k);
        };
        const batchOf = (plot, r) => {
            const b = String(r.batch_name || '—');
            if (!plot.batches.has(b)) plot.batches.set(b, { batch: b, tRows: [], adjRows: [], c2Rows: [], c3Rows: [] });
            return plot.batches.get(b);
        };
        (rows || []).forEach(r => {
            if (lpIsReplant(r.plot_name)) return;
            const t = r.transaction_type;
            if (t === 'Transplanted') batchOf(plotOf(r), r).tRows.push(r);
            else if (lpIsApprovedTransplantCal(r)) batchOf(plotOf(r), r).adjRows.push(r);
            else if (t === '2nd_Culling') batchOf(plotOf(r), r).c2Rows.push(r);
            else if (t === '3rd_Culling') batchOf(plotOf(r), r).c3Rows.push(r);
        });
        // A plot in Seedling Stock with nothing recorded still gets a row, so an empty plot shows as empty.
        nurOfPlot.forEach((v, k) => { if (!byPlot.has(k) && v.nursery !== 'OTHER') byPlot.set(k, { name: v.name, nursery: v.nursery, batches: new Map() }); });

        const sum = (xs, f) => xs.reduce((a, r) => a + (Number(f(r)) || 0), 0);
        const out = NURSERY_ORDER.map(key => {
            const list = [...byPlot.values()].filter(p => p.nursery === key).sort((a, b) => lpNatural(a.name, b.name));
            return { key, label: NURSERY_LABEL[key], plots: list.map(p => {
                const batches = [...p.batches.values()].map(b => {
                    const tQty = sum(b.tRows, r => r.quantity_change);
                    const adj = sum(b.adjRows, r => r.quantity_change);
                    return {
                        batch: b.batch,
                        tDate: lpEarliest(b.tRows.map(r => lpDayOf(r, 'Date'))),
                        tQty, adj, tAdj: tQty + adj,
                        c2Date: lpEarliest(b.c2Rows.map(r => lpDayOf(r, 'CullDate'))),
                        c2Qty: sum(b.c2Rows, r => r.quantity_change),
                        c3Date: lpEarliest(b.c3Rows.map(r => lpDayOf(r, 'CullDate'))),
                        c3Qty: sum(b.c3Rows, r => r.quantity_change),
                    };
                }).sort((x, y) => (x.tDate || '9999').localeCompare(y.tDate || '9999') || lpNatural(x.batch, y.batch));
                return {
                    plot: p.name, nursery: p.nursery, batches,
                    tAdj: batches.reduce((a, b) => a + b.tAdj, 0),
                    c2: batches.reduce((a, b) => a + b.c2Qty, 0),
                    c3: batches.reduce((a, b) => a + b.c3Qty, 0),
                };
            }) };
        }).filter(g => g.plots.length || g.key !== 'OTHER');
        return { groups: out };
    }
    // ── END build ──

    async function lpFetchAll(build) {
        const out = [];
        for (let from = 0; ; from += 1000) {
            const { data, error } = await build().range(from, from + 999);
            if (error) throw error;
            out.push(...(data || []));
            if (!data || data.length < 1000) break;
        }
        return out;
    }

    const nf = n => (n ? Number(n).toLocaleString('en-MY') : '');
    const dash = v => (v ? nf(v) : '–');
    let MODEL = null;

    function showList() {
        fillPlotSelect('');
        document.getElementById('lp-list').classList.remove('hidden');
        document.getElementById('lp-detail').classList.add('hidden');
        document.getElementById('lp-title').textContent = 'Life of Plot';
        document.getElementById('lp-sub').textContent = 'Every plot, and what happened to it. Click a plot for its timeline.';
        history.replaceState(null, '', location.pathname);
    }

    let NUR = '';
    const chip = (attr, val, label, on) =>
        `<button type="button" class="lp-chip${on ? ' on' : ''}" data-${attr}="${String(val).replace(/"/g, '&quot;')}">${label}</button>`;
    function fillNurserySelect() {
        const keys = MODEL.groups.filter(g => g.plots.length).map(g => g.key);
        document.getElementById('lp-nursery-row').innerHTML =
            chip('nur', '', 'All nurseries', !NUR) + keys.map(k => chip('nur', k, NURSERY_LABEL[k], NUR === k)).join('');
    }
    function fillPlotSelect(keep) {
        const names = MODEL.groups.filter(g => !NUR || g.key === NUR).flatMap(g => g.plots.map(p => p.plot));
        const cur = keep && names.includes(keep) ? keep : '';
        document.getElementById('lp-plot-row').innerHTML =
            chip('plot', '', 'All plots', !cur) + names.map(n => chip('plot', n, n, cur === n)).join('');
    }

    function renderList() {
        let h = '<thead><tr><th class="l">Plot</th><th class="l">Nursery</th><th>Transplanted (adjusted)</th><th>2nd cull</th><th>3rd cull</th></tr></thead><tbody>';
        MODEL.groups.filter(g => !NUR || g.key === NUR).forEach(g => {
            h += `<tr class="grp"><td colspan="5">${g.label} · ${g.plots.length} plot${g.plots.length === 1 ? '' : 's'}</td></tr>`;
            g.plots.forEach(p => {
                h += `<tr class="plotrow" data-plot="${p.plot.replace(/"/g, '&quot;')}"><td class="l batch">${p.plot}</td><td class="l">${g.label}</td><td>${dash(p.tAdj)}</td><td class="cull">${dash(p.c2)}</td><td class="cull">${dash(p.c3)}</td></tr>`;
            });
            if (!g.plots.length) h += '<tr><td colspan="5" class="l" style="color:#94a3b8;font-weight:700">No plots.</td></tr>';
        });
        h += '</tbody>';
        document.getElementById('lp-plots').innerHTML = h;
        document.querySelectorAll('#lp-plots tr.plotrow').forEach(tr => tr.addEventListener('click', () => showPlot(tr.dataset.plot)));
    }

    function showPlot(name) {
        const p = MODEL.groups.flatMap(g => g.plots).find(x => x.plot === name);
        if (!p) return;
        NUR = p.nursery;
        fillNurserySelect();
        fillPlotSelect(p.plot);
        document.getElementById('lp-list').classList.add('hidden');
        document.getElementById('lp-detail').classList.remove('hidden');
        document.getElementById('lp-title').textContent = 'Life of Plot · ' + p.plot;
        const nurLabel = NURSERY_LABEL[p.nursery];
        document.getElementById('lp-sub').textContent = nurLabel + ' · transplant, 2nd cull and 3rd cull by batch, in date order. Transplant includes approved calibration.';
        history.replaceState(null, '', '#plot=' + encodeURIComponent(p.plot));
        let h = '<thead><tr><th class="l">Batch</th><th class="l">Transplant date</th><th>Transplant qty</th><th>Calibration</th><th>Adjusted</th>'
              + '<th class="l">2nd cull date</th><th>2nd cull qty</th><th class="l">3rd cull date</th><th>3rd cull qty</th></tr></thead><tbody>';
        if (!p.batches.length) h += '<tr><td colspan="9" class="l" style="color:#94a3b8;font-weight:700">Nothing recorded on this plot yet.</td></tr>';
        p.batches.forEach(b => {
            h += `<tr><td class="l batch">${b.batch}</td><td class="l">${b.tDate || '–'}</td><td>${dash(b.tQty)}</td>`
               + `<td class="${b.adj ? 'adj' : 'dash'}">${b.adj ? (b.adj > 0 ? '+' : '') + nf(b.adj) : '–'}</td><td>${dash(b.tAdj)}</td>`
               + `<td class="l">${b.c2Date || '–'}</td><td class="cull">${dash(b.c2Qty)}</td><td class="l">${b.c3Date || '–'}</td><td class="cull">${dash(b.c3Qty)}</td></tr>`;
        });
        h += `</tbody><tfoot><tr class="tot"><td class="l">Total</td><td></td><td>${dash(p.batches.reduce((a, b) => a + b.tQty, 0))}</td>`
           + `<td>${dash(p.batches.reduce((a, b) => a + b.adj, 0)) || '–'}</td><td>${dash(p.tAdj)}</td><td></td><td>${dash(p.c2)}</td><td></td><td>${dash(p.c3)}</td></tr></tfoot>`;
        document.getElementById('lp-timeline').innerHTML = h;
        document.getElementById('lp-note').textContent = 'Dates come from the transplant and cull records: the record\'s own date, else the Date / CullDate written in its remark, else the day it was saved.';
    }

    async function load() {
        document.getElementById('lp-status').classList.remove('hidden');
        document.getElementById('lp-status').textContent = 'Loading…';
        try {
            const [plots, rows] = await Promise.all([
                lpFetchAll(() => _supabase.from('shared_plots').select('plot_name, nursery_name').order('plot_name')),
                lpFetchAll(() => _supabase.from('shared_inventory_logs')
                    .select('id, plot_name, transaction_type, transaction_date, quantity_change, batch_name, remark, created_at')
                    .in('transaction_type', ['Transplanted', 'Stock_Calibration', '2nd_Culling', '3rd_Culling'])
                    .order('id', { ascending: true })),
            ]);
            MODEL = buildPlotHistory(plots, rows);
            document.getElementById('lp-status').classList.add('hidden');
            fillNurserySelect();
            fillPlotSelect('');
            renderList();
            const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
            if (deep) showPlot(deep); else showList();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not read the plot records: ' + (e && e.message ? e.message : e);
        }
    }

    document.getElementById('lp-up').addEventListener('click', showList);
    document.getElementById('lp-nursery-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-nur]');
        if (!b) return;
        NUR = b.dataset.nur;
        fillNurserySelect();
        fillPlotSelect('');
        renderList();
        showList();
    });
    document.getElementById('lp-plot-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-plot]');
        if (!b) return;
        if (b.dataset.plot) showPlot(b.dataset.plot); else showList();
    });
    window.addEventListener('hashchange', () => {
        const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
        if (MODEL && deep) showPlot(deep); else if (MODEL) showList();
    });

    (async function boot() {
        try {
            await MJMAccess.load(_supabase);
            if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
            if (!MJMAccess.canOpenOperationPage('lifeplot')) {
                document.getElementById('lp-status').textContent = 'You do not have access to Life of Plot.';
                return;
            }
            await load();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not sign you in: ' + (e && e.message ? e.message : e);
        }
    })();
</script>
</body>
</html>
