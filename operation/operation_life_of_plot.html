            ? p.cycles.slice().reverse().map(c => cycleHtml(c, p)).join('')
            : '<div class="panel p-8 text-center text-sm font-bold text-[#94a3b8]">Nothing recorded on this plot yet.</div>';
        document.getElementById('lp-note').textContent = '';
        lpBindTips(document.getElementById('lp-timeline-box'));
        // The 3rd culling waits on the sales; draw again once they are read.
        if (!(ROT && ROT.done)) ensureRot().then(() => {
            if (VIEW === 'plots' && location.hash === '#plot=' + encodeURIComponent(p.plot)) showPlot(p.plot);
        }).catch(() => {});
    }

    // ── Settings ──
    async function lpLoadSettings() {
        try {
            const r = await _supabase.from('nops_maint_config').select('txt_value').eq('key', LP_SET_KEY).maybeSingle();
            if (r && r.data && r.data.txt_value) lpApplySet(JSON.parse(r.data.txt_value));
        } catch (e) { console.warn('[lifeplot] settings not read, the built-in values stand:', (e && e.message) || e); }
    }
    const lpMayEditSettings = () => { try { return !!(window.MJMAccess && MJMAccess.isAdminOf && MJMAccess.isAdminOf('operation')); } catch (e) { return false; } };
    /* Each section is LOCKED until its Edit is pressed (the office: "default是lock的
       加一个edit 按钮 才可以edit"); Save or Cancel locks it again. A section is
       drawn on its own, so opening or closing one never touches another. */
    const LP_SET_EDITING = new Set();
    function lpSetSectionHtml(sec) {
        const can = lpMayEditSettings(), on = can && LP_SET_EDITING.has(sec), dis = on ? '' : ' disabled';
        const S = LP_SET, esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const num = (id, v, lo, hi) => `<input type="number" id="${id}" min="${lo}" max="${hi}" step="1" value="${v}"${dis}>`;
        const toHex = x => { const m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(x || ''); return /^#[0-9a-f]{6}$/i.test(x || '') ? x : m ? '#' + [m[1], m[2], m[3]].map(n => (+n).toString(16).padStart(2, '0')).join('') : '#94a3b8'; };
        const head = title => `<div class="lp-set-top"><div class="lp-set-h">${title}</div>${can && !on ? `<button type="button" class="lp-set-edit" data-ls-edit="${sec}">Edit</button>` : ''}</div>`;
        const foot = on ? `<div class="lp-set-foot"><span class="lp-set-msg" data-ls-msg="${sec}"></span><button type="button" class="lp-set-cancel" data-ls-cancel="${sec}">Cancel</button><button type="button" class="lp-set-save" data-ls-save="${sec}">Save</button></div>` : `<div class="lp-set-foot"><span class="lp-set-msg" data-ls-msg="${sec}"></span></div>`;
        let body = '';
        if (sec === 'cycles') body = head('Plots &amp; cycles')
            + `<div class="lp-set-row"><label for="ls-est2">2nd culling estimate</label>${num('ls-est2', S.est2, 1, 24)}<span>months after transplant</span></div>`
            + `<div class="lp-set-row"><label for="ls-est3">3rd culling estimate</label>${num('ls-est3', S.est3, 1, 36)}<span>months after transplant</span></div>`;
        if (sec === 'map') body = head('Map stages')
            + LP_STAGES.map(x => `<div class="lp-set-row"><div><label class="lp-set-sw${on ? '' : ' ro'}" style="background:${x.fill};border-color:${x.stroke}"><input type="color" id="ls-col-${x.key}" value="${toHex(x.stroke)}"${dis}></label></div><input type="text" id="ls-name-${x.key}" value="${esc(x.label)}" maxlength="40"${dis}><span></span></div>`).join('')
            + `<div class="lp-set-row"><label for="ls-soon">${esc(LP_STAGES[2].label)} from month</label>${num('ls-soon', S.soonMonth, 1, 36)}<span>after transplant</span></div>`;
        if (sec === 'plans') body = head('Pusingan Jualan &amp; Transplant')
            + `<div class="lp-set-row"><label for="ls-colpct">Collection plan</label>${num('ls-colpct', S.colPct, 1, 100)}<span>% of the transplant</span></div>`
            + `<div class="lp-set-row"><label for="ls-colm">Collection plan from</label>${num('ls-colm', S.colMonths, 1, 36)}<span>months earlier</span></div>`
            + `<div class="lp-set-row"><label for="ls-trm">Transplanting plan from</label>${num('ls-trm', S.trMonths, 1, 36)}<span>months earlier</span></div>`;
        return `<div class="panel lp-set-sec" data-ls-sec="${sec}">${body}${foot}</div>`;
    }
    function lpSetDrawSection(sec, note) {
        const old = document.querySelector(`#lp-set [data-ls-sec="${sec}"]`);
        if (!old) return;
        old.outerHTML = lpSetSectionHtml(sec);
        const el = document.querySelector(`#lp-set [data-ls-sec="${sec}"]`);
        lpSetBind(el);
        if (note) { const m = el.querySelector('[data-ls-msg]'); if (m) m.textContent = note; }
    }
    function lpSetBind(root) {
        // The swatch IS the picker: pressing it opens the colour, and it repaints as one is chosen.
        root.querySelectorAll('.lp-set-sw input[type=color]').forEach(inp => inp.addEventListener('input', () => {
            const sw = inp.parentElement; sw.style.borderColor = inp.value; sw.style.background = lpHexA(inp.value, .45) || inp.value;
        }));
        root.querySelectorAll('[data-ls-edit]').forEach(b => b.addEventListener('click', () => { if (!lpMayEditSettings()) return; LP_SET_EDITING.add(b.dataset.lsEdit); lpSetDrawSection(b.dataset.lsEdit); }));
        root.querySelectorAll('[data-ls-cancel]').forEach(b => b.addEventListener('click', () => { LP_SET_EDITING.delete(b.dataset.lsCancel); lpSetDrawSection(b.dataset.lsCancel); }));
        root.querySelectorAll('[data-ls-save]').forEach(b => b.addEventListener('click', () => saveSettings(b.dataset.lsSave)));
    }
    async function renderSettings() {
        const box = document.getElementById('lp-set');
        LP_SET_EDITING.clear();
        box.innerHTML = ['cycles', 'map', 'plans'].map(lpSetSectionHtml).join('');
        lpSetBind(box);
    }
    /* Save ONE section: its own fields off the screen, every other field as it
       is SAVED, so an unsaved edit in another section is neither written nor
       thrown away. */
    async function saveSettings(sec) {
        const msg = document.querySelector(`[data-ls-msg="${sec}"]`), btn = document.querySelector(`[data-ls-save="${sec}"]`);
        const say = t => { if (msg) msg.textContent = t; };
        if (!lpMayEditSettings()) { say('Only an Operation admin can change Settings.'); return; }
        const val = id => { const e = document.getElementById(id); return e ? Number(e.value) : NaN; };
        const ok = (x, lo, hi) => Number.isInteger(x) && x >= lo && x <= hi;
        const v = JSON.parse(JSON.stringify(LP_SET));
        let checks = [];
        if (sec === 'cycles') { v.est2 = val('ls-est2'); v.est3 = val('ls-est3'); checks = [['est2', 1, 24], ['est3', 1, 36]]; }
        if (sec === 'plans') { v.colPct = val('ls-colpct'); v.colMonths = val('ls-colm'); v.trMonths = val('ls-trm'); checks = [['colPct', 1, 100], ['colMonths', 1, 36], ['trMonths', 1, 36]]; }
        if (sec === 'map') {
            v.soonMonth = val('ls-soon'); checks = [['soonMonth', 1, 36]];
            v.stages = {};
            LP_STAGES.forEach((x, i) => {
                const name = String((document.getElementById('ls-name-' + x.key) || {}).value || '').trim();
                const col = String((document.getElementById('ls-col-' + x.key) || {}).value || '');
                const b = LP_STAGES_BUILTIN[i], o = {};
                if (name && name !== b.label) o.label = name;
                if (/^#[0-9a-f]{6}$/i.test(col) && col.toLowerCase() !== String(b.stroke).toLowerCase()) o.color = col;
                if (Object.keys(o).length) v.stages[x.key] = o;
            });
        }
        if (checks.some(([k, lo, hi]) => !ok(v[k], lo, hi))) { say('Whole numbers only, in range.'); return; }
        if (btn) btn.disabled = true;
        say('Saving…');
        try {
            const who = (MJMAccess.user && MJMAccess.user() && MJMAccess.user().email) || null;
            const { error } = await _supabase.from('nops_maint_config').upsert({ key: LP_SET_KEY, txt_value: JSON.stringify(v), note: 'Life of Plot Settings', updated_by: who, updated_at: new Date().toISOString() }, { onConflict: 'key' });
            if (error) throw error;
            lpApplySet(v);
            if (MODEL) renderHeadTabs();
            LP_SET_EDITING.delete(sec);
            lpSetDrawSection(sec, 'Saved.');
            return;
        } catch (e) {
            say('Not saved: ' + ((e && e.message) || e));
        }
        if (btn) btn.disabled = false;
    }

    // ── Cycles set by hand ──
    // One row of nops_maint_config, key life_of_plot_cycles: { plotKey: [[batch, ...], ...] }.
    const LP_CYC_KEY = 'life_of_plot_cycles';
    let LP_CYC = {};
    let CYC_EDIT = null;   // { plot, groups: [[batchKey, ...], ...] } while the editor is open
    async function lpReadCycles() {
        const r = await _supabase.from('nops_maint_config').select('txt_value').eq('key', LP_CYC_KEY).maybeSingle();
        if (r && r.error) throw r.error;
        return r && r.data && r.data.txt_value ? (JSON.parse(r.data.txt_value) || {}) : {};
    }
    async function lpLoadCycles() {
        try { LP_CYC = await lpReadCycles(); } catch (e) { LP_CYC = {}; console.warn('[lifeplot] cycles set by hand not read, the rule stands:', (e && e.message) || e); }
    }
    function lpApplyCycles() {
        if (!MODEL) return;
        MODEL.groups.forEach(g => g.plots.forEach(p => {
            const ov = LP_CYC[lpPlotKey(p.plot)];
            p.cycles = lpCycles(p.batches, Array.isArray(ov) && ov.length ? ov : null);
        }));
    }
    function lpOpenCycleEditor(p) {
        if (!lpMayEditSettings()) return;
        CYC_EDIT = { plot: p.plot, groups: p.cycles.map(c => c.batches.map(b => lpBatchKey(b.batch))) };
        lpDrawCycleEditor(p);
    }
    /* The editor IS the cycle cards (the office: "我按了edit 我就可以drag整条batch
       从current cycle去previous cycle"): each batch row is picked up whole and
       dropped on another card; the cards are worked out again on each drop. */
    function lpCanonCycles(p) {
        const full = CYC_EDIT.groups.filter(g => g.length), empty = CYC_EDIT.groups.length - full.length;
        const cyc = full.length ? lpCycles(p.batches, full) : [];
        CYC_EDIT.groups = cyc.map(c => c.batches.map(b => lpBatchKey(b.batch))).concat(Array.from({ length: empty }, () => []));
        return cyc;
    }
    function lpDrawCycleEditor(p) {
        const cyc = lpCanonCycles(p);
        document.getElementById('lp-cyc-bar').innerHTML = `<span class="lp-set-msg" id="lp-ce-msg"></span>`
            + `<button type="button" class="lp-set-cancel" id="lp-ce-add">+ Add cycle</button>`
            + (LP_CYC[lpPlotKey(p.plot)] ? `<button type="button" class="lp-set-cancel" id="lp-ce-auto">Automatic</button>` : '')
            + `<button type="button" class="lp-set-cancel" id="lp-ce-cancel">Cancel</button><button type="button" class="lp-set-save" id="lp-ce-save">Save</button>`;
        const box = document.getElementById('lp-timeline-box');
        let h = '';
        for (let i = CYC_EDIT.groups.length - 1; i >= cyc.length; i--)
            h += `<div class="panel lp-cyc lp-ce-cyc lp-ce-new" data-ci="${i}"><div class="lp-cyc-h"><span class="lp-cyc-n">Cycle ${i + 1}</span>`
               + `<button type="button" class="lp-ce-x" data-cx="${i}" title="Remove">×</button></div><div class="lp-ce-drop">Drop a batch here</div></div>`;
        h += cyc.slice().reverse().map(c => cycleHtml(c, p).replace('class="panel lp-cyc"', `class="panel lp-cyc lp-ce-cyc" data-ci="${c.n - 1}"`)).join('');
        box.innerHTML = h;
        lpBindTips(box);
        let dragKey = null;
        box.querySelectorAll('.lp-ce-cyc tbody tr[data-b]').forEach(tr => {
            tr.draggable = true; tr.classList.add('lp-ce-row');
            tr.addEventListener('dragstart', e => { dragKey = tr.dataset.b; tr.classList.add('drag'); try { e.dataTransfer.setData('text/plain', dragKey); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
            tr.addEventListener('dragend', () => tr.classList.remove('drag'));
        });
        box.querySelectorAll('.lp-ce-cyc').forEach(cy => {
            cy.addEventListener('dragover', e => { e.preventDefault(); cy.classList.add('over'); });
            cy.addEventListener('dragleave', e => { if (!cy.contains(e.relatedTarget)) cy.classList.remove('over'); });
            cy.addEventListener('drop', e => {
                e.preventDefault(); cy.classList.remove('over');
                let k = dragKey; try { k = e.dataTransfer.getData('text/plain') || k; } catch (x) {}
                if (!k) return;
                const to = +cy.dataset.ci;
                if (CYC_EDIT.groups[to] && CYC_EDIT.groups[to].includes(k)) return;
                CYC_EDIT.groups = CYC_EDIT.groups.map(g => g.filter(x => x !== k));
                CYC_EDIT.groups[to].push(k);
                lpDrawCycleEditor(p);
            });
        });
        box.querySelectorAll('[data-cx]').forEach(x => x.addEventListener('click', () => { CYC_EDIT.groups.splice(+x.dataset.cx, 1); lpDrawCycleEditor(p); }));
        document.getElementById('lp-ce-add').addEventListener('click', () => { CYC_EDIT.groups.push([]); lpDrawCycleEditor(p); });
        document.getElementById('lp-ce-cancel').addEventListener('click', () => { CYC_EDIT = null; showPlot(p.plot); });
        const auto = document.getElementById('lp-ce-auto');
        if (auto) auto.addEventListener('click', () => lpSaveCycles(p, null));
        document.getElementById('lp-ce-save').addEventListener('click', () => lpSaveCycles(p, CYC_EDIT.groups.filter(g => g.length)));
    }
    // groups: the cycles to keep for this plot; null hands the plot back to the rule.
    async function lpSaveCycles(p, groups) {
        const msg = document.getElementById('lp-ce-msg');
        if (!lpMayEditSettings()) { if (msg) msg.textContent = 'Only an Operation admin can change cycles.'; return; }
        if (msg) msg.textContent = 'Saving…';
        try {
            const all = await lpReadCycles();   // read again: another plot may have been saved since
            const k = lpPlotKey(p.plot);
            if (groups && groups.length) all[k] = groups; else delete all[k];
            const who = (MJMAccess.user && MJMAccess.user() && MJMAccess.user().email) || null;
            const { error } = await _supabase.from('nops_maint_config').upsert({ key: LP_CYC_KEY, txt_value: JSON.stringify(all), note: 'Life of Plot cycles set by hand', updated_by: who, updated_at: new Date().toISOString() }, { onConflict: 'key' });
            if (error) throw error;
            LP_CYC = all;
            lpApplyCycles();
            CYC_EDIT = null;
            showPlot(p.plot);
            if (MAP_NUR) drawMap();
        } catch (e) {
            if (msg) msg.textContent = 'Not saved: ' + ((e && e.message) || e);
        }
    }

    // ── Side bar: Plots & cycles, or the Transplant record by year ──
    let VIEW = 'plots';
    let REC_YEAR = '';
    const PALMS_PAGES = {
        'palms-board':  { href: '../nursery_ops/nursery_ops_palms_board.html?embed=1',  title: 'PALMS', sub: 'every plot and the stage it is on.' },
        'palms-stages': { href: '../nursery_ops/nursery_ops_palms_stages.html?embed=1', title: 'Settings',  sub: 'the stages a plot moves through.' },
    };
    function setView(v, quiet) {
        VIEW = (v === 'record' || v === 'rotation') ? v : (PALMS_PAGES[v] ? v : 'plots');
        document.querySelectorAll('#lp-side .lp-side-b').forEach(b => b.classList.toggle('on', b.dataset.view === VIEW));
        document.getElementById('lp-record').classList.toggle('hidden', VIEW !== 'record');
        document.getElementById('lp-rot').classList.toggle('hidden', VIEW !== 'rotation');
        document.getElementById('lp-plots-view').classList.toggle('hidden', VIEW !== 'plots');
        document.getElementById('lp-palms').classList.toggle('hidden', !PALMS_PAGES[VIEW]);
        document.getElementById('lp-set').classList.toggle('hidden', VIEW !== 'palms-stages');
        if (VIEW === 'palms-stages') renderSettings();
        if (MODEL) renderHeadTabs();
        if (PALMS_PAGES[VIEW]) {
            const pg = PALMS_PAGES[VIEW];
            const fr = document.getElementById('lp-palms-frame');
            if (fr.getAttribute('src') !== pg.href) fr.setAttribute('src', pg.href);
            document.getElementById('lp-title').textContent = 'Life of Plot';
            document.getElementById('lp-sub').textContent = pg.title;
            if (!quiet) history.replaceState(null, '', '#view=' + VIEW);
            syncPalmsNursery();
        } else if (VIEW === 'rotation') {
            document.getElementById('lp-title').textContent = 'Life of Plot';
            document.getElementById('lp-sub').textContent = 'Pusingan Jualan & Transplant';
            if (!quiet) history.replaceState(null, '', '#view=rotation');
            renderRotation();
        } else if (VIEW === 'record') {
            document.getElementById('lp-title').textContent = 'Life of Plot';
            document.getElementById('lp-sub').textContent = 'Transplant Record ' + REC_YEAR;
            if (!quiet) history.replaceState(null, '', '#view=record&year=' + REC_YEAR);
            renderRecord();
        } else if (!quiet) {
            showList();
        }
    }
    // Delivery orders and plot capacity are read the first time this view opens.
    let ROT = null, ROT_YEAR = '', ROT_P = null;
    // ONE read of the delivery orders, shared by the map and the rotation view.
    const ensureRot = () => ROT_P || (ROT_P = loadRotation());
    async function loadRotation() {
        const soft = (pr, what) => pr.catch(e => { ROT.missing.push(what + ': ' + (e && e.message ? e.message : e)); return []; });
        ROT = { missing: [], sales: [], caps: {} };
        const [dos, caps] = await Promise.all([
            soft(lpFetchAll(() => _supabase.from('shared_do_records').select('id, delivery_date, status, remark, plot_1, qty_1, plot_2, qty_2, plot_3, qty_3, plot_4, qty_4, plot_5, qty_5, batch_1, batch_2, batch_3, batch_4, batch_5').order('id', { ascending: true })), 'delivery orders'),
            soft(lpFetchAll(() => _supabase.from('nops_maint_plot_qty').select('nursery, plot, qty').order('plot')), 'plot capacity'),
        ]);
        (dos || []).forEach(d => {
            if (d.status === 'Cancelled' || String(d.remark || '').includes('[CANCELLED]')) return;
            const day = String(d.delivery_date || '').slice(0, 10);
            for (let i = 1; i <= 5; i++) { const q = Math.abs(Number(d['qty_' + i]) || 0); if (q && d['plot_' + i]) ROT.sales.push({ plot: d['plot_' + i], batch: d['batch_' + i], day, qty: q }); }
        });
        (caps || []).forEach(r => { if (Number(r.qty) > 0) (ROT.caps[lpNurKey(r.nursery)] = ROT.caps[lpNurKey(r.nursery)] || {})[lpPlotKey(r.plot)] = Number(r.qty); });
        ROT.done = true;
    }
    async function renderRotation() {
        if (!MODEL) return;
        if (!ROT_P || !ROT || !ROT.done) {
            document.getElementById('lp-rot-sales').innerHTML = '<div class="lp-rot-mh" style="grid-column:1/-1">Loading…</div>';
            await ensureRot();
            if (VIEW !== 'rotation') return;
        }
        const keys = NURSERY_ORDER.filter(k => k !== 'OTHER' && MODEL.groups.some(g => g.key === k && g.plots.length));
        if (!keys.includes(NUR)) NUR = keys[0] || '';
        const byMap = NURSERY_ORDER.some(k => MAPS[k]);
        document.getElementById('lp-rot-nur-wrap').classList.toggle('hidden', byMap);
        document.getElementById('lp-rot-nur').innerHTML = keys.map(k => chip('rnur', k, NURSERY_LABEL[k], k === NUR)).join('');
        const now = new Date(), nowY = String(now.getFullYear()), todayYM = nowY + '-' + String(now.getMonth() + 1).padStart(2, '0');
        const years = lpYears(MODEL);
        ROT.sales.forEach(r => { const y = String(r.day).slice(0, 4); if (/^\d{4}$/.test(y) && !years.includes(y)) years.push(y); });
        // Next year too: its plans are already known from this year transplants.
        [nowY, String(+nowY + 1)].forEach(y => { if (!years.includes(y)) years.push(y); });
        years.sort();
        if (!ROT_YEAR || !years.includes(ROT_YEAR)) ROT_YEAR = nowY;
        document.getElementById('lp-rot-year').innerHTML = years.slice().reverse().map(y => chip('ryear', y, y, y === ROT_YEAR)).join('');
        const rows = lpRotation(MODEL, NUR, ROT_YEAR, ROT.sales, ROT.caps[NUR] || {}, todayYM, LP_SET);
        const lab = NURSERY_LABEL[NUR] || NUR;
        document.getElementById('lp-rot-sales-t').textContent = `Pusingan Jualan — ${lab}, ${ROT_YEAR}`;
        document.getElementById('lp-rot-tr-t').textContent = `Pusingan Transplant — ${lab}, ${ROT_YEAR}`;
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const head = '<div></div>' + MON.map((m, i) => `<div class="lp-rot-mh${ROT_YEAR + '-' + String(i + 1).padStart(2, '0') === todayYM ? ' now' : ''}">${m}</div>`).join('');
        const plotCell = r => `<div class="lp-rot-plot"><b>${r.plot}</b></div>`;
        let hs = head, ht = head;
        rows.forEach(r => {
            hs += plotCell(r); ht += plotCell(r);
            r.months.forEach(x => {
                const tip = `${r.plot} · ${x.ym} · Collected ${fmtN(x.col)} · this round so far ${fmtN(x.colCum)}${x.colPct != null ? ' (' + x.colPct + '% of capacity)' : ''}${x.colOlder ? ' · ' + fmtN(x.colOlder) + ' of an earlier round, not counted' : ''} · Plan ${fmtN(x.colPlan)}`;
                if (x.colMine > 0) {
                    const cls = x.colPct == null ? 'c2' : x.colPct >= 80 ? 'c3' : x.colPct >= 40 ? 'c2' : 'c1';
                    hs += `<div class="lp-rot-c ${cls}" title="${tip}">${fmtN(x.colCum)}${x.colPct != null ? `<small>${x.colPct}%</small>` : ''}</div>`;
                }
                // A month that sold only the round before is not drawn: plan and
                // cumulative only (the office: "只需要show plan和cumulative的").
                else if (x.colPlan > 0) hs += `<div class="lp-rot-c pc${x.future ? ' fut' : ''}" title="${tip}"><small>Plan</small>${fmtN(x.colPlan)}</div>`;
                else hs += `<div class="lp-rot-c${x.future ? ' fut' : ''}"></div>`;
                const tipT = `${r.plot} · ${x.ym} · Transplanted ${fmtN(x.tr)} · Plan ${fmtN(x.trPlan)}`;
                if (x.tr > 0) ht += `<div class="lp-rot-c t1" title="${tipT}">${fmtN(x.tr)}</div>`;
                else if (x.trPlan > 0) ht += `<div class="lp-rot-c pt${x.future ? ' fut' : ''}" title="${tipT}"><small>Plan</small>${fmtN(x.trPlan)}</div>`;
                else ht += `<div class="lp-rot-c${x.future ? ' fut' : ''}"></div>`;
            });
        });
        const empty = '<div class="lp-rot-mh" style="grid-column:1/-1">No plots for this nursery.</div>';
        document.getElementById('lp-rot-sales').innerHTML = rows.length ? hs : empty;
        document.getElementById('lp-rot-tr').innerHTML = rows.length ? ht : empty;
        document.getElementById('lp-rot-note').textContent = ROT.missing.length ? 'Could not read: ' + ROT.missing.join('; ') + '. Those figures show as empty.' : '';
    }
    document.getElementById('lp-rot').addEventListener('click', e => {
        const n = e.target.closest('button[data-rnur]'), y = e.target.closest('button[data-ryear]');
        if (n) { NUR = MAP_NUR = n.dataset.rnur; renderRotation(); }
        if (y) { ROT_YEAR = y.dataset.ryear; renderRotation(); }
    });
    function renderRecord() {
        if (!MODEL) return;
        const years = lpYears(MODEL);
        const nowY = String(new Date().getFullYear());
        // Next year too: its plans are already known from this year transplants.
        [nowY, String(+nowY + 1)].forEach(y => { if (!years.includes(y)) years.push(y); });
        years.sort();
        if (!REC_YEAR || !years.includes(REC_YEAR)) REC_YEAR = years.includes(nowY) ? nowY : years[years.length - 1];
        document.getElementById('lp-title').textContent = 'Life of Plot';
        document.getElementById('lp-sub').textContent = 'Transplant Record ' + REC_YEAR;
        document.getElementById('lp-year-row').innerHTML = years.slice().reverse().map(y => chip('year', y, y, y === REC_YEAR)).join('');
        const R = buildTransplantYear(MODEL, REC_YEAR);
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const cell = v => (v ? `<td>${nf(v)}</td>` : '<td class="dash"></td>');
        const sumRow = (label, xs, total) => `<tr class="sumrow"><td class="l batch">${label}</td>${xs.map(v => `<td class="sum">${v ? nf(v) : '–'}</td>`).join('')}<td class="yt">${total == null ? '' : nf(total) || '0'}</td></tr>`;
        let h = `<thead><tr><th class="l">Month</th>${MON.map(m => `<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
        h += '<tr class="grp"><td colspan="14">Summary</td></tr>';
        h += sumRow('Total transplanted ' + R.year, R.thisY, R.total);
        h += sumRow('Cumulative ' + R.year, R.thisCum, null);
        h += sumRow('Total transplanted ' + R.prev, R.prevY, R.prevTotal);
        h += sumRow('Cumulative ' + R.prev, R.prevCum, null);
        R.groups.forEach(g => {
            h += `<tr class="grp"><td colspan="14">${g.label}</td></tr>`;
            g.plots.forEach(p => {
                h += `<tr class="plotrow" data-plot="${p.plot.replace(/"/g, '&quot;')}"><td class="l batch">${p.plot}</td>${p.months.map((v, i) => v ? `<td class="has-tip" data-tip="${p.plot} · ${MON[i]} ${R.year}\n${p.who[i].map(w => 'Batch ' + w.batch + ': ' + nf(w.qty)).join('\n')}">${nf(v)}</td>` : '<td class="dash"></td>').join('')}<td class="yt">${p.total ? nf(p.total) : ''}</td></tr>`;
            });
            h += `<tr class="tot"><td class="l">Total ${g.label}</td>${g.months.map(v => `<td>${nf(v) || '0'}</td>`).join('')}<td>${nf(g.total) || '0'}</td></tr>`;
        });
        h += '</tbody>';
        const t = document.getElementById('lp-rec-table');
        t.innerHTML = h;
        // Each figure floats the batches it is made of.
        lpBindTips(t);
                // Only the plot NAME opens the plot (the office: "我按plot名字才带我去plot").
        t.querySelectorAll('tr.plotrow td.batch').forEach(td => td.addEventListener('click', () => {
            showPlot(td.parentElement.dataset.plot);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
    }

    async function load() {
        document.getElementById('lp-status').classList.remove('hidden');
        document.getElementById('lp-status').textContent = 'Loading…';
        try {
            const [plots, rows, nurs] = await Promise.all([
                lpFetchAll(() => _supabase.from('shared_plots').select('plot_name, nursery_name, map_top').order('plot_name')),
                lpFetchAll(() => _supabase.from('shared_inventory_logs')
                    .select('id, plot_name, transaction_type, transaction_date, quantity_change, batch_name, remark, created_at')
                    .in('transaction_type', ['Transplanted', 'Stock_Calibration', '2nd_Culling', '3rd_Culling', 'Transplant_Card'])
                    .order('id', { ascending: true })),
                _supabase.from('operation_nurseries').select('name, map_image_url').then(r => (r.data || []), () => []),
                lpLoadSettings(),
            ]);
            MAPS = {};
            (nurs || []).forEach(n => { if (n.map_image_url) MAPS[lpNurKey(n.name)] = n.map_image_url; });
            PLOT_SHAPES = {};
            (plots || []).forEach(p => {
                if (lpIsReplant(p.plot_name) || !String(p.map_top || '').startsWith('[')) return;
                try {
                    const nk = lpNurKey(p.nursery_name);
                    PLOT_SHAPES[lpPlotKey(p.plot_name)] = { name: p.plot_name, nur: NURSERY_ORDER.includes(nk) ? nk : 'OTHER', pts: JSON.parse(p.map_top) };
                } catch (e) { /* a shape that will not parse is simply not drawn */ }
            });
            MODEL = buildPlotHistory(plots, rows);
            await lpLoadCycles();
            lpApplyCycles();
            // With the map choosing the nursery there is no "All nurseries", so
            // the list opens on the nursery the map opens on.
            if (!NUR) { const k0 = NURSERY_ORDER.find(k => MAPS[k]); if (k0) NUR = k0; }
            document.getElementById('lp-status').classList.add('hidden');
            fillNurserySelect();
            fillPlotSelect('');
                renderMap();
            // The delivery orders decide Selling; read them now and colour the map again.
            ensureRot().then(() => { if (VIEW === 'plots' && MAP_NUR) drawMap(); }).catch(() => {});
            ensurePalms().then(() => { if (VIEW === 'plots' && MAP_NUR) drawMap(); });
            const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
            REC_YEAR = (location.hash.match(/year=(\d{4})/) || [])[1] || '';
            const viewIn = (location.hash.match(/view=([a-z-]+)/) || [])[1] || '';
            if (deep) showPlot(deep);
            else if (viewIn === 'record' || viewIn === 'rotation' || PALMS_PAGES[viewIn]) setView(viewIn);
            else showList();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not read the plot records: ' + (e && e.message ? e.message : e);
        }
    }

    document.getElementById('lp-side').addEventListener('click', e => {
        const b = e.target.closest('button[data-view]');
        if (b) setView(b.dataset.view);
    });
    document.getElementById('lp-year-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-year]');
        if (!b) return;
        REC_YEAR = b.dataset.year;
        history.replaceState(null, '', '#view=record&year=' + REC_YEAR);
        renderRecord();
    });
    document.getElementById('lp-nursery-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-nur]');
        if (!b) return;
        setNursery(b.dataset.nur);
    });
    document.getElementById('lp-head-nur').addEventListener('click', e => {
        const b = e.target.closest('button[data-map]');
        if (!b) return;
        if (VIEW === 'rotation') {
            NUR = MAP_NUR = b.dataset.map;
            renderHeadTabs(); renderRotation();
        } else if (VIEW === 'palms-board') {
            NUR = MAP_NUR = b.dataset.map;
            fillNurserySelect(); fillPlotSelect(''); renderMap();
            syncPalmsNursery();
        } else setNursery(b.dataset.map);
    });
    document.getElementById('lp-palms-frame').addEventListener('load', () => syncPalmsNursery());
    document.getElementById('lp-plot-row').addEventListener('click', e => {
        const b = e.target.closest('button[data-plot]');
        if (!b) return;
        if (b.dataset.plot) showPlot(b.dataset.plot); else showList();
    });
    window.addEventListener('hashchange', () => {
        const deep = decodeURIComponent((location.hash.match(/plot=([^&]+)/) || [])[1] || '');
        const viewIn = (location.hash.match(/view=([a-z-]+)/) || [])[1] || '';
        if (MODEL && deep) showPlot(deep);
        else if (MODEL && (viewIn === 'record' || viewIn === 'rotation' || PALMS_PAGES[viewIn])) setView(viewIn);
        else if (MODEL) showList();
    });

    (async function boot() {
        try {
            await MJMAccess.load(_supabase);
            if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
            if (!MJMAccess.canOpenOperationPage('lifeplot')) {
                document.getElementById('lp-status').textContent = 'You do not have access to Life of Plot.';
                return;
            }
            await load();
        } catch (e) {
            document.getElementById('lp-status').textContent = 'Could not sign you in: ' + (e && e.message ? e.message : e);
        }
    })();
</script>
</body>
