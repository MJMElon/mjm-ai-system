<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — MJM Nursery AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_cf_select.js"></script>
<!-- Is this batch finished? ONE rule, shared with the Batch Record list, so
     the two cannot disagree about which batches are Completed. -->
<script src="../shared/shared_batch_completed.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { background:#f8f4ec; margin:0; font-family:'Outfit', system-ui, sans-serif; color:#1a150d; }
  .bg-pattern { position:fixed; inset:0; background-image:radial-gradient(#e8dcc8 1px, transparent 1px); background-size:24px 24px; z-index:-2; opacity:.5; }
  .glass-panel { background-color:rgba(253, 250, 244, .95); backdrop-filter:blur(24px); border:1px solid #fff; box-shadow:0 25px 50px -12px rgba(61, 38, 16, .08); border-left:12px solid #6aa83c; }

  .input-style { border:1.5px solid #e8dcc8; background:#fff; padding:10px 12px; border-radius:12px; outline:none; width:100%; font-weight:600; font-size:13px; color:#1a150d; }
  .input-style:focus { border-color:#c07820; box-shadow:0 0 0 4px rgba(192, 120, 32, .15); }
  .label-style { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.15em; color:#8a7a68; margin-left:4px; margin-bottom:6px; display:block; }
  .btn-earth { background:linear-gradient(135deg, #6aa83c, #4a7a2e); color:white; font-weight:900; padding:12px 24px; border-radius:12px; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; box-shadow:0 8px 20px -4px rgba(74, 122, 46, .5); border:none; font-size:12px; }
  .btn-earth:hover { transform:translateY(-2px); }

  /* Report picker as a connected tab strip — one bar with dividers between
     tabs and the active one picked out by its own underline, not separate
     pill buttons with gaps between them. */
  .report-tab-bar { display:flex; flex-wrap:wrap; border:1px solid #e8dcc8; border-radius:12px; overflow:hidden; width:fit-content; max-width:100%; margin:0 auto; }
  .report-tab {
    padding:12px 20px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color:#8a7a68; background:#fdfaf4; border:none; border-right:1px solid #e8dcc8;
    border-bottom:3px solid transparent; cursor:pointer; transition:color .15s, background .15s, border-color .15s;
    white-space:nowrap;
  }
  .report-tab:last-child { border-right:none; }
  .report-tab:hover:not(.active) { color:#4a7a2e; background:#f5f0e4; }
  .report-tab.active { color:#3d2610; background:#fff; border-bottom-color:#4a7a2e; }

  /* Report switcher lives in a hover-reveal left sidebar: hidden off-screen,
     slides in when the mouse nears the left edge, slides back out when it
     leaves. Pure CSS via the adjacent-sibling hover, so "open", "stay open
     while over the panel" and "close on leave" all fall out of :hover with
     no JS mouseenter/mouseleave timing to get wrong. */
  #mv-sidebar-trigger { position:fixed; top:0; left:0; width:16px; height:100vh; z-index:9000; }
  #mv-report-sidebar {
    position:fixed; top:0; left:0; height:100vh; width:240px; z-index:8999;
    background:#fdfaf4; border-right:1px solid #e8dcc8; box-shadow:8px 0 24px -8px rgba(61, 38, 16, .2);
    box-sizing:border-box; display:flex; flex-direction:column;
    transform:translateX(-100%); transition:transform .2s ease;
  }
  /* Everything except Run Report scrolls in here; the button itself sits
     outside this scroller as its own flex row below, so it's pinned to the
     sidebar's bottom edge and always reachable without scrolling however
     long the filter list above it gets. */
  #mv-sidebar-scroll { flex:1 1 auto; overflow-y:auto; padding:28px 16px; }
  #mv-sidebar-trigger:hover + #mv-report-sidebar, #mv-report-sidebar:hover { transform:translateX(0); }
  /* The As At date's native picker renders as a browser overlay outside
     the DOM — the mouse moving onto it isn't hovering #mv-report-sidebar
     any more, so :hover alone closed the panel mid-pick. #f-to keeps
     browser focus for as long as that picker is open, and :focus-within
     keeps tracking that even though the picker itself isn't a DOM
     descendant to :hover. */
  #mv-report-sidebar:focus-within { transform:translateX(0); }
  /* Forced shut right after Run Report is clicked — the mouse is usually
     still over the button (inside the sidebar) at that moment, so :hover
     alone would keep it open and cover the very results just asked for.
     !important beats both :hover rules above; cleared the moment the
     mouse actually leaves the trigger/sidebar (see the JS below), so the
     next hover opens it normally rather than leaving it stuck shut. */
  #mv-report-sidebar.mv-force-closed { transform:translateX(-100%) !important; }
  #mv-report-sidebar .report-tab-bar { flex-direction:column; flex-wrap:nowrap; width:100%; margin:0; }
  #mv-report-sidebar .report-tab { border-right:none; border-bottom:1px solid #e8dcc8; text-align:left; }
  #mv-report-sidebar .report-tab:last-child { border-bottom:none; }
  #mv-report-sidebar .report-tab.active { border-bottom-color:#e8dcc8; border-left:3px solid #4a7a2e; }

  /* The filter row (As At / Sort by / Locations / Breed / Run Report / …)
     moved in under the tabs. It's already inside the sidebar's own card, so
     the glass-panel look (blur, shadow, left accent bar) is stripped back
     to a plain divider, and the row that used to wrap horizontally across
     a wide panel is stacked one-per-line down the sidebar's 240px width. */
  #mv-report-sidebar .glass-panel {
    background:transparent; backdrop-filter:none; border:none; box-shadow:none;
    border-left:none; border-top:1px solid #e8dcc8; border-radius:0;
    padding:20px 0 0; margin-top:20px;
  }
  #mv-report-sidebar .flex.flex-wrap.gap-3.items-end.justify-center { flex-direction:column; align-items:stretch; }
  #mv-report-sidebar .f-range, #mv-report-sidebar .f-sort, #mv-report-sidebar .f-breed,
  #mv-report-sidebar .f-nursery-inline, #mv-report-sidebar .f-sales-mode,
  #mv-report-sidebar .f-los { width:100%; }
  /* Locations chips: one per row going down, not wrapped side by side —
     easier to scan and tick in a narrow sidebar than a wrapped cluster. */
  #mv-report-sidebar #f-nursery-chips { flex-direction:column; flex-wrap:nowrap; }
  #mv-report-sidebar #f-nursery-chips .nursery-chip { width:100%; }
  /* Run Report as a pinned footer row, not an inline field — flex-shrink:0
     keeps it out of #mv-sidebar-scroll's scrolling, and the top border +
     shadow read as "separate from the list that scrolled past above it". */
  #mv-report-sidebar > #f-run {
    flex-shrink:0; width:100%; margin:0; border-radius:0;
    padding:16px; border-top:1px solid #e8dcc8; box-shadow:0 -8px 16px -8px rgba(61, 38, 16, .18);
  }

  /* Permanently-visible handle — the "there's a sidebar here" cue. Floats
     over the trigger strip (pointer-events:none so hover still reaches the
     trigger underneath) and hides once the panel is actually open. */
  #mv-sidebar-handle {
    position:fixed; top:50%; left:0; transform:translateY(-50%);
    width:26px; height:84px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, #6aa83c, #4a7a2e); color:#fff; border-radius:0 14px 14px 0;
    box-shadow:4px 0 16px -4px rgba(61, 38, 16, .4); pointer-events:none; z-index:9001;
    transition:opacity .15s ease;
  }
  #mv-sidebar-handle svg { width:15px; height:15px; }
  #mv-sidebar-trigger:hover ~ #mv-sidebar-handle, #mv-report-sidebar:hover ~ #mv-sidebar-handle,
  #mv-report-sidebar:focus-within ~ #mv-sidebar-handle { opacity:0; }
  @media print { #mv-sidebar-trigger, #mv-report-sidebar, #mv-sidebar-handle { display:none !important; } }

  table.report-table { width:100%; border-collapse:separate; border-spacing:0; }
  .report-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#8a7a68; padding:12px 14px; border-bottom:2px solid #e8dcc8; background:#fdfaf4; white-space:nowrap; }
  /* "th.text-right" outranks the plain "th" rule above (two selectors beat
     one), which a bare Tailwind ".text-right" utility on a <th> cannot —
     equal specificity, same rule wins, so a right-aligned header stayed
     left-aligned while its numbers underneath (plain <td>, nothing to
     out-rank) lined up fine. Without this, every right-aligned figure
     column in every report has a header that doesn't sit over its data. */
  .report-table th.text-right { text-align:right; }
  .report-table td { font-size:13px; font-weight:600; color:#1a150d; padding:14px; border-bottom:1px solid #f3efe6; }
  /* No hover-highlight — these rows aren't clickable, so a colour change on
     pointing at one only implied an interaction that wasn't there. */
  /* Numeric cells across every report use tabular-nums so digits align
     column-for-column and rows read as a clean matrix. */
  .report-table td, .report-table th { font-variant-numeric: tabular-nums; }
  /* The movement reports carry a dozen narrow figure columns. Centring the
     heading over its figures keeps each column reading as one block, and a
     long heading — "Transplanted from PN" — wraps onto a second line instead
     of stretching its column wide enough to hold it on one. Figures
     themselves are right-aligned — centring a number doesn't line its digits
     up the way it does a short heading, and a dozen centred columns of
     different widths was exactly what read as "hard to see". */
  .movement-table th { text-align:center; white-space:normal; line-height:1.3; max-width:96px; }
  .movement-table td { text-align:right; }
  .movement-table th:first-child, .movement-table th:nth-child(2), .movement-table th:nth-child(3) { text-align:left; max-width:none; }
  /* Label cells (group name, other-of, age) by class, not :nth-child — the
     group-name cell is a rowspan that's only emitted on a group's FIRST
     row, so every later row in a multi-row group has one fewer <td> before
     the figures. :nth-child(3) then landed on the B/F figure instead of
     Age on those rows, forcing that one numeric column left on every row
     but a group's first — the B/F column that looked "not right-aligned"
     while every other figure in the table was. */
  .movement-table td.col-label { text-align:left; max-width:none; }
  /* A visible rule between every column — a dozen unbroken figure columns
     otherwise blur into one wide field. Same problem as the row divider
     below: #efe6d4 is lighter than the zebra stripe (#f0e6d2) it
     sometimes sits on, so it disappeared on every other row. Same fix. */
  .movement-table th, .movement-table td { border-right:1px solid #d9c8a3; }
  .movement-table th:last-child { border-right:none; }
  /* Not td:last-child — the Balance column is a rowspan cell that only
     actually exists in the DOM on each group's FIRST row; every other row
     in the group has Batch Balance as its real last <td>, so :last-child
     wrongly stripped ITS border-right instead — the missing divider
     reported before Balance on every row but a group's first. col-balance-
     total names the real last column explicitly so removing its border
     can't catch anything else by accident. */
  .movement-table td.col-balance-total { border-right:none; }
  /* The row divider (.report-table td's default border-bottom:1px solid
     #f3efe6) is lighter than the zebra stripe it sometimes sits on
     (#f0e6d2) — against that darker band it all but disappears. Darker
     here, so the line between rows stays visible whichever band it's on. */
  .movement-table td { border-bottom:1px solid #d9c8a3; }
  /* The header stays put while a long table scrolls past underneath it —
     wrapped in .movement-scroll below, which is what actually scrolls. */
  .movement-scroll { max-height:70vh; overflow-y:auto; }
  /* Only Pre-Nursery ever has a second ("Transfer Out") header row above the
     column names — Main Nursery's is always one row. Both cases need the
     LAST header row pinned with the shadow that marks the sticky edge; a
     first row that isn't also the last (Pre-Nursery's group row) sticks
     above it without its own shadow, so the two don't draw two edges. */
  .movement-table thead tr:first-child th { position:sticky; top:0; z-index:2; box-shadow:0 2px 0 #e8dcc8; }
  .movement-table thead tr:first-child:not(:last-child) th { box-shadow:none; }
  .movement-table thead tr:last-child:not(:first-child) th { position:sticky; top:33px; z-index:2; box-shadow:0 2px 0 #e8dcc8; }
  /* Seedling Sales grid: 14 columns (Year, 12 months, Total). Fix the
     layout so every month gets the same width regardless of value, and
     the year column stays narrow so it doesn't dominate the row. */
  .sales-table { table-layout: fixed; }
  .sales-table col.c-year  { width: 7%;  }
  .sales-table col.c-month { width: 6.5%; }
  .sales-table col.c-total { width: 9%;  }
  .sales-table th,
  .sales-table td { padding: 10px 8px; }
  /* ── Life of Seedlings ──────────────────────────────────────────────────
     Seventeen columns, and all of them have to be on the page at once: this
     is a report you read ACROSS, batch by batch, and a table you scroll
     sideways answers one half of a row at a time. So the table is
     fixed-layout at 100% width with a colgroup that spends the width where
     it is needed — the supplier's name and the two-line figures — and the
     type is sized to what that leaves rather than the other way round.
     Nothing sets a min-width, because a min-width is how a fixed layout
     starts overflowing again. */
  .los-wrap { overflow:visible; }
  .los-table { table-layout:fixed; width:100%; }
  .los-table th, .los-table td { border-right:1px solid #efe6d4; }
  .los-table th:last-child, .los-table td:last-child { border-right:none; }
  /* Centred, and centred both ways: with columns this narrow a figure
     pinned to the right edge sits under the NEXT column's heading as often
     as its own, and a two-line supplier name next to a one-line date read
     as two different rows. */
  .los-table th, .los-table td {
    text-align:center; vertical-align:middle; white-space:normal;
    overflow-wrap:break-word; line-height:1.3;
  }
  /* No letter-spacing on these headings, unlike every other table's: the
     tracking that makes a wide heading read well is what pushed
     "TRANSPLANTING" a few pixels past its column and split it across two
     lines as "TRANSPLANTIN / G". */
  .los-table th { font-size:9px; padding:8px 4px; letter-spacing:0; }
  .los-table td { font-size:11px; padding:8px 4px; }
  .los-table th.los-grp { color:#c07820; background:#f8f1e2; letter-spacing:.12em; }
  .los-table tbody tr:nth-child(even) { background:#faf7f0; }
  /* THE HEADINGS STAY. Sticky against the page itself, not against an inner
     scrolling box — scroll to the four-hundredth batch and the headings are
     still overhead. Two rows, so the second one has to sit exactly under the
     first: its offset is measured after render and written to --los-head2
     (see _losStickyHeads), because the first row's height depends on how the
     group bands wrap, which no fixed number in here can know. The cells that
     span both rows are in the first row and stick at 0, tall enough to cover
     both.

     This is also why .los-wrap does not scroll: an overflow ancestor becomes
     the scrollport a sticky heading sticks to, and a box that scrolls
     sideways but not down never scrolls past its own heading, so the heading
     never sticks to anything. */
  .los-table thead th { position:sticky; z-index:3; background:#fdfaf4; }
  .los-table thead tr:first-child th { top:0; }
  .los-table thead tr:nth-child(2) th { top:var(--los-head2, 34px); }
  /* The sticky edge — a border on a sticky cell scrolls away with the cell's
     own box, a shadow does not. */
  .los-table thead tr:last-child th { box-shadow:0 2px 0 #e8dcc8; }
  /* Below about 1100px there is no honest way to fit seventeen columns, so
     the table is allowed to scroll sideways again. The headings stop
     sticking when it does — that is the trade, and it only applies to a
     window narrower than this report is meant for. */
  @media (max-width:1100px) {
    .los-wrap { overflow-x:auto; }
    .los-table { table-layout:auto; width:auto; min-width:1100px; }
  }
  /* A figure you can open. It has to read as a figure first — same size,
     same weight, same colour as one that has nothing behind it — so the
     table is not a page of links; the underline is what says it will do
     something. Pointing at one shows what it is made of; clicking opens the
     same records in a window you can filter and read at length. */
  /* `pointer`, not `help`. The question-mark cursor says "there is an
     explanation here"; this is a figure that OPENS — pointing shows what it
     is made of and clicking opens the records in full — and a pointer is what
     every other openable thing on the page uses. */
  .los-fig { background:none; border:none; padding:0; font:inherit; color:inherit;
             cursor:pointer; text-decoration:underline; text-decoration-style:dotted;
             text-underline-offset:3px; text-decoration-color:#d9cdb6; }
  .los-fig:hover { text-decoration-style:solid; text-decoration-color:currentColor; }
  .los-fig:focus-visible { outline:2px solid #6aa83c; outline-offset:2px; border-radius:4px; }
  /* ── A FIGURE NOBODY HAS VERIFIED YET ──────────────────────────────────
     An unverified figure is still the best answer there is, so it is shown
     in full and not greyed into illegibility — what changes is that it no
     longer LOOKS like a settled number. The amber wash and the left tick
     mark the cell; the ⧗ beside the figure carries the explanation, and
     survives printing, photocopying and anybody reading the table in black
     and white, which a background colour alone does not. */
  /* The amber cell wash, the ⧗ beside a figure and the verdict line under
     a batch's name are all GONE, in that order and for the same reason
     twice over: the office asked for an unverified figure not to be on the
     report, and then for the row not to carry a label about it either. All
     that marks it now is the figure itself, which is the VERIFIED part of
     what the field keyed and says in its hover what is still to come
     (_losWaitingNote). Left as a comment
     rather than as unused rules, because a stylesheet that still dresses a
     state nothing can enter is how the next person concludes the state
     still exists. */
  /* A SPLIT CELL: the total on top, the two halves it is made of under a
     rule. It is one column doing the work of three, which is how the
     transplant and the 1st culling splits got their detail without taking
     four more columns off the width every other figure has to live in —
     twenty-one columns were already tight.

     The halves are 9px and muted so the TOTAL is still what the eye lands
     on going across a row: the detail is for the reader who stops. Both
     halves are still their own figure and open their own records. */
  .los-split { display:flex; margin-top:4px; border-top:1px solid #e8dcc8;
               padding-top:3px; }
  .los-split > span { flex:1 1 0; min-width:0; font-size:9px; font-weight:700;
                      line-height:1.25; }
  .los-split > span + span { border-left:1px solid #e8dcc8; }
  .los-split .los-fig { font-size:9px; }
  .los-split-lbl { color:#a09078; }
  /* THE DASH IS GONE TOO, and that is the third turn of this screw. The
     amber wash went first, then the verdict line under the batch name, and
     now the dash a withheld figure left behind — because a figure is no
     longer withheld at all. It is built out of the SIGNED lines and shown
     as a figure, and the unsigned ones join it the day somebody signs them:
     see verOnly in _losBuildAllRows. Left as a comment, not as unused
     rules, for the same reason as the two above it. */
  @media print {
    .los-fig { text-decoration:none; }
    .los-table thead th { position:static; }
  }

  /* Nursery multi-select chips */
  .nursery-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; background:#fff; border:1.5px solid #e8dcc8; cursor:pointer; font-size:11px; font-weight:700; color:#3d2610; user-select:none; }
  .nursery-chip:has(input:checked) { background:#e8f5da; border-color:#6aa83c; }
  .nursery-chip input { accent-color:#4a7a2e; }

  @media print {
    body { background:white; }
    .no-print, .glass-panel, header { box-shadow:none !important; border:none !important; }
    .no-print { display:none !important; }
    table { box-shadow:none !important; }
  }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<!-- Report switcher + filters: hover-reveal sidebar (see #mv-sidebar-trigger /
     #mv-report-sidebar / #mv-sidebar-handle CSS). #f-report-tabs and every
     filter id below (#f-to, #f-sort, #f-run, …) are untouched — the JS just
     fills/reads them by id regardless of where they live in the DOM. The
     handle is the permanently-visible cue that a sidebar is there at all;
     hovering either it or the trigger strip reveals the panel, and the
     panel stays open while the mouse is over it. -->
<div id="mv-sidebar-trigger" class="no-print" aria-hidden="true"></div>
<div id="mv-report-sidebar" class="no-print">
  <div id="mv-sidebar-scroll">
    <div class="report-tab-bar" id="f-report-tabs"></div>

    <!-- Report filters — moved here from the old glass-panel row above the
         report output so everything about "which report, which data" lives
         in one place. f-report stays as the state the rest of the page reads
         (syncFilterVisibility, runReport, syncReportDefaults, …) exactly the
         way it read a <select>'s .value before. -->
    <div class="glass-panel no-print">
      <input type="hidden" id="f-report">
      <div class="flex flex-wrap gap-3 items-end justify-center mb-3">
        <!-- Which of the four reports living inside Nursery Report — see
             NURSERY_SUB_REPORTS and syncFilterVisibility(). Comes first:
             it decides which of the OTHER filters below even apply, same
             as the outer report tabs above deciding this whole panel. -->
        <div class="f-nursery-sub-wrap hidden w-full">
          <label class="label-style !mb-1">Report</label>
          <select id="f-nursery-sub" class="input-style">
            <option value="summary">Summary Report</option>
            <option value="transplanting">Transplanting Report</option>
            <option value="seed_in">Seed In Report</option>
            <option value="culling">Culling Report</option>
          </select>
        </div>
        <!-- Only Culling Report needs this — which of the three stages to
             list. See CULLING_STAGES / runCullingReport(). -->
        <div class="f-culling-stage-wrap hidden w-full">
          <label class="label-style !mb-1">Culling Stage</label>
          <select id="f-culling-stage" class="input-style">
            <option value="">All Stages</option>
            <option value="1st_Culling">1st Culling</option>
            <option value="2nd_Culling">2nd Culling</option>
            <option value="3rd_Culling">3rd Culling</option>
          </select>
        </div>
        <!-- One date, not a range — every report is "as at" a day now. A
             report that needs a period (Movement's Culled/Transplanted/etc
             columns, "this month's activity") gets it derived from this one
             date's calendar month (monthStartOf()) rather than asking for a
             second field — see the f-from hidden input below and
             runReport(). -->
        <input type="hidden" id="f-from">
        <!-- Life of Seedlings' filters, in the order they narrow a batch
             down: where it is, whether it is still going, when, how old,
             what it is and who sold it. Nothing picked is not a filter —
             the report opens on every batch, active and completed alike. -->
        <div class="f-los hidden w-40">
          <label class="label-style !mb-1">Nursery Type</label>
          <select id="f-los-nursery" class="input-style">
            <option value="">All</option>
            <option value="pre">Pre-Nursery</option>
            <option value="main">Main Nursery</option>
          </select>
        </div>
        <!-- Status and Supplier are shared with Life of Plot too (see
             .f-los-shared in syncFilterVisibility()) — a plot's own
             "Active" reads as "still has something standing" rather than
             a batch's own life having ended, but the question ("only the

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);

function fmtNum(n)   { return (n || 0).toLocaleString(); }
function fmtDate(d)  { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' }); }
// Same thousand-separator grouping as fmtNum, kept at 2 decimals — a
// subtotal like RM 33390.00 read as one long unbroken run of digits;
// toLocaleString groups it the same way fmtNum already groups quantities.
function fmtMoney(n) { return (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

async function loadBreeds() {
  const { data } = await _supabase.from('shared_breeds').select('name').order('name');
  const sel = document.getElementById('f-breed');
  (data || []).forEach(b => {
    const o = document.createElement('option');
    o.value = b.name; o.textContent = b.name;
    sel.appendChild(o);
  });
}

/* ════════════════════════════════════════════════════════════════════════════
   LIFE OF SEEDLINGS

   One row per batch, following it from the day its seeds arrived to what is
   still standing today. It replaces three reports that each showed a slice of
   the same life — Batch Production Summary, Double Tone and Seed Received —
   because reading a batch meant opening all three and lining them up by eye.

   Everything on the row comes out of shared_inventory_logs and shared_do_records,
   the same ledger the Movement Report reads:

     Balance = transplant qty
             − 3rd culling
             − total sales
             + approved stock calibration

   Three things about that formula are worth knowing before changing it.

   FIRST, it is WHAT IS STANDING IN THE FIELD, and that is the office's own
   question. It used to be everything the batch had anywhere, tray included —
   actual planted − total culling − total sales + approved calibration — and
   on a batch that was over- or under-allocated the two answers differ by the
   allocation gap for ever. Batch 224 read −416 and 226 read −560 with
   nothing standing in either. What is still in a tray is not lost: it is
   preBalance, which is unchanged, and it is what the Pre-Nursery filter
   asks.

   The 1st culling is not taken off this one, and that is why it reads
   better rather than worse. A 1st culling happens in the TRAY, before any of
   these seedlings go out, so the transplanting quantity is ALREADY net of
   it; starting from planted and subtracting it was right for the old
   question and is double-counting for this one.

   The approved stock calibration IS in it, and it is what closes the last
   seedling: 224, 225 and 226 came to 1, −1 and 13 on the three terms alone,
   against calibrations of −1, +1 and −13, so all three settle to exactly
   nought. An UNAPPROVED one still counts for nothing. A transfer takes no
   part either way: it moves seedlings between two plots of the SAME batch.

   SECOND, the 2nd culling NEVER counts — not even while no 3rd has been
   recorded. The 3rd culling is keyed against the ORIGINAL transplanted
   figure, so it already contains the 2nd; counting both takes the same
   seedlings off twice. And a 2nd culling on its own is not a loss waiting
   for a 3rd: netOfRow() in the Movement Report says "2nd Culled never
   deducts here, B/F included — 2nd Culling is Tab 6's own live snapshot as
   a batch works through 3rd Culling", and the Batch Report carries cull2
   "for reference only — it is inside cull3". That is why the column is
   headed 1st + 3rd, and for a while the code did not do what the heading
   said.

   THIRD, Transplant Qty and 1st Culled are each ONE column carrying a
   SPLIT: the total on top, and under a rule the two halves it is made of —
   Normal out of an ordinary pre-nursery tray, DT out of the DOUBLE-TONE
   tray. They are the batch report's own cards (Main Plot and Main Plot
   (D-Tone) for the transplant, and the same question asked of the tray a
   1st culling happened in), and the halves are DISJOINT, so the total is
   read off them rather than summed from two different things.

   They were three columns each for a while, which made twenty-one and left
   every figure in the report reading in a column too narrow for it. See
   _losSplitCell: a split belongs inside its column because that is what it
   is — one figure with its composition shown.

   The Balance uses the TOTAL, and so does Total Culled (1st + 3rd): half of
   what is standing is not what is standing. The Double Tone Quantity in
   Nursery an admin keys on the Transplanting tab is a different number
   again and is in none of this.

   Supplier, MPOB licence, D/O quantity and FOC percent are not columns of
   their own in the ledger — Seeds In writes them as labelled fragments of the
   Seeds_Received remark (see operation_batch_detail.html's save), and they are
   read back out of it here with the same patterns that page reads them with.
════════════════════════════════════════════════════════════════════════════ */

const _RE_LOS_SUPPLIER = /Supplier:\s*(.*?)\s*\.?\s*(?=MPOB:|D\/O:|DO_Qty:|Incl\.|Replacement:|$)/i;
const _RE_LOS_MPOB     = /MPOB:\s*([0-9\-]+)/i;
const _RE_LOS_DONO     = /D\/O:\s*([^.]+)/i;
const _RE_LOS_DO_QTY   = /DO_Qty:\s*(\d+)/i;
const _RE_LOS_FOC_PCT  = /Incl\.\s*([\d.]+)%\s*FOC/i;
const _RE_LOS_REPL     = /Replacement:\s*(\d+)/i;
/* A calibration only moves a figure once somebody has approved it — an
   unapproved one is a claim, not a correction. Same marker Adjustments &
   Audit writes and the batch report reads. */
const _RE_LOS_APPROVED = /\[APPROVED by ([^\]]+) on ([^\]]+)\]/i;
const _RE_LOS_CAL_REPORT = /Report:\s*([^.]+?)\s*\.\s*/i;
const _RE_LOS_CAL_SIDE   = /Side:\s*(seed|plot)\s*\.\s*/i;
/* The three reports whose calibration corrects the SEED count rather than
   what is standing in a plot — ADJUST_INITIAL_REPORTS in
   operation_batch_detail.html, and the same list. Change one, change the
   other. */
const _LOS_CAL_SEED_REPORTS = ['seeds received', 'planting', 'seed audit'];
const _RE_LOS_FROM_TRAY  = /from tray \[([^\]]+)\]/i;
const _RE_LOS_FROM_PLOT  = /From:\s*\[([^\]|]+)\|/i;

/* ═══ WHICH FIGURES SOMEBODY HAS ACTUALLY CHECKED ═══════════════════════════

   Every figure on this report is a live sum of the batch ledger, and the
   ledger is filled in BEFORE anybody verifies it. So a column could read
   with complete confidence off a tab still sitting on PENDING VERIFICATION
   — a figure keyed this morning and a figure signed off last week looked
   exactly alike, and the reader had no way to tell which was which.

   They are not alike. An unverified figure is the field's first answer:
   it may be incomplete (half the plots keyed), it may be wrong (a typo
   nobody has looked at yet), and the derived figures beside it — Variance,
   Total Culling, Balance — inherit whichever of those it is.

   So every figure now carries its stage's verification state, and one that
   nobody has signed SAYS SO rather than reading as settled. Nothing is
   hidden and nothing is zeroed: the figure is the best answer there is, and
   the marker is what stops it being mistaken for a final one. Zeroing an
   unverified stage would have been worse than showing it — a batch with
   Seed Received in and Actual Planted silently at nought reports a Variance
   of minus the whole delivery, which is a wrong number wearing a right
   number's clothes.

   ── Where the signatures live ──
   A stage signed as a WHOLE is a row in operation_batch_verifications
   (batch_name, stage) — one signature over every row on that tab.
   A tab verified ROW BY ROW (Transplanting, 1st/2nd/3rd Culling) has no such
   row; each row's sign-off is a Row_Verification log whose plot_name is
   `<stage>::<rowKey>`. Either is a sign-off — see rowsAllSigned() in
   operation/operation_batch_detail.html, which draws the tab's tick by the
   same rule, and shared/CHECK_which_batches_completed.sql, which asks the
   same question of the record.

   ── Matching a ledger line to a row sign-off ──
   A rowKey begins with the PLOT (or tray) the row is about and may carry
   more after a pipe: `U7|main`, `U7|main|P4|2026-09-18`, `P4`. Only the part
   before the first pipe is matched, deliberately — which dest type or tray
   the tab happened to merge the row under has nothing to do with whether
   somebody looked at that plot. CHECK_which_batches_completed.sql matches
   cull_3 the same way and says so.

   The one exception is a 3rd-culling TRANSFER, which is a card of its own on
   Tab 6 and signs off as `<SOURCE PLOT>|transfer` — kept whole so that
   verifying where a plot's seedlings went and verifying its culling stay
   separate answers, exactly as that tab keeps them.

   ── What is NOT gated here, and why ──
   Total Sales comes from the delivery orders, which are approved in the D/O
   module and never appear on a batch report tab. Stock Calibration already
   counts only once somebody has approved it (_RE_LOS_APPROVED above). Both
   are signed off, just not here — so they carry no marker, while Balance,
   which contains them, carries the marker of the stages that ARE verified on
   a tab.

   ── The as-at date does not cut the signatures off ──
   The ledger is cut off at As At because "as at September" is a question
   about September's figures. Whether somebody has since checked them is not:
   it is a question about the record as it stands now, which is when the
   reader is reading it. A sign-off given in October therefore still counts
   towards a September report.

   ── A COLUMN, not a tab, is the unit ──
   The tally is kept per FIGURE GROUP rather than per stage, and the two are
   not the same thing: 3rd Culling and Transfer are both signed off on Tab 6,
   so a stage-wide tally would have let an unsigned transfer card mark the
   culling figure beside it — a warning on a figure that is in fact checked.
   One batch is the example and never the scope, and nor is one tab: a marker
   that cries over figures that are fine is a marker nobody reads.

   WHICH TRANSACTION TYPE BELONGS TO WHICH TAB — this mirrors TAB_TXN_TYPES
   in operation/operation_batch_detail.html. Change one, change the other.
   (Cull3_Transfer is not in that map — it is saved by Tab 6 but has no
   last-edit stamp of its own — and is here because its figure is a column on
   this report.) */
const LOS_GROUP_OF_TYPE = {
  Seeds_Received:          'seeds_in',
  Planted:                 'planting',
  Damaged_Seeds:           'planting',
  Transplanted:            'transplanting',
  Transplanted_DoubleTone: 'dtone_tray',
  DTone_Nursery_Qty:       'dtone',
  Transplanted_Premium:    'premium',
  '1st_Culling':           'cull_1',
  '2nd_Culling':           'cull_2',
  '3rd_Culling':           'cull_3',
  Cull3_Transfer:          'transfer'
};

/* Which tab's signature covers a figure group. Four of these groups share
   two tabs, because this report has a column for each of them and a column
   is what gets marked: Transplanting Qty, Double Tone and the premium-care
   transplants are three figures on the Transplanting tab, and 3rd Culling
   and Transfer are two on the 3rd Culling tab. Rolling them up per TAB is
   what made an unsigned transfer card put a warning on a culling figure
   somebody had signed.

   premium-care transplanting has no column of its own here (it is a holding
   tray, and its seedlings reach a plot later as ordinary Transplanted rows,
   so counting it would count them twice). It is still tallied and still
   named in the row's verdict: a batch with an unchecked premium row has
   unchecked transplanting, and calling it "verified" because the unchecked
   part happens to be off-screen is the kind of quiet lie this whole thing
   exists to stop. */
const LOS_STAGE_OF_GROUP = {
  seeds_in: 'seeds_in', planting: 'planting',
  transplanting: 'transplanting', dtone: 'transplanting',
  dtone_tray: 'transplanting', premium: 'transplanting',
  cull_1: 'cull_1', cull_2: 'cull_2', cull_3: 'cull_3', transfer: 'cull_3'
};

// Tabs that are verified row by row rather than with one signature at the
// top — mirrors ROW_TAB_CONFIG in operation_batch_detail.html. A stage NOT
// listed here can only be signed off as a whole, so its lines are verified
// if and only if operation_batch_verifications carries the stage.
const LOS_ROW_STAGES = { transplanting: 1, cull_1: 1, cull_2: 1, cull_3: 1 };

// What a group is called when the report has to name it to the reader.
const LOS_GROUP_NAMES = {
  seeds_in: 'seed in', planting: 'planting', transplanting: 'transplanting',
  dtone: 'double tone', dtone_tray: 'double-tone tray', premium: 'premium care',
  cull_1: '1st culling', cull_2: '2nd culling', cull_3: '3rd culling',
  transfer: '3rd-culling transfer'
};
const LOS_GROUP_ORDER = ['seeds_in', 'planting', 'transplanting', 'dtone', 'dtone_tray', 'premium',
                         'cull_1', 'cull_2', 'cull_3', 'transfer'];

/* WHICH GROUPS A DERIVED FIGURE IS MADE OF. The same rule the figure itself
   follows — see postCull/cullTotal/balance in _losBuildAllRows(): the 2nd
   culling takes no part in the total at all, so an unsigned 2nd culling
   must never mark a total it is not in. */
const LOS_CULLTOTAL_GROUPS = (r) => ['cull_1', 'cull_3'];
/* Balance is transplant qty − 3rd culling − total sales + approved stock
   calibration, so the groups that mark it are the transplanting and the 3rd
   culling. Sales and the calibration are signed off elsewhere (the D/O
   module, the calibration approval) and carry no group here. The PLANTING no
   longer marks it — the figure does not start from planted any more — and
   neither does the 1st culling, which is already inside the transplanting
   quantity rather than taken off it. A transfer moves seedlings between two
   plots of the same batch and is not in the Balance at all. */
const LOS_BALANCE_GROUPS = (r) => ['transplanting', 'cull_3'];

/* All three Transplant Details columns are the Transplanted rows, split by
   the tray they came out of, so one group marks all three. The keyed Double
   Tone Quantity in Nursery is signed off on the same tab but is no longer a
   column, so it marks none of them. */
const LOS_TRANSTOTAL_GROUPS = (r) => ['transplanting'];

/* Which groups each openable figure is made of, by the `kind` the drilldown
   knows it as — so the records window can carry the same answer the cell
   does. Sales and the calibration are absent on purpose: neither is signed
   off on a batch report tab. */
const LOS_GROUPS_OF_KIND = {
  received: () => ['seeds_in'],
  damaged:  () => ['planting'],
  planted:  () => ['planting'],
  variance: () => ['seeds_in', 'planting'],
  // All three Transplant Details columns are Transplanted rows, split by
  // the tray each came out of, so one group answers for all three.
  trans:    LOS_TRANSTOTAL_GROUPS,
  dtone:    LOS_TRANSTOTAL_GROUPS,
  transTotal: LOS_TRANSTOTAL_GROUPS,
  // All three 1st Culled columns are 1st_Culling rows split by tray.
  cull1Total: () => ['cull_1'],
  cull1:    () => ['cull_1'],
  cull1Dtone: () => ['cull_1'],
  cull2:    () => ['cull_2'],
  cull3:    () => ['cull_3'],
  cullTotal: LOS_CULLTOTAL_GROUPS,
  transfer: () => ['transfer'],
  balance:  LOS_BALANCE_GROUPS
};

const _losPlotKey = (p) => String(p == null ? '' : p).trim().toUpperCase();

/* A source tray matched on letters and digits only, so DOUBLE-TONE,
   "Double Tone" and "doubletone" are one tray. Same rule as nurseryKey /
   plotKey, and it cannot merge two trays: different letters give different
   keys. Kept to ONE line on purpose: the test harnesses lift a named const
   by reading to the end of its line, so a one-liner is the real function
   under test rather than a copy of it that can drift. */
const _losTrayKey = (t) => String(t == null ? '' : t).toUpperCase().split('').filter(c => (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9')).join('');

/* The part of a row sign-off's key that names the plot. `cull_2::U7` →
   'U7'; `transplanting::U7|main|P4|2026-09-18` → 'U7'. A transfer card's
   key keeps its suffix ('U7|TRANSFER') — see the note above. Sliced at the
   first pipe rather than split on purpose: a plot name is whatever somebody
   typed, and everything after the first pipe is the tab's own bookkeeping. */
function _losVerKey(mapKey) {
  const i = String(mapKey || '').indexOf('::');
  if (i < 0) return { stage: '', key: '' };
  const stage = String(mapKey).slice(0, i);
  const rest  = String(mapKey).slice(i + 2);
  const bar   = rest.indexOf('|');
  const head  = bar < 0 ? rest : rest.slice(0, bar);
  const tail  = bar < 0 ? '' : rest.slice(bar + 1).toLowerCase();
  return { stage, key: _losPlotKey(head) + (tail === 'transfer' ? '|TRANSFER' : '') };
}

/* The state of one figure group on one batch:
     'ok'   every line behind it is signed off
     'part' some are, some are not
     'no'   none is
     'n/a'  the batch has no line of that group at all — nothing to verify,
            so nothing to warn about. */
function _losStageState(tally) {
  if (!tally || !tally.lines) return 'n/a';
  if (tally.signed >= tally.lines) return 'ok';
  return tally.signed ? 'part' : 'no';
}

// The worst state across the groups a figure is made of. A figure built from
// a verified group and an unverified one is an unverified figure.
function _losWorst(r, groups) {
  let worst = 'n/a';
  const rank = { 'n/a': 0, ok: 1, part: 2, no: 3 };
  groups.filter(Boolean).forEach(g => {
    const st = _losStageState(r.ver && r.ver[g]);
    if (rank[st] > rank[worst]) worst = st;
  });
  return worst;
}

// Which of a figure's groups are still outstanding, named for the reader.
function _losPendingNames(r, groups) {
  return LOS_GROUP_ORDER
    .filter(g => groups.indexOf(g) >= 0)
    .filter(g => { const st = _losStageState(r.ver && r.ver[g]); return st === 'part' || st === 'no'; })
    .map(g => {
      const t = (r.ver && r.ver[g]) || { lines: 0, signed: 0 };
      const left = Math.max(0, t.lines - t.signed);
      return LOS_GROUP_NAMES[g] + (t.signed ? ' (' + left + ' of ' + t.lines + ' rows left)' : '');
    });
}

/* ═══ AN UNVERIFIED FIGURE DOES NOT FLOAT ══════════════════════════════════

   The office asked for this in two sentences: "if the batch report not yet
   filled in the data, dont float the data to life of seedling", then "make
   it only verified data will float to life of seedling".

   It reverses what this report used to do, and the reversal is theirs to
   make — they are the ones who reconcile against it. Batch 246 is what
   changed their mind: its 3rd Culling tab reads 0 of 4 Done, with every
   Culled Qty box empty, and Life of Seedlings was showing 10,142 third
   culled and a Balance of MINUS 7,659 off the back of it.

   WHAT WAS RIGHT ABOUT THE OLD RULE IS STILL RIGHT, AND IT IS WHY A
   WITHHELD FIGURE IS A DASH AND NEVER A NOUGHT. Zeroing an unverified stage
   is a wrong number wearing a right number's clothes: a batch with Seed
   Received in and Actual Planted silently at nought reports a Variance of
   minus the whole delivery. So:

   - a withheld figure reads "—", which is "nobody has signed this yet" and
     cannot be mistaken for a count;
   - a DERIVED figure is withheld whenever any part of it is, rather than
     being computed from the parts that survived — that is the same trap one
     level up, and it is why Balance and Total Culled carry every group they
     are made of;
   - a withheld figure is OUT of its column total, and the foot says how
     many rows are missing from it;
   - and the figure is still reachable: it is in the hover, and the records
     behind it still open. It does not float; it is not hidden.

   A stage with no lines at all is not withheld — there is nothing to verify
   about a stage the batch has not reached, so a true nought still reads 0.

   If the sign-off tables could not be READ, nothing is withheld and the
   report says so. The same reason access fails open: a check that cannot
   run must not empty a report. */
/* ── WHICH ROW A LEDGER LINE SIGNS OFF UNDER ──────────────────────────
   A transfer card signs off under the plot the seedlings LEFT, which the
   line names in its remark and not in plot_name. The Double Tone Quantity
   in Nursery box is not about a plot at all and signs off under its own
   name — see ROW_TAB_CONFIG in operation_batch_detail.html, where it is
   pushed with the key 'DTONE-NURSERY-QTY'. Everything else signs off under
   its own plot. */
function _losLineRowKey(l) {
  if (!l) return '';
  if (l.transaction_type === 'Cull3_Transfer') {
    const from = (l.remark || '').match(_RE_LOS_FROM_PLOT);
    return from ? _losPlotKey(from[1]) + '|TRANSFER' : '';
  }
  if (l.transaction_type === 'DTone_Nursery_Qty') return 'DTONE-NURSERY-QTY';
  return _losPlotKey(l.plot_name);
}

/* HAS SOMEBODY SIGNED THIS LINE OFF? One signature over the whole tab, or —
   on a tab verified row by row — a Row_Verification against this line's own
   row. A line belonging to no batch-report stage at all (a sale, a
   calibration) is signed off elsewhere and is never held back here.

   ONE RULE, two readers: the figures are built out of the lines this
   answers yes to, and the tally beside them counts the lines it answers no
   to. Two copies of this test would be a figure disagreeing with the note
   that explains it. */
function _losLineSigned(l, ctx) {
  const group = LOS_GROUP_OF_TYPE[l && l.transaction_type];
  if (!group) return true;
  const stage = LOS_STAGE_OF_GROUP[group];
  const batch = l.batch_name;
  if (ctx.stageSigned.has(batch + '::' + stage)) return true;
  if (!LOS_ROW_STAGES[stage]) return false;
  const rowKey = _losLineRowKey(l);
  return !!rowKey && ctx.rowSigned.has(batch + '::' + stage + '::' + rowKey);
}

function _losHeld(r, groups) {
  if (!r.verKnown) return false;
  const st = _losWorst(r, groups);
  return st === 'part' || st === 'no';
}

/* WHAT THIS FIGURE IS STILL WAITING FOR, for the cell's hover.

   The figure itself is the verified part and is shown as a figure — see the
   note on verOnly in _losBuildAllRows. But a figure that is going to MOVE
   when somebody signs the rest has to say so somewhere, or a reader takes a
   partial total away believing it settled. So the cell carries it in its
   title: which stage, how many rows are left, and what they would add.

   Nothing visible changes — every figure on this report already wears the
   dotted underline that says it opens. '' when there is nothing outstanding,
   which is the ordinary case. */
function _losWaitingNote(r, groups, kind) {
  if (!r.verKnown) return '';
  const names = _losPendingNames(r, groups);
  if (!names.length) return '';
  let waiting = 0;
  (groups || []).filter(Boolean).forEach(g => {
    const t = (r.ver && r.ver[g]) || {};
    waiting += Number(t.waiting || 0);
  });
  return 'This is the VERIFIED figure. Still to be signed off: ' + names.join(', ')
       + (waiting ? ', which would add ' + fmtNum(waiting) : '')
       + '. It joins this figure the day somebody signs it.'
       + (kind ? ' Click to see the records behind it.' : '');
}

/* A <td> carrying that note, or a plain one when nothing is outstanding. */
function _losTd(r, groups, kind, inner) {
  const note = _losWaitingNote(r, groups, kind);
  return note ? `<td title="${_losEsc(note)}">${inner}</td>` : `<td>${inner}</td>`;
}

/* Which stages each TOTAL-row field is made of, so the foot can leave out
   exactly the rows the table left out. It is the same answer
   LOS_GROUPS_OF_KIND gives per column, keyed by the field the reducer sums
   — two names for one fact, and a field missing from here is a field that
   would quietly total figures the rows above it are not showing. */
const LOS_GROUPS_OF_FIELD = {
  received: ['seeds_in'], doQty: ['seeds_in'], focQty: ['seeds_in'],
  damaged: ['planting'], planted: ['planting'],
  transTotal: ['transplanting'], trans: ['transplanting'],
  transMain: ['transplanting'], transDtone: ['transplanting'],
  dtone: ['dtone'],
  cull1: ['cull_1'], cull1Main: ['cull_1'], cull1Dtone: ['cull_1'],
  cull2: ['cull_2'], cull3: ['cull_3'],
  cullTotal: ['cull_1', 'cull_3'],
  transfer: ['transfer'],
  // Sales and the calibration are signed off elsewhere — the D/O module and
  // the calibration approval — so neither is ever withheld here.
  sales: [], calibration: [],
  balance: ['transplanting', 'cull_3']
};

function _losEsc(s) {
  return String(s == null ? '' : s).replace(/[<>"'&]/g,
    c => ({ '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;', '&':'&amp;' }[c]));
}

/* Whole months between two dates, the way the nursery counts them: six weeks
   is one month, not one and a half — the month only turns once the same day
   of the month comes round again. Measured to the As At date rather than to
   today, so looking back at March shows what the batch's age WAS in March. */
function _losAgeMonths(from, asAt) {
  if (!from) return null;
  const d = new Date(from);
  if (isNaN(d.getTime())) return null;
  const now = asAt ? new Date(asAt) : new Date();
  if (isNaN(now.getTime())) return null;
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m--;
  return m < 0 ? 0 : m;
}
function _losAgeLabel(m) {
  if (m == null) return '—';
  return m + (m === 1 ? ' month' : ' months');
}

/* The As At cut-off the Month and Year pickers come to, as YYYY-MM-DD, or
   '' for no cut-off. A month without a year says nothing on its own — there
   is no year for it to be the month of — so it is ignored until a year is
   picked. */
function _losAsAt(year, month) {
  if (!year) return '';
  const y = Number(year);
  const m = month === '' ? 11 : Number(month);
  // Day 0 of the NEXT month is the last day of this one, leap years and all.
  const last = new Date(y, m + 1, 0);
  const pad = (n) => String(n).padStart(2, '0');
  return `${last.getFullYear()}-${pad(last.getMonth() + 1)}-${pad(last.getDate())}`;
}

/* The window a Completed batch has to have FINISHED inside. A year on its
   own is the whole year; a year and a month, that month. */
function _losFinishedWindow(year, month) {
  if (!year) return null;
  const y = Number(year);
  const from = month === '' ? new Date(y, 0, 1)  : new Date(y, Number(month), 1);
  const to   = month === '' ? new Date(y, 12, 0) : new Date(y, Number(month) + 1, 0);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  return { from: fmt(from), to: fmt(to) };
}

/* How each of the two As Ats reads on the report's own scope line. */
const _LOS_MONTHS_LONG = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
function _losFinishedLabel(year, month) {
  if (!year) return 'finished at any time';
  return 'finished in ' + (month === '' ? year : _LOS_MONTHS_LONG[Number(month)] + ' ' + year);
}
function _losDayLabel(day) {
  if (!day) return 'as at today';
  const d = new Date(day + 'T00:00:00');
  if (isNaN(d.getTime())) return 'as at ' + day;
  return 'as at ' + d.getDate() + ' ' + _LOS_MONTHS_LONG[d.getMonth()] + ' ' + d.getFullYear();
}

/* The age bands the Age filter offers. Open-ended at the top so a batch never
   falls out of every band as it gets older. */
const LOS_AGE_BANDS = [
  { value: '0-3',   label: '0 – 3 months',   min: 0,  max: 3  },
  { value: '4-6',   label: '4 – 6 months',   min: 4,  max: 6  },
  { value: '7-9',   label: '7 – 9 months',   min: 7,  max: 9  },
  { value: '10-12', label: '10 – 12 months', min: 10, max: 12 },
  { value: '12+',   label: 'Over 12 months', min: 13, max: Infinity },
];

/* Signed, so a stock calibration reads "+3" / "−2" rather than leaving the
   reader to work out which way it went. */
function fmtSigned(n) {
  const v = Number(n || 0);
  if (!v) return '0';
  return (v > 0 ? '+' : '−') + Math.abs(v).toLocaleString();
}

// The whole Life of Seedlings data pipeline's FETCH + BUILD half — one row
// per batch, every figure computed (received/damaged/planted/transplanted/
// culled/sold/balance/variance/age…), completely UNFILTERED. Shared by
// _losBuildData() (Life of Seedling's own LOS-style filters: nursery type,
// status, As At month/year, age, breed, supplier) and runSeedInReport()
// (Nursery Report's Seed In sub-report, which filters the same rows a
// simpler way — As At as a single day, Locations, breed — see its own
// comment). Neither is a second implementation of the figures themselves;
// both filter the exact same build.
//
// asAt only affects r.ageMonths/r.age here — the "as at THIS date, is a
// batch too old/too young for the age band" question. Each caller applies
// its own as-at-based CUTOFF (excluding batches received after asAt)
// itself, once it has its own filtered rows to work with.
//
// Returns null (having already rendered the error and unhidden #report-
// output) if the fetch failed — callers just `return` on that. Otherwise
// the unfiltered array of per-batch rows.
async function _losBuildAllRows(asAt, opts) {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');

  const [logsRes, dosRes, plotsRes, traysRes, stageVerRes, rowVerRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, breed_name, transaction_type, transaction_date, created_at, remark, plot_name, quantity_change')
      .in('transaction_type', ['Seeds_Received', 'Damaged_Seeds', 'Planted',
          'Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone',
          'DTone_Nursery_Qty',
          '1st_Culling', '2nd_Culling', '3rd_Culling', 'Cull3_Transfer',
          'Stock_Calibration',
          /* Not a figure on this report — it is what holds a batch out of
             Completed. See shared/shared_batch_completed.js. */
          'Review_Rejection'])
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('do_number, delivery_date, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    _supabase.from('operation_trays').select('tray_name, nursery_name').then(r => r, () => ({ data: [] })),
    /* WHO HAS SIGNED WHAT — see the note above LOS_GROUP_OF_TYPE. A stage
       signed as a whole, and a tab signed row by row, are two tables and one
       question. Both are read for EVERY batch and are never cut off at the
       As At date, because "has anybody checked this" is a question about now.

       Failing soft on purpose: if either read is refused, every figure keeps
       the state it had before this existed — shown, unmarked. A report that
       cannot tell verified from unverified must not therefore announce the
       whole nursery unverified. */
    fetchAllRows(() => _supabase.from('operation_batch_verifications')
      .select('batch_name, stage')
      .order('id', { ascending: true })).then(r => r, () => ({ data: [], error: true })),
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, plot_name')
      .eq('transaction_type', 'Row_Verification')
      .order('id', { ascending: true })).then(r => r, () => ({ data: [], error: true }))
  ]);

  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${_losEsc(logsRes.error.message)}</div>`;
    return null;
  }

  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  const trayNames = new Set(PRE_NURSERY_PLOTS);
  (((traysRes && traysRes.data) || [])).forEach(t => { if (t.tray_name) trayNames.add(t.tray_name); });
  const isTray    = (n) => trayNames.has(n);
  const nurseryOf = (plot) => !plot ? 'Unassigned'
    : (isTray(plot) ? 'Pre-Nursery' : (plotToLoc[plot] || 'Unassigned'));

  /* ── The sign-off lookups ──
     stageSigned: `batch::stage`           → one signature over the whole tab
     rowSigned:   `batch::stage::PLOTKEY`  → that one row signed
     verReadable needs BOTH reads, and it is an AND rather than an OR on
     purpose. Either table missing on its own is not a partial answer, it is
     a systematically wrong one: without the stage table every whole-tab
     signature disappears and Seed In and Planting read unverified on every
     batch in the nursery; without the row sign-offs the same happens to the
     four tabs that are signed row by row. A marker that cries over hundreds
     of figures that are fine teaches the reader to ignore it, so when either
     read fails no figure is marked at all and the report says why. */
  const stageSigned  = new Set();
  const rowSigned    = new Set();
  const verReadable  = !(stageVerRes && stageVerRes.error) && !(rowVerRes && rowVerRes.error);
  (((stageVerRes && stageVerRes.data) || [])).forEach(v => {
    if (v && v.batch_name && v.stage) stageSigned.add(v.batch_name + '::' + v.stage);
  });
  (((rowVerRes && rowVerRes.data) || [])).forEach(v => {
    if (!v || !v.batch_name || !v.plot_name) return;
    const k = _losVerKey(v.plot_name);
    if (k.stage && k.key) rowSigned.add(v.batch_name + '::' + k.stage + '::' + k.key);
  });

  /* ── ONLY VERIFIED DATA IS COUNTED ──────────────────────────────────
     The office, twice: *"make it only verified data will float to life of
     seedling"*, and then *"it is only calculate what data is verified
     first ... just show the number which verified until new data verified
     then update the report there."*

     So the figures are built out of the lines SOMEBODY HAS SIGNED, and a
     line nobody has signed takes no part in any of them. It is not a
     different rule from the one before it, it is the same rule asked one
     level down: it used to be asked of a whole STAGE, so one unsigned row
     took the whole column away and everything derived from it with it.
     Asked of the LINE, a tab signed four rows out of five shows those
     four, and the fifth joins the figure the day it is signed.

     Three things fall out of that, and they are why this is where the
     test goes rather than in the cells:

     - **Every derived figure is right by construction.** Variance, Total
       Culled, the Balance and both splits are arithmetic over these
       figures, so none of them needs to know this rule exists.
     - **Nothing is a dash any more.** A figure is the verified part and a
       stage nobody has signed is nought — which is what the office asked
       for, and it is also why the cell still carries, in its hover, how
       many rows are outstanding and what they would add. A figure that is
       going to move has to say so somewhere.
     - **The record lists are untouched.** `r.rec` keeps every line, signed
       or not, because the drilldown is exactly what somebody needs in
       order to go and sign the rest off.

     It FAILS OPEN, same as everything else here: if neither sign-off table
     could be read, every line counts and the report says it could not tell.

     Only Life of Seedlings asks for it. The Seed In Report shares this
     builder and is a different report with a different question, so it
     takes the ledger as keyed — see runSeedInReport(). */
  const verOnly = !!(opts && opts.verifiedOnly) && verReadable;
  const verCtx  = { stageSigned, rowSigned };

  // ── One row per batch ──
  const rowsByBatch = {};
  const blank = (name) => ({
    batch: name, breed: '—', supplier: '—', mpob: '—',
    seedsDate: null,
    received: 0, doQty: 0, focPct: null, focQty: 0, replQty: 0,
    /* How many Seeds_Received rows the batch has, and the stamp of the one
       these figures came from. A batch is meant to have exactly one — see
       the note in the Seeds_Received branch below. */
    srRows: 0, srStamp: '',
    damaged: 0, planted: 0,
    /* trans is EVERY main-plot transplant, which is the batch report's own
       transplanted total; transDtone is the part of it that came out of the
       DOUBLE-TONE tray, which is that report's "Main Plot (D-Tone)" card.
       The Transplant Details group is those two and their total. */
    trans: 0, transDtone: 0, premium: 0,
    /* THREE numbers wear the name Double Tone and only one of them is a
       column. dtone is the admin-keyed "Double Tone Quantity in Nursery"
       (see the DTone_Nursery_Qty branch below) and dtoneTray is the
       transplant INTO the d-tone tray; both are kept, counted and verified,
       and neither is the column. The column is transDtone above. */
    dtone: 0, dtStamp: '', dtRows: 0, dtoneTray: 0,
    /* cull1 is every 1st culling; cull1Dtone is the part of it that
       happened in the DOUBLE-TONE tray. The two columns beside the total
       are disjoint halves of it, the same shape as Transplant Details. */
    cull1: 0, cull1Dtone: 0, cull2: 0, cull3: 0,
    /* Of the sales and the calibration, the part that happened in the
       PRE-NURSERY. Seedlings can leave a tray without ever being
       transplanted — sold straight out of it, or written off by an approved
       calibration against it — and until these existed neither came off the
       pre-nursery figure. See preBalance below for what that cost. */
    /* The day the batch last moved. For one that has finished, that IS the
       day it finished — the movement that took the last of it away is the
       last movement there is. It is what Status → Completed filters on. */
    lastDate: null,
    transfer: 0, sales: 0, salesPre: 0,
    calibration: 0, calibrationPre: 0, calibrationSeed: 0, calibrationField: 0,
    preBalance: 0,
    /* stage → { lines, signed }: how many of that stage's ledger lines this
       batch has, and how many of them somebody has signed off. Filled by
       _losApplyVerification() at the end of the build, and read by the
       report's ⧗ markers — see _losStageState(). */
    ver: {},
    rec: { received: [], damaged: [], planted: [], trans: [], premium: [], dtone: [], dtoneTray: [],
           cull1: [], cull2: [], cull3: [], transfer: [], sales: [], calibration: [] }
  });
  const rowFor = (name) => rowsByBatch[name] || (rowsByBatch[name] = blank(name));

  (logsRes.data || []).forEach(l => {
    const name = l.batch_name; if (!name) return;
    const d = _logDate(l);
    /* AS AT CUTS THE LEDGER OFF.
       It used to cut off only WHICH batches were listed and how old they
       were; every figure beside them — planted, transplanted, culled, sold,
       the balance — was counted to TODAY. So "as at September" put
       September's batches under October's culling, and the report said as at
       on a line that was not. Asked BEFORE the row is created, so a batch
       nothing had happened to by then does not appear as a line of noughts. */
    if (asAt && d && d > asAt) return;
    const r = rowFor(name);
    if (d && (!r.lastDate || d > r.lastDate)) r.lastDate = d;
    /* Nobody has signed this line, so it is in no figure on the report —
       see the note on verOnly above. The line still reaches r.rec below,
       and still counts in the verification tally, so it can be found and
       signed. */
    const vOK = !verOnly || _losLineSigned(l, verCtx);
    const q = vOK ? Math.abs(Number(l.quantity_change || 0)) : 0;
    const t = l.transaction_type;
    // The log is the only thing that names the breed: operation_batches has
    // no breed_name column, and a bulk-imported batch has no row there at
    // all. Every Seeds_Received row carries its own — see the reception
    // form's save in operation_batch_detail.html.
    if (r.breed === '—' && l.breed_name) r.breed = l.breed_name;

    if (t === 'Seeds_Received') {
      const rm = l.remark || '';
      const sup  = rm.match(_RE_LOS_SUPPLIER);
      const mp   = rm.match(_RE_LOS_MPOB);
      const dono = rm.match(_RE_LOS_DONO);
      const dq   = rm.match(_RE_LOS_DO_QTY);
      const fp   = rm.match(_RE_LOS_FOC_PCT);
      const rp   = rm.match(_RE_LOS_REPL);
      // Legacy rows carry no DO_Qty marker — the whole received quantity WAS
      // the D/O quantity then, there being no FOC concept yet to split it from.
      const doQty = dq ? parseInt(dq[1], 10) : Number(l.quantity_change || 0);
      const focPct = fp ? parseFloat(fp[1]) : null;
      // The same "Calculated FOC Qty" arithmetic Seeds In shows beside the FOC
      // percent it comes from, so this report's figure is the one the batch
      // was keyed against.
      const focQty = focPct != null ? Math.round(doQty * (focPct / 100)) : 0;
      const repl   = rp ? parseInt(rp[1], 10) : 0;

      /* ONE BATCH, ONE RECEPTION — THE NEWEST ROW WINS.

         These figures used to be ADDED UP across every Seeds_Received row the
         batch had, and a batch is only ever meant to have one. Saving the
         Seeds In form twice used to leave a second (batch 261 went in seven
         times, 260 twice), and the 224-241 range was damaged again by an
         update keyed on created_at — both are named in the comments around
         that form's save in operation_batch_detail.html.

         So a batch carrying a stale row read as the SUM of the two. Batch 224
         showed 997,500 seeds received against 9,920 planted and a Variance of
         minus nine hundred and eighty-seven thousand, while the form it was
         keyed on, and the batch list beside it, both read 10,500.

         The other two readers had already settled this and this one had not:
         operation_batch_detail.html loads the newest row with `.limit(1)`
         ("Match the list page: newest row wins") and
         operation_batch_record.html de-dupes to the newest per batch_name.
         Three readers of one ledger, and this was the one disagreeing.

         So: the newest row supplies the figures, the supplier, the licence
         and the date — exactly what the form shows. EVERY row is still kept
         in r.rec.received, because the drilldown is where somebody SEES the
         duplicate, and srRows is counted so the report can SAY there is one
         rather than quietly dropping it. shared/CHECK_duplicate_seeds_in.sql
         names them on every batch. */
      r.srRows += 1;
      const stamp = String(l.created_at || l.transaction_date || '');
      if (r.srRows === 1 || stamp >= r.srStamp) {
        r.srStamp  = stamp;
        r.seedsDate = d;
        r.supplier = sup && sup[1].trim() ? sup[1].trim() : '—';
        r.mpob     = mp ? mp[1].trim() : '—';
        /* The date, the supplier and the licence are not figures — they say
           WHICH delivery this is, and a row with no figure on it still has
           to be identifiable. The quantities are the figures, and an
           unsigned reception contributes none of them. */
        r.received = vOK ? Number(l.quantity_change || 0) : 0;
        r.doQty    = vOK ? doQty : 0;
        r.focQty   = vOK ? focQty : 0;
        r.replQty  = vOK ? repl : 0;
        r.focPct   = vOK ? focPct : null;
      }
      r.rec.received.push({ date: d, batch: name, supplier: sup ? sup[1].trim() : '—',
        mpob: mp ? mp[1].trim() : '—', dono: dono ? dono[1].trim() : '—',
        doQty, focQty, repl, qty: Number(l.quantity_change || 0) });
      return;
    }
    if (t === 'Damaged_Seeds') {
      r.damaged += q;
      r.rec.damaged.push({ date: d, batch: name, place: l.plot_name || '—', qty: q, note: l.remark || '' });
      return;
    }
    if (t === 'Planted') {
      r.planted += q;
      r.rec.planted.push({ date: d, batch: name, place: l.plot_name || '—', qty: q });
      return;
    }
    if (t === 'Transplanted') {
      const src = (l.remark || '').match(_RE_LOS_FROM_TRAY);
      r.trans += q;
      /* THE D-TONE-SOURCED SUBSET, which is the batch report's "Main Plot
         (D-Tone)" card and nothing else. A Transplanted row is a main-plot
         transplant whatever tray it came out of; the ones that came out of
         the DOUBLE-TONE tray are the ones that had the treatment. So the
         two are DISJOINT halves of one total and add up to it — the same
         words that tile is built on in operation_batch_detail.html.

         It is read off the source tray in the remark, which is where the
         save writes it: `Transplanted from tray [DOUBLE-TONE] to Main Plot
         [U3]`. Matched on letters and digits so a dash or a space cannot
         lose a row, the same rule as nurseryKey / plotKey. */
      if (src && _losTrayKey(src[1]) === 'DOUBLETONE') r.transDtone += q;
      r.rec.trans.push({ date: d, batch: name, from: src ? src[1].trim() : '—',
        place: l.plot_name || '—', nursery: nurseryOf(l.plot_name), qty: q });
      return;
    }
    if (t === 'Transplanted_Premium' || t === 'Transplanted_DoubleTone') {
      const src = (l.remark || '').match(_RE_LOS_FROM_TRAY);
      /* NOT the Double Tone column. This is the step that FILLS the D-Tone
         tray out of the batch's own tray, and its seedlings leave again
         later as ordinary Transplanted rows — the same reason it takes no
         part in the Balance. The column is the figure below. */
      const key = t === 'Transplanted_Premium' ? 'premium' : 'dtoneTray';
      r[key] += q;
      r.rec[key].push({ date: d, batch: name, from: src ? src[1].trim() : '—',
        place: l.plot_name || '—', qty: q });
      return;
    }

    /* DOUBLE TONE IS THE FIGURE THE OFFICE KEYED.

       The Transplanting tab has a box headed "Double Tone Quantity in
       Nursery" — an admin counts the double-tone seedlings standing in the
       nursery and keys the number, and Tabs 3 and 4 add it to the planted
       total to get their allocation base. It is stored as ONE
       DTone_Nursery_Qty row per batch and read back newest-first with
       `.limit(1)`, exactly as loadDtoneNurseryQty() does it.

       This column used to show Transplanted_DoubleTone instead — the
       transplant INTO the d-tone tray, which is a different number and is
       nought on most batches. So the report read 0 against batches the
       office had keyed a figure for, on a column headed Double Tone.

       Newest wins, like the form: a second keying is a correction, not a
       second lot of seedlings. dtRows counts them so the report can say
       when there is more than one, the same way the Seeds In column does. */
    if (t === 'DTone_Nursery_Qty') {
      r.dtRows += 1;
      const stamp = String(l.created_at || l.transaction_date || '');
      if (r.dtRows === 1 || stamp >= r.dtStamp) {
        r.dtStamp = stamp;
        r.dtone   = vOK ? Number(l.quantity_change || 0) : 0;
      }
      r.rec.dtone.push({ date: d, batch: name, place: l.plot_name || '—',
        note: l.remark || '', qty: Number(l.quantity_change || 0) });
      return;
    }
    if (t === '1st_Culling' || t === '2nd_Culling' || t === '3rd_Culling') {
      const key = t === '1st_Culling' ? 'cull1' : t === '2nd_Culling' ? 'cull2' : 'cull3';
      const stage = t === '1st_Culling' ? '1st' : t === '2nd_Culling' ? '2nd' : '3rd';
      r[key] += q;
      /* THE D-TONE TRAY'S SHARE OF THE 1ST CULLING. A 1st culling happens
         in the TRAY and the row is keyed against the tray it happened in —
         `plot_name` IS the tray, and the DOUBLE-TONE tray is one of them
         (saveCullingTab in operation_batch_detail.html draws a row for every
         tray in preNurseryTrayData and gives the d-tone one its own icon).
         So the split is the same question as the transplant one, asked of a
         different column, and it uses the same tray matcher. */
      if (t === '1st_Culling' && _losTrayKey(l.plot_name) === 'DOUBLETONE') r.cull1Dtone += q;
      r.rec[key].push({ date: d, batch: name, stage, place: l.plot_name || '—',
        nursery: t === '1st_Culling' ? 'Pre-Nursery' : nurseryOf(l.plot_name), qty: q });
      return;
    }
    if (t === 'Cull3_Transfer') {
      /* One log describes both sides of the move: the plot named on the row
         gained the seedlings, the plot named in its remark lost them. Both
         plots belong to THIS batch — a 3rd-culling transfer only ever moves
         seedlings from one of a batch's plots to another — so it changes
         where the batch is standing and not how many of it there are. That
         is why the column is the quantity moved, and why it takes no part in
         the Balance beside it. */
      const from = (l.remark || '').match(_RE_LOS_FROM_PLOT);
      r.transfer += q;
      r.rec.transfer.push({ date: d, batch: name, from: from ? from[1].trim() : '—',
        place: l.plot_name || '—', nursery: nurseryOf(l.plot_name), qty: q });
      return;
    }
    if (t === 'Stock_Calibration') {
      const rm = l.remark || '';
      const ok = _RE_LOS_APPROVED.test(rm);
      const body = rm.replace(_RE_LOS_APPROVED, '').trim();
      const rep  = body.match(_RE_LOS_CAL_REPORT);
      const side = body.match(_RE_LOS_CAL_SIDE);
      const signed = Number(l.quantity_change || 0);
      if (ok) r.calibration += signed;
      // Which side of the nursery it adjusts. A tray is pre-nursery; so is a
      // row keyed against 'Pre-Nursery' itself.
      if (ok && nurseryOf(l.plot_name) === 'Pre-Nursery') r.calibrationPre += signed;
      /* WHICH COUNT IT CORRECTS, which is a different question from where
         the plot is. A calibration reported against Seeds Received,
         Planting or a Seed Audit is a correction to the SEED side — the
         batch total, what was counted into the tray. Everything else is a
         correction to what is standing in a PLOT.

         `ADJUST_SIDE_OF` in operation_batch_detail.html is the original and
         this is its list; the rule is derived from the Report and never
         from the "Side:" in the remark, because rows written while the form
         still asked carry one and a row filed on the wrong side has to
         correct itself. Change one, change the other. */
      const seedSide = _LOS_CAL_SEED_REPORTS.indexOf(
        String(rep ? rep[1] : '').trim().toLowerCase()) >= 0;
      if (ok && seedSide) r.calibrationSeed += signed;
      /* And the FIELD one, which is the plot side of the plot side: a
         correction to what is standing, in a plot that is not a tray. It is
         counted on its own rather than worked out by subtraction, because
         230's row is BOTH seed-side and pre-nursery and taking each off in
         turn would take it off twice. */
      if (ok && !seedSide && nurseryOf(l.plot_name) !== 'Pre-Nursery') r.calibrationField += signed;
      r.rec.calibration.push({ date: d, batch: name, place: l.plot_name || '—',
        report: rep ? rep[1].trim() : '—', side: side ? side[1].toLowerCase() : 'seed',
        approved: ok, qty: signed, note: body.replace(_RE_LOS_CAL_REPORT, '').replace(_RE_LOS_CAL_SIDE, '').trim() });
      return;
    }
  });

  // ── Sales, off the delivery orders ──
  // Matched on the batch alone, not plot·batch: this report's row IS the batch,
  // so a D/O line for it counts wherever in the nursery it was picked from.
  // Cancelled D/Os are the only ones left out; CAL- calibration D/Os count,
  // the same rule Batch Detail's Sales figure follows.
  const byBatchKey = {};
  Object.values(rowsByBatch).forEach(r => {
    const k = _mvBatchKey(r.batch);
    if (k) byBatchKey[k] = r;
  });
  (dosRes.data || []).forEach(d => {
    if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
    // The same cut-off. A delivery made after the As At date has not
    // happened yet as far as this report is concerned.
    const dDate = d.delivery_date ? String(d.delivery_date).slice(0, 10) : '';
    if (asAt && dDate && dDate > asAt) return;
    for (let i = 1; i <= 5; i++) {
      const qty = Number(d['qty_' + i] || 0);
      if (!qty) continue;
      const r = byBatchKey[_mvBatchKey(d['batch_' + i])];
      if (!r) continue;
      const soldFrom = nurseryOf(d['plot_' + i]);
      // A delivery is a movement too, and for a batch sold out it is usually
      // the LAST one — so it has to count towards when the batch finished.
      if (dDate && (!r.lastDate || dDate > r.lastDate)) r.lastDate = dDate;
      r.sales += qty;
      // A small-polybag sale straight out of the tray never reaches the
      // field, so it has to come off the pre-nursery figure and not the
      // main one.
      if (soldFrom === 'Pre-Nursery') r.salesPre += qty;
      r.rec.sales.push({ date: d.delivery_date || null, batch: r.batch,
        dono: d.do_number || '—', place: d['plot_' + i] || '—',
        nursery: soldFrom, qty });
    }
  });

  // ── Derived figures ──
  Object.values(rowsByBatch).forEach(r => {
    /* THE 2ND CULLING NEVER DEDUCTS. NOT EVEN WHILE NO 3RD EXISTS.

       This used to read `cull3 > 0 ? cull3 : cull2` — the 2nd standing in
       for the 3rd until a 3rd was keyed — and claimed in its own comment to
       be "the same rule as the Movement Report's netOfRow()". It was not.
       netOfRow says so in as many words: "2nd Culled never deducts here,
       B/F included — 2nd Culling is Tab 6's own live snapshot as a batch
       works through 3rd Culling, not a separate loss on top of it." The
       Batch Report's culling rate says the same thing from the other side:
       (1st + 3rd) over (transplanted + 1st), and cull2 is carried "for
       reference only — it is inside cull3".

       So every batch 2nd culled and not yet 3rd culled had its Total
       Culling overstated by the 2nd culling and its Balance understated by
       the same, on the one report the office reconciles against — while
       the column it sat in was headed "Total Culling (1st + 3rd)" and the
       Movement Report beside it disagreed.

       The 2nd Culled COLUMN stays. It is worth seeing; it is just not a
       loss to add on top of the 3rd. */
    r.postCull   = r.cull3;
    r.cullTotal  = r.cull1 + r.postCull;
    r.variance   = r.planted - (r.received - r.damaged);
    /* TRANSPLANT DETAILS IS THE BATCH REPORT'S OWN THREE FIGURES, NOT A SUM
