        </table>
      </div>
    </div>`;
  }).join('');
}

/* ── The same Seed In detail, ONE table grouped by supplier ───────────────
   Same shape Sales Listing uses (see runSalesListing()): a single table, a
   group-header row per supplier — showing the supplier's name AND its MPOB
   licence together, "the customer name" of this report — a subtotal row
   under their batches, and one grand total at the end, rather than a
   separate <table> per group. Breed moves to a plain per-row column since
   the group heading is supplier now, not breed. */
function _losSupplierHtml(rows) {
  if (!rows.length) return '';
  const groups = {};
  rows.forEach(r => { (groups[r.supplier] = groups[r.supplier] || []).push(r); });
  // Busiest supplier first — same ordering rule Sales Listing uses for
  // customers.
  const names = Object.keys(groups).sort((a, b) =>
    groups[b].reduce((s, r) => s + r.received, 0) - groups[a].reduce((s, r) => s + r.received, 0));

  const grand = rows.reduce((s, r) => ({
    received: s.received + r.received, damaged: s.damaged + r.damaged,
    planted: s.planted + r.planted,
    varDown: s.varDown + (r.variance < 0 ? r.variance : 0),
    varUp:   s.varUp   + (r.variance > 0 ? r.variance : 0)
  }), { received: 0, damaged: 0, planted: 0, varDown: 0, varUp: 0 });

  const bodyHtml = names.map(name => {
    const list = groups[name].slice().sort((a, b) => String(b.seedsDate || '').localeCompare(String(a.seedsDate || '')));
    const t = list.reduce((s, r) => ({
      received: s.received + r.received, damaged: s.damaged + r.damaged,
      planted: s.planted + r.planted,
      varDown: s.varDown + (r.variance < 0 ? r.variance : 0),
      varUp:   s.varUp   + (r.variance > 0 ? r.variance : 0)
    }), { received: 0, damaged: 0, planted: 0, varDown: 0, varUp: 0 });
    // MPOB licence is the supplier's own, not the batch's — every batch
    // under one supplier should carry the same one, but read from whichever
    // row actually has it in case an older batch was saved before the field
    // existed.
    const mpob = (list.find(r => r.mpob && r.mpob !== '—') || {}).mpob;
    const heading = mpob && mpob !== '—' ? `${_losEsc(name)} · ${_losEsc(mpob)}` : _losEsc(name);
    return `
      <tr style="background:#f3ede1"><td colspan="7" class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${heading}</td></tr>
      ${list.map(r => `
        <tr>
          <td>${fmtDate(r.seedsDate)}</td>
          <td class="font-black text-[#3d2610]">
            ${_losEsc(r.batch)}
            ${_losSeedBoardBtn(r)}
          </td>
          <td>${_losEsc(r.breed)}</td>
          <td>
            ${_losFig('received', r.batch, fmtNum(r.received), 'text-[#c07820] font-black')}
            ${_losFocSplit(r)}
          </td>
          ${_losCell('damaged', r.batch, r.damaged, 'text-[#a83020] font-black')}
          ${_losCell('planted', r.batch, r.planted, 'font-black')}
          <td>${_losFig('variance', r.batch,
            (r.variance > 0 ? '+' : r.variance < 0 ? '−' : '') + fmtNum(Math.abs(r.variance)),
            r.variance < 0 ? 'text-[#a83020] font-black' : r.variance > 0 ? 'text-[#4a7a2e] font-black' : 'text-[#8a7a68]')}</td>
        </tr>`).join('')}
      <tr style="background:#fdfaf4">
        <td colspan="3" class="text-right font-black text-[10px] uppercase tracking-widest text-[#8a7a68]">Subtotal — ${_losEsc(name)}</td>
        <td class="font-black text-[#c07820]">${fmtNum(t.received)}</td>
        <td class="font-black text-[#a83020]">${fmtNum(t.damaged)}</td>
        <td class="font-black">${fmtNum(t.planted)}</td>
        <td class="font-black">
          <div class="text-[#a83020]">${t.varDown ? '−' + fmtNum(Math.abs(t.varDown)) : '0'}</div>
          <div class="text-[#4a7a2e]">${t.varUp ? '+' + fmtNum(t.varUp) : '0'}</div>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4 gap-4 flex-wrap">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seed In Details</h3>
        <div class="flex items-center gap-4 flex-wrap">
        ${_ptSeedRows.length ? `<button type="button" onclick="papanTanamAll(this)"
          class="no-print text-[10px] font-black uppercase tracking-widest px-3 py-2 rounded-xl border border-[#cfe3b4] bg-[#eef7e4] text-[#3f6b23] hover:bg-[#e3f0d4]"
          title="One signboard image per pre-nursery tray below, for the day the seeds went in. Each is the tray, the batch, the breed, how many were sown into it, the day it was sown and the month it is due to move out.">⬇ Papan Tanda · all ${fmtNum(_ptSeedRows.length)}</button>` : ''}
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} batch${rows.length === 1 ? '' : 'es'} · ${fmtNum(names.length)} supplier${names.length === 1 ? '' : 's'}</div>
        </div>
      </div>
      <div class="los-wrap">
        <table class="report-table los-table">
          <colgroup>${LOS_BREED_COL_WIDTHS.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
          <thead>
            <tr>
              <th rowspan="2">Seed In Date</th>
              <th rowspan="2">Batch</th>
              <th rowspan="2">Breed</th>
              <th colspan="4" class="los-grp">Seed In Details</th>
            </tr>
            <tr>
              <th>Seed Received (D/O) + FOC Qty</th>
              <th>Seed Damage</th>
              <th>Actual Planted</th>
              <th>Variance Seed In</th>
            </tr>
          </thead>
          <tbody>${bodyHtml}</tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="uppercase tracking-widest text-[10px] text-[#8a7a68]">Grand Total</td>
            <td class="text-[#c07820]">${fmtNum(grand.received)}</td>
            <td class="text-[#a83020]">${fmtNum(grand.damaged)}</td>
            <td>${fmtNum(grand.planted)}</td>
            <td>
              <div class="text-[#a83020]">${grand.varDown ? '−' + fmtNum(Math.abs(grand.varDown)) : '0'}</div>
              <div class="text-[#4a7a2e]">${grand.varUp ? '+' + fmtNum(grand.varUp) : '0'}</div>
            </td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
}

/* Where the SECOND header row has to stick.

   The first row's height is whatever its group bands come to once they have
   wrapped, which depends on the window's width and the reader's font — so it
   is measured after every render (and on resize) and written to the table as
   --los-head2, rather than guessed at in the stylesheet. The cells that span
   both rows live in the first row and stick at 0; being two rows tall, they
   cover the second row's line on their own. */
function _losStickyHeads() {
  document.querySelectorAll('#report-output .los-table').forEach(t => {
    const first = t.querySelector('thead tr');
    if (!first) return;
    t.style.setProperty('--los-head2', Math.round(first.getBoundingClientRect().height) + 'px');
  });
}
let _losResizeWired = false;
function _losWireSticky() {
  _losStickyHeads();
  /* And again once the web font has actually arrived. Measured against the
     fallback face the heading is a line shorter than it ends up, which would
     leave a strip of scrolling rows showing between the two header rows. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(_losStickyHeads);
  if (_losResizeWired) return;
  _losResizeWired = true;
  window.addEventListener('resize', _losStickyHeads);
}

/* Year and Supplier are offered from what the data actually holds, so there
   is never a dead selection. Rebuilt only when the set changes, and the
   current pick is kept if it is still on offer — otherwise switching report
   or re-running would silently clear a filter somebody had set. */
function _losSyncOptions(id, values, allLabel) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const have = [...sel.options].slice(1).map(o => o.value);
  if (have.length === values.length && have.every((v, i) => v === values[i])) return;
  const keep = sel.value;
  sel.innerHTML = `<option value="">${allLabel}</option>`
    + values.map(v => `<option value="${_losEsc(v)}">${_losEsc(v)}</option>`).join('');
  sel.value = values.includes(keep) ? keep : '';
}
function _losSyncYearOptions(years)       {
  _losSyncOptions('f-los-year', years, 'All years');
  // The year picker is filled from the data AFTER the page opens, so the
  // month's enabled state has to be settled again here or it would be stuck
  // at whatever it was before the years arrived.
  try { _losSyncMonthEnabled(); } catch (_) {}
}
function _losSyncSupplierOptions(suppliers) { _losSyncOptions('f-los-supplier', suppliers, 'All suppliers'); }
// ── Report menu ───────────────────────────────────────────────────────────
// One flat row — every report is a tab, no Category tier to click through
// first. label is what the tab shows; hint is the fuller description (e.g.
// "by Plot / Batch") kept as the button's title (a hover tooltip) instead
// of dropped.
/* ════════════════════════════════════════════════════════════════════════════
   LIFE OF PLOT

   One row per main-nursery plot, following the PLOT rather than the batch:
   every batch that was ever transplanted or transferred into it, what was
   culled, sold and moved out of it, and what is standing in it now. Click a
   plot to unfold its full history — every event in date order.

   Built from the SAME events the Movement Report's Main Nursery section
   reads, with the same rules, so a plot's Standing here and its balance
   there are the same number:
     · 3rd Culling counts only once evidenced (MapQty: keyed) — see the
       matching branch in runMovementReportCombined().
     · 2nd Culling never deducts (it is Tab 6's running snapshot, already
       inside the 3rd).
     · Stock calibrations count only once [APPROVED …].
     · Sales attach only to a plot·batch the plot actually carries, and a
       cancelled DO does not count. CAL-… calibration DOs DO count — same
       rule as Batch Detail Tab 6's Sales figure.
     Standing = transplanted in + transfer in − sold − 3rd culled
              − transfer out + stock adjustment  (netOfRow('main', …)).
════════════════════════════════════════════════════════════════════════════ */

let _lopDetailPool = [];   // per-plot event history for the unfold rows

const LOP_EVENT_LABELS = {
  transIn: 'Transplanted In',
  trIn:    'Transfer In',
  trOut:   'Transfer Out',
  cull3:   '3rd Culled',
  sold:    'Sold',
  adjust:  'Stock Adjustment',
};
const LOP_EVENT_CLS = {
  transIn: 'text-[#3a7ab4]', trIn: 'text-[#3a7ab4]',
  trOut: 'text-[#a83020]', cull3: 'text-[#a83020]',
  sold: 'text-[#4a7a2e]', adjust: 'text-[#7a4a10]',
};

function lopToggleDetail(idx) {
  const tr = document.getElementById('lop-detail-' + idx);
  const chev = document.getElementById('lop-chev-' + idx);
  if (!tr) return;
  tr.classList.toggle('hidden');
  if (chev) chev.style.transform = tr.classList.contains('hidden') ? '' : 'rotate(90deg)';
}
window.lopToggleDetail = lopToggleDetail;

async function runLifeOfPlot() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');
  _lopDetailPool = [];

  const toStr = document.getElementById('f-to').value;
  const toMs  = toStr ? new Date(toStr).getTime() + 86400000 : Infinity;
  // Locations chips: nothing ticked = every location — the same rule every
  // other report reads these chips with. PN never matches a plot, so it is
  // simply inert here.
  const selectedLocs = new Set(selectedNurseries());

  const [logsRes, dosRes, alsRes, plotsRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('transaction_type, transaction_date, created_at, remark, plot_name, batch_name, quantity_change, breed_name')
      // Seeds_Received is fetched only for its breed_name — the log is the
      // only thing that names a batch's breed (same note as Life of
      // Seedlings) — it is never an event of a plot's life.
      .in('transaction_type', ['Seeds_Received', 'Transplanted', 'Transplanted_Premium',
          'Transplanted_DoubleTone', '3rd_Culling', 'Cull3_Transfer',
          'Stock_Calibration'])
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('do_number, al_number, delivery_date, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_al_orders').select('al_number, customer_name')),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
  ]);
  if (logsRes.error || dosRes.error || plotsRes.error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load data.</div>`;
    return;
  }

  // Real plots only — a tray or a grade label is not a plot and has no row.
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  const locOfKey = {};
  Object.keys(plotToLoc).forEach(n => { locOfKey[_mvPlotKey(n)] = plotToLoc[n]; });
  const isPlot   = (name) => !!name && (_mvPlotKey(name) in locOfKey);
  const passLoc  = (name) => {
    if (!isPlot(name)) return false;
    return !selectedLocs.size || selectedLocs.has(locOfKey[_mvPlotKey(name)] || 'Unassigned');
  };

  // ── Which breed each batch is — from any log that names it, the
  //    Seeds_Received row usually. Also drives the Breed filter below. ──
  const batchBreed = {};
  (logsRes.data || []).forEach(l => {
    if (l.breed_name && l.batch_name) {
      const bk = _mvBatchKey(l.batch_name);
      if (bk && !batchBreed[bk]) batchBreed[bk] = l.breed_name;
    }
  });
  const breedFilter = (document.getElementById('f-breed') || {}).value || '';

  // ── Which supplier each batch's seeds came from — same Seeds_Received
  //    remark convention Life of Seedling parses (_RE_LOS_SUPPLIER),
  //    reused here rather than re-derived, so the two never drift apart on
  //    what counts as "the supplier". Also drives the Supplier filter
  //    below, and syncs the shared #f-los-supplier dropdown's own options
  //    to whatever suppliers are actually in THIS run's data. ──
  const batchSupplier = {};
  (logsRes.data || []).forEach(l => {
    if (l.transaction_type !== 'Seeds_Received' || !l.batch_name) return;
    const bk = _mvBatchKey(l.batch_name);
    if (!bk || batchSupplier[bk]) return;
    const sup = (l.remark || '').match(_RE_LOS_SUPPLIER);
    if (sup && sup[1].trim()) batchSupplier[bk] = sup[1].trim();
  });
  _losSyncSupplierOptions([...new Set(Object.values(batchSupplier))].sort());
  const supplierFilter = (document.getElementById('f-los-supplier') || {}).value || '';

  // ── One row per plot; inside it, the same figures divided per batch
  //    (r.byBatch) plus the raw event list — both feed the unfold row. ──
  const rows = new Map();   // plot key → row
  const rowOf = (plotName) => {
    const k = _mvPlotKey(plotName);
    if (!rows.has(k)) rows.set(k, Object.assign(emptyRow('main'), {
      plot: plotName, loc: locOfKey[k] || 'Unassigned',
      batches: new Set(), first: null, last: null, events: [],
      byBatch: new Map(),   // batch key → per-batch totals, same columns
    }));
    return rows.get(k);
  };
  const addEvent = (plotName, batch, col, date, qty, label) => {
    if (!plotName || !qty) return;
    // As At cut-off: the plot's life up to that day, everything if unset.
    if (date && new Date(date).getTime() >= toMs) return;
    // Breed / Supplier filters: only that breed's or supplier's batches
    // count — the plot's figures become that batch attribute's share of
    // the plot, and a plot with none of it drops off the list entirely
    // (it renders only rows with events).
    if (breedFilter && batchBreed[_mvBatchKey(batch)] !== breedFilter) return;
    if (supplierFilter && batchSupplier[_mvBatchKey(batch)] !== supplierFilter) return;
    const r = rowOf(plotName);
    r[col] = (r[col] || 0) + qty;
    if (batch && batch !== '—') r.batches.add(batch);
    const ds = date ? String(date).slice(0, 10) : '';
    if (ds) {
      if (!r.first || ds < r.first) r.first = ds;
      if (!r.last  || ds > r.last)  r.last  = ds;
    }
    r.events.push({ date: ds, col, batch: batch || '—', qty, label: label || '' });
    // The same figure, kept per batch — what the unfold's "by batch"
    // breakdown rows read.
    const bk = _mvBatchKey(batch) || '—';
    if (!r.byBatch.has(bk)) r.byBatch.set(bk, Object.assign(emptyRow('main'), { batch: batch || '—', breed: batchBreed[bk] || '—', first: null, last: null }));
    const bb = r.byBatch.get(bk);
    bb[col] = (bb[col] || 0) + qty;
    if (ds) {
      if (!bb.first || ds < bb.first) bb.first = ds;
      if (!bb.last  || ds > bb.last)  bb.last  = ds;
    }
  };

  (logsRes.data || []).forEach(l => {
    const d = _logDate(l);
    const q = Math.abs(l.quantity_change || 0);
    const t = l.transaction_type;
    const b = l.batch_name;

    if (t === 'Transplanted' || t === 'Transplanted_Premium' || t === 'Transplanted_DoubleTone') {
      // Premium Care / Double Tone transplants usually land in a pre-nursery
      // tray, which is not a plot and has no row here; when one names a REAL
      // plot it counts like any other transplant in. passLoc() is the guard
      // either way.
      if (!passLoc(l.plot_name)) return;
      const src = (l.remark || '').match(/from tray \[([^\]]+)\]/i);
      const grade = t === 'Transplanted_Premium' ? 'Premium Care' : t === 'Transplanted_DoubleTone' ? 'Double Tone' : '';
      addEvent(l.plot_name, b, 'transIn', d, q,
        [src ? 'from tray ' + src[1] : '', grade].filter(Boolean).join(' · '));
      return;
    }
    if (t === '3rd_Culling') {
      // Only once evidenced — same MapQty rule as the Movement Report.
      if (!/MapQty:\s*\d+/.test(l.remark || '')) return;
      if (!passLoc(l.plot_name)) return;
      addEvent(l.plot_name, b, 'cull3', d, q, '');
      return;
    }
    if (t === 'Cull3_Transfer') {
      const from = (l.remark || '').match(/From:\s*\[([^\]|]+)\|/);
      if (passLoc(l.plot_name)) addEvent(l.plot_name, b, 'trIn', d, q, from ? 'from ' + from[1] : '');
      if (from && passLoc(from[1])) addEvent(from[1], b, 'trOut', d, q, 'to ' + l.plot_name);
      return;
    }
    if (t === 'Stock_Calibration') {
      const approved = (l.remark || '').match(/\[APPROVED by [^\]]+ on [^\]]+\]/);
      if (!approved || !passLoc(l.plot_name)) return;
      const signedQty = Number(l.quantity_change) || 0;
      if (!signedQty) return;
      let reason = (l.remark || '').replace(approved[0], '').trim();
      reason = reason.replace(/Report:\s*[^.]+?\s*\.\s*/i, '')
                     .replace(/Plot:\s*[^.]+?\s*\.\s*/i, '')
                     .replace(/Side:\s*(seed|plot)\s*\.\s*/i, '').trim();
      addEvent(l.plot_name, b, 'adjust', d, signedQty, reason);
      return;
    }
  });

  // ── Sales — only against a plot·batch the plot actually carries, so a
  //    typo'd DO line can't invent a plot. Cancelled DOs skipped; CAL-…
  //    calibration DOs count, same as Batch Detail Tab 6's Sales. ──
  const customerByAl = {};
  (alsRes.data || []).forEach(a => { if (a.al_number) customerByAl[a.al_number] = a.customer_name || ''; });
  (dosRes.data || []).forEach(dRec => {
    if (dRec.status === 'Cancelled' || (dRec.remark && dRec.remark.includes('[CANCELLED]'))) return;
    for (let i = 1; i <= 5; i++) {
      const qty = Number(dRec[`qty_${i}`] || 0);
      if (!qty) continue;
      const plot = dRec[`plot_${i}`];
      if (!passLoc(plot)) continue;
      const r = rows.get(_mvPlotKey(plot));
      if (!r) continue;
      const bk = _mvBatchKey(dRec[`batch_${i}`]);
      const batch = [...r.batches].find(x => _mvBatchKey(x) === bk);
      if (!batch) continue;   // this plot never carried that batch
      addEvent(r.plot, batch, 'sold', dRec.delivery_date || null, qty,
        ('DO ' + (dRec.do_number || '—') + (customerByAl[dRec.al_number] ? ' · ' + customerByAl[dRec.al_number] : '')));
    }
  });

  // ── Rows out, grouped by location in the nursery's own order ──
  const cmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  let list = [...rows.values()].filter(r => r.events.length);
  // Status filter, reread here as "does this plot currently have anything
  // standing" — Active = standing > 0, Completed = 0 or less (everything
  // that ever passed through it has since moved out, been culled, or sold).
  const statusFilter = (document.getElementById('f-los-status') || {}).value || '';
  if (statusFilter) {
    list = list.filter(r => statusFilter === 'active' ? netOfRow('main', r) > 0 : netOfRow('main', r) <= 0);
  }
  const locIdx = (loc) => {
    const i = NURSERY_ORDER.findIndex(x => _mvPlotKey(x) === _mvPlotKey(loc));
    return i === -1 ? NURSERY_ORDER.length : i;
  };
  list.sort((a, b) => (locIdx(a.loc) - locIdx(b.loc)) || cmp(a.loc, b.loc) || cmp(a.plot, b.plot));

  const esc = _losEsc;
  const cell = (v, cls) => `<td class="text-right ${v ? cls : 'text-[#8a7a68]'}">${v ? fmtNum(v) : '0'}</td>`;
  const grand = { transIn: 0, trIn: 0, trOut: 0, cull3: 0, sold: 0, adjust: 0, standing: 0 };

  let lastLoc = null;
  const body = list.map(r => {
    const standing = netOfRow('main', r);
    ['transIn','trIn','trOut','cull3','sold','adjust'].forEach(k => grand[k] += r[k] || 0);
    grand.standing += standing;

    const batches = [...r.batches].sort(cmp);
    const events = r.events.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const idx = _lopDetailPool.push(events) - 1;

    // The plot's figures DIVIDED PER BATCH — the same columns as the
    // parent row, one line per batch, so the plot's total reads as the
    // sum of the batch lines right under it. The raw event history
    // follows below it.
    const byBatch = [...r.byBatch.values()].sort((a, b) => cmp(a.batch, b.batch));
    const byBatchRows = byBatch.map(bb => {
      const st = netOfRow('main', bb);
      return `
              <tr>
                <td>
                  <div class="font-black text-[#3d2610]">${esc(bb.batch)}</div>
                  <div class="text-[9px] font-bold text-[#8a7a68]">${esc(bb.breed)}</div>
                </td>
                <td class="text-[#8a7a68] whitespace-nowrap">${fmtDate(bb.first)}</td>
                <td class="text-[#8a7a68] whitespace-nowrap">${fmtDate(bb.last)}</td>
                ${cell(bb.transIn, 'text-[#3a7ab4] font-black')}
                ${cell(bb.trIn, 'text-[#3a7ab4] font-black')}
                ${cell(bb.trOut, 'text-[#a83020] font-black')}
                ${cell(bb.cull3, 'text-[#a83020] font-black')}
                ${cell(bb.sold, 'text-[#4a7a2e] font-black')}
                <td class="text-right font-black ${st < 0 ? 'text-[#a83020]' : 'text-[#4a7a2e]'}">${fmtNum(st)}${bb.adjust ? `<div class="text-[9px] font-bold text-[#7a4a10]">adj ${fmtSigned(bb.adjust)}</div>` : ''}</td>
              </tr>`;
    }).join('');

    const detail = `
      <tr id="lop-detail-${idx}" class="hidden">
        <td colspan="10" style="background:#fdfaf4; padding:0.75rem 1rem 1rem;">
          <div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${esc(r.plot)} — by batch · ${byBatch.length} batch${byBatch.length === 1 ? '' : 'es'}</div>
          <table class="report-table" style="background:#fff; border:1px solid #e8dcc8; border-radius:12px; overflow:hidden; margin-bottom:0.9rem;">
            <thead><tr>
              <th style="width:140px;">Batch / Breed</th>
              <th style="width:120px;">First Activity</th>
              <th style="width:120px;">Latest Activity</th>
              <th class="text-right">Transplanted In</th>
              <th class="text-right">Transfer In</th>
              <th class="text-right">Transfer Out</th>
              <th class="text-right">3rd Culled</th>
              <th class="text-right">Sold</th>
              <th class="text-right">Standing</th>
            </tr></thead>
            <tbody>${byBatchRows}</tbody>
          </table>
          <div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">History — ${esc(r.plot)} · ${events.length} event${events.length === 1 ? '' : 's'}</div>
          <table class="report-table" style="background:#fff; border:1px solid #e8dcc8; border-radius:12px; overflow:hidden;">
            <thead><tr><th style="width:110px;">Date</th><th style="width:170px;">Event</th><th style="width:90px;">Batch</th><th class="text-right" style="width:90px;">Qty</th><th>Note</th></tr></thead>
            <tbody>${events.map(e => `
              <tr>
                <td>${fmtDate(e.date)}</td>
                <td class="font-black ${LOP_EVENT_CLS[e.col] || ''}">${LOP_EVENT_LABELS[e.col] || esc(e.col)}</td>
                <td class="font-black text-[#3d2610]">${esc(e.batch)}</td>
                <td class="text-right font-black ${LOP_EVENT_CLS[e.col] || ''}">${e.col === 'adjust' ? fmtSigned(e.qty) : fmtNum(e.qty)}</td>
                <td class="text-[10px] text-[#8a7a68]">${esc(e.label)}</td>
              </tr>`).join('')}</tbody>
          </table>
        </td>
      </tr>`;

    const locHeader = r.loc !== lastLoc
      ? `<tr style="background:#f3ede1"><td colspan="10" class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${esc(r.loc)}</td></tr>`
      : '';
    lastLoc = r.loc;

    return locHeader + `
      <tr class="cursor-pointer hover:bg-[#fdfaf4]" onclick="lopToggleDetail(${idx})" title="Click to unfold this plot's full history">
        <td>
          <div class="flex items-center gap-2">
            <svg id="lop-chev-${idx}" class="w-3 h-3 text-[#8a7a68] shrink-0" style="transition:transform .15s" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
            <span class="font-black text-[#3d2610]">${esc(r.plot)}</span>
          </div>
        </td>
        <td class="text-[10px] font-bold text-[#3d2610]">${batches.map(esc).join(', ') || '—'}</td>
        <td class="text-[#8a7a68] whitespace-nowrap">${fmtDate(r.first)}</td>
        <td class="text-[#8a7a68] whitespace-nowrap">${fmtDate(r.last)}</td>
        ${cell(r.transIn, 'text-[#3a7ab4] font-black')}
        ${cell(r.trIn, 'text-[#3a7ab4] font-black')}
        ${cell(r.trOut, 'text-[#a83020] font-black')}
        ${cell(r.cull3, 'text-[#a83020] font-black')}
        ${cell(r.sold, 'text-[#4a7a2e] font-black')}
        <td class="text-right font-black ${standing < 0 ? 'text-[#a83020]' : 'text-[#4a7a2e]'}">${fmtNum(standing)}${r.adjust ? `<div class="text-[9px] font-bold text-[#7a4a10]">adj ${fmtSigned(r.adjust)}</div>` : ''}</td>
      </tr>` + detail;
  }).join('');

  const scopeBits = [];
  scopeBits.push(toStr ? 'as at ' + fmtDate(toStr) : 'all dates');
  if (selectedLocs.size) scopeBits.push([...selectedLocs].join(', '));
  if (statusFilter) scopeBits.push(statusFilter === 'active' ? 'active only' : 'completed only');
  if (breedFilter) scopeBits.push(breedFilter);
  if (supplierFilter) scopeBits.push(supplierFilter);

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4 gap-4 flex-wrap">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Life of Plot</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(list.length)} plot${list.length === 1 ? '' : 's'} · ${scopeBits.join(' · ')}</div>
      </div>
      <div class="text-[10px] font-bold text-[#8a7a68] mb-3 no-print">Click a plot to unfold its full history — every transplant, transfer, culling and sale in date order.</div>
      <div style="overflow-x:auto;">
        <table class="report-table">
          <thead>
            <tr>
              <th>Plot</th>
              <th>Batches</th>
              <th>First Activity</th>
              <th>Latest Activity</th>
              <th class="text-right">Transplanted In</th>
              <th class="text-right">Transfer In</th>
              <th class="text-right">Transfer Out</th>
              <th class="text-right" title="Only 3rd Culling records with a keyed drone-map quantity count — same rule as the Nursery Report">3rd Culled</th>
              <th class="text-right" title="Delivery Note collection lines matched to this plot's own batches; cancelled DOs excluded, CAL-… calibration DOs included">Sold</th>
              <th class="text-right" title="Transplanted in + transfer in − sold − 3rd culled − transfer out + approved stock adjustment">Standing</th>
            </tr>
          </thead>
          <tbody>
            ${list.length ? body : `<tr><td colspan="10" class="py-10 text-[#8a7a68] text-center">No plot activity matches the selected filters.</td></tr>`}
          </tbody>
          ${list.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="4" class="uppercase tracking-widest text-[10px] text-[#8a7a68]">Total — ${fmtNum(list.length)} plot${list.length === 1 ? '' : 's'}</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(grand.transIn)}</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(grand.trIn)}</td>
            <td class="text-right text-[#a83020]">${fmtNum(grand.trOut)}</td>
            <td class="text-right text-[#a83020]">${fmtNum(grand.cull3)}</td>
            <td class="text-right text-[#4a7a2e]">${fmtNum(grand.sold)}</td>
            <td class="text-right ${grand.standing < 0 ? 'text-[#a83020]' : 'text-[#4a7a2e]'}">${fmtNum(grand.standing)}${grand.adjust ? `<div class="text-[9px] font-bold text-[#7a4a10]">adj ${fmtSigned(grand.adjust)}</div>` : ''}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>`;
}

// ── Report tabs ───────────────────────────────────────────────────────────
// f-report is a hidden input — the state the rest of the page reads
// (syncFilterVisibility, runReport, syncReportDefaults, …) exactly the way
// it read a <select>'s .value before. These tab buttons are just what keeps
// it in sync now, instead of a dropdown. Styled as one connected tab strip
// (.report-tab-bar / .report-tab, see <style>) — dividers between tabs and
// an underline on the active one, not separate pill buttons with gaps.
function renderReportTabs() {
  const rep  = document.getElementById('f-report').value;
  const wrap = document.getElementById('f-report-tabs');
  wrap.innerHTML = REPORTS.map(o => `
    <button type="button" onclick="selectReport('${o.value}')" title="${o.hint || ''}"
      class="report-tab${o.value === rep ? ' active' : ''}">${o.label}</button>

// Which report tab was last open, so a browser refresh comes back to it
// instead of always landing on Production Summary — see bootstrap().
const LAST_REPORT_KEY = 'mjm_reports_last_tab';
function _rememberReport(report) {
  try { localStorage.setItem(LAST_REPORT_KEY, report); } catch (e) { /* private mode, etc — just don't persist */ }
}

// The "As At" date is NOT remembered across visits any more — it was for a
// while, and the office overruled it: "Always show today's date at as at
// there." Opening the page and switching report tabs both land on today;
// a date somebody picks still survives re-running the same report.
// Today as LOCAL YYYY-MM-DD: toISOString() is UTC, which in Malaysia
// (UTC+8) is still yesterday for the whole early morning — the house
// _localISO rule (see CLAUDE.md on the audit cards).
function _reportsLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Same idea again, one level down — which Nursery Report sub-page (and its
// own Culling Stage / Breed / Locations filters) was open. A refresh used
// to always drop Seed In Report back to Summary Report with every filter
// cleared. Only restored on a REFRESH (see bootstrap()) — switching
// sub-reports by hand still resets via syncReportDefaults(). The As At
// date used to be remembered the same way; the office overruled that one
// (always today), and only the date.
const LAST_NURSERY_SUB_KEY = 'mjm_reports_last_nursery_sub';
const LAST_CULLING_STAGE_KEY = 'mjm_reports_last_culling_stage';
const LAST_BREED_KEY = 'mjm_reports_last_breed';
const LAST_LOCATIONS_KEY = 'mjm_reports_last_locations';
function _rememberNurserySub(sub) {
  try { localStorage.setItem(LAST_NURSERY_SUB_KEY, sub || ''); } catch (e) { /* private mode, etc — just don't persist */ }
}
function _rememberCullingStage(stage) {
  try { localStorage.setItem(LAST_CULLING_STAGE_KEY, stage || ''); } catch (e) { /* private mode, etc — just don't persist */ }
}
function _rememberBreed(breed) {
  try { localStorage.setItem(LAST_BREED_KEY, breed || ''); } catch (e) { /* private mode, etc — just don't persist */ }
}
function _rememberLocations(locs) {
