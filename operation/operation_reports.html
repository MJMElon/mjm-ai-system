let _ptRows = [];

const _ptDate = (d) => {
  if (!d) return '—';
  const x = new Date(d);
  if (isNaN(x)) return '—';
  return x.toLocaleDateString('en-MY', { day: '2-digit', month: 'short', year: 'numeric' })
          .toUpperCase().replace(/,/g, '');
};

/* A MONTH, with no day on it. The seed board goes up in the pre-nursery the
   day the seeds are sown, and the move out of the tray has not happened —
   it is three months away and the day is not yet a fact about anything. A
   date printed there would be a promise the board cannot keep, so the board
   says DEC 2026 and means it.

   Short, not December: the board is read from a distance and every line is
   set as large as it will go, so a month spelled out would shrink the line
   it is on and the one beside it. The rest of the board is already shouting
   in SEP and OCT. */
const _ptMonth = (d) => {
  if (!d) return '—';
  const x = new Date(d);
  if (isNaN(x)) return '—';
  return x.toLocaleDateString('en-MY', { month: 'short', year: 'numeric' })
          .toUpperCase().replace(/,/g, '');
};

/* THE PRE-NURSERY IS THREE MONTHS, and that is not a rule this file gets to
   invent. The auditor portal has drawn the papan tanda off it since it was
   written — `audit_papan_script.js` sets the Transplanting row from the
   planted month plus three, shows it as a month and a year, and the sign in
   the field reads that way. A second rule here would be a second answer on
   two boards nailed up a few metres apart.

   THE MONTH PLUS THREE, NOT THE DAY PLUS THREE MONTHS, and the difference
   is not pedantry — it is three months in twelve. Adding months to a DATE
   overflows when the month it lands in is shorter: 30 November plus three
   is 30 February, which JavaScript rolls into 2 March, so a tray sown on
   the 30th of November had a board reading MAR when the answer is FEB. The
   same goes for 31 January (MAY for APR) and 31 March (JUL for JUN).

   The office said it in the words that avoid all of it: the seed planted
   MONTH plus three months. So the day takes no part — the year and the
   month are read off the date and three is added to the month, and the
   first of a month can never overflow.

   Local time, not UTC: new Date('YYYY-MM-DD') parses as UTC midnight and
   drifts a day in a negative timezone, which on the 1st of a month moves
   the ANSWER by a whole month. Same reason the audit copy does it this way. */
const _PT_PN_MONTHS = 3;
const _ptMonthPlus = (iso, months) => {
  if (!iso) return '—';
  const [y, m] = String(iso).split('T')[0].split('-').map(Number);
  if (!y || !m) return '—';
  return _ptMonth(new Date(y, (m - 1) + (months || 0), 1));
};

async function _ptFonts() {
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.all(['900 240px Outfit', '900 128px Outfit',
                       '900 64px Outfit', '900 34px Outfit'].map(f => document.fonts.load(f)));
  } catch (e) { /* a font that will not load is still a board, just a plainer one */ }
}

/* Decoded once and kept, so twenty boards are twenty draws and one decode.
   It resolves to null rather than rejecting if the browser will not take
   it: a board with no mark on it is still the figures somebody needs, and
   a download that threw would be neither. */
let _ptLogoPromise = null;
function _ptLogoImage() {
  if (!_ptLogoPromise) {
    _ptLogoPromise = new Promise((ok) => {
      const im = new Image();
      im.onload  = () => ok(im);
      im.onerror = () => ok(null);
      im.src = _PT_LOGO_SRC;
    });
  }
  return _ptLogoPromise;
}

/* THE FILE IS TRIMMED TO THE MARK, so the board draws the whole of it and
   there is no crop. The GROUP tile it replaced was a square with a broad
   flat margin of green round the mark and had to be cropped to the framing
   the office drew; this one arrives already framed. ONE width is given and
   the height comes off the image, so the mark cannot be stretched — which
   is the one thing the office asked not to happen to it. */
const _ptLogoRatio = (im) => {
  const nw = (im && (im.naturalWidth || im.width)) || 0;
  const nh = (im && (im.naturalHeight || im.height)) || 0;
  return (nw && nh) ? nh / nw : 0;
};

function _ptLogo(ctx, im, x, y, w) {
  const r = _ptLogoRatio(im);
  if (!r) return;
  ctx.drawImage(im, x, y, w, w * r);
}

/* The board itself. Returns the canvas, so the preview and the download
   draw exactly the same thing rather than two nearly-identical copies. */
async function _ptDraw(r) {
  await _ptFonts();
  const logo = await _ptLogoImage();
  const c = document.createElement('canvas');
  c.width = _PT_W; c.height = _PT_H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, _PT_W, _PT_H);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  /* THE OFFICE DREW THE BOARD AND THESE ARE ITS OWN NUMBERS, measured off
     it: the margins, where each line sits, how big the type is and where
     the mark goes. They were an arrangement arrived at here before that;
     they are a specification now, which is why they are named constants in
     one place rather than spread down the drawing. _PT_LINE_STEP is the
     spacing the office asked to be followed and nothing else may set it —
     it used to be worked out from whatever room was left under the logo,
     so a change to the mark quietly changed the spacing of the lines. */
  const L = 60, R = 37;                         // left and right margin
  const _PT_PLOT_SIZE = 240, _PT_PLOT_BASE = 282;
  const _PT_RULE_Y = 294, _PT_RULE_H = 22;
  const _PT_LINE_SIZE = 128, _PT_LINE_1 = 486, _PT_LINE_STEP = 193;
  const _PT_LOGO_X = 1343, _PT_LOGO_Y = 96, _PT_LOGO_W = 598;

  _ptLogo(ctx, logo, _PT_LOGO_X, _PT_LOGO_Y, _PT_LOGO_W);
  /* AFTER the logo, never before: the mark used to paint its own text and
     leave a white fill behind it, so ink set first drew a white board on
     white. It no longer does, and the order stays anyway — the ink belongs
     with the type it is for. */
  ctx.fillStyle = _PT_INK;

  /* PLOT, with the rule under it that the board has always had. Shrunk if
     it would reach the logo: a transfer plot is "N18-R" and a longer one
     would otherwise run underneath the mark. */
  const plot = 'PLOT ' + String(r.plot || '—');
  const plotRoom = _PT_LOGO_X - 60 - L;
  let plotSize = _PT_PLOT_SIZE;
  ctx.font = '900 ' + plotSize + 'px Outfit, sans-serif';
  while (plotSize > 70 && ctx.measureText(plot).width > plotRoom) {
    plotSize -= 6;
    ctx.font = '900 ' + plotSize + 'px Outfit, sans-serif';
  }
  ctx.fillText(plot, L, _PT_PLOT_BASE);
  const plotW = ctx.measureText(plot).width;
  ctx.fillRect(L, _PT_RULE_Y, plotW, _PT_RULE_H);

  /* The five lines. A long breed name is SHRUNK to fit rather than wrapped
     or clipped: the board is read from a distance and a line that runs off
     the edge loses the end of the name, which is the part that tells two
     breeds apart.

     ONE WEIGHT for the whole block, and ONE CASE. The breed used to be set
     lighter than everything beside it and in its own mixed case, and at
     this size that does not read as one typeface in two weights — it reads
     as two fonts, which is what the office saw. Every other field on the
     board is upper case, the dates included, so the breed is too. */
  /* The labels are the OFFICE'S OWN, spaces included. They are not spaced
     evenly and the colons do not line up, and that is how the board they
     drew reads — a sign that is one word different from the one the office
     nails up is a sign somebody has to ask about. PLOT carries no colon,
     and JUMLAH TANAM carries no POKOK; both were there before and both
     went. */
  const lines = [
    ['BATCH    : ',      String(r.batch || '—')],
    ['JENAMA: ',         String(r.breed || '—').toUpperCase()],
    ['JUMLAH TANAM: ',   fmtNum(r.qty)],
    ['TARIKH TANAM  : ', _ptDate(r.planted)],
    /* The transplant board knows the day the seedlings moved, because it is
       drawn after they did. The SEED board does not: the move is three
       months off, so it carries a month and says so through `pindah`
       rather than through a second drawing. One board, two reports. */
    ['TARIKH PINDAH : ', r.pindah || _ptDate(r.date)]
  ];
  let y = _PT_LINE_1;
  lines.forEach(([label, value]) => {
    let size = _PT_LINE_SIZE;
    const fits = () => {
      ctx.font = '900 ' + size + 'px Outfit, sans-serif';
      return ctx.measureText(label + value).width <= _PT_W - L - R;
    };
    while (size > 44 && !fits()) size -= 4;
    ctx.font = '900 ' + size + 'px Outfit, sans-serif';
    ctx.fillText(label, L, y);
    ctx.fillText(value, L + ctx.measureText(label).width, y);
    y += _PT_LINE_STEP;
  });
  return c;
}

const _ptFileName = (r) =>
  ('papan-tanda-' + String(r.plot || 'plot') + '-' + String(r.batch || 'batch'))
    .replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-') + '.png';

async function _ptSave(c, name) {
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  if (!blob) throw new Error('the browser would not turn the board into a file');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  // Revoked on the next turn of the loop: revoking it in the same one can
  // cancel the download that was just started.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ═══ THE SEED BOARD ═══════════════════════════════════════════════════
   The same board, nailed up three months earlier.

   The office asked for one when the seeds go INTO the tray, not only when
   the seedlings come out of it: a pre-nursery tray stands for three months
   with nothing on it saying what is in it. So the Seed In Report draws it
   too, and it is the SAME drawing — `_ptDraw` — because two boards on two
   posts in one nursery that do not look alike are two boards somebody has
   to compare.

   ONE BOARD PER TRAY, PER DAY. The Planted log says which tray took how
   many and when; a batch sown into four trays is four boards, and a tray
   filled over two days is two, because what goes up at the tray is what is
   standing in THAT tray. Same shape as the transplant board, which merges
   a plot's rows for a day and makes one board of them.

   Every field is the Batch Record's own answer, read off the same rows the
   report above is drawn from:

     PLOT           the tray the Planted row names
     BATCH / JENAMA the batch and its breed
     JUMLAH TANAM   what was planted into that tray that day
     TARIKH TANAM   the day it was planted
     TARIKH PINDAH  that month plus three, as a MONTH — see _ptMonth.

   `_ptSeedRows` is kept apart from `_ptRows` rather than shared. They are
   two reports, and a board drawn off whichever list was filled last is how
   the Transplanting Report comes to hand out seed boards. */
let _ptSeedRows = [];

function _losSeedBoards(rows) {
  const merged = new Map();
  (rows || []).forEach(r => {
    (r.rec && r.rec.planted ? r.rec.planted : []).forEach(p => {
      const plot = String(p.place || '').trim();
      const day  = String(p.date || '').slice(0, 10);
      if (!plot || plot === '—') return;
      const k = r.batch + '\x01' + plot + '\x01' + day;
      const had = merged.get(k);
      if (had) { had.qty += p.qty || 0; return; }
      merged.set(k, {
        plot, batch: r.batch, breed: r.breed,
        qty: p.qty || 0,
        planted: day,
        pindah: _ptMonthPlus(day, _PT_PN_MONTHS),
      });
    });
  });
  const nat = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  return [...merged.values()].sort((a, b) =>
    String(b.planted).localeCompare(String(a.planted))
    || nat(a.batch, b.batch) || nat(a.plot, b.plot));
}

const _ptSeedName = (r) =>
  ('papan-tanam-' + String(r.plot || 'plot') + '-' + String(r.batch || 'batch') + '-' + String(r.planted || ''))
    .replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-') + '.png';

/* Every board a batch has, because a batch sown into four trays is four
   signs and nobody wants to press four buttons for one delivery. */
async function papanTanam(batch, btn) {
  const list = _ptSeedRows.filter(r => String(r.batch) === String(batch));
  if (!list.length) { alert('No planting rows for batch ' + batch + ', so there is no board to draw.'); return; }
  await _ptSaveMany(list, btn, _ptSeedName);
}

async function papanTanamAll(btn) {
  if (!_ptSeedRows.length) return;
  await _ptSaveMany(_ptSeedRows, btn, _ptSeedName);
}

/* One writer for both reports and both buttons. Browsers drop downloads
   fired in the same tick, so they are spaced — and the button says how far
   it has got, because twenty files is long enough for somebody to wonder
   whether anything is happening. */
async function _ptSaveMany(list, btn, name) {
  if (btn && btn.disabled) return;
  const label = btn ? btn.innerHTML : '';
  try {
    for (let i = 0; i < list.length; i++) {
      if (btn) { btn.disabled = true; btn.innerHTML = 'Saving ' + (i + 1) + ' of ' + list.length + '…'; }
      await _ptSave(await _ptDraw(list[i]), name(list[i]));
      if (i < list.length - 1) await new Promise(ok => setTimeout(ok, 350));
    }
  } catch (e) {
    alert('Could not make the papan tanda: ' + (e && e.message ? e.message : e));
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = label; }
  }
}

async function papanTanda(i) {
  const r = _ptRows[i]; if (!r) return;
  try { await _ptSave(await _ptDraw(r), _ptFileName(r)); }
  catch (e) { alert('Could not make the papan tanda: ' + (e && e.message ? e.message : e)); }
}

/* Every board on screen, one file each. Browsers drop downloads fired in
   the same tick, so they are spaced — and the button says how far it has
   got, because twenty files is long enough for somebody to wonder. */
async function papanTandaAll(btn) {
  if (!_ptRows.length) return;
  await _ptSaveMany(_ptRows, btn, _ptFileName);
}

/**
 * Transplanting Report
 *
 * One row per Transplanted / Transplanted_Premium / Transplanted_DoubleTone
 * log line: when it moved, where to, and — since a seedling is treated as
 * mature roughly 9 months after being put out — when it's due. Nursery-
 * filterable the same way Movement Report's Main Nursery section already is
 * — the same Locations chips, PN included (see runMovementReportCombined).
 */
async function runTransplantingReport() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');
  _mvDetailPool = [];

  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;
  const selectedLocs = new Set(selectedNurseries());

  const [logsRes, plotsRes, calRes, batchesRes] = await Promise.all([
    // Transplanted only — a move INTO a real main plot. Transplanted_Premium
    // and Transplanted_DoubleTone are pre-nursery-to-pre-nursery moves (into
    // the Premium Care / Double-Tone holding tray, not a plot), and don't
    // belong in a report titled Transplanting.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, transaction_date, created_at, remark, plot_name, quantity_change, breed_name')
      .eq('transaction_type', 'Transplanted')
      .order('id', { ascending: true })),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    // Approved Stock_Calibration adjustments filed against this report (Tab
    // 7's "Report:" field — see _parseCalibration() in
    // operation_batch_detail.html, same [APPROVED by … on …]/"Report:
    // X. Plot: Y." convention this file already reads for Movement Report's
    // Stock Adjustment column). Marks the Qty cell it applies to rather
    // than adding a column — a row with no matching calibration renders
    // exactly as before.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, plot_name, quantity_change, transaction_date, created_at, remark')
      .eq('transaction_type', 'Stock_Calibration')),
    // operation_batches has no breed_name column to fall back to (a
    // Transplanted row is sometimes saved without one of its own — see
    // batch 260/U4). Seeds_Received is the batch's own "Breed Variety"
    // field from Tab 1, written once when the batch is first set up
    // (see operation_batch_detail.html's reception-form save) — the
    // actual, reliable source of what a batch's breed is.
    //
    // transaction_date comes back with it for the papan tanda's TARIKH
    // TANAM: the Batch Record list's Planted Date is this same field, the
    // one keyed on Tab 1, and never the row's insert time.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, breed_name, transaction_date, created_at')
      .eq('transaction_type', 'Seeds_Received')
      .order('id', { ascending: true }))
  ]);
  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logsRes.error.message}</div>`;
    return;
  }

  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  const batchBreed = {};
  /* THE BATCH'S PLANTED DATE, for the papan tanda. A batch is meant to have
     exactly ONE Seeds_Received row and some have many — see the note on
     duplicate receptions in CLAUDE.md — so the newest wins, which is what
     the Seeds In form and the batch list already do. */
  const batchPlanted = {}, _bpStamp = {};
  (batchesRes.data || []).forEach(b => {
    if (b.breed_name) batchBreed[b.batch_name] = b.breed_name;
    const stamp = String(b.created_at || b.transaction_date || '');
    if (!(b.batch_name in _bpStamp) || stamp >= _bpStamp[b.batch_name]) {
      _bpStamp[b.batch_name] = stamp;
      batchPlanted[b.batch_name] = b.transaction_date || b.created_at || null;
    }
  });

  // Approved calibrations filed against the Transplanting report, keyed by
  // batch+plot so a row's Qty cell can be marked. Same [APPROVED by … on
  // …] / "Report: X. Plot: Y." remark convention _parseCalibration() reads
  // in operation_batch_detail.html — a lightweight read of the same shape,
  // not a shared function, since this file has no import from that one.
  const calByBatchPlot = {};
  /* AN AMENDMENT IS AN ENTRY OF ITS OWN, ON ITS OWN DATE.
     Batch 225 was transplanted long before December and amended IN
     December, and a December report that leaves the amendment out is
     short by it — the correction happened in December whatever month the
     seedlings went out. So each approved amendment becomes a line of this
     report, dated by the Stock Calibration rather than by the transplant,
     and falls inside whichever range covers that date. The transplant rows
     themselves are untouched: a record says what was keyed on the day. */
  const calEntries = [];
  (calRes.data || []).forEach(l => {
    const approved = (l.remark || '').match(/\[APPROVED by ([^\]]+) on ([^\]]+)\]/);
    if (!approved) return;
    let body = (l.remark || '').replace(approved[0], '').trim();
    const repMatch = body.match(/Report:\s*([^.]+?)\s*\.\s*/i);
    if (!repMatch || repMatch[1].trim().toLowerCase() !== 'transplanting') return;
    const plotMatch = body.match(/Plot:\s*([^.]+?)\s*\.\s*/i);
    const plot = plotMatch ? plotMatch[1].trim() : (l.plot_name || '');
    if (!plot) return;
    let reason = body.replace(repMatch[0], '');
    if (plotMatch) reason = reason.replace(plotMatch[0], '');
    reason = reason.replace(/Side:\s*(seed|plot)\s*\.\s*/i, '')
                    .replace(/Tray:\s*[^.]+?\s*\.\s*/i, '')
                    .replace(/TxTray:\s*[^.]+?\.?/i, '')
                    .replace(/TxMap:\S*/i, '')
                    .replace(/TxRow:\S*/i, '')
                    .trim();
    const k = _mvBatchKey(l.batch_name) + '::' + plot;
    const entry = {
      date: l.transaction_date || l.created_at,
      qty: Number(l.quantity_change) || 0,
      label: reason || ('Approved by ' + approved[1].trim())
    };
    (calByBatchPlot[k] = calByBatchPlot[k] || []).push(entry);
    // …and as an entry of its own, which is what becomes a line below.
    calEntries.push({ ...entry, batch: l.batch_name || '—', plot });
  });

  const maturityOf = (d) => {
    const dt = new Date(d);
    if (isNaN(dt)) return null;
    dt.setMonth(dt.getMonth() + 9);
    return dt.toISOString().slice(0, 10);
  };

  // A transplant can land in a pre-nursery tray (Premium Care / Double
  // Tone) rather than a main-nursery plot — those trays are never a row
  // in shared_plots, so plotToLoc[...] would silently fall through to
  // "Unassigned". PRE_NURSERY_PLOTS is the same list runMovementReport
  // already uses to recognise them; label them "PN" instead.
  const locOf = (plot) => PRE_NURSERY_PLOTS.includes(plot) ? 'PN' : (plotToLoc[plot] || 'Unassigned');
  const inView = (r) => {
    const ts = r.date ? new Date(r.date).getTime() : NaN;
    // A row with no usable date at all can't be placed within a chosen
    // range — leave it out rather than guess which month it belongs to.
    // toTs is midnight of the day AFTER "As At" — exclusive, so `>=` (not
    // `>`) is what actually excludes a date-only value dated exactly there
    // (see the same fix/comment in buildMovementSection above).
    if (from || to) { if (!isFinite(ts) || ts < fromTs || ts >= toTs) return false; }
    if (selectedLocs.size && !selectedLocs.has(r.nursery)) return false;
    if (breed && r.breed !== breed) return false;
    return true;
  };

  const txRows = (logsRes.data || []).map(l => {
    const date = _logDate(l);
    return {
      date, maturity: date ? maturityOf(date) : null,
      nursery: locOf(l.plot_name),
      plot: l.plot_name || '—', batch: l.batch_name || '—',
      breed: l.breed_name || batchBreed[l.batch_name] || '—',
      planted: batchPlanted[l.batch_name] || null,
      qty: Number(l.quantity_change || 0),
      cal: calByBatchPlot[_mvBatchKey(l.batch_name) + '::' + (l.plot_name || '')] || null
    };
  });

  /* The maturity of an amendment is the maturity of the seedlings it
     corrects, not nine months from the day somebody keyed the correction —
     they went into the ground when the transplant says they did. Taken from
     the LAST transplant of that plot, before any filtering, so a range that
     excludes the transplant does not blank the column. */
  const txMaturity = {};
  txRows.forEach(r => {
    const k = _mvBatchKey(r.batch) + '::' + r.plot;
    if (!txMaturity[k] || String(r.date || '') > String(txMaturity[k].date || '')) {
      txMaturity[k] = { date: r.date, maturity: r.maturity };
    }
  });

  /* AN AMENDMENT IS NOT A RECORD, SO IT IS NOT A ROW. The rows are what was
     keyed on the day and they stay exactly that. The amendment lands in the
     TOTAL, which is the one figure on this page that claims to be how many
     went out — and the Total carries a dotted underline saying so, with the
     date, the batch, the plot and the amount of each one on hover. */
  const amendInView = calEntries.filter(c => c.qty).map(c => ({
    date: c.date ? String(c.date).slice(0, 10) : null,
    maturity: (txMaturity[_mvBatchKey(c.batch) + '::' + c.plot] || {}).maturity || null,
    nursery: locOf(c.plot),
    plot: c.plot || '—', batch: c.batch,
    breed: batchBreed[c.batch] || '—',
    qty: c.qty
  })).filter(inView);

  let rows = txRows.filter(inView);

  // Several log rows for the same date/plot/batch are the same move keyed
  // in more than once (the same tray split across several rows at save
  // time, e.g.) — one line on this report, qty summed, rather than the
  // same date/plot/batch repeated with a different number each time.
  // Breed/maturity/nursery are all derived from date+plot+batch already,
  // so any row sharing that key already agrees on them — first one wins.
  const merged = new Map();
  rows.forEach(r => {
    const k = r.date + '\x01' + r.plot + '\x01' + r.batch;
    const existing = merged.get(k);
    if (existing) existing.qty += r.qty;
    else merged.set(k, { ...r });
  });
  rows = [...merged.values()];

  // Newest date first; same date, same plot sits together (natural order —
  // "B10" after "B9", not before it) instead of interleaving with whatever
  // other plots happened to share that date.
  const _tpNatCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  rows.sort((a, c) => String(c.date || '').localeCompare(String(a.date || '')) || _tpNatCmp(a.plot, c.plot));
  /* What the papan tanda buttons draw from — the rows as shown, after
     filtering, merging and sorting, so a board can never be made for a
     line the report is not showing. */
  _ptRows = rows;
  const recorded  = rows.reduce((s, r) => s + r.qty, 0);
  const amendNet  = amendInView.reduce((s, r) => s + r.qty, 0);
  const total     = recorded + amendNet;
  // Sorted the way the rows are, newest first, so the tooltip reads down in
  // the same direction as the table above it.
  const amendTip  = amendInView.slice()
    .sort((a, c) => String(c.date || '').localeCompare(String(a.date || '')) || _tpNatCmp(a.plot, c.plot))
    .map(a => ({ date: a.date, qty: a.qty, label: a.batch + ' · ' + a.plot }));

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Transplanting Report</h3>
        <div class="flex items-center gap-4 flex-wrap">
        ${rows.length ? `<button type="button" onclick="papanTandaAll(this)"
          class="no-print text-[10px] font-black uppercase tracking-widest px-3 py-2 rounded-xl border border-[#cfe3b4] bg-[#eef7e4] text-[#3f6b23] hover:bg-[#e3f0d4]"
          title="One signboard image per plot below, for the installation. Each is the plot, batch, breed, how many are standing in it and the two dates.">⬇ Papan Tanda · all ${fmtNum(rows.length)}</button>` : ''}
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} record${rows.length === 1 ? '' : 's'}${amendTip.length ? ' · ' + fmtNum(amendTip.length) + ' amendment' + (amendTip.length === 1 ? '' : 's') : ''}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Transplanting Date</th><th>Maturity Date</th><th>Location</th><th>Plot</th><th>Batch</th><th>Breed</th><th class="text-right">Qty</th><th class="no-print">Papan Tanda</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map((r, i) => `
              <tr>
                <td>${fmtDate(r.date)}</td>
                <td class="text-[#c07820] font-black">${fmtDate(r.maturity)}</td>
                <td class="font-black text-[#3a7ab4]">${r.nursery}</td>
                <td>${r.plot}</td>
                <td class="font-black">${r.batch}</td>
                <td>${r.breed}</td>
                ${r.cal && r.cal.length ? (() => {
                  const idx = _mvDetailPool.push({ title: 'Calibration', rows: r.cal }) - 1;
                  return `<td class="text-right font-black"><span class="cursor-help border-b border-dotted border-current"
                    onmouseenter="mvShowDetailTip(this, ${idx})" onmouseleave="mvHideDetailTip()">${fmtNum(r.qty)}</span></td>`;
                })() : `<td class="text-right font-black">${fmtNum(r.qty)}</td>`}
                <td class="no-print text-center"><button type="button" onclick="papanTanda(${i})"
                  class="text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded-lg border border-[#cfe3b4] bg-[#eef7e4] text-[#3f6b23] hover:bg-[#e3f0d4]"
                  title="The signboard for ${_losEsc(r.plot)} — batch ${_losEsc(r.batch)}, ${fmtNum(r.qty)} pokok.">⬇ PNG</button></td>
              </tr>`).join('') : `<tr><td colspan="8" class="text-center py-10 text-[#8a7a68]">No transplant records match the selected filters.</td></tr>`}
          </tbody>
          ${(rows.length || amendTip.length) ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="6" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            ${amendTip.length ? (() => {
              // The Total is the only figure here that is more than the rows
              // add up to, so it is the one that has to say so. Dotted, like
              // every other figure on this page that carries something
              // underneath it, with the date, batch, plot and amount of each
              // amendment on hover.
              const idx = _mvDetailPool.push({ title: 'Amendments in this total', rows: amendTip }) - 1;
              return `<td class="text-right text-[#3a7ab4]"><span class="cursor-help border-b border-dotted border-current"
                onmouseenter="mvShowDetailTip(this, ${idx})" onmouseleave="mvHideDetailTip()">${fmtNum(total)}</span></td>`;
            })() : `<td class="text-right text-[#3a7ab4]">${fmtNum(total)}</td>`}
            <td class="no-print"></td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

// Nursery Report → Culling Report: one row per log entry for whichever
// culling stage is picked (see #f-culling-stage) — 1st Culling always
// happens in a Pre-Nursery tray, 2nd/3rd in whichever main plot the batch
// is standing in by then, same PRE_NURSERY_PLOTS check Transplanting
// Report uses to tell the two apart.
const CULLING_STAGES = {
  '1st_Culling': 'First Culling',
  '2nd_Culling': 'Second Culling',
  '3rd_Culling': 'Third Culling',
};
async function runCullingReport() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  // '' (All Stages) is the default on a fresh visit — see syncReportDefaults()
  // — so the first thing anyone sees is every stage together; picking a
  // stage from the dropdown is what narrows it to just that one.
  const stage = (document.getElementById('f-culling-stage') || {}).value || '';
  const stageLabel = stage ? (CULLING_STAGES[stage] || stage) : 'Culling';
  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;
  const selectedLocs = new Set(selectedNurseries());

  const [logsRes, plotsRes, batchesRes] = await Promise.all([
    fetchAllRows(() => {
      let q = _supabase.from('shared_inventory_logs')
        .select('batch_name, transaction_date, created_at, remark, plot_name, quantity_change, breed_name, transaction_type');
      q = stage ? q.eq('transaction_type', stage) : q.in('transaction_type', Object.keys(CULLING_STAGES));
      return q.order('id', { ascending: true });
    }),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    // Same breed fallback Transplanting Report uses — operation_batches has
    // no breed_name column, and a culling log doesn't always carry its own.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, breed_name')
      .eq('transaction_type', 'Seeds_Received'))
  ]);
  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logsRes.error.message}</div>`;
    return;
  }

  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  const batchBreed = {};
  /* THE BATCH'S PLANTED DATE, for the papan tanda. A batch is meant to have
     exactly ONE Seeds_Received row and some have many — see the note on
     duplicate receptions in CLAUDE.md — so the newest wins, which is what
     the Seeds In form and the batch list already do. */
  const batchPlanted = {}, _bpStamp = {};
  (batchesRes.data || []).forEach(b => {
    if (b.breed_name) batchBreed[b.batch_name] = b.breed_name;
    const stamp = String(b.created_at || b.transaction_date || '');
    if (!(b.batch_name in _bpStamp) || stamp >= _bpStamp[b.batch_name]) {
      _bpStamp[b.batch_name] = stamp;
      batchPlanted[b.batch_name] = b.transaction_date || b.created_at || null;
    }
  });

  let rows = (logsRes.data || []).map(l => {
    const date = _logDate(l);
    const nursery = PRE_NURSERY_PLOTS.includes(l.plot_name) ? 'PN' : (plotToLoc[l.plot_name] || 'Unassigned');
    return {
      date, nursery,
      plot: l.plot_name || '—', batch: l.batch_name || '—',
      breed: l.breed_name || batchBreed[l.batch_name] || '—',
      qty: Number(l.quantity_change || 0),
      stage: l.transaction_type,
      // 3rd Culling only — same MapQty: gate Movement Report's Summary
      // uses for the identical reason: Tab 6 computes/saves a "fully
      // culled" figure the moment Alive reaches zero, whether or not
      // anyone has actually counted/photographed it. An un-evidenced
      // figure would otherwise show here on nothing more than a formula.
      hasMapQty: /MapQty:\s*\d+/.test(l.remark || '')
    };
  }).filter(r => {
    const ts = r.date ? new Date(r.date).getTime() : NaN;
    if (from || to) { if (!isFinite(ts) || ts < fromTs || ts >= toTs) return false; }
    if (selectedLocs.size && !selectedLocs.has(r.nursery)) return false;
    if (breed && r.breed !== breed) return false;
    // The MapQty gate is a 3rd Culling rule specifically — checked per row
    // so it still applies to just the 3rd Culling rows when All Stages is
    // showing 1st/2nd/3rd together.
    if (r.stage === '3rd_Culling' && !r.hasMapQty) return false;
    // A zero-qty row is furniture, not a record — nothing was culled, so
    // there's nothing to report, for any stage.
    if (!r.qty) return false;
    return true;
  });

  // Same date/plot/batch(/stage) collapses to one row, qty summed — see the
  // identical fix in runTransplantingReport() above. Stage joins the key so
  // an All-Stages view never merges e.g. a 1st and 2nd Culling on the same
  // day/plot/batch into one blended row.
  const merged = new Map();
  rows.forEach(r => {
    const k = r.date + '\x01' + r.plot + '\x01' + r.batch + '\x01' + r.stage;
    const existing = merged.get(k);
    if (existing) existing.qty += r.qty;
    else merged.set(k, { ...r });
  });
  rows = [...merged.values()];

  const _clNatCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  const _clByDatePlot = (a, c) => String(c.date || '').localeCompare(String(a.date || '')) || _clNatCmp(a.plot, c.plot);
  const total = rows.reduce((s, r) => s + r.qty, 0);
  const colCount = 6;
  const emptyRow = `<tr><td colspan="${colCount}" class="text-center py-10 text-[#8a7a68]">No ${stageLabel.toLowerCase()} records match the selected filters.</td></tr>`;
  const rowHtml = r => `
              <tr>
                <td>${fmtDate(r.date)}</td>
                <td class="font-black text-[#3a7ab4]">${r.nursery}</td>
                <td>${r.plot}</td>
                <td class="font-black">${r.batch}</td>
                <td>${r.breed}</td>
                <td class="text-right font-black">${fmtNum(r.qty)}</td>
              </tr>`;

  // All Stages — grouped into a section per stage, fixed 1st/2nd/3rd order
  // (not busiest-first the way Seed In Report orders suppliers: these are
  // three fixed categories, not an open list), each with its own subtotal
  // row and one grand total at the end — same shape _losSupplierHtml() and
  // Sales Listing use for their own groups. A single stage stays the plain
  // flat table it always was; the grouping only matters once more than one
  // stage is on screen at a time.
  const isAll = !stage;
  let bodyHtml;
  if (isAll) {
    const byStage = {};
    rows.forEach(r => { (byStage[r.stage] = byStage[r.stage] || []).push(r); });
    bodyHtml = Object.keys(CULLING_STAGES).filter(s => (byStage[s] || []).length).map(s => {
      const list = byStage[s].slice().sort(_clByDatePlot);
      const stageTotal = list.reduce((sum, r) => sum + r.qty, 0);
      const label = CULLING_STAGES[s] || s;
      return `
      <tr style="background:#f3ede1"><td colspan="${colCount}" class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${label}</td></tr>
      ${list.map(rowHtml).join('')}
      <tr style="background:#fdfaf4">
        <td colspan="${colCount - 1}" class="text-right font-black text-[10px] uppercase tracking-widest text-[#8a7a68]">Subtotal — ${label}</td>
        <td class="text-right font-black text-[#3a7ab4]">${fmtNum(stageTotal)}</td>
      </tr>`;
    }).join('') || emptyRow;
  } else {
    rows.sort(_clByDatePlot);
    bodyHtml = rows.length ? rows.map(rowHtml).join('') : emptyRow;
  }

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">${stageLabel} Report</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} record${rows.length === 1 ? '' : 's'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Culling Date</th><th>Location</th><th>Plot</th><th>Batch</th><th>Breed</th><th class="text-right">Qty Culled</th>
          </tr></thead>
          <tbody>${bodyHtml}</tbody>
          ${rows.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="${colCount - 1}" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">${isAll ? 'Grand Total' : 'Total'}</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(total)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

/**
 * Sales Listing
 *
 * Table view: one row per Delivery Order collection line — the same
 * plot_N / qty_N / batch_N lines the batch report's own Sales figure reads,
 * with the same single-line-DO qty fallback — grouped by customer (read off
 * the linked Approval Letter, same as the DO List does it), with a subtotal
 * per customer and a grand total at the end. Unit Price also comes from the
 * AL (shared_al_orders.price_per_unit — the price the sales website order
 * carried through to the AL).
 *
 * Chart view reuses runSeedlingSales() / _renderSalesChart from the old
 * Seedling Sales report, with one change: it now excludes CAL- calibration
 * DOs too, same as the Table view, so the two match — a month's Chart bar
 * and its Table "Total Sold" used to disagree by whatever CAL- volume fell
 * in that month, which is the same reason the 3rd Culling Sales figure
 * elsewhere in this system counts CAL- as a sale ("what is left in the
 * plot") while this listing doesn't (it's asking what customers actually
 * ordered, the same question operation_stock_sales.js's Order & Collection
 * dashboard asks).
 */
async function runSalesListing() {
  if (_salesViewMode === 'chart') return runSeedlingSales();

  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;
  const selectedLocs = new Set(selectedNurseries());

  const [dosRes, alsRes, plotsRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('id, do_number, al_number, delivery_date, total_qty, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_al_orders').select('al_number, customer_name, price_per_unit')),
    _supabase.from('shared_plots').select('plot_name, nursery_name')
  ]);
  if (dosRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load delivery records: ${dosRes.error.message}</div>`;
    return;
  }

  const alByNumber = {};
  (alsRes.data || []).forEach(a => { if (a.al_number) alByNumber[a.al_number] = a; });
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });

  // ── Flatten every DO into its individual collection lines ──
  const lines = [];
  (dosRes.data || []).forEach(d => {
    if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
    if (/^CAL-/i.test(d.do_number || '')) return; // a stock correction, not a customer sale
    const ts = d.delivery_date ? new Date(d.delivery_date).getTime() : NaN;
    // toTs is midnight of the day AFTER "As At" — exclusive (see the same
    // fix/comment in buildMovementSection/runTransplantingReport above).
    if (from || to) { if (!isFinite(ts) || ts < fromTs || ts >= toTs) return; }

    let filled = 0;
    for (let i = 1; i <= 5; i++) if (String(d[`plot_${i}`] || '').trim()) filled++;

    const al = d.al_number ? alByNumber[d.al_number] : null;
    const customer   = (al && al.customer_name) || d.remark || 'Unknown';
    const unitPrice  = al ? Number(al.price_per_unit || 0) : null;

    for (let i = 1; i <= 5; i++) {
      const plot = d[`plot_${i}`];
      if (!String(plot || '').trim()) continue;
      let qty = Number(d[`qty_${i}`] || 0);
      // Same fallback the batch report's own Sales figure uses: a single-
      // line DO whose per-line qty was never keyed reads its total instead.
      const fallback = (!qty && filled === 1);
      if (fallback) qty = Number(d.total_qty || 0);
      if (!qty) continue;
      const loc = plotToLoc[plot] || 'Unassigned';
      if (selectedLocs.size && !selectedLocs.has(loc)) continue;
      lines.push({
        date: d.delivery_date, customer, doNumber: d.do_number,
        qty, nursery: loc, plot, batch: d[`batch_${i}`] || '—',
        unitPrice
      });
    }
  });

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  if (!lines.length) {
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No sales found for the selected filters.</div>`;
    return;
  }

  // ── Group by customer, ordered by whoever sold the most ──
  const byCustomer = {};
  lines.forEach(l => { (byCustomer[l.customer] = byCustomer[l.customer] || []).push(l); });
  const customers = Object.keys(byCustomer).sort((a, b) =>
    byCustomer[b].reduce((s, l) => s + l.qty, 0) - byCustomer[a].reduce((s, l) => s + l.qty, 0));

  const grandTotal  = lines.reduce((s, l) => s + l.qty, 0);
  const anyPriced   = lines.some(l => l.unitPrice != null);
  const grandAmount = lines.reduce((s, l) => s + (l.unitPrice != null ? l.unitPrice * l.qty : 0), 0);
  // Customer isn't its own column — it's the group-header row above each
  // customer's lines, so it never needed a column of its own.
  const colCount    = anyPriced ? 7 : 6;

  const rowsHtml = customers.map(cust => {
    const rows = byCustomer[cust].slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
    const custQty = rows.reduce((s, l) => s + l.qty, 0);
    const custAmt = rows.reduce((s, l) => s + (l.unitPrice != null ? l.unitPrice * l.qty : 0), 0);
    return `
      <tr style="background:#f3ede1"><td colspan="${colCount}" class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${cust}</td></tr>
      ${rows.map(l => `
        <tr>
          <td>${fmtDate(l.date)}</td>
          <td class="font-black text-[#3a7ab4]">${l.doNumber || '—'}</td>
          <td>${l.nursery}</td>
          <td>${l.plot}</td>
          <td>${l.batch}</td>
          <td class="text-right font-black">${fmtNum(l.qty)}</td>
          ${anyPriced ? `<td class="text-right">${l.unitPrice != null ? 'RM ' + fmtMoney(l.unitPrice) : '—'}</td>` : ''}
        </tr>`).join('')}
      <tr style="background:#fdfaf4">
        <td colspan="5" class="text-right font-black text-[10px] uppercase tracking-widest text-[#8a7a68]">Subtotal — ${cust}</td>
        <td class="text-right font-black text-[#4a7a2e]">${fmtNum(custQty)}</td>
        ${anyPriced ? `<td class="text-right font-black text-[#4a7a2e]">RM ${fmtMoney(custAmt)}</td>` : ''}
      </tr>`;
  }).join('');

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Sales Listing</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(lines.length)} line${lines.length === 1 ? '' : 's'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Collection Date</th><th>DO Number</th><th>Nursery</th><th>Plot</th><th>Batch</th>
            <th class="text-right">Sold Qty</th>${anyPriced ? '<th class="text-right">Unit Price</th>' : ''}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot><tr class="font-black bg-[#fdf3e6]">
            <td colspan="5" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total Sold</td>
            <td class="text-right text-[#4a7a2e]">${fmtNum(grandTotal)}</td>
            ${anyPriced ? `<td class="text-right text-[#4a7a2e]">RM ${fmtMoney(grandAmount)}</td>` : ''}
          </tr></tfoot>
        </table>
      </div>
    </div>
  `;
}

async function bootstrap() {
  await MJMAccess.load(_supabase);
  if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
  if (!MJMAccess.canAccess('reports')) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('report-area').classList.add('hidden');
    document.getElementById('forbidden').classList.remove('hidden');
    return;
  }
  // The Report tabs don't exist until renderReportTabs() builds them — do
  // that before anything reads f-report.value. Reopens whichever tab was
  // last selected (see selectReport()) — a refresh used to always land
  // back on Production Summary regardless of what was actually open.
  let DEFAULT_REPORT = 'life_of_seedlings';
  try {
    const remembered = localStorage.getItem(LAST_REPORT_KEY);
    if (remembered && REPORTS.some(r => r.value === remembered)) DEFAULT_REPORT = remembered;
  } catch (e) { /* private mode, etc — falls back to the plain default */ }
  document.getElementById('f-report').value = DEFAULT_REPORT;
  renderReportTabs();
  // Reopens whichever Nursery Report sub-page (and Culling Stage, if that
  // was it) was last open — see LAST_NURSERY_SUB_KEY above. Only applies
  // when the tab itself is Nursery Report; syncReportDefaults() already
  // resets both to Summary/All Stages on an actual tab switch, and that
  // rule stays untouched here.
  if (DEFAULT_REPORT === 'movement_report') {
    try {
      const rememberedSub = localStorage.getItem(LAST_NURSERY_SUB_KEY);
      const subEl = document.getElementById('f-nursery-sub');
      if (subEl && rememberedSub && NURSERY_SUB_REPORTS.some(r => r.value === rememberedSub)) {
        subEl.value = rememberedSub;
      }
    } catch (e) { /* private mode, etc — falls back to Summary */ }
    try {
      const rememberedStage = localStorage.getItem(LAST_CULLING_STAGE_KEY);
      const stageEl = document.getElementById('f-culling-stage');
      if (stageEl && rememberedStage != null && ['', ...Object.keys(CULLING_STAGES)].includes(rememberedStage)) {
        stageEl.value = rememberedStage;
      }
    } catch (e) { /* private mode, etc — falls back to All Stages */ }
  }

  // LOCAL today, never toISOString().slice(0,10) — that is UTC, which in
  // Malaysia (UTC+8) is still YESTERDAY for the whole early morning, so the
  // office opened the report at 8am and As At read the day before.
  const todayStr = _reportsLocalISO();
  const fTo = document.getElementById('f-to');
  // As At ALWAYS opens on today — the office asked for it in as many
  // words ("Always show today's date at as at there"), overruling the
  // earlier remember-across-refresh behaviour. A date somebody picks
  // still survives re-running the SAME report (runReport never touches
  // it); only opening the page, or switching report tabs, resets it.
  fTo.value = todayStr;
  // Reports look at what has actually happened — future dates make no
  // sense. f-from is hidden and derived from f-to (see runReport()), so
  // only f-to needs a bound.
  fTo.max = todayStr;
  await Promise.all([loadBreeds(), loadNurseryFilter()]);
  // Restores whichever Breed was last picked, loadBreeds() having just
  // built the option list fresh from shared_breeds — same "don't drop a
  // deliberate choice on refresh" rule as the date above.
  try {
    const rememberedBreed = localStorage.getItem(LAST_BREED_KEY);
    const breedEl = document.getElementById('f-breed');
    if (breedEl && rememberedBreed && [...breedEl.options].some(o => o.value === rememberedBreed)) {
      breedEl.value = rememberedBreed;
    }
  } catch (e) { /* private mode, etc — falls back to All Breeds */ }
  // Same rule as selectReport() — a fresh visit to Movement Report starts
  // with Locations unticked. A REFRESH is different: it restores whichever
  // Locations were last ticked, same as the sub-report/date/breed above,
  // rather than clearing them out from under an unchanged page.
  if (DEFAULT_REPORT === 'movement_report') {
    let restoredLocs = null;
    try {
      const raw = localStorage.getItem(LAST_LOCATIONS_KEY);
      if (raw) restoredLocs = JSON.parse(raw);
    } catch (e) { /* private mode, malformed save, etc — falls back below */ }
    if (Array.isArray(restoredLocs)) {
      document.querySelectorAll('.f-nurs-cb').forEach(cb => { cb.checked = restoredLocs.includes(cb.value); });
    } else {
      document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false);
    }
  }
  _setSalesView('table');
  document.getElementById('f-mode-table').addEventListener('click', () => { _setSalesView('table'); runReport(); });
  document.getElementById('f-mode-chart').addEventListener('click', () => { _setSalesView('chart'); runReport(); });
  document.addEventListener('change', e => {
    if (e.target && e.target.classList.contains('f-nurs-cb')) _rememberLocations(selectedNurseries());
    if (e.target && (e.target.classList.contains('f-yr-cb') || e.target.classList.contains('f-nurs-cb'))) runReport();
  });
  syncFilterVisibility();
  runReport();
}

    tipLabel: x => x.dono + ' · ' + x.batch + ' · ' + x.place,
    cols: [_losCol.date, _losCol.dono, _losCol.batch, _losCol.nursery, _losCol.plot,
      { ..._losQty('Sold', 'text-[#4a7a2e] font-black'), sum: x => x.qty }],
    roll: x => x.nursery },
  calibration: { title: 'Stock Calibration', list: 'calibration',
    tipLabel: x => x.batch + ' · ' + x.place + (x.approved ? '' : ' (waiting)'),
    // A waiting adjustment is listed but not counted, the same way the
    // Balance column leaves it out.
    tipSum: x => x.approved ? x.qty : 0,
    cols: [_losCol.date, _losCol.batch, { label: 'Report', get: x => _losEsc(x.report) },
      _losCol.place, { label: 'Side', get: x => _losEsc(x.side) },
      { label: 'Approved', get: x => x.approved
          ? '<span class="text-[#4a7a2e] font-black">Yes</span>'
          : '<span class="text-[#c07820] font-black">Waiting</span>' },
      _losCol.note,
      { label: 'Adjustment', num: true, cls: 'font-black', get: x => fmtSigned(x.qty),
        // Only approved adjustments move the batch's figures, so only those
        // are totalled — the waiting ones are listed but not counted, which
        // is exactly what the Balance column does with them.
        sum: x => x.approved ? x.qty : 0 }] },
};

/* The records behind one figure, for one batch or for all of them. */
function _losDrillCollect(kind, batch) {
  const D = window._losData; if (!D) return [];
  const rows = batch === '*' ? D.rows : D.rows.filter(r => r.batch === batch);
  const spec = LOS_DRILL[kind];
  if (!spec) return [];
  const out = [];
  rows.forEach(r => {
    if (spec.list === 'cullTotal') {
      // 1st + 3rd, and never the 2nd — the same rule the column itself is
      // totalled by, so the window and the figure it opened from can never
      // disagree.
      out.push(...r.rec.cull1);
      out.push(...r.rec.cull3);
    } else if (spec.list === 'cull1Main' || spec.list === 'cull1Dtone') {
      // The 1st culling split by the tray it happened in, the same test the
      // figures themselves are built on.
      const wantDtone = spec.list === 'cull1Dtone';
      r.rec.cull1.forEach(x => {
        if ((_losTrayKey(x.place) === 'DOUBLETONE') === wantDtone) out.push(x);
      });
    } else if (spec.list === 'transMain' || spec.list === 'transDtone') {
      // One list, split by the tray the row came out of — exactly the test
      // the figures themselves are built on, so a window can never show
      // rows its own column is not counting.
      const wantDtone = spec.list === 'transDtone';
      r.rec.trans.forEach(x => {
        if ((_losTrayKey(x.from) === 'DOUBLETONE') === wantDtone) out.push(x);
      });
    } else {
      out.push(...(r.rec[spec.list] || []));
    }
  });
  return out;
}

function _losDrillFilterBar(all) {
  const years = new Set(), months = new Set();
  all.forEach(x => {
    if (!x.date) return;
    const d = new Date(x.date);
    if (isNaN(d)) return;
    years.add(d.getFullYear()); months.add(d.getMonth());
  });
  if (!years.size) return '';
  const yearOpts = ['<option value="">All years</option>'].concat(
    [...years].sort((a, b) => b - a).map(y =>
      `<option value="${y}"${String(y) === String(_losDrillState.year) ? ' selected' : ''}>${y}</option>`)).join('');
  const monthOpts = ['<option value="">All months</option>'].concat(
    [...months].sort((a, b) => a - b).map(m =>
      `<option value="${m}"${String(m) === String(_losDrillState.month) ? ' selected' : ''}>${_LOS_MONTH_NAMES[m]}</option>`)).join('');
  return `
    <div class="flex items-center gap-2 flex-wrap mb-3">
      <span class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mr-1">Filter</span>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Year
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_losDrillSetFilter('year', this.value)">${yearOpts}</select>
      </label>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Month
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_losDrillSetFilter('month', this.value)">${monthOpts}</select>
      </label>
      ${(_losDrillState.year || _losDrillState.month !== '') ? `
        <button type="button" onclick="_losDrillClearFilter()" class="text-[10px] font-black text-[#a83020] uppercase tracking-widest hover:underline ml-1">Clear</button>` : ''}
    </div>`;
}
function _losDrillSetFilter(key, value) { _losDrillState[key] = value; _losDrillRender(); }
function _losDrillClearFilter() { _losDrillState.year = ''; _losDrillState.month = ''; _losDrillRender(); }

function _losDrillApplyFilter(all) {
  const y = _losDrillState.year, m = _losDrillState.month;
  if (!y && m === '') return all.slice();
  return all.filter(x => {
    if (!x.date) return false;
    const d = new Date(x.date);
    if (isNaN(d)) return false;
    if (y && d.getFullYear() !== Number(y)) return false;
    if (m !== '' && d.getMonth() !== Number(m)) return false;
    return true;
  });
}

/* Balance and Variance have no record list of their own — they are what other
   figures come to. Opening one shows the sum being done, line by line, so the
   number can be checked rather than taken on trust. */
/* The lines themselves, shared by the window and the tooltip so the two can
   never show a different sum for the same figure. */
function _losReconcileLines(kind, batch) {
  const D = window._losData; if (!D) return null;
  const rows = batch === '*' ? D.rows : D.rows.filter(r => r.batch === batch);
  const add = (k) => rows.reduce((s, r) => s + (r[k] || 0), 0);
  const parts = kind === 'variance'
    ? [['Seed received', add('received'), +1],
       ['Seed damage', add('damaged'), -1],
       ['Actual planted', add('planted'), 0]]
    : [['Transplant qty', add('trans'), +1],
       ['3rd culling (the 2nd never deducts)', add('postCull'), -1],
       ['Total sales', add('sales'), -1],
       ['Approved stock calibration', add('calibration'), +1]];
  return {
    parts,
    result: rows.reduce((s, r) => s + (kind === 'variance' ? r.variance : r.balance), 0),
    label: kind === 'variance' ? 'Variance seed in' : 'Balance',
    note: kind === 'variance'
      ? 'Actual planted less what arrived after damage. Negative means fewer seeds were planted than were received.'
      : 'What the batch still has standing in the field. The 1st culling is not taken off: it happens in the TRAY, before any of these seedlings go out, so the transplant quantity is already net of it and subtracting it again would subtract it twice. The 2nd culling never deducts either — the 3rd is keyed against the original transplanted figure and already contains it. An approved stock calibration does count, added or deducted as it was keyed; one nobody has approved counts for nothing. What is NOT in this figure is whatever is still sitting in a tray — that is what the Pre-Nursery filter answers. Transfers take no part either: a 3rd-culling transfer moves seedlings between two plots of the SAME batch, so it changes where the batch is standing and not how many of it there are.'
  };
}

function _losReconcile(kind, batch) {
  const L = _losReconcileLines(kind, batch); if (!L) return '';
  return `
    <div class="text-[10px] font-bold text-[#8a7a68] mb-3">${L.note}</div>
    <table class="report-table w-full">
      <thead><tr><th>Line</th><th class="text-right">Qty</th></tr></thead>
      <tbody>
        ${L.parts.map(([label, v, sign]) => `
          <tr>
            <td>${sign === 0 ? '' : (sign > 0 ? '+ ' : '− ')}${label}</td>
            <td class="text-right ${sign < 0 ? 'text-[#a83020]' : ''} font-black">${fmtNum(v)}</td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr class="font-black bg-[#f8f4ec]">
        <td class="uppercase tracking-widest text-[10px] text-[#8a7a68]">${L.label}</td>
        <td class="text-right ${L.result < 0 ? 'text-[#a83020]' : 'text-[#4a7a2e]'}">${
          kind === 'variance' ? fmtSigned(L.result) : fmtNum(L.result)}</td>
      </tr></tfoot>
    </table>`;
}

/* ── Point at a figure and its records appear ─────────────────────────────
   No click. The same records the drilldown window lists, in the same shape
   the Movement Report's own cells show theirs (see mvShowDetailTip) and in
   the same floating box — one tooltip element for the page, so two reports
   can never leave two of them on screen at once.

   A tooltip is a glance, not a table: it lists the most recent
   LOS_TIP_ROWS records, says how many more there are, and always ends on
   the total, which is the figure that was pointed at. Clicking opens the
   lot, filterable. Balance and Variance have no records of their own, so
   they show the sum being done instead — the same lines the window shows. */
const LOS_TIP_ROWS = 10;

function losShowTip(anchorEl, kind, batch) {
  const D = window._losData; if (!D) return;
  const tip = document.getElementById('mv-sales-tip'); if (!tip) return;
  const who = batch === '*'
    ? `${fmtNum(D.rows.length)} batch${D.rows.length === 1 ? '' : 'es'}`
    : 'Batch ' + batch;

  let html = '';
  if (kind === 'balance' || kind === 'variance') {
    const lines = _losReconcileLines(kind, batch);
    if (!lines) return;
    html = `<div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${
      _losEsc((kind === 'balance' ? 'Balance' : 'Variance Seed In') + ' — ' + who)}</div>`;
    lines.parts.forEach(([label, v, sign]) => {
      html += `<div class="flex items-baseline gap-3 py-0.5 text-[11px]">
        <span class="font-bold text-[#3d2610]">${sign === 0 ? '' : (sign > 0 ? '+ ' : '− ')}${_losEsc(label)}</span>
        <span class="ml-auto font-black ${sign < 0 ? 'text-[#a83020]' : 'text-[#3a7ab4]'}">${fmtNum(v)}</span>
      </div>`;
    });
    html += `<div class="flex items-baseline gap-3 border-t border-[#e8dcc8] mt-1.5 pt-1.5 text-[11px]">
      <span class="font-black text-[#3d2610] uppercase tracking-widest text-[9px]">${_losEsc(lines.label)}</span>
      <span class="ml-auto font-black ${lines.result < 0 ? 'text-[#a83020]' : 'text-[#4a7a2e]'}">${
        kind === 'variance' ? fmtSigned(lines.result) : fmtNum(lines.result)}</span>
    </div>`;
  } else {
    const spec = LOS_DRILL[kind]; if (!spec) return;
    const all = _losDrillCollect(kind, batch);
    if (!all.length) return;
    const sorted = all.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    const shown = sorted.slice(0, LOS_TIP_ROWS);
    // The total is of EVERY record, not just the ones that fitted — it has
    // to come back to the figure the pointer is on.
    const total = all.reduce((sum, x) => sum + (spec.tipSum ? spec.tipSum(x) : (x.qty || 0)), 0);
    html = `<div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${
      _losEsc(spec.title + ' — ' + who)} · ${fmtNum(all.length)} record${all.length === 1 ? '' : 's'}</div>`;
    shown.forEach(x => {
      const label = spec.tipLabel ? spec.tipLabel(x) : '';
      html += `<div class="flex items-baseline gap-2 py-0.5 text-[11px] whitespace-nowrap">
        <span class="font-bold text-[#8a7a68]">${fmtDate(x.date)}</span>
        ${label ? `<span class="font-bold text-[#3d2610] truncate max-w-[170px]">${_losEsc(label)}</span>` : ''}
        <span class="ml-auto font-black text-[#3a7ab4]">${
          kind === 'calibration' ? fmtSigned(x.qty) : fmtNum(x.qty)}</span>
      </div>`;
    });
    if (all.length > shown.length) {
      html += `<div class="text-[10px] font-bold text-[#8a7a68] py-0.5">… and ${
        fmtNum(all.length - shown.length)} more — click to see them all</div>`;
    }
    html += `<div class="flex items-baseline gap-2 border-t border-[#e8dcc8] mt-1.5 pt-1.5 text-[11px]">
      <span class="font-black text-[#3d2610] uppercase tracking-widest text-[9px]">Total</span>
      <span class="ml-auto font-black text-[#3a7ab4]">${
        kind === 'calibration' ? fmtSigned(total) : fmtNum(total)}</span>
    </div>`;
  }

  tip.innerHTML = html;
  tip.classList.remove('hidden');
  // Below the figure, clamped to the window; above it when there is no room
  // underneath — the same placement rule the Movement Report's own tooltip
  // follows, so the two behave identically.
  const a = anchorEl.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, a.left), window.innerWidth - t.width - 8);
  let top = a.bottom + 8;
  if (top + t.height > window.innerHeight - 8) top = Math.max(8, a.top - t.height - 8);
  tip.style.left = left + 'px';
  tip.style.top  = top + 'px';
}
function losHideTip() {
  const tip = document.getElementById('mv-sales-tip');
  if (tip) tip.classList.add('hidden');
}

function losDrill(kind, batch) {
  if (!window._losData) return;
  _losDrillState = { kind, batch, year: '', month: '' };
  _losDrillRender();
  const m = document.getElementById('los-drill-modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
}

function _losDrillRender() {
  const D = window._losData; if (!D) return;
  const { kind, batch } = _losDrillState;
  const who = batch === '*' ? `${fmtNum(D.rows.length)} batch${D.rows.length === 1 ? '' : 'es'}` : 'Batch ' + batch;

  if (kind === 'balance' || kind === 'variance') {
    document.getElementById('los-drill-title').textContent =
      (kind === 'balance' ? 'Balance' : 'Variance Seed In') + ' · ' + who;
    document.getElementById('los-drill-body').innerHTML =
      _losDrillVerNote(kind, batch) + _losReconcile(kind, batch);
    return;
  }

  const spec = LOS_DRILL[kind];
  if (!spec) return;
  const all  = _losDrillCollect(kind, batch);
  const list = _losDrillApplyFilter(all);
  list.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

  const totals = {};
  spec.cols.forEach((c, i) => { if (c.sum) totals[i] = list.reduce((s, x) => s + (c.sum(x) || 0), 0); });

  // A roll-up across nurseries or culling stages, where the figure is made of
  // records from more than one — the same at-a-glance split the Movement
  // Report gives a column.
  let rollHtml = '';
  if (spec.roll) {
    const roll = {};
    list.forEach(x => { const k = spec.roll(x) || '—'; roll[k] = (roll[k] || 0) + (x.qty || 0); });
    const entries = Object.entries(roll).sort((a, b) => b[1] - a[1]);
    if (entries.length > 1) {
      rollHtml = `<div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        ${entries.map(([n, q]) => `
          <div class="bg-[#f8f4ec] border border-[#e8dcc8] rounded-xl px-3 py-2">
            <div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest">${_losEsc(n)}</div>
            <div class="text-lg font-black text-[#3d2610]">${fmtNum(q)}</div>
          </div>`).join('')}
      </div>`;
    }
  }

  const filterNote = (_losDrillState.year || _losDrillState.month !== '')
    ? ` · filtered: ${_losDrillState.month !== '' ? _LOS_MONTH_NAMES[Number(_losDrillState.month)] : ''} ${_losDrillState.year || ''}`.trim()
    : '';

  document.getElementById('los-drill-title').textContent = spec.title + ' · ' + who;
  document.getElementById('los-drill-body').innerHTML =
    _losDrillVerNote(kind, batch) +
    _losDrillFilterBar(all) +
    `<div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${
       fmtNum(list.length)} record${list.length === 1 ? '' : 's'}${
       D.asAt ? ' · as at ' + fmtDate(D.asAt) : ''}${filterNote}</div>` +
    rollHtml +
    `<div class="overflow-x-auto">
      <table class="report-table w-full">
        <thead><tr>${spec.cols.map(c => `<th class="${c.num ? 'text-right' : ''}">${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${list.length ? list.map(x => `<tr>${spec.cols.map(c =>
            `<td class="${c.num ? 'text-right ' : ''}${c.cls || ''}">${c.get(x)}</td>`).join('')}</tr>`).join('')
            : `<tr><td colspan="${spec.cols.length}" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>`}
        </tbody>
        ${list.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
          ${spec.cols.map((c, i) => i === 0
            ? `<td class="uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>`
            : `<td class="${c.num ? 'text-right ' : ''}${c.cls || ''}">${
                 totals[i] != null ? (c.label === 'Adjustment' ? fmtSigned(totals[i]) : fmtNum(totals[i])) : ''}</td>`).join('')}
        </tr></tfoot>` : ''}
      </table>
    </div>`;
}

function closeLosDrill() {
  const m = document.getElementById('los-drill-modal');
  if (!m) return;
  m.classList.add('hidden');
  m.classList.remove('flex');
}

window.losDrill             = losDrill;
window.losShowTip           = losShowTip;
window.losHideTip           = losHideTip;
window.closeLosDrill        = closeLosDrill;
window._losDrillSetFilter   = _losDrillSetFilter;
window._losDrillClearFilter = _losDrillClearFilter;
</script>

<!-- Life of Seedlings drilldown — one window, reused by every figure on the report. -->
<div id="los-drill-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/60 p-4" onclick="if(event.target===this)closeLosDrill()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-6 py-4 border-b border-[#e8dcc8] bg-gradient-to-r from-[#f8f4ec] to-white">
      <div class="text-base font-black text-[#3d2610] uppercase tracking-widest" id="los-drill-title">Detail</div>
      <button onclick="closeLosDrill()" class="w-9 h-9 rounded-lg bg-[#e8dcc8]/60 hover:bg-[#e8dcc8] text-[#3d2610] text-xl leading-none flex items-center justify-center transition-colors">×</button>
    </div>
    <div class="p-5 overflow-y-auto" id="los-drill-body"></div>
  </div>
</div>


<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
