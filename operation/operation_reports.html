function selectReport(report) {
  document.getElementById('f-report').value = report;
  _rememberReport(report);
  // Movement Report starts with every Location unticked — picked fresh
  // each time, not left however they were from a previous report/visit.
  if (report === 'movement_report') document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false);
  renderReportTabs();
  syncReportDefaults();
  syncFilterVisibility();
  runReport();
}
window.selectReport = selectReport;

/* The first day of the same calendar month as the given YYYY-MM-DD date, in
   the same format. There's only one visible date control (f-to, "As At")
   now; a report that wants a period reads this as its implicit From rather
   than a second field the user has to pick — "as at 15 Sep" means "this
   month, up to the 15th", not "since the batch began". */
function monthStartOf(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  // Built from the LOCAL year/month, as a plain string — not
  // `new Date(y, m, 1).toISOString()`, which converts that local midnight to
  // UTC and rolls it back a calendar day for anyone east of UTC (Malaysia is
  // UTC+8): "As At 23 Sep" came out with a B/F cutoff of 31 Aug instead of
  // 1 Sep, one real day short.
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-01`;
}

async function runReport() {
  // f-from is a hidden field now — kept in sync with f-to's own month
  // right before every run, so every report function below can go on
  // reading document.getElementById('f-from').value exactly as before.
  const toEl = document.getElementById('f-to');
  const fromEl = document.getElementById('f-from');
  if (toEl && fromEl) fromEl.value = monthStartOf(toEl.value);
  const which = document.getElementById('f-report').value;
  if (which === 'life_of_seedlings') return runLifeOfSeedlings();
  if (which === 'life_of_plot') return runLifeOfPlot();
  if (which === 'movement_report') {
    const sub = (document.getElementById('f-nursery-sub') || {}).value || 'summary';
    if (sub === 'summary')       return runMovementReportCombined();
    if (sub === 'transplanting') return runTransplantingReport();
    if (sub === 'seed_in')       return runSeedInReport();
    if (sub === 'culling')       return runCullingReport();
  }
  if (which === 'sales_listing') return runSalesListing();
}

// ── Filter visibility by report type ─────────────────────────────────────────
function syncFilterVisibility() {
  const which        = document.getElementById('f-report').value;
  const isNurseryTab = (which === 'movement_report');
  // Which of the four reports inside Nursery Report — see
  // NURSERY_SUB_REPORTS. Only meaningful (and only shown) on that tab.
  const sub = isNurseryTab ? ((document.getElementById('f-nursery-sub') || {}).value || 'summary') : '';
  const isMovement = sub === 'summary';
  const isTrans    = sub === 'transplanting';
  // isLife is the standalone Life of Seedling tab — its own six-filter set
  // (.f-los + breed). isSeedIn (Nursery Report's Seed In sub-report) reads
  // the SAME underlying figures (_losBuildAllRows()) but filters the
  // simple way every other Nursery Report sub-report does — As At + Locations
  // + breed — so it joins isMovement/isTrans/isCulling below instead of
  // isLife's own filter group.
  const isLife     = (which === 'life_of_seedlings');
  // Life of Plot filters the simple way: As At (one day) + Locations chips.
  const isLifePlot = (which === 'life_of_plot');
  const isSeedIn   = sub === 'seed_in';
  const isCulling  = sub === 'culling';
  const isSales    = (which === 'sales_listing');
  // Sales Listing carries two views that want different filters: the Table
  // (line items) wants a date range + nurseries, the Chart (the year×month
  // trend the old Seedling Sales report drew) wants a set of years instead.
  const isSalesTable = isSales && _salesViewMode !== 'chart';
  const isSalesChart = isSales && _salesViewMode === 'chart';
  document.querySelectorAll('.f-nursery-sub-wrap').forEach(el   => el.classList.toggle('hidden', !isNurseryTab));
  document.querySelectorAll('.f-culling-stage-wrap').forEach(el => el.classList.toggle('hidden', !isCulling));
  const hasRange  = isMovement || isTrans || isSeedIn || isCulling || isSalesTable || isLifePlot;
  document.querySelectorAll('.f-range').forEach(el         => el.classList.toggle('hidden', !hasRange));
  // No visible From anywhere — every report is one "As At" date. Movement
  // Report still shows the Culled/Transplanted/Damaged/etc columns as that
  // period's activity only, not a running total since the batch began, but
  // the period is now the As-At date's own calendar month (derived in
  // runReport(), see monthStartOf()) rather than a second field to pick.
  // Balance stays a true running total regardless of the period, so it
  // still answers "what's actually there right now" — see
  // runMovementReportCombined().
  const toLabel = document.getElementById('f-to-label');
  if (toLabel) toLabel.textContent = 'As At';
  document.querySelectorAll('.f-sort').forEach(el          => el.classList.toggle('hidden', !isMovement));
  // Locations (PN / BNN / UNN 1 / UNN 2) drives Movement Report directly now
  // — which of those are checked decides whether the Pre-Nursery section,
  // the Main Nursery section, or both, render. Transplanting, Seed In,
  // Culling and Sales Listing (table view) use the same chips to filter
  // their own rows by destination nursery (Seed In's is always Pre-Nursery
  // in practice — see runSeedInReport() — but the same chip set asks the
  // same question every other sub-report does). Life of Seedling uses its
  // own Nursery Type filter instead (.f-los, below).
  document.querySelectorAll('.f-nursery-inline').forEach(el => el.classList.toggle('hidden', !(isMovement || isTrans || isSeedIn || isCulling || isSalesTable || isLifePlot)));
  document.querySelectorAll('.f-breed').forEach(el         => el.classList.toggle('hidden', !(isLife || isSeedIn || isTrans || isCulling || isLifePlot)));
  // 2nd/3rd Culling never happens in a Pre-Nursery tray — see
  // runCullingReport()'s own PRE_NURSERY_PLOTS comment: 1st Culling is the
  // only stage that is. The Pre-Nursery chip has nothing to filter for
  // either of those two, so it's hidden (and unticked, so a leftover tick
  // from 1st Culling/All Stages doesn't silently keep filtering through a
  // chip nobody can see) whenever one of them is picked.
  _cullingSyncPreNurseryChip(isCulling);
  /* Life of Seedling's own: nursery type and age (.f-los), status shared
     with Life of Plot (.f-los-shared), supplier for Life of Plot alone
     (.f-lifeplot). Its As At is its own, not the shared day picker, so
     .f-range is off for it. Seed In Report reads the shared day picker and
     Locations instead (both handled above), not this set. */
  document.querySelectorAll('.f-los').forEach(el           => el.classList.toggle('hidden', !isLife));
  document.querySelectorAll('.f-los-shared').forEach(el    => el.classList.toggle('hidden', !(isLife || isLifePlot)));
  document.querySelectorAll('.f-lifeplot').forEach(el      => el.classList.toggle('hidden', !isLifePlot));
  /* And its As At, which follows the Status beside it: a DAY while the
     question is what is still standing, a month and a year once the
     question is what finished and when. Never both — two As Ats on screen
     at once is two answers to one question. */
  const losDone = isLife && (document.getElementById('f-los-status') || {}).value === 'completed';
  document.querySelectorAll('.f-los-active').forEach(el    => el.classList.toggle('hidden', !(isLife && !losDone)));
  document.querySelectorAll('.f-los-done').forEach(el      => el.classList.toggle('hidden', !losDone));
  document.querySelectorAll('.f-sales-mode').forEach(el    => el.classList.toggle('hidden', !isSales));
  document.querySelectorAll('.f-sales-years').forEach(el   => el.classList.toggle('hidden', !isSalesChart));
}

// View mode (Table vs Chart) — used by Sales Listing; Table is the detailed
// line-item listing, Chart is the year×month trend the Seedling Sales report
// always drew (kept verbatim, see _renderSalesChart).
let _salesViewMode = 'table';
function _setSalesView(mode) {
  _salesViewMode = mode;
  const t = document.getElementById('f-mode-table');
  const c = document.getElementById('f-mode-chart');
  const active   = 'bg-[#3d2610] text-white';
  const inactive = 'text-[#3d2610]';
  t.className = `flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest ${mode === 'table' ? active : inactive}`;
  c.className = `flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest ${mode === 'chart' ? active : inactive}`;
  syncFilterVisibility();
}

// ── Nursery multi-select ─────────────────────────────────────────────────────
async function loadNurseryFilter() {
  const { data } = await _supabase.from('shared_plots').select('nursery_name');
  const names = new Set();
  (data || []).forEach(p => { if (p.nursery_name) names.add(p.nursery_name); });
  const wrap = document.getElementById('f-nursery-chips');
  wrap.innerHTML = '';
  // In the nursery's own order — PN, BNN, UNN 1, UNN 2 — not the alphabet's.
  // shared_plots never has a "Pre-Nursery" row (trays, not plots), so PN is
  // added by hand rather than found in the data — it's what a transplant
  // landing in a pre-nursery tray (Premium Care / Double Tone) is labelled,
  // see runTransplantingReport(), and this is how that gets filtered in or
  // out alongside BNN/UNN1/UNN2.
  const list = [...names].filter(n => !PRE_NURSERY_PLOTS.includes(n) && n !== 'Pre-Nursery');
  list.push('PN');
  list
    .sort((a, b) => nurseryRank(a) - nurseryRank(b) || String(a).localeCompare(String(b)))
    .forEach(n => {
    const safe = String(n).replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c]));
    // The chip's value stays "PN" — every wantPre/passMain/NURSERY_ORDER
    // check elsewhere keys off that exact string — only the label shown
    // to the reader spells it out.
    const label = n === 'PN' ? 'Pre-Nursery' : safe;
    const lbl = document.createElement('label');
    lbl.className = 'nursery-chip';
    // Own id so 2nd/3rd Culling can hide just this one chip — see
    // _cullingSyncPreNurseryChip() — without touching BNN/UNN1/UNN2.
    if (n === 'PN') lbl.id = 'f-nurs-chip-pn';
    lbl.innerHTML = `<input type="checkbox" class="f-nurs-cb" value="${safe}" checked>${label}`;
    wrap.appendChild(lbl);
  });
  document.getElementById('f-nurs-all').onclick  = () => { document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = true); };
  document.getElementById('f-nurs-none').onclick = () => { document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false); };
}
function selectedNurseries() {
  return [...document.querySelectorAll('.f-nurs-cb:checked')].map(cb => cb.value);
}

// Hides (and unticks) the Pre-Nursery Locations chip while Culling Report
// is showing 2nd Culling or 3rd Culling — see syncFilterVisibility()'s own
// call site for why. Shown again for 1st Culling, All Stages, or any other
// sub-report, unconditionally — nothing else hides this chip, so there's
// no other state to preserve or clobber.
function _cullingSyncPreNurseryChip(isCulling) {
  const chip = document.getElementById('f-nurs-chip-pn');
  if (!chip) return;
  const stage = (document.getElementById('f-culling-stage') || {}).value || '';
  const hidePN = isCulling && (stage === '2nd_Culling' || stage === '3rd_Culling');
  chip.classList.toggle('hidden', hidePN);
  if (hidePN) {
    const cb = chip.querySelector('.f-nurs-cb');
    if (cb && cb.checked) { cb.checked = false; _rememberLocations(selectedNurseries()); }
  }
}

/* Defaults that change with which report is now selected — run once per
   switch, not on every "Run Report" click, so re-running the same report
   never clobbers a date someone deliberately picked. */
const DATE_KEYED_REPORTS = new Set(['sales_listing', 'movement_report', 'life_of_plot']);
function syncReportDefaults() {
  const which = document.getElementById('f-report').value;
  if (DATE_KEYED_REPORTS.has(which)) {
    // f-from is derived from this in runReport() — nothing to set here.
    // LOCAL today, same reason as bootstrap(): toISOString is UTC and
    // reads as yesterday in Malaysia until 8am.
    document.getElementById('f-to').value = _reportsLocalISO();
  }
  // Plot is the more commonly checked default for both sections (see
  // buildMovementSection).
  if (_fSort && which === 'movement_report') _fSort.value = 'plot';
  // Nursery Report always opens on Summary (the old Movement Report) — a
  // fresh visit to the tab shouldn't land on whichever sub-report someone
  // was last looking at, same "fresh tab starts clean" rule as the date
  // reset above.
  if (which === 'movement_report') {
    const subEl = document.getElementById('f-nursery-sub');
    if (subEl) subEl.value = 'summary';
    // Culling Report opens on all three stages combined — a fresh visit
    // shouldn't hide 2nd/3rd Culling behind a stage nobody picked yet.
    // Narrowing to one stage only happens once someone actually chooses
    // it from this dropdown (see #f-culling-stage's change listener).
    const stageEl = document.getElementById('f-culling-stage');
    if (stageEl) stageEl.value = '';
  }
}

document.getElementById('f-run').addEventListener('click', runReport);
// The Report tabs call selectReport() directly on click (see their
// onclick=), which already does everything the old <select>'s 'change'
// listener did here — nothing left to wire up.
const _fSort = document.getElementById('f-sort');
if (_fSort) _fSort.addEventListener('change', runReport);
// Picking a different sub-report (or culling stage) changes which OTHER
// filters apply — Summary's Sort By, Seed In's month/year pickers, and so
// on — so this goes through syncFilterVisibility() first, same as the
// outer report tabs do, not straight to runReport() like f-sort above.
const _fNurserySub = document.getElementById('f-nursery-sub');
if (_fNurserySub) _fNurserySub.addEventListener('change', () => { _rememberNurserySub(_fNurserySub.value); syncFilterVisibility(); runReport(); });
const _fCullingStage = document.getElementById('f-culling-stage');
if (_fCullingStage) _fCullingStage.addEventListener('change', () => { _rememberCullingStage(_fCullingStage.value); syncFilterVisibility(); runReport(); });

// Closes the sidebar the moment Run Report is clicked, instead of leaving
// it open (and covering the results) until the mouse happens to wander
// off — see .mv-force-closed above. document.activeElement is blurred too:
// without it, #f-to (or whichever field was last focused) would keep the
// panel open via :focus-within even with the mouse gone and this class
// applied everywhere else.
document.getElementById('f-run').addEventListener('click', () => {
  document.getElementById('mv-report-sidebar').classList.add('mv-force-closed');
  document.activeElement?.blur();
});
['mv-sidebar-trigger', 'mv-report-sidebar'].forEach(id => {
  document.getElementById(id).addEventListener('mouseleave', () => {
    document.getElementById('mv-report-sidebar').classList.remove('mv-force-closed');
  });
});

/* Life of Seedlings' filters re-run on pick rather than waiting for Run
   Report — six dropdowns and a button to remember is five more chances to
   read a table that is answering the previous question. Status goes through
   syncFilterVisibility() first so the Year picker appears (or goes) in the
   same breath as the choice that governs it. */
/* As At is a year, optionally narrowed to a month — so a month on its own
   has nothing to narrow. _losAsAt() returns no cut-off at all without a year,
   which meant picking September under "All years" changed precisely nothing
   and the picker looked broken rather than inapplicable. A control that
   cannot do anything should not look settable, so the month is disabled
   until a year is chosen, and reset when the year goes back to All. */
function _losSyncMonthEnabled() {
  const y = document.getElementById('f-los-year');
  const m = document.getElementById('f-los-month');
  if (!y || !m) return;
  const off = !y.value;
  if (off && m.value) m.value = '';
  m.disabled = off;
  m.title = off ? 'Pick a year first — As At is a year, optionally narrowed to a month' : '';
  m.style.opacity = off ? '.55' : '';
}

['f-los-nursery', 'f-los-status', 'f-los-month', 'f-los-year', 'f-los-date',
 'f-los-age', 'f-los-verified', 'f-los-supplier', 'f-breed']
  .forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => {
      if (id === 'f-breed') _rememberBreed(el.value);
      if (id === 'f-los-year') _losSyncMonthEnabled();
      syncFilterVisibility(); runReport();
    });
  });

// ════════════════════════════════════════════════════════════════════════════
// Seedling Sales Report (year × month grid)
// ════════════════════════════════════════════════════════════════════════════
// Aggregates `shared_do_records.total_qty` by year and month of delivery_date,
// excluding cancelled DOs. Renders a year-by-year grid like the printed report,
// with a variance row at the bottom comparing the latest year to the previous.

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const _CHART_COLORS = ['#3a7ab4', '#c07820', '#4a7a2e', '#a83020', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ca8a04', '#0284c7', '#9333ea', '#dc2626'];

// Populate the year chip filter once the data has told us which years exist.
function _populateYearChips(years) {
  const wrap = document.getElementById('f-year-chips');
  if (!wrap) return;
  const existing = new Set([...wrap.querySelectorAll('input')].map(cb => cb.value));
  const incoming = new Set(years.map(String));
  // Only rebuild when the set of years actually changes
  if (existing.size === incoming.size && [...existing].every(v => incoming.has(v))) return;
  wrap.innerHTML = '';
  years.forEach(y => {
    const lbl = document.createElement('label');
    lbl.className = 'nursery-chip';
    lbl.innerHTML = `<input type="checkbox" class="f-yr-cb" value="${y}" checked>${y}`;
    wrap.appendChild(lbl);
  });
  document.getElementById('f-yr-all').onclick  = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = true);  };
  document.getElementById('f-yr-none').onclick = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = false); };
}
function _selectedYears() {
  return [...document.querySelectorAll('.f-yr-cb:checked')].map(cb => Number(cb.value));
}

// Simple SVG line chart of monthly sales, one line per selected year.
function _renderSalesChart(grid, years) {
  const W = 960, H = 460, PL = 60, PR = 20, PT = 30, PB = 50;
  const months = MONTHS_SHORT;
  const data = years.map(y => grid[y] || new Array(12).fill(0));
  const max = Math.max(1, ...data.flat());
  const niceMax = Math.ceil(max / 5000) * 5000 || max;
  const xStep = (W - PL - PR) / 11;
  const yPlot = (v) => PT + (H - PT - PB) * (1 - v / niceMax);
  const xPlot = (i) => PL + xStep * i;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:520px" preserveAspectRatio="xMidYMid meet">`;
  // Y gridlines + labels
  for (let i = 0; i <= 5; i++) {
    const y   = yPlot((niceMax * i) / 5);
    const val = Math.round((niceMax * i) / 5);
    svg += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e8dcc8" stroke-width="1"/>`;
    svg += `<text x="${PL - 10}" y="${y + 4}" text-anchor="end" fill="#8a7a68" font-size="11" font-weight="700">${fmtNum(val)}</text>`;
  }
  // X labels
  months.forEach((m, i) => {
    svg += `<text x="${xPlot(i)}" y="${H - PB + 22}" text-anchor="middle" fill="#3d2610" font-size="11" font-weight="700">${m}</text>`;
  });
  // Lines + dots
  data.forEach((vals, idx) => {
    const color = _CHART_COLORS[idx % _CHART_COLORS.length];
    const pts = vals.map((v, i) => `${xPlot(i)},${yPlot(v)}`).join(' ');
    svg += `<polyline points="${pts}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v, i) => {
      svg += `<circle cx="${xPlot(i)}" cy="${yPlot(v)}" r="4" fill="${color}"><title>${years[idx]} ${months[i]}: ${fmtNum(v)}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = years.map((y, i) => `
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white border border-[#e8dcc8] text-[11px] font-bold text-[#3d2610]">
      <span style="width:14px;height:14px;background:${_CHART_COLORS[i % _CHART_COLORS.length]};border-radius:3px;display:inline-block"></span>${y}
    </span>`).join('');

  return `<div class="flex flex-wrap gap-2 mb-4">${legend}</div>${svg}`;
}

async function runSeedlingSales() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const { data: dos, error } = await _supabase
    .from('shared_do_records')
    .select('delivery_date, total_qty, status, remark, do_number')
    .order('delivery_date', { ascending: true });

  if (error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load deliveries: ${error.message}</div>`;
    return;
  }

  // Build the full year × month grid (all years on record).
  const grid = {};
  (dos || []).forEach(d => {
    const cancelled = d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'));
    if (cancelled) return;
    // Same exclusion the Table view uses — a CAL- DO is a stock correction,
    // not a customer order, and Table/Chart are two views of the same
    // report so they need to agree on what counts as a sale.
    if (/^CAL-/i.test(d.do_number || '')) return;
    if (!d.delivery_date) return;
    const dt = new Date(d.delivery_date);
    if (isNaN(dt)) return;
    const y = dt.getFullYear();
    const m = dt.getMonth();
    if (!grid[y]) grid[y] = new Array(12).fill(0);
    grid[y][m] += Number(d.total_qty || 0);
  });

  const allYears = Object.keys(grid).map(Number).sort();
  if (!allYears.length) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No delivery records found.</div>`;
    return;
  }

  // Populate the year chip filter (idempotent — only rebuilds if the year set changed).
  _populateYearChips(allYears);

  // Years the user picked (default: every checkbox is checked on first load).
  let years = _selectedYears();
  if (!years.length) years = allYears;
  years.sort();

  const latest = years[years.length - 1];
  const prev   = years.length > 1 ? years[years.length - 2] : null;
  const rowTotal = (arr) => arr.reduce((s, v) => s + v, 0);

  // Year-by-year variance row (latest visible year vs the one before it).
  let varianceAbs = null, variancePct = null;
  if (prev != null) {
    varianceAbs = grid[latest].map((v, i) => v - grid[prev][i]);
    variancePct = grid[latest].map((v, i) => {
      const base = grid[prev][i];
      return (base === 0) ? null : ((v - base) / base) * 100;
    });
  }

  const fmtVarPct = (n) => (n == null) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cell = (n) => `<td class="text-right">${n === 0 ? '0' : fmtNum(n)}</td>`;
  const varCell = (n) => {
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${n > 0 ? '+' : ''}${fmtNum(n)}</td>`;
  };
  const varPctCell = (n) => {
    if (n == null) return `<td class="text-right text-[#8a7a68]">—</td>`;
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${fmtVarPct(n)}</td>`;
  };

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  const headerHtml = `
    <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
      <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seedlings Sales Report</h3>
      <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${years.length} year${years.length === 1 ? '' : 's'} · ${years[0]} – ${latest}</div>
    </div>`;

  const bodyHtml = (_salesViewMode === 'chart')
    ? _renderSalesChart(grid, years)
    : `
      <div class="overflow-x-auto">
        <table class="report-table sales-table">
          <colgroup>
            <col class="c-year">
            ${MONTHS_SHORT.map(() => '<col class="c-month">').join('')}
            <col class="c-total">
          </colgroup>
          <thead>
            <tr>
              <th>Year</th>
              ${MONTHS_SHORT.map(m => `<th class="text-right">${m}</th>`).join('')}
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${years.map(y => `
              <tr>
                <td class="font-black text-[#3d2610]">${y}</td>
                ${grid[y].map(v => cell(v)).join('')}
                <td class="text-right font-black text-[#3d2610]">${fmtNum(rowTotal(grid[y]))}</td>
              </tr>
            `).join('')}
            ${prev != null ? `
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">Variance<br><span class="text-[10px] font-bold text-[#8a7a68]">(${latest} vs ${prev})</span></td>
                ${varianceAbs.map(v => varCell(v)).join('')}
                ${varCell(rowTotal(varianceAbs))}
              </tr>
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">%</td>
                ${variancePct.map(p => varPctCell(p)).join('')}
                ${varPctCell(rowTotal(varianceAbs) / (rowTotal(grid[prev]) || 1) * 100)}
              </tr>
            ` : ''}
          </tbody>
        </table>
      </div>`;

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      ${headerHtml}
      ${bodyHtml}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════════════════
// Nursery Summary Report (per-nursery monthly movement for a chosen year)
// ════════════════════════════════════════════════════════════════════════════
// Per nursery (mapped via shared_plots.nursery_name + Pre-Nursery aliases):
//   Seeds In         = SUM(Seeds_Received)               — pre-nursery only
//   Transplanted In  = SUM(Transplanted*) into this nursery's plots
//   Transplanted Out = mirror of trans-in, credited to source nursery
//                      (best-effort: source assumed Pre-Nursery for transplants
//                      into Main; not perfectly resolvable from current schema)
//   Damaged          = ABS(SUM(Damaged_Seeds))
//   Culling          = ABS(SUM(1st/2nd/3rd_Culling))
//   Sold             = SUM(qty_n) on DO records, by plot_n's nursery (cancelled excluded)
//   Balance c/f      = Balance b/f + Seeds In + Trans In − Trans Out − Damaged − Culling − Sold

const PRE_NURSERY_PLOTS = ['Pre-Nursery', 'DOUBLE-TONE', 'PREMIUM CARE'];
const TRANSPLANT_TYPES  = ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'];

function ymKey(d) {
  if (!d) return null;
  const x = new Date(d);
  if (isNaN(x)) return null;
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`;
}


// ════════════════════════════════════════════════════════════════════════════
// Summary Report (group by Batch / Plot / Date)
// ════════════════════════════════════════════════════════════════════════════
// One universal column set; rows roll up to the chosen dimension:
//   By Plot  → one row per (Plot, Batch). Plot is shown once at the top of
//              each plot group, then individual batch rows underneath; a TOTAL
//              line closes each plot. Matches the supplied xlsx samples.
//   By Batch → one row per Batch (summed across plots).
//   By Date  → one row per calendar date.
//
// Columns: B/F · Seeds In · Planted · Transplanted · Premium · Double Tone ·
//          Damaged · 1st Cull · 2nd Cull · 3rd Cull · Sold · Closing
// B/F is the cumulative net of all transactions BEFORE the From date for the
// same (plot, batch) / batch / date key. Closing = B/F + inflow − outflow.

const SUMMARY_SKIP_TYPES = new Set([
  'Seed_Audit', 'Seed_Audit_Email', 'Seed_Audit_Note', 'Seed_Audit_Action',
  'Planting_Photo'
]);
// Stock_Calibration used to be skipped here too — now it's read by the
// Stock Adjustment branch below, so it has to actually reach the loop.

/* ── Reading a movement date out of a batch-report log ──────────────────────
   The batch report writes most movement rows WITHOUT transaction_date — the
   date the user keyed sits inside the remark instead:

     Transplanted / Premium / D-Tone  →  "... Date: 2026-03-04"
     1st Culling                      →  "... Date: 2026-03-04"
     2nd Culling                      →  "... CullDate: 2026-03-04"
     3rd Culling                      →  no date at all
     Seeds_Received / Planted         →  real transaction_date

   The report used to read transaction_date only, so every transplanting and
   culling row resolved to NaN and was skipped — which is why those columns
   read 0 while Sold (from the DO system, which does carry a date) did not.
   Resolve in the order the batch report actually records: the keyed date
   first, then the remark, then when the row was written. */
/* WHEN a ledger row happened: transaction_date, else a date written into the
   remark, else the created_at it was saved with. Not every row carries a
   transaction_date, and a row without one still belongs on a day.

   SHARED RULE. The FC Portal reads the same ledger to build its Transplanting
   Job list and carries its own copy — logDate() in
   src/modules/maintenance/transplantData.js, MJMElon/FC-Portal. Change one,
   change the other: that screen once narrowed by transaction_date in the
   query alone, PostgREST dropped every undated row, and a plot arrived on the
   phone carrying less than this report showed. */
const _RE_LOG_DATE = /(?:Cull)?Date:\s*(\d{4}-\d{2}-\d{2})/i;
function _logDate(l) {
  if (l.transaction_date) return String(l.transaction_date).slice(0, 10);
  const m = l.remark ? String(l.remark).match(_RE_LOG_DATE) : null;
  if (m) return m[1];
  return l.created_at ? String(l.created_at).slice(0, 10) : null;
}

/* Supabase caps a single request at 1000 rows. The movement report reads the
   whole ledger, so it has to page or it silently reports on a fraction of the
   batches. */
async function fetchAllRows(buildQuery, pageSize = 1000) {
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await buildQuery().range(from, from + pageSize - 1);
    if (error) return { data: null, error };
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return { data: all, error: null };
}

/* A delivery order's plot and batch are typed by hand: "225.", " 225",
   "U15 (UPB PREMIER HYBRID)". Read them the way the batch report reads them,
   so a D/O line lands on the row the batch report already has rather than
   inventing one of its own. */
function _mvPlotKey(v) {
  return String(v == null ? '' : v).trim().toUpperCase()
    .replace(/^PLOT\s*:?\s*/, '')
    .split(/[\s(,\[]/)[0]
    .replace(/[^0-9A-Z\-]/g, '');
}
/* A batch is identified by its trailing digits, exactly as the batch report
   identifies it — "MJM-225", "225." and " 225 " are all batch 225. Something
   with no trailing digits at all ("24D") identifies no batch and returns '',
   so it can never be matched to one. */
function _mvBatchKey(v) {
  // A parenthetical (or other) note after the number goes first — "232
  // (B13)" is batch 232, not batch 13. Left in, the trailing-digits rule
  // below reads the "13" inside the note instead of the real number,
  // which is exactly why B14-R's batch 232 sale wasn't matching: the DO
  // line had "232 (B13)" typed into its batch field. Same split _mvPlotKey
  // already uses for its own parenthetical notes.
  const noNote = String(v == null ? '' : v).trim().split(/[\s(,\[]/)[0];
  // Trailing punctuation next — "225." is still batch 225 — then the
  // digits it ends with.
  const cleaned = noNote.replace(/[^0-9A-Za-z]+$/, '');
  const m = /(\d+)$/.exec(cleaned);
  return m ? String(parseInt(m[1], 10)) : '';
}


/* ════════════════════════════════════════════════════════════════════════════
   MOVEMENT REPORT

   One report, two sections — Pre-Nursery and Main Nursery hold different
   things and move them in different ways, and a single table that tried to
   serve both left most of its columns empty on every row, so each still
   gets its own table. Which section(s) actually render is driven by the
   Locations chips: PN shows Pre-Nursery, any of BNN/UNN1/UNN2 shows Main
   Nursery, both together show both, stacked.

     Pre-nursery   keyed by TRAY · batch. Seeds are planted into a tray, some
                   are culled, and the rest leave — to a main-nursery plot, or
                   to the Premium Care / Double Tone trays.
     Main nursery  keyed by PLOT · batch. Seedlings arrive from pre-nursery,
                   are culled twice more, sold, or transferred plot to plot.

   runMovementReportCombined() fetches the ledger once and builds the shared
   lookups once; buildMovementSection(scope, …) is the engine that turns
   that into one section's table — a column spec says what each column is
   called, which way it moves the balance, and how it is coloured.
════════════════════════════════════════════════════════════════════════════ */

/* Nurseries read in the order the nursery works in, not the order the
   alphabet happens to put them in. Anything not named here follows after.
   PN (Pre-Nursery) leads — it's the first stage a batch passes through. */
const NURSERY_ORDER = ['PN', 'BNN', 'UNN 1', 'UNN 2'];
function nurseryRank(n) {
  const k = _mvPlotKey(n);
  const i = NURSERY_ORDER.findIndex(x => _mvPlotKey(x) === k);
  return i === -1 ? NURSERY_ORDER.length : i;
}

/* sign: how the column moves the balance. 0 means shown but not counted —
   see Seed Damage, which never entered a tray to begin with. */
const MOVE_COLS = {
  // Premium Care and Double Tone no longer get their own Transfer Out
  // columns here — a transplant into either is just Transplanted Out
  // from the source tray, same as any other transplant (see the
  // Transplanted_Premium/Transplanted_DoubleTone branch below). The
  // receiving side (a Premium Care/D-Tone tray filling up) already reads
  // as ordinary Transfer In, with nothing special to call out either.
  pre: [
    { key: 'trIn',     label: 'Transfer In',      sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'planted',  label: 'Planted',          sign: +1, cls: 'text-[#c07820]' },
    { key: 'damaged',  label: 'Seed Damage',      sign:  0, cls: 'text-[#a83020]' },
    { key: 'cull1',    label: '1st Culled',       sign: -1, cls: 'text-[#a83020]' },
    { key: 'transOut', label: 'Transplanted Out', sign: -1, cls: 'text-[#a83020]' },
  ],
  main: [
    { key: 'trIn',    label: 'Transfer In',           sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'transIn', label: 'Transplanted from PN',  sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'sold',    label: 'Sold',                  sign: -1, cls: 'text-[#a83020]' },
    { key: 'cull3',   label: '3rd Culled',            sign: -1, cls: 'text-[#a83020]' },
    { key: 'trOut',   label: 'Transfer Out',          sign: -1, cls: 'text-[#a83020]' },
    // Stock_Calibration's own quantity_change is already signed (a Found
    // is positive, a Stolen/over-allocation is negative) — sign: +1 adds
    // it exactly as stored, not a fixed direction like every other
    // column here. Only APPROVED adjustments are ever pushed as an event
    // to begin with — see the Stock_Calibration branch below — so this
    // column can never carry a pending, unapproved figure.
    { key: 'adjust',  label: 'Stock Adjustment',      sign: +1, cls: 'text-[#7a4a10]' },
  ],
};

const emptyRow = (scope) => MOVE_COLS[scope].reduce((a, c) => { a[c.key] = 0; return a; }, {});

/**
 * What a row's movements come to.
 *
 * 2nd Culled never deducts here, B/F included — 2nd Culling is Tab 6's own
 * live snapshot as a batch works through 3rd Culling, not a separate loss
 * on top of it, and it doesn't get its own column here either (see
 * MOVE_COLS.main). 3rd Culled — once evidenced (see the MapQty: check
 * below) — is the actual, standing deduction.
 */
function netOfRow(scope, b) {
  return MOVE_COLS[scope].reduce((s, c) => s + c.sign * (b[c.key] || 0), 0);
}

/* "2 months". Age is measured from the batch's own planting date, so it reads
   the same whether the batch is still in a tray or long since out in a plot. */
function ageLabel(planted) {
  if (!planted) return '—';
  const d = new Date(planted);
  if (isNaN(d.getTime())) return '—';
  const now = new Date();
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m--;
  if (m < 0) m = 0;
  return m + (m === 1 ? ' month' : ' months');
}

// Every movement column's hover-tooltip data — Sold (Date/DO
// Number/Customer/Qty) and Transfer In / Transplanted from PN / 3rd
// Culled / Transfer Out (Date/label/Qty) — pooled across the whole run
// and referenced by index from each cell's markup. See fmtDetailCell()
// in buildMovementSection() and mvShowDetailTip() below.
let _mvDetailPool = [];

function mvShowDetailTip(anchorEl, idx) {
  const entry = _mvDetailPool[idx];
  if (!entry || !entry.rows || !entry.rows.length) return;
  const sorted = entry.rows.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  const total = sorted.reduce((s, r) => s + (r.qty || 0), 0);
  const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  let html = `<div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${esc(entry.title)} — ${sorted.length} record${sorted.length === 1 ? '' : 's'}</div>`;
  sorted.forEach(r => {
    // Sold rows carry doNumber/customer (their own two-colour layout,
    // matching Tab 6's own Sales tooltip); every other column carries a
    // plain label instead ("B13", "Tray PREMIUM CARE") — or none at all
    // (3rd Culled: just date and qty), in which case that span is left
    // out rather than printed empty.
    html += (r.doNumber != null) ? `
      <div class="flex items-baseline gap-2 py-0.5 text-[11px] whitespace-nowrap">
        <span class="font-black text-[#3a7ab4]">${esc(r.doNumber)}</span>
        <span class="font-bold text-[#8a7a68]">${fmtDate(r.date)}</span>
        <span class="font-bold text-[#3d2610] uppercase truncate max-w-[140px]">${esc(r.customer)}</span>
        <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(r.qty)}</span>
      </div>` : `
      <div class="flex items-baseline gap-2 py-0.5 text-[11px] whitespace-nowrap">
        <span class="font-bold text-[#8a7a68]">${fmtDate(r.date)}</span>
        ${r.label ? `<span class="font-bold text-[#3d2610] truncate max-w-[160px]">${esc(r.label)}</span>` : ''}
        <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(r.qty)}</span>
      </div>`;
  });
  html += `
    <div class="flex items-baseline gap-2 border-t border-[#e8dcc8] mt-1.5 pt-1.5 text-[11px]">
      <span class="font-black text-[#3d2610] uppercase tracking-widest text-[9px]">Total</span>
      <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(total)}</span>
    </div>`;
  const tip = document.getElementById('mv-sales-tip');
  tip.innerHTML = html;
  tip.classList.remove('hidden');
  // Below the figure, clamped to the viewport; above it when there's no
  // room underneath — same placement rule as Tab 6's own sales tooltip.
  const a = anchorEl.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  let left = Math.min(Math.max(8, a.left), window.innerWidth - t.width - 8);
  let top  = a.bottom + 8;
  if (top + t.height > window.innerHeight - 8) top = Math.max(8, a.top - t.height - 8);
  tip.style.left = left + 'px';
  tip.style.top  = top + 'px';
}
function mvHideDetailTip() {
  document.getElementById('mv-sales-tip').classList.add('hidden');
}

async function runMovementReportCombined() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');
  _mvDetailPool = [];

  // PN drives the Pre-Nursery section, any of BNN/UNN1/UNN2 drives the Main
  // Nursery section — one Movement Report tab, the Locations chips decide
  // which section(s) actually render. Same rule Transplanting/Sales Listing
  // already use for these chips: nothing ticked means no filter at all, not
  // nothing to show — nothing ticked shows every location, both sections.
  const pickedLocs = selectedNurseries();
  const wantPre  = pickedLocs.length === 0 || pickedLocs.includes('PN');
  const wantMain = pickedLocs.length === 0 || pickedLocs.some(l => l !== 'PN');

  const fromStr = document.getElementById('f-from').value;
  const toStr   = document.getElementById('f-to').value;
  const fromMs  = fromStr ? new Date(fromStr).getTime() : -Infinity;
  const toMs    = toStr ? new Date(toStr).getTime() + 86400000 : Infinity;
  const groupBy = (document.getElementById('f-sort') || {}).value || 'plot';

  const [logsRes, dosRes, alsRes, plotsRes, traysRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('transaction_type, transaction_date, created_at, remark, plot_name, batch_name, quantity_change')
      .in('transaction_type', ['Seeds_Received', 'Planted', 'Transplanted',
          'Transplanted_Premium', 'Transplanted_DoubleTone', 'Damaged_Seeds',
          '1st_Culling', '2nd_Culling', '3rd_Culling', 'Cull3_Transfer',
          'Stock_Calibration',
          /* Not a figure on this report — it is what holds a batch out of
             Completed. See shared/shared_batch_completed.js. */
          'Review_Rejection'])
      .order('id', { ascending: true })),
    // do_number/al_number added for the Sold column's hover tooltip
    // (date · DO number · customer · qty) — see mvBuildSaleDetails().
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('do_number, al_number, delivery_date, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_al_orders').select('al_number, customer_name')),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    _supabase.from('operation_trays').select('tray_name, nursery_name').then(r => r, () => ({ data: [] }))
  ]);
  if (logsRes.error || dosRes.error || plotsRes.error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load data.</div>`;
    return;
  }

  const logs = logsRes.data || [];

  // ── Where each place belongs ──
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  // Trays are pre-nursery whatever nursery they sit in; their own nursery is
  // kept only so the pre-nursery list can be read in the same order.
  const trayNames = new Set();
  const trayNursery = {};
  ((traysRes && traysRes.data) || []).forEach(t => {
    if (!t.tray_name) return;
    trayNames.add(t.tray_name);
    trayNursery[t.tray_name] = t.nursery_name || '';
  });
  PRE_NURSERY_PLOTS.forEach(p => trayNames.add(p));
  const isTray = (name) => trayNames.has(name);

  // BNN/UNN1/UNN2 filter which main-nursery plots pass; PN plays no part in
  // this check (plotToLoc never returns "PN" — it only ever comes from
  // shared_plots.nursery_name, a real main-nursery name), so leaving PN in
  // the checked set is harmless here. Empty selectedLocs (nothing ticked)
  // means no filter — same !selectedLocs.size guard as Transplanting/Sales
  // Listing use for the same chips — not "nothing passes".
  const selectedLocs = new Set(pickedLocs);
  const passMain = (plot) => !!plot && !isTray(plot) && (!selectedLocs.size || selectedLocs.has(plotToLoc[plot] || 'Unassigned'));

  // ── When each batch was planted, for Age ──
  // The same source the batch list uses: the keyed date on Seeds_Received.
  const batchPlantedAt = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Seeds_Received') return;
    const k = _mvBatchKey(l.batch_name);
    const d = l.transaction_date || l.created_at;
    if (!k || !d) return;
    if (!batchPlantedAt[k] || String(d) < String(batchPlantedAt[k])) batchPlantedAt[k] = d;
  });

  // ── Every movement, as (scope, place, batch, column, qty) — built once
  //    from one fetch, so both sections come off the same pass over the
  //    ledger instead of fetching (and re-deriving the lookups above)
  //    twice. Each section later reads only the events tagged its way. ──
  const ev = [];
  const push = (sc, date, place, batch, col, qty) => {
    if (!place || !qty) return;
    ev.push({ sc, date, place, batch: batch || '—', col, qty });
  };
  // DOUBLE-TONE and PREMIUM CARE (PRE_NURSERY_PLOTS) are quality-grade
  // labels, not physical trays — a batch graded Double Tone never actually
  // moves into a tray called that; it stays in whatever numbered tray it
  // was planted into, just re-tagged. So a "from tray [DOUBLE-TONE]" /
  // "[PREMIUM CARE]" remark names a grade, not a place with its own
  // standing balance — no "Planted" event ever credits one, which without
  // this fallback debited a tray that (correctly) never existed, System-
  // wide sweep (CHECK_pre_nursery_negative_balances.sql): every one of
  // these came back showing transfer_in=0 too, confirming nothing ever
  // credits "DOUBLE-TONE"/"PREMIUM CARE" as a place either. Redirected to
  // the batch's home tray — the same fallback Damaged_Seeds already uses
  // for exactly the same reason (see batchHomeTray below).
  //
  // Any OTHER tray name a "from tray [X]" remark names — a real numbered
  // tray, or a range/list like "P28-P30" — is left as-is. Those are
  // genuine tray-attribution gaps in the source data (see the SQL sweep),
  // not something this report can safely paper over by guessing which
  // real tray the seedlings actually came from.
  const PRE_GRADE_LABELS = new Set(['DOUBLE-TONE', 'PREMIUM CARE']);
  const srcTrayOf = (l) => {
    const m = (l.remark || '').match(/from tray \[([^\]]+)\]/i);
    const raw = m ? m[1].trim() : null;
    if (raw && PRE_GRADE_LABELS.has(raw)) {
      const home = batchHomeTray[_mvBatchKey(l.batch_name)];
      return home ? home.tray : raw;
    }
    return raw;
  };

  // Records behind Transfer In / Transplanted from PN / 3rd Culled /
  // Transfer Out, for their own hover tooltips (see mvShowDetailTip()) —
  // the same idea as saleDetails above, one shared shape: date, qty, and
  // a short label already worded for the tooltip line. Keyed by
  // place::batch::col so each column's own figure has its own list.
  const colDetails = {};
  const pushDetail = (place, batch, col, date, qty, label) => {
    if (!place || !qty) return;
    const dk = place + '::' + (batch || '—') + '::' + col;
    (colDetails[dk] = colDetails[dk] || []).push({ date, qty, label });
  };

  // Damaged seeds carry no tray: they are counted at the batch as it is
  // planted and never enter one. Shown against the tray the batch was mostly
  // planted into, once, so the column is visible without being invented for
  // every tray the batch happens to occupy — and it does not move that tray's
  // balance, because those seeds were never standing in it.
  const batchHomeTray = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Planted' || !l.plot_name) return;
    const k = _mvBatchKey(l.batch_name);
    const q = Math.abs(l.quantity_change || 0);
    if (!batchHomeTray[k] || q > batchHomeTray[k].qty) batchHomeTray[k] = { tray: l.plot_name, qty: q };
  });

  logs.forEach(l => {
    if (SUMMARY_SKIP_TYPES.has(l.transaction_type)) return;
    const d = _logDate(l);
    const q = Math.abs(l.quantity_change || 0);
    const t = l.transaction_type;
    const b = l.batch_name;

    if (t === 'Planted')     { push('pre', d, l.plot_name, b, 'planted', q); return; }
    if (t === '1st_Culling') { push('pre', d, l.plot_name, b, 'cull1', q); return; }
    // 2nd_Culling isn't tracked in Main Nursery Movement at all — it's
    // Tab 6's own running snapshot toward 3rd Culling, not a separate,
    // standing deduction (see netOfRow above).
    if (t === '2nd_Culling') return;
    if (t === '3rd_Culling') {
      // Only counted once a drone map qty has actually been keyed — Tab 6
      // computes and saves a 3rd_Culling figure the moment Alive reaches
      // zero, whether or not anyone has actually counted/photographed it.
      // An un-evidenced "fully culled" record would otherwise zero out a
      // batch's standing balance here on nothing more than a formula.
      // MapQty: N is written into the remark by saveTab6() only when that
      // box actually has a number in it (see operation_batch_detail.html).
      const mapQtyMatch = (l.remark || '').match(/MapQty:\s*(\d+)/);
      if (mapQtyMatch && passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'cull3', q);
        pushDetail(l.plot_name, b, 'cull3', d, q, '');
      }
      return;
    }

    if (t === 'Damaged_Seeds') {
      const home = batchHomeTray[_mvBatchKey(b)];
      if (home) push('pre', d, home.tray, b, 'damaged', q);
      return;
    }

    if (t === 'Transplanted') {
      const src = srcTrayOf(l);
      if (src) push('pre', d, src, b, 'transOut', q);
      if (passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'transIn', q);
        pushDetail(l.plot_name, b, 'transIn', d, q, src ? `Tray ${src}` : '');
      }
      return;
    }

    if (t === 'Transplanted_Premium' || t === 'Transplanted_DoubleTone') {
      // The source tray's own loss reads as ordinary Transplanted Out —
      // no separate Premium Care/Double Tone column for it (see MOVE_COLS.pre).
      const src = srcTrayOf(l);
      if (src) push('pre', d, src, b, 'transOut', q);
      push('pre', d, l.plot_name, b, 'trIn', q);   // the receiving tray
      return;
    }

    if (t === 'Cull3_Transfer') {
      const from = (l.remark || '').match(/From:\s*\[([^\]|]+)\|/);
      if (passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'trIn', q);
        pushDetail(l.plot_name, b, 'trIn', d, q, from ? from[1] : '');
      }
      if (from && passMain(from[1])) {
        push('main', d, from[1], b, 'trOut', q);
        pushDetail(from[1], b, 'trOut', d, q, l.plot_name);
      }
      return;
    }

    if (t === 'Stock_Calibration') {
      // Only an APPROVED adjustment ever counts — the same "[APPROVED by
      // <who> on <when>]" marker operation_batch_detail.html's own
      // _parseCalibration() reads. A pending one hasn't been ruled on yet
      // and moves no figure there either; reading it here too would make
      // this the one place in the system where an unapproved adjustment
      // silently did.
      const approved = (l.remark || '').match(/\[APPROVED by [^\]]+ on [^\]]+\]/);
      if (!approved || !passMain(l.plot_name)) return;
      // Its own signed value — a Found is positive, a Stolen or
      // over-allocation is negative — not Math.abs(quantity_change) like
      // every other branch here, so the direction survives into the
      // column and the balance exactly as it was approved.
      const signedQty = Number(l.quantity_change) || 0;
      if (!signedQty) return;
      push('main', d, l.plot_name, b, 'adjust', signedQty);
      // Same reason-extraction as _parseCalibration(): strip the
      // "Report: X. Plot: Y. Side: Z." prefix pieces and the [APPROVED…]
      // marker, leaving just the reason someone actually wrote.
      let reason = (l.remark || '').replace(approved[0], '').trim();
      reason = reason.replace(/Report:\s*[^.]+?\s*\.\s*/i, '')
                      .replace(/Plot:\s*[^.]+?\s*\.\s*/i, '')
                      .replace(/Side:\s*(seed|plot)\s*\.\s*/i, '').trim();
      pushDetail(l.plot_name, b, 'adjust', d, signedQty, reason);
      return;
    }
  });

  // ── Sales, only against a plot·batch the batch report already has ──
  // Only worth doing when the Main Nursery section is actually wanted.
  const unmatchedSales = [];
  // Every DO line that lands as a Sold event, kept (not just traced) so
  // the Sold column's hover tooltip can show date/DO number/customer/qty
  // for each — see mvShowDetailTip(). Keyed the same simple way the row
  // itself will be looked up by: place + '::' + batch.
  const saleDetails = {};
  if (wantMain) {
    const customerByAl = {};
    (alsRes.data || []).forEach(a => { if (a.al_number) customerByAl[a.al_number] = a.customer_name || ''; });
    const realRows = new Map();
    ev.filter(e => e.sc === 'main').forEach(e => {
      const pk = _mvPlotKey(e.place), bk = _mvBatchKey(e.batch);
      if (!pk || !bk) return;
      if (!realRows.has(pk)) realRows.set(pk, new Map());
      if (!realRows.get(pk).has(bk)) realRows.get(pk).set(bk, { place: e.place, batch: e.batch });
    });
    // Diagnostic trace — every DO line that landed as a Sold event
    // for the main-nursery view. Open DevTools > Console and grep for
    // [mv:sales] to audit "which DO lines add up to N sold on plot X
    // batch Y". Grouped and totalled below the raw list.
    const _salesTrace = [];
    (dosRes.data || []).forEach(d => {
      if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
      for (let i = 1; i <= 5; i++) {
        const qty = Number(d[`qty_${i}`] || 0);
        if (!qty) continue;
        const plot = d[`plot_${i}`];
        if (!passMain(plot)) continue;
        const hit = (realRows.get(_mvPlotKey(plot)) || new Map()).get(_mvBatchKey(d[`batch_${i}`]));
        if (!hit) { unmatchedSales.push({ plot: plot || '—', batch: d[`batch_${i}`] || '—', qty }); continue; }
        ev.push({ sc: 'main', date: d.delivery_date || null, place: hit.place, batch: hit.batch, col: 'sold', qty });
        const dk = hit.place + '::' + hit.batch;
        (saleDetails[dk] = saleDetails[dk] || []).push({
          doNumber: d.do_number || '—', date: d.delivery_date || null,
          customer: customerByAl[d.al_number] || '—', qty
        });
        _salesTrace.push({
          do: d.do_number, line: i,
          plot: hit.place, batch: hit.batch,
          raw_plot: plot, raw_batch: d[`batch_${i}`], qty,
          delivery_date: d.delivery_date, status: d.status
        });
      }
    });
    const _byPB = {};
    _salesTrace.forEach(t => {
      const k = t.plot + ' · ' + t.batch;
      (_byPB[k] = _byPB[k] || []).push(t);
    });
    Object.keys(_byPB).sort().forEach(k => {
      const rows = _byPB[k];
      const total = rows.reduce((s, r) => s + r.qty, 0);
      console.log('[mv:sales]', k, '=', total, '(' + rows.length + ' DO line' + (rows.length===1?'':'s') + ')', rows);
    });
  }

  const ctx = { fromMs, toMs, fromStr, toStr, groupBy, plotToLoc, trayNursery, batchPlantedAt, saleDetails, colDetails };
  const sections = [];
  if (wantPre)  sections.push(buildMovementSection('pre',  ev.filter(e => e.sc === 'pre'),  { ...ctx, unmatchedSales: [] }));
  if (wantMain) sections.push(buildMovementSection('main', ev.filter(e => e.sc === 'main'), { ...ctx, unmatchedSales }));

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = sections.join('');
}

/**
 * Builds one Movement Report section (Pre-Nursery or Main Nursery) as an
 * HTML string, from events already filtered to that scope. Split out of
 * runMovementReportCombined() so both sections come off one fetch and one
 * pass over the ledger — see there — instead of each fetching (and
 * re-deriving plotToLoc/trayNursery/batchPlantedAt) on its own.
 */
function buildMovementSection(scope, ev, ctx) {
  const { fromMs, toMs, fromStr, toStr, plotToLoc, trayNursery, batchPlantedAt, unmatchedSales, saleDetails, colDetails } = ctx;
  // "Sort by" (Plot/Batch) applies to both sections alike: Plot groups
  // Pre-Nursery by Tray No first same as it groups Main by Plot first,
  // Batch second either way — one shared toggle, not a Main-only one.
  const groupBy = ctx.groupBy;

  // ── Three buckets from the same events ──
  // `buc` is everything up to the As-At date, unrestricted by the implicit
  // From — this is what Balance/Batch Balance is netted from, because
  // "what's actually standing in this plot right now" can't correctly
  // ignore months before the one you happen to be looking at.
  // `per` is only events inside [month start, As At] — this is what fills
  // the visible Culled/Transplanted/Damaged/etc columns, so picking a date
  // in September shows September's culling to date, not everything since
  // the batch began.
  // `bf` is everything strictly BEFORE month start — the balance brought
  // forward into this month, shown in its own B/F column. Computed the same
  // way as `buc` (netOfRow over a fully cumulative bucket, just cut off
  // earlier) rather than derived as buc − per, so it's correct on its own
  // even in the one case where that arithmetic wouldn't cleanly reconcile:
  // netOfRow's "supersede" rule (a 3rd culling excludes the 2nd once
  // recorded) is evaluated separately for `buc` and `bf`, each its own
  // honest cumulative total, not a subtraction that could inherit an edge
  // case from the other side of the cut.
  const SEP = '\x01';
  const buc = {}, per = {}, bf = {}, meta = {};
  for (const e of ev) {
    const ts = e.date ? new Date(e.date).getTime() : NaN;
    // toMs is midnight of the day AFTER "As At" (fromStr/toMs above) — an
    // exclusive upper bound, so a row dated exactly there belongs to that
    // NEXT day, not the one picked. `> toMs` let a date-only value (no
    // time component, so it parses to exactly that midnight) slip through
    // as "not greater than" — reported as "I picked 31/07 and 01/08 data
    // still showed up". `>=` is the correct exclusion.
    if (!isFinite(ts) || ts >= toMs) continue;
    const k = e.place + SEP + e.batch;
    meta[k] = meta[k] || { place: e.place, batch: e.batch };
    if (!buc[k]) buc[k] = emptyRow(scope);
    buc[k][e.col] += e.qty;
    if (ts >= fromMs) {
      if (!per[k]) per[k] = emptyRow(scope);
      per[k][e.col] += e.qty;
    } else {
      if (!bf[k]) bf[k] = emptyRow(scope);
      bf[k][e.col] += e.qty;
    }
  }

  let rows = [];
  for (const k of Object.keys(buc)) {
    const closing = netOfRow(scope, buc[k]);
    const periodRow = per[k] || emptyRow(scope);
    // A batch/plot pair still shows if there's anything to actually see:
    // either it has movement THIS period (batch 242 in B4 — culled and
    // sold out, both in September, Balance ends at 0 but the row still
    // earns its place), or something's still standing (closing !== 0).
    // Neither — a batch whose only activity was months ago and has sat at
    // 0 ever since, with nothing happening as at the date picked — has
    // nothing to report and stays hidden, same as before.
    const hasPeriodActivity = MOVE_COLS[scope].some(c => (periodRow[c.key] || 0) !== 0);
    if (closing === 0 && !hasPeriodActivity) continue;
    const bfClosing = netOfRow(scope, bf[k] || emptyRow(scope));
    // Same window as periodRow's own figures (fromMs..toMs) — every
    // tooltip has to list exactly what its own column's number is made
    // of, not this batch/plot's whole history on that column.
    const inPeriod = (arr) => (arr || []).filter(r => {
      const ts = r.date ? new Date(r.date).getTime() : NaN;
      return isFinite(ts) && ts >= fromMs && ts <= toMs;
    });
    const sales = saleDetails ? inPeriod(saleDetails[meta[k].place + '::' + meta[k].batch]) : [];
    const details = {};
    if (colDetails) {
      ['trIn', 'transIn', 'cull3', 'trOut', 'adjust'].forEach(col => {
        const dk = meta[k].place + '::' + meta[k].batch + '::' + col;
        details[col] = inPeriod(colDetails[dk]);
      });
    }
    rows.push({ ...meta[k], ...periodRow, closing, bf: bfClosing, sales, details,
                age: ageLabel(batchPlantedAt[_mvBatchKey(meta[k].batch)]) });
  }

  const _natCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  const locOfRow = (r) => scope === 'pre'
    ? (trayNursery[r.place] || 'Pre-Nursery')
    : (plotToLoc[r.place] || 'Unassigned');
  rows.sort((a, c) => (groupBy === 'batch'
    // A transferred batch sits in several plots, often in several nurseries;
    // keeping it under one heading is the whole point of this view.
    ? _natCmp(a.batch, c.batch) ||
      nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(a.place, c.place)
    : nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(locOfRow(a), locOfRow(c)) ||
      _natCmp(a.place, c.place) || _natCmp(a.batch, c.batch)));

  const cols = MOVE_COLS[scope];
  const placeLabel = scope === 'pre' ? 'Tray No' : 'Plot';
  const firstLabel  = groupBy === 'batch' ? 'Batch' : placeLabel;
  const secondLabel = groupBy === 'batch' ? placeLabel : 'Batch';
  const title = scope === 'pre' ? 'Pre-Nursery Movement' : 'Main Nursery Movement';

  if (!rows.length) {
    return `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No ${
      scope === 'pre' ? 'pre-nursery' : 'main nursery'} movement found in this period.</div>`;
  }

  const fmtCell = (n, cls) => `<td class="${cls || ''}">${n ? fmtNum(n) : '0'}</td>`;
  // A cell hovers to a tooltip listing what its number is made of, when
  // there's something behind it — a plain number otherwise, same as any
  // other cell. The rows are pushed into the shared pool and referenced
  // by index rather than embedding the data in the attribute itself, so
  // a customer name or a plot name with a quote in it can't break the
  // markup. Sold reads r.sales (Date/DO Number/Customer/Qty); the other
  // wired columns read r.details[col] (Date/label/Qty) — see the
  // pushDetail() calls above and DETAIL_TITLES below.
  const DETAIL_TITLES = { trIn: 'Transfer In', transIn: 'Transplanted from PN', cull3: '3rd Culled', trOut: 'Transfer Out', adjust: 'Stock Adjustment' };
  const fmtDetailCell = (r, c) => {
    const n = r[c.key];
    const rowsForTip = c.key === 'sold' ? r.sales : (r.details && r.details[c.key]);
    if (!n || !rowsForTip || !rowsForTip.length) return fmtCell(n, c.cls);
    const title = c.key === 'sold' ? 'Sold' : DETAIL_TITLES[c.key];
    const idx = _mvDetailPool.push({ title, rows: rowsForTip }) - 1;
    return `<td class="${c.cls || ''}"><span class="cursor-help border-b border-dotted border-current"
      onmouseenter="mvShowDetailTip(this, ${idx})" onmouseleave="mvHideDetailTip()">${fmtNum(n)}</span></td>`;
  };

  // ── Body: a section per nursery, a group per tray/plot ──
  // Grouped by whichever the reader asked for. By batch, a batch that has
  // been transferred shows every plot it now sits in under one heading —
  // which is the only way to see where a batch actually IS.
  const keyOf   = (r) => (groupBy === 'batch' ? r.batch : r.place);
  const otherOf = (r) => (groupBy === 'batch' ? r.place : r.batch);
  const groups = [];
  rows.forEach(r => {
    const last = groups[groups.length - 1];
    if (last && last.key === keyOf(r)) last.list.push(r);
    else groups.push({ key: keyOf(r), loc: locOfRow(r), list: [r] });
  });

  const totalCols = 6 + cols.length; // Place/Batch, Age, B/F, cols, Batch Balance, Balance
  const bodyHtml = [];
  let lastLoc = null;
  let band = false;
  groups.forEach(g => {
    if (groupBy !== 'batch' && g.loc !== lastLoc) {
      lastLoc = g.loc;
      // !text-left — .movement-table td defaults every cell to text-align:right
      // (it's mostly a numbers table), which otherwise beats a plain
      // text-left utility class on specificity alone.
      bodyHtml.push(`<tr style="background:#f3ede1"><td colspan="${totalCols}"
        class="font-black text-base !text-left uppercase tracking-widest text-[#3d2610] py-2">${g.loc}</td></tr>`);
    }
    const bal = g.list.reduce((s, r) => s + r.closing, 0);
    // Alternating band per ROW (not per group) — every line gets its own
    // dark/light step, so a batch with several tray/plot rows still shows
    // each one distinctly instead of one solid block of colour.
    g.list.forEach((r, i) => {
      band = !band;
      const zebra = band ? ' style="background:#f0e6d2"' : '';
      // The group key and the group's Balance are shown once per group, not
      // once per row — a real rowspan cell, vertically centred, instead of
      // text pinned to the group's first row with blank cells trailing
      // under it (which read as stuck at the top, not "one merged value").
      // Plot and Balance get their own background — white, always — rather
      // than inheriting whichever zebra band their group's FIRST row
      // happened to land on. Without this they looked white for some
      // groups and tan for others purely by coincidence of position; every
      // other cell in the row keeps the alternating stripe as before.
      bodyHtml.push(`<tr${zebra}>
        ${i === 0 ? `<td rowspan="${g.list.length}" class="col-label font-black text-[#8a7a68] align-middle" style="background:#fff">${g.key}</td>` : ''}
        <td class="col-label">${otherOf(r) || '—'}</td>
        <td class="col-label text-[#8a7a68] text-xs whitespace-nowrap">${r.age}</td>
        ${fmtCell(r.bf, 'text-[#8a7a68] font-black')}
        ${cols.map(c => fmtDetailCell(r, c)).join('')}
        ${fmtCell(r.closing, 'text-[#4a7a2e] font-black')}
        ${i === 0 ? `<td rowspan="${g.list.length}" class="col-balance-total font-black text-[#8a7a68] align-middle" style="background:#fff">${fmtNum(bal)}</td>` : ''}
      </tr>`);
    });
  });

  // ── Grand total ──
  const grand = rows.reduce((s, r) => {
    cols.forEach(c => { s[c.key] += r[c.key] || 0; });
    s.closing += r.closing;
    s.bf += r.bf || 0;
    return s;
  }, { closing: 0, bf: 0, ...emptyRow(scope) });

  // A grouped header row only where two columns belong together.
  const grouped = cols.some(c => c.grp);
  let groupRow = '';
  if (grouped) {
    const cells = [];
    let i = 0;
    while (i < cols.length) {
      const g = cols[i].grp;
      if (!g) { cells.push('<th></th>'); i++; continue; }
      let n = 0;
      while (i + n < cols.length && cols[i + n].grp === g) n++;
      cells.push(`<th colspan="${n}" class="text-center text-[#c07820]">${g}</th>`);
      i += n;
    }
    groupRow = `<tr><th colspan="4"></th>${cells.join('')}<th colspan="2"></th></tr>`;
  }

  const rangeLabel = fromStr && toStr
    ? `${fmtDate(fromStr)} – ${fmtDate(toStr)} · Balance as at ${fmtDate(toStr)}`
    : (toStr ? `Balance as at ${fmtDate(toStr)}` : 'Balance as at today');
  const unmatchedHtml = unmatchedSales.length ? `
      <div class="mt-4 rounded-2xl border border-[#f0b429] bg-[#fffbeb] p-4">
        <div class="text-[11px] font-black text-[#7a4a10] uppercase tracking-widest mb-2">
          ${unmatchedSales.length} delivery order line${unmatchedSales.length === 1 ? '' : 's'} not matched to a batch report
        </div>
        <div class="text-[10px] font-bold text-[#8a7a68] mb-2">
          These are left out of the table above. The plot or batch on the delivery order does not
          exist in any batch report, so there is no row for the sale to belong to.
        </div>
        <div class="flex flex-wrap gap-2">
          ${unmatchedSales.map(u => `<span class="inline-block bg-white border border-[#e8dcc8] rounded-lg px-2.5 py-1 text-[11px] font-bold text-[#3d2610]">
             ${u.plot} · batch ${u.batch} · ${fmtNum(u.qty)}</span>`).join('')}
        </div>
      </div>` : '';

  return `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">${title}</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${rangeLabel}</div>
      </div>

      <div class="overflow-x-auto movement-scroll">
        <table class="report-table movement-table">
          <thead>
            ${groupRow}
            <tr>
              <th>${firstLabel}</th>
              <th>${secondLabel}</th>
              <th>Age</th>
              <th>B/F</th>
              ${cols.map(c => `<th>${c.label}</th>`).join('')}
              <th>Batch Balance</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody>
            ${bodyHtml.join('')}
            <tr style="background:#fdf3e6">
              <td class="font-black text-[#3d2610]">GRAND TOTAL</td>
              <td></td><td></td>
              ${fmtCell(grand.bf, 'text-[#8a7a68] font-black')}
              ${cols.map(c => fmtCell(grand[c.key], (c.cls || '') + ' font-black')).join('')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black col-balance-total')}
            </tr>
          </tbody>
        </table>
      </div>

      ${unmatchedHtml}
    </div>
  `;
}

   The board that gets nailed up at the plot when the seedlings arrive. The
   office was making these by hand, one per plot, off the Transplanting
   Report on the screen beside them — so it is drawn FROM that row, and the
   figure on the board is the figure on the report by construction.

   ONE BOARD PER ROW, which is one per plot per transplant. That is the
   whole reason it is drawn here and not off the ledger: B4 took 1,931 out
   of P32 and 378 out of P33 on the same day, and the board says 2,309,
   because what goes up at the plot is how many are standing in it. The
   report already merges a plot's rows for that day (see `merged` above);
   this follows it rather than adding a second rule.

   Every field comes off the Batch Report's own answer:

     PLOT / BATCH / JENAMA   the row
     JUMLAH TANAM            the row's qty, merged
     TARIKH TANAM            the batch's Seeds_Received transaction_date,
                             which is what the Batch Record list shows as
                             Planted Date — the date keyed on Tab 1, never
                             the row's insert time. Newest reception row
                             wins, the same rule the Seeds In form and the
                             batch list already follow.
     TARIKH PINDAH           the transplant date

   THE FONT HAS TO BE LOADED BEFORE THE FIRST STROKE. A canvas asked for a
   font it does not have yet does not wait — it draws in the fallback and
   the board comes out in Times, which is not a thing anybody would notice
   until it was on a post in a field. `document.fonts.load` is awaited for
   each weight actually used.

   THE LOGO IS THE OFFICE'S OWN MARK, and it is INLINED rather than fetched.
   The board carries MJM NURSERY, which is not the MJM GROUP tile that was
   here before — same house, different mark, and the office asked for this
   one by handing over a board with it on. `shared/mjm_nursery_logo.png` is

   byte, as a data URI — `tests/papan_tanda.cjs` decodes the one and
   compares it against the other, so the two cannot drift. Inlining keeps
   every property the hand-drawn mark had: no fetch, so no 404 at the moment
   somebody presses the button; no cross-origin, so `toBlob` still works;
   and nothing to go stale in a cache. It is drawn at the IMAGE'S OWN aspect
   ratio, read off the image, so it cannot be stretched even if the file is
   one day replaced with a different shape.

   The file is TRIMMED to the mark — no flat margin round it the way the
   GROUP tile had — so there is no crop any more, and `shared/mjm_logo.png`
   stays in the repository as the GROUP mark that this board no longer
