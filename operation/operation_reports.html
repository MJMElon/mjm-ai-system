       THIS REPORT WORKS OUT FOR ITSELF.

       The first version added the transplant quantity to the admin-keyed
       Double Tone Quantity in Nursery. Batch 276 is what that looked like:
       nothing transplanted, 100% still pending on its own batch report, and
       a Total Transplant Qty of 3 — because somebody had keyed 3 into the
       Quantity in Nursery box. A total of three seedlings transplanted, on a
       batch that had transplanted none.

       The batch report splits one total into two DISJOINT halves:

         Main Plot            a main-plot transplant out of a PN tray
         Main Plot (D-Tone)   a main-plot transplant out of the DOUBLE-TONE
                              tray — the ones that had the treatment
         ───────────────────  and the two add up to every Transplanted row

       So these three columns are those three figures, and the total is the
       total because the parts are halves of it rather than two things
       stacked together. `calcTransplanting` in operation_batch_detail.html
       is the original, and its own comment says the two tiles are disjoint
       "so the two tiles add up to the total main-plot population".

       The keyed Quantity in Nursery is a different number — a count of
       double-tone seedlings STANDING, which is why it can be above nought
       on a batch that has transplanted nothing. It is still read, still
       verified and still in the drilldown; it is not this column. */
    r.transMain  = r.trans - r.transDtone;
    r.transTotal = r.trans;
    /* The 1st culling splits the same way and for the same reason: a 1st
       culling happens in a TRAY, and the DOUBLE-TONE tray is one of the
       trays. Total, the ordinary trays, and the d-tone one — two disjoint
       halves and the total they add up to, never a sum of two different
       things. Total Culled (1st + 3rd) goes on using cull1, the whole of
       it. */
    r.cull1Main  = r.cull1 - r.cull1Dtone;
    r.cull1Total = r.cull1;
    /* BALANCE IS WHAT IS STANDING IN THE FIELD.

         transplanting qty − 3rd culling − total sales

       It used to start from ACTUAL PLANTED and take the whole culling off:
       planted − (1st + 3rd) − sales + approved calibration. That is a
       different question — everything the batch has anywhere, tray
       included — and on a batch that was over- or under-allocated the two
       answers differ by the allocation gap for ever. Batch 224 read −416
       and 226 read −560 on a report the office reconciles against, with
       nothing standing in either.

       The 1st culling is NOT taken off here, and that is the whole reason
       this reads better: it happens in the TRAY, before any of these
       seedlings go out, so the transplanting quantity is already net of it.
       Starting from planted and subtracting it was correct for the old
       question and is double-counting for this one.

       The 2nd culling never deducts, same as everywhere else — the 3rd is
       keyed against the original transplanted figure and already contains
       it.

       THE APPROVED STOCK CALIBRATION IS IN IT, and it is what closes the
       last seedling. The office asked for the three terms first and for the
       calibration a moment later, once they saw what it does: 224, 225 and
       226 were reading 1, −1 and 13 against calibrations of −1, +1 and −13,
       so all three settle to EXACTLY NOUGHT. A correction somebody has
       approved is a correction; leaving it out leaves a batch that is
       finished reading as though a seedling were missing. Unapproved ones
       still count for nothing — see the Stock_Calibration branch above.

       ONLY THE PLOT-SIDE ONES, and batch 230 is why. Its calibration is
       minus 1,000 reported against PLANTING — "Sold out 1,000 Pre nursery
       seedlings" — which corrects the SEED count, what went into the tray.
       Those seedlings never reached a field plot, so taking them off what
       is standing in one is subtracting a loss from a figure that never
       contained it: 230 balanced to nought on its own three terms and read
       MINUS 1,000. A seed-side correction belongs to the pre-nursery, which
       is preBalance, and it is already there — the row is keyed against
       tray P30.

       The side is the REPORT (`_LOS_CAL_SEED_REPORTS`), never the plot the
       row names and never the "Side:" in the remark. The Stock Calibration
       COLUMN still shows every approved one, because it is still a real
       correction; it is only this figure it does not belong in.

       What is NOT in it is whatever is still sitting in a tray. preBalance
       below is the question "what is still in the pre-nursery", and it is
       unchanged.

       It is TOTAL sales, which is the column beside it, and on a batch sold
       out of the TRAY that takes a tray sale off a field figure: one sold
       400 out of the tray and never transplanted reads minus 400. Every
       batch the office reconciles sells out of the field, where total sales
       and field sales are the same number, so this is the figure they asked
       for and it is right on every row they have. mainBalance below does
       NOT inherit it — the Pre / Main filter would otherwise list such a
       batch under a nursery it never reached, which is a fault this file
       has already had once. */
    r.balance    = r.trans - r.cull3 - r.sales + (r.calibration - r.calibrationSeed);
    /* Where the batch is standing NOW, which is what the Pre / Main filter
       asks. Pre-nursery holds whatever was planted and has not left the tray:
       culled in it, transplanted out of it, SOLD out of it, or written off
       against it by an approved calibration.

       The last two were missing, and a batch sold entirely out of the tray
       reported 1,000 standing in pre-nursery and MINUS 400 standing in a
       nursery it had never reached. And because the Nursery Type filter
       keeps a batch on the strength of preBalance > 0, such a batch was
       listed under Pre-Nursery long after the last of it had gone.

       mainBalance USED to be `balance − preBalance` — the Balance spanned
       both halves, so the subtraction was the one way the two could not
       drift from the total they split. The Balance is now the FIELD side on
       its own, so there is no total left to split and the subtraction would
       take the tray off twice.

       It is NOT simply `= balance` either, and that is the whole care in
       this line. The Balance takes TOTAL sales off, because that is the
       column beside it and the figure the office asked for; a sale out of
       the tray is therefore inside it, and inheriting that here would put
       MINUS 400 back into the nursery a batch never reached — the very
       fault above. So the field side is counted on its own terms: what went
       out, less what was 3rd culled, less what was sold out of the FIELD,
       plus whatever an approved calibration moved there.

       The two agree on every batch that sells out of the field, which is
       every batch the office reconciles. Where they differ, the difference
       is exactly the TRAY sales and the TRAY calibration — which is to say,
       exactly the part of the Balance that belongs to the pre-nursery. */
    r.preBalance  = r.planted - r.cull1 - r.trans - r.salesPre + r.calibrationPre;
    r.mainBalance = r.trans - r.cull3 - (r.sales - r.salesPre) + r.calibrationField;
    r.ageMonths   = _losAgeMonths(r.seedsDate, asAt);
    r.age         = _losAgeLabel(r.ageMonths);
    /* COMPLETED IS THE BATCH RECORD'S ANSWER, not one of this report's own.

       It used to be this report's arithmetic coming to nought — something
       has left the batch and nothing of it is standing anywhere. That reads
       sensibly and it is still a different question from the one the Batch
       Record list asks, which is whether every plot the batch used has been
       3rd culled, proofed against its drone map and signed off. Two
       questions, two answers, and a batch could sit in Completed on one
       screen and Active on the other with nothing saying which was wrong.

       The office asked for them to agree, so there is now one rule and it
       lives in shared/shared_batch_completed.js — see that file for what it
       is and which batches taught us each part of it. `completedSet` is the
       answer for the whole report, worked out once by
       _losBuildAllRows's caller and handed in.

       Two things about the way it is handed in:

       - IT IS ASKED AS AT THE REPORT'S DATE. The lines are cut at the As At
         and the SIGNATURES are not, the same split every other As At rule
         here follows: a culling dated after the As At has not happened yet,
         while "has anybody checked this" is a question about now. So
         September still reads as September did.
       - IT IS NOT GATED ON VERIFICATION the way the figures are. A batch
         cannot be Completed without its 3rd culling being signed off in the
         first place, so the question answers itself; and a withheld figure
         must not also take the batch off the Status filter.

       anyOut stays, as the one thing this report still asks on its own: it
       is what the empty-row test uses. r.completed is set below, once the
       whole ledger has been read — it is not derived from this row. */
    r.anyOut      = r.trans > 0 || r.sales > 0 || r.cullTotal > 0;
  });

  /* A BATCH IS A ROW ONLY IF SOMETHING OF IT EXISTS.

     rowFor() makes a row for any ledger line carrying a batch name, and some
     lines carry one while contributing nothing: an unapproved stock
     calibration, a transfer of nought, a line keyed and zeroed. The batch
     then appeared as a row of dashes and noughts — no date, no breed, no
     supplier, nothing received — which reads as a batch that exists and has
     nothing in it. It is not a batch; it is one stray ledger line.

     Kept if it was ever received (a Seeds_Received row sets seedsDate even
     when its quantity is nought, so a genuine keying error stays visible), or
     if anything at all has moved. Only a batch with neither goes. */
  const _losMoved = (r) => !!(r.received || r.damaged || r.planted || r.trans ||
    r.premium || r.dtone || r.dtoneTray || r.cull1 || r.cull2 || r.cull3 || r.transfer ||
    r.sales || r.calibration);
  const rows = Object.values(rowsByBatch).filter(r => r.seedsDate || _losMoved(r));

  // Years/suppliers offered by their pickers come from the data, so there
  // is never a choice offered that has no batch behind it. Cheap enough to
  // keep in sync here regardless of which caller is asking — Seed In
  // Report doesn't use either picker, but nothing is hurt by refreshing
  // them anyway.
  const years = [...new Set(rows.map(r => (r.seedsDate || '').slice(0, 4)).filter(Boolean))]
    .sort((a, b) => b.localeCompare(a));
  _losSyncYearOptions(years);
  _losSyncSupplierOptions([...new Set(rows.map(r => r.supplier).filter(s => s && s !== '—'))].sort());

  /* HAS ANYBODY CHECKED THESE FIGURES? A second walk of the same ledger,
     deliberately kept out of the figure-building above: the figures are one
     question and the signatures are another, and a reader of either half
     should not have to step over the other. Sets r.ver / r.verKnown /
     r.verStages / r.verPending — see _losApplyVerification(). */
  _losApplyVerification(rows, logsRes.data, { stageSigned, rowSigned, verReadable, asAt });

  /* ── IS EACH BATCH FINISHED? ─────────────────────────────────────────────
     The Batch Record list's rule, out of shared/shared_batch_completed.js,
     so the two lists cannot answer differently.

     The LINES are cut at the As At and the SIGNATURES are not — the same
     split every other As At rule on this report follows, and what lets
     September go on reading as September did. The rejections are not cut
     either: an amendment still open today is open. */
  const _losInAsAt = (l) => { const d = _logDate(l); return !(asAt && d && d > asAt); };
  const _losOfType = (types, cut) => (logsRes.data || []).filter(
    l => types.indexOf(l.transaction_type) >= 0 && (!cut || _losInAsAt(l)));
  const completedSet = (typeof MJMBatchCompleted === 'undefined') ? null
    : MJMBatchCompleted.compute({
        transplants:        _losOfType(['Transplanted', 'Transplanted_Premium',
                                        'Transplanted_DoubleTone'], true),
        transfers:          _losOfType(['Cull3_Transfer'], true),
        cull3:              _losOfType(['3rd_Culling'], true),
        /* OUT OF THEIR OWN READ, not out of logsRes. The ledger query asks
           for the transaction types this report draws figures from, and
           Row_Verification is not one of them — taking the sign-offs from
           it gives an EMPTY list, so no batch could ever be completed by
           the row-by-row route and only a whole-stage signature would do
           it. rowVerRes is the read that exists for exactly this. */
        rowVerifications:   (rowVerRes && rowVerRes.data) || [],
        stageVerifications: (stageVerRes && stageVerRes.data) || [],
        rejections:         _losOfType(['Review_Rejection'], false),
        /* Cut like any other line: an adjustment approved in October has
           not settled anything as at September. */
        calibrations:       _losOfType(['Stock_Calibration'], true)
      }).completed;
  rows.forEach(r => { r.completed = !!(completedSet && completedSet.has(r.batch)); });

  return rows;
}

/* ── The verification pass ─────────────────────────────────────────────────
   One walk of the ledger counting, per batch and per stage, how many lines
   there are and how many of them somebody has signed off. The figures above
   are untouched: nothing is zeroed, nothing is hidden, and a reader who
   ignores all of this gets exactly the report they got before. What it adds
   is the ability to say which figures are settled.

   The AS AT cut-off applies to the LINES, because a line dated after it
   takes no part in any figure on screen and so has no bearing on whether
   that figure is checked. It does NOT apply to the signatures — see the long
   note above LOS_GROUP_OF_TYPE.

   Called with the row array AFTER the phantom-batch filter, so a stray
   ledger line that is not a batch cannot conjure a verification state for a
   batch that is not on the report. */
function _losApplyVerification(rows, logs, ctx) {
  const byBatch = {};
  rows.forEach(r => {
    // Rebuilt from nothing each pass: a stale tally from a previous run of
    // the report would be a figure claiming a signature it no longer has.
    r.ver = {};
    byBatch[r.batch] = r;
  });

  (logs || []).forEach(l => {
    const r = byBatch[l && l.batch_name]; if (!r) return;
    const group = LOS_GROUP_OF_TYPE[l.transaction_type]; if (!group) return;
    const d = _logDate(l);
    if (ctx.asAt && d && d > ctx.asAt) return;
    const tal = r.ver[group] || (r.ver[group] = { lines: 0, signed: 0, waiting: 0 });
    tal.lines++;
    /* _losLineSigned is the SAME test the figures were built with — see the
       note on verOnly in _losBuildAllRows. One rule, so the tally cannot
       disagree with the figure it is explaining. */
    if (_losLineSigned(l, ctx)) tal.signed++;
    /* What the figure would gain if somebody signed the rest, which is what
       the hover tells a reader who wants to know whether to wait for it. */
    else tal.waiting += Math.abs(Number(l.quantity_change || 0));
  });

  /* verKnown is false when neither sign-off table could be read. Every
     figure then reads exactly as it did before any of this existed, and the
     report SAYS it could not tell — it does not quietly call the whole
     nursery unverified, and it does not quietly call it verified either.

     verStages are the groups a batch actually has data for: one not yet
     transplanted is not "awaiting transplanting verification", it has
     nothing to verify there. verPending is whichever of those nobody has
     finished signing. */
  rows.forEach(r => {
    r.verKnown = !!ctx.verReadable;
    if (!r.verKnown) r.ver = {};
    r.verStages  = LOS_GROUP_ORDER.filter(g => _losStageState(r.ver[g]) !== 'n/a');
    r.verPending = r.verStages.filter(g => _losStageState(r.ver[g]) !== 'ok');
  });
}

// Life of Seedling's own filtering on top of _losBuildAllRows() — nursery
// type, active/completed, As At month/year, age band, breed, supplier.
// Returns null if the fetch failed (already reported by _losBuildAllRows()).
async function _losBuildData() {
  const breed    = document.getElementById('f-breed').value;
  const nursery  = (document.getElementById('f-los-nursery')  || {}).value || '';
  const status   = (document.getElementById('f-los-status')   || {}).value || '';
  const ageBand  = (document.getElementById('f-los-age')      || {}).value || '';
  const verPick  = (document.getElementById('f-los-verified') || {}).value || '';
  const done     = status === 'completed';
  /* The As At that is on screen, and only that one. Asking the hidden pair
     as well is how a picker nobody can see goes on filtering — the Pre-
     Nursery culling chip had exactly that bug. */
  const dayPick  = done ? '' : ((document.getElementById('f-los-date') || {}).value || '');
  const year     = done ? ((document.getElementById('f-los-year')  || {}).value || '') : '';
  const month    = done ? ((document.getElementById('f-los-month') || {}).value || '') : '';

  /* Looking at what is still going: the day picked, or no cut-off at all,
     which is everything up to today.

     Looking at what has finished: the month or year picked is WHEN it
     finished, so the cut-off is the end of it — a batch that ended inside
     the window has nothing after it to leave out anyway, and one that ended
     later is not in the window at all. `fin` below is the window itself. */
  const asAt = done ? _losAsAt(year, month) : dayPick;
  const fin  = done && year ? _losFinishedWindow(year, month) : null;

  /* ONLY VERIFIED DATA — the office's rule, and the one thing Life of
     Seedlings asks of this builder that no other report does. See the note
     on verOnly inside it. */
  const allRows = await _losBuildAllRows(asAt, { verifiedOnly: true });
  if (!allRows) return null;

  // ── Filters ── nothing picked means no filtering, so the report opens on
  // everything — active and completed alike — rather than on a slice nobody
  // asked for.
  const band = LOS_AGE_BANDS.find(b => b.value === ageBand);
  let rows = allRows.filter(r => {
    if (breed && r.breed !== breed) return false;
    if (status === 'active' && r.completed) return false;
    if (done && !r.completed) return false;
    /* Finished INSIDE the window, not merely finished by the end of it.
       "Completed · September" is a question about September — a batch that
       ended in August is not an answer to it, and listing it turns the month
       picker back into the cut-off the day picker already was. */
    if (fin) {
      const f = r.lastDate ? String(r.lastDate).slice(0, 10) : '';
      if (!f || f < fin.from || f > fin.to) return false;
    }
    /* Compared as YYYY-MM-DD text, not as timestamps. Both sides are already
       that shape, the ordering is the same either way, and it leaves no
       midnight for a batch to slip through: parsing "2025-05-31" and adding
       a day to take in the whole of it lands exactly on the 1st of June,
       which then let a batch received THAT MORNING past an As At of May. */
    if (asAt && r.seedsDate && String(r.seedsDate).slice(0, 10) > asAt) return false;
    if (nursery === 'pre'  && r.preBalance  <= 0) return false;
    if (nursery === 'main' && r.mainBalance <= 0) return false;
    if (band && (r.ageMonths == null || r.ageMonths < band.min || r.ageMonths > band.max)) return false;
    /* VERIFIED / AWAITING. Asked of the batch's stages that have data, so a
       batch not yet transplanted is not held back for a transplanting
       signature it cannot have.

       Skipped entirely when verKnown is false — the sign-off tables could
       not be read, and a filter that cannot tell the two apart must not
       answer as though it could. The report says so above the table. */
    if (verPick && r.verKnown) {
      if (verPick === 'verified' && (!r.verStages.length || r.verPending.length)) return false;
      if (verPick === 'pending'  && !r.verPending.length) return false;
    }
    return true;
  });

  rows.sort((a, b) => String(b.seedsDate || '').localeCompare(String(a.seedsDate || ''))
                   || String(b.batch).localeCompare(String(a.batch)));

  /* THE TOTAL IS THE SUM OF THE ROWS, PLAINLY.

     It used to leave out any row whose stage was unsigned, because such a
     row showed a DASH and a column of dashes adding up to a number is the
     one shape of wrong that cannot be spotted. There are no dashes now:
     every row shows its VERIFIED figure, so the total is simply their sum
     and it agrees with the column above it line for line.

     `held` counts the rows each field is still WAITING on, which is no
     longer a hole in the total — it is how much of it has yet to arrive,
     and the foot says so. `LOS_GROUPS_OF_FIELD` is the one place that
     mapping lives. */
  const TOT_FIELDS = ['received','doQty','focQty','damaged','planted','transTotal','trans',
    'transMain','transDtone','dtone','cull1','cull1Main','cull1Dtone','cull2','cull3',
    'cullTotal','transfer','sales','calibration','balance'];
  const tot = rows.reduce((s, r) => {
    TOT_FIELDS.forEach(k => {
      const g = LOS_GROUPS_OF_FIELD[k] || [];
      if (g.length && _losHeld(r, g)) s.held[k] = (s.held[k] || 0) + 1;
      s[k] += r[k] || 0;
    });
    if (_losHeld(r, ['seeds_in', 'planting'])) s.held.variance = (s.held.variance || 0) + 1;
    if (r.variance < 0) s.varDown += r.variance;
    else if (r.variance > 0) s.varUp += r.variance;
    return s;
  }, { received:0, doQty:0, focQty:0, damaged:0, planted:0, transTotal:0, trans:0,
       transMain:0, transDtone:0, dtone:0,
       cull1:0, cull1Main:0, cull1Dtone:0, cull2:0,
       cull3:0, cullTotal:0, transfer:0, sales:0, calibration:0, balance:0, varDown:0, varUp:0,
       held:{} });

  // What the drilldowns read. Published only after filtering, so a detail
  // window can never show rows the summary above it is not counting.
  window._losData = { rows, asAt };

  const scope = [
    done ? _losFinishedLabel(year, month) : _losDayLabel(dayPick),
    status === 'active' ? 'active' : done ? 'completed' : 'active & completed',
    nursery === 'pre' ? 'pre-nursery' : nursery === 'main' ? 'main nursery' : '',
    band ? band.label.replace(/\s/g, ' ') : '',
    verPick === 'verified' ? 'verified only' : verPick === 'pending' ? 'awaiting verification' : '',
    breed
  ].filter(Boolean).join(' · ');

  return { rows, tot, scope, breed };
}

async function runLifeOfSeedlings() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const built = await _losBuildData();
  if (!built) return; // error already shown by _losBuildData()
  const { rows, tot, scope, breed } = built;

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  // The per-breed "Seed In Details" tables that used to follow the summary
  // were asked off (Sep 2026) — that detail lives in Nursery Report → Seed
  // In Report, so here it only repeated the summary's own Seed In columns.
  out.innerHTML = _losSummaryHtml(rows, tot, scope);
  // Where the second header row sticks can only be known once the first one
  // has been laid out — see _losStickyHeads().
  _losWireSticky();
}

// Nursery Report → Seed In Report: the same batch-level Seed In figures
// Life of Seedlings always showed (see _losBuildAllRows()), just filtered
// and grouped differently — the simple As At (one day) + Locations chips
// every other Nursery Report sub-report already uses, grouped by
// SUPPLIER rather than breed (see _losSupplierHtml()), instead of Life of
// Seedling's own six-filter set grouped by breed.
async function runSeedInReport() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  // "As At" is a period window here, same as Transplanting/Culling's own
  // date range — f-from is that month's 1st (see monthStartOf() in
  // runReport()), so "As At 31 Aug 2026" means August, not "everything
  // received since the beginning".
  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;
  const selectedLocs = new Set(selectedNurseries());
  const asAt = to || null;

  /* NO verifiedOnly here, deliberately. The Seed In Report answers what
     arrived from the supplier, off the delivery order and the MPOB licence,
     and that is a different question from the one Life of Seedlings asks —
     it reads the ledger as keyed, exactly as it always has. */
  const allRows = await _losBuildAllRows(asAt);
  if (!allRows) return; // error already shown by _losBuildAllRows()

  let rows = allRows.filter(r => {
    if (breed && r.breed !== breed) return false;
    const d = r.seedsDate ? String(r.seedsDate).slice(0, 10) : '';
    if (asAt && d && d > asAt) return false;
    if (from && d && d < from) return false;
    // Every Seed In event is inherently Pre-Nursery — shared_inventory_logs
    // hardcodes plot_name:'Pre-Nursery' on every Seeds_Received row (see
    // operation_batch_detail.html's reception-form save). Ticking a
    // Location that isn't PN genuinely has nothing to show, same as
    // Transplanting Report ticking a nursery a batch never reached.
    if (selectedLocs.size && !selectedLocs.has('PN')) return false;
    return true;
  });
  rows.sort((a, b) => String(b.seedsDate || '').localeCompare(String(a.seedsDate || ''))
                   || String(b.batch).localeCompare(String(a.batch)));

  // Same drilldown-read convention _losBuildData() uses — published only
  // after filtering.
  window._losData = { rows, asAt };

  /* What the seed boards are drawn from — the rows AS SHOWN, after every
     filter, so a board can never be made for a batch the report is not
     showing. Same rule the transplant board follows. */
  _ptSeedRows = _losSeedBoards(rows);

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = _losSupplierHtml(rows) || `
    <div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No seed-in records match the selected filters.</div>`;
  _losWireSticky();
}

/* THE BOARD BUTTON ON A BATCH, and only where there is a board to draw.

   A batch whose seeds have been received and not yet sown into a tray has
   no Planted row, so it has no tray, no quantity and no planting day — and
   a button that answers "there is nothing to draw" is a button somebody
   presses twice before believing it. The count is on it, because a batch
   sown into four trays gives four signs and pressing it once should not be
   a surprise. */
function _losSeedBoardBtn(r) {
  const n = _ptSeedRows.filter(b => String(b.batch) === String(r.batch)).length;
  if (!n) return '';
  const title = 'Papan tanda for the pre-nursery tray' + (n === 1 ? '' : 's')
              + ' batch ' + r.batch + ' was sown into — ' + n + ' board' + (n === 1 ? '' : 's')
              + ', one per tray per day, with the tray, the batch, the breed, how many went in, '
              + 'the day they went in and the month they are due to move out.';
  return `<button type="button" onclick="papanTanam('${_losEsc(String(r.batch).replace(/'/g, "\\'"))}', this)"
    class="no-print ml-1.5 align-middle text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-lg border border-[#cfe3b4] bg-[#eef7e4] text-[#3f6b23] hover:bg-[#e3f0d4]"
    title="${_losEsc(title)}">⬇ ${n}</button>`;
}

/* The D/O + FOC split under the received figure. Said only when it says
   something: a batch with no FOC seeds would otherwise carry a permanent
   "1,000 + FOC 0" under a figure that is already 1,000. */
function _losFocSplit(r) {
  if (!r.focQty && r.doQty === r.received) return '';
  return `<div class="text-[9px] font-bold text-[#8a7a68]">${fmtNum(r.doQty)} + FOC ${fmtNum(r.focQty)}</div>`;
}

/* A BATCH WITH MORE THAN ONE RECEPTION ROW SAYS SO.

   The figure beside this is the newest row's, which is what the Seeds In
   form and the batch list both show — but a batch is meant to have exactly
   one reception row, and one that has two is a stale row left by a repeated
   save or by the created_at update that damaged 224-241. Reading the newest
   is the right answer and hiding the extra row would not be: nothing would
   ever get it deleted, and the ledger would go on disagreeing with itself.

   Click the figure to see them all — the drilldown lists every row, which is
   how somebody tells which one is the real delivery. */
function _losSeedsInDup(r) {
  if (!r.srRows || r.srRows < 2) return '';
  const title = r.srRows + ' Seeds In rows are stored for this batch, and a batch should have '
              + 'one. The figure is the newest, the same one the Seeds In form and the batch '
              + 'list show. Click it to see them all, and run '
              + 'shared/CHECK_duplicate_seeds_in.sql to find every batch like this.';
  return `<div class="text-[9px] font-black text-[#a83020]" title="${_losEsc(title)}">`
       + `⚠ ${r.srRows} reception rows</div>`;
}

/* A figure that can be opened. Everything numeric on this report is one,
   except where there is nothing behind it to show.

   POINTING at it is enough: the records behind it appear beside the pointer,
   with no click. Clicking still opens the same records in a window you can
   filter, sort through and read at length — the tooltip answers "what is
   this number made of" at a glance, the window answers it in full. */
function _losFig(kind, batch, text, cls) {
  /* Escaped for the JS string FIRST, then for the attribute — the other way
     round does nothing, because _losEsc has already turned the apostrophe
     into &#39; by the time the backslash would be added, and the parser
     hands it back as a bare quote that ends the argument early. */
  const arg = _losEsc(String(batch).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
  const on = `onmouseenter="losShowTip(this,'${kind}','${arg}')" onmouseleave="losHideTip()"`
           + ` onfocus="losShowTip(this,'${kind}','${arg}')" onblur="losHideTip()"`;
  return `<button type="button" class="los-fig ${cls || ''}" ${on} onclick="losDrill('${kind}','${arg}')">${text}</button>`;
}
function _losCell(kind, batch, value, cls) {
  if (!value) return `<td class="text-[#8a7a68]">0</td>`;
  return `<td>${_losFig(kind, batch, fmtNum(value), cls)}</td>`;
}

/* The same cell, with its verification state on it. `stages` are the stages
   the figure is made of — one for a plain column, several for a derived one
   like Balance, which is only as checked as the least-checked thing in it.

   A nought still shows as a nought, but it is marked too when the stage
   behind it is unsigned: "0 culled" and "0 culled so far as anybody has
   keyed" are different claims, and on a tab nobody has checked it is the
   second one. A nought with no line behind it at all stays plain — there is
   nothing to verify about a stage the batch has not reached. */
function _losCellV(kind, r, value, cls, stages) {
  const note = _losWaitingNote(r, stages, kind);
  const inner = value
    ? _losFig(kind, r.batch, fmtNum(value), cls)
    : (note ? _losFig(kind, r.batch, '0', 'text-[#8a7a68]') : '');
  if (!inner) return `<td class="text-[#8a7a68]">0</td>`;
  return note ? `<td title="${_losEsc(note)}">${inner}</td>` : `<td>${inner}</td>`;
}

/* ONE COLUMN, THREE FIGURES: the total, and under a rule the two halves it
   is made of.

   Transplant Details and the 1st culling both split into a total and two
   DISJOINT halves, and both were first drawn as three columns each. That
   took the table from seventeen columns to twenty-one, and at twenty-one
   every figure in the report is reading in a column too narrow for it — the
   detail was bought with the legibility of everything beside it.

   A split belongs INSIDE its column, because that is what it is: one figure
   with its composition shown, not three figures that happen to be adjacent.
   The total keeps the column's size and weight so a reader going across a
   row still lands on it; the halves are small and muted underneath, for the
   reader who stops. All three stay clickable and open their own records.

   `parts` is [[label, kind, value], ...]. A half with no label is not drawn
   at all, so a column can carry a split on the batches that have one and
   read as a plain figure on the ones that do not. */
function _losSplitCell(r, kind, value, cls, stages, parts) {
  const head = value
    ? _losFig(kind, r.batch, fmtNum(value), cls)
    : '<span class="text-[#8a7a68]">0</span>';
  /* Nothing to split means nothing to draw: on a batch that has never used
     the d-tone tray the halves say "all of it" and "none of it", which is
     two lines of type for no information. */
  const shown = parts.filter(p => p[2]);
  const split = shown.length < 2 ? '' : `<div class="los-split">${parts.map(p =>
    `<span><span class="los-split-lbl">${_losEsc(p[0])}</span> ${p[2]
      ? _losFig(p[1], r.batch, fmtNum(p[2]), cls)
      : '<span class="text-[#8a7a68]">0</span>'}</span>`).join('')}</div>`;
  const note = _losWaitingNote(r, stages, kind);
  return `<td${value ? '' : ' class="text-[#8a7a68]"'}`
       + (note ? ` title="${_losEsc(note)}"` : '')
       + `>${head}${split}</td>`;
}

/* The same cell in the foot, where there is no batch and no verification —
   the figures open the whole report's records with '*'. */
function _losSplitFoot(kind, total, cls, parts) {
  const shown = parts.filter(p => p[2]);
  const split = shown.length < 2 ? '' : `<div class="los-split">${parts.map(p =>
    `<span><span class="los-split-lbl">${_losEsc(p[0])}</span> ${_losFig(p[1], '*', fmtNum(p[2]), cls)}</span>`
  ).join('')}</div>`;
  return `<td>${_losFig(kind, '*', fmtNum(total), cls)}${split}</td>`;
}

/* THE ROW NO LONGER SAYS WHICH STAGE IT IS WAITING ON, and that is the
   office's call. A line under the batch name used to read "⧗ 2nd culling,
   3rd culling unverified", on the argument that the markers scattered
   across a row are lost if a reader has to collect them by eye.

   The markers are gone. Once an unverified figure stopped being SHOWN and
   became a dash, the row was already saying it — in the one column it
   actually applies to, which is more than the line could say in the space
   it had. The office put it in one sentence: "no need to show which item
   not yet verify, as long as it is not verify, then the data wont appear
   here, while verified, then it will show here based on the date." A
   second answer to a question the table already answers is a second thing
   to read on a row seventeen columns wide, and on the row most people are
   reading it said the same thing twice.

   What is NOT in that, and must stay:

   - **The dash itself**, with its hover and its drilldown. It is the
     answer; taking the LABEL off a row does not take the answer off it.
   - **The note above the table** — how many batches carry an unsigned
     stage. That answers "is there anything missing from what I am about
     to take away", which no dash in a row can answer.
   - **The foot's column-by-column note.** A column of dashes adding up to
     a number is the one shape of wrong that cannot be spotted, so the
     total has to say which of them is light.
   - **The verification filter**, which is a question somebody asks on
     purpose rather than a label following them around.

   `verStages` / `verPending` are still computed for those three. */

/* The same answer again, at the top of the records window a figure opens
   into. A reader who clicks a marked figure to find out what is behind it
   should not have to go back to the table to be reminded why it was marked
   — and for the TOTAL row, where the figure is made of many batches, this
   is the only place the count can be given at all. */
function _losDrillVerNote(kind, batch) {
  const D = window._losData; if (!D) return '';
  const of = LOS_GROUPS_OF_KIND[kind]; if (!of) return '';
  const rows = batch === '*' ? D.rows : D.rows.filter(r => r.batch === batch);
  const known = rows.filter(r => r.verKnown);
  if (!known.length) return '';
  const short = (r) => _losWorst(r, of(r));
  const bad = known.filter(r => { const s = short(r); return s === 'part' || s === 'no'; });
  const box = (cls, text) =>
    `<div class="${cls} border rounded-xl px-3 py-2 mb-3 text-[10px] font-bold">${text}</div>`;
  if (!bad.length) {
    return box('bg-[#eef7e4] border-[#cfe3b4] text-[#3f6b23]',
      '✓ Verified — somebody has signed off every record behind this figure.');
  }
  if (batch === '*') {
    return box('bg-[#fdf6e8] border-[#e8d4a8] text-[#8a5a10]',
      '⧗ ' + fmtNum(bad.length) + ' of ' + fmtNum(known.length) + ' batch' +
      (known.length === 1 ? '' : 'es') + ' behind this total are not verified. ' +
      'The records are listed all the same — an unverified record is what the field has keyed.');
  }
  const names = _losPendingNames(known[0], of(known[0])).join(', ');
  return box('bg-[#fdf6e8] border-[#e8d4a8] text-[#8a5a10]',
    '⧗ Not verified yet: ' + _losEsc(names) + '. These records are what the field has ' +
    'keyed — they may be incomplete, or uncorrected.');
}

/* How the seventeen columns share the width. Fixed layout means these are
   what the browser uses rather than a hint it may ignore, which is what
   gets all seventeen onto the page at once — see .los-table in <style>. The
   ones that carry text or a split (batch/breed, supplier, the received
   figure, the transplant and the 1st culling) get the room; the plain
   figure columns take what is left, evenly.

   Transplant Details and 1st Culled were three columns each for a while,
   which made twenty-one and left every figure in the report reading in a
   column too narrow for it. A split lives INSIDE its column now — see
   _losSplitCell — and the four columns that bought back went to the ones
   that carry text. */
const LOS_COL_WIDTHS = [6, 6, 8.5, 4,
                        6.5, 4.5, 5.5, 5,
                        6.5,
                        6.5, 4.5, 4.5, 5.5,
                        4.5, 5.5, 5.5, 5.5];

/* Which TOTALS are still going to move, column by column — because "3
   batches are unverified" does not tell a reader which of them is light, and
   a batch can be signed off on its seed in and waiting on its 3rd culling.

   Nothing is left OUT of a total any more: every row shows its verified
   figure and the total is their sum. What this says is how many rows behind
   each total are still waiting for a signature, so a reader knows which
   column is going to rise. */
function _losHeldFootNote(tot, total) {
  const named = { received: 'Seed Received', damaged: 'Seed Damage', planted: 'Actual Planted',
    variance: 'Variance Seed In', transTotal: 'Transplant Qty', cull1: '1st Culled',
    cull2: '2nd Culled', cull3: '3rd Culled', cullTotal: 'Total Culled', transfer: 'Transfer',
    balance: 'Balance' };
  const parts = Object.keys(named)
    .filter(k => tot.held && tot.held[k])
    .map(k => named[k] + ' is waiting on ' + fmtNum(tot.held[k]) + ' of ' + fmtNum(total));
  return parts.length ? parts.join(' · ') + '.' : 'nothing in these columns is outstanding.';
}

function _losSummaryHtml(rows, tot, scope) {
  const body = rows.map(r => `
    <tr>
      <td>${fmtDate(r.seedsDate)}</td>
      <td>
        <div class="font-black text-[#3d2610]">${_losEsc(r.batch)}</div>
        <div class="text-[9px] font-bold text-[#8a7a68]">${_losEsc(r.breed)}</div>
      </td>
      <td>
        <div class="text-[10px] font-bold text-[#3d2610]">${_losEsc(r.supplier)}</div>
        <div class="text-[9px] font-bold text-[#8a7a68]">${_losEsc(r.mpob)}</div>
      </td>
      <td class="text-[#8a7a68]">${r.age}</td>
      ${_losTd(r, ['seeds_in'], 'received',
        `${_losFig('received', r.batch, fmtNum(r.received), 'text-[#c07820] font-black')}
         ${_losFocSplit(r)}
         ${_losSeedsInDup(r)}`)}
      ${_losCellV('damaged', r, r.damaged, 'text-[#a83020] font-black', ['planting'])}
      ${_losCellV('planted', r, r.planted, 'font-black', ['planting'])}
      ${_losTd(r, ['seeds_in', 'planting'], 'variance',
        _losFig('variance', r.batch,
          (r.variance > 0 ? '+' : r.variance < 0 ? '−' : '') + fmtNum(Math.abs(r.variance)),
          r.variance < 0 ? 'text-[#a83020] font-black' : r.variance > 0 ? 'text-[#4a7a2e] font-black' : 'text-[#8a7a68]'))}
      ${_losSplitCell(r, 'transTotal', r.transTotal, 'text-[#3a7ab4] font-black', ['transplanting'],
        [['Normal', 'trans', r.transMain], ['DT', 'dtone', r.transDtone]])}
      ${_losSplitCell(r, 'cull1Total', r.cull1Total, 'text-[#a83020] font-black', ['cull_1'],
        [['Normal', 'cull1', r.cull1Main], ['DT', 'cull1Dtone', r.cull1Dtone]])}
      ${_losCellV('cull2', r, r.cull2, 'text-[#a83020]', ['cull_2'])}
      ${_losCellV('cull3', r, r.cull3, 'text-[#a83020]', ['cull_3'])}
      ${_losCellV('cullTotal', r, r.cullTotal, 'text-[#a83020] font-black', LOS_CULLTOTAL_GROUPS(r))}
      ${_losCellV('transfer', r, r.transfer, 'font-black', ['transfer'])}
      ${_losCell('sales', r.batch, r.sales, 'text-[#4a7a2e] font-black')}
      <td>${r.rec.calibration.length
        ? _losFig('calibration', r.batch, fmtSigned(r.calibration), 'font-black')
        : '<span class="text-[#8a7a68]">0</span>'}</td>
      ${_losTd(r, LOS_BALANCE_GROUPS(r), 'balance',
        _losFig('balance', r.batch, fmtNum(r.balance),
          r.balance < 0 ? 'text-[#a83020] font-black' : 'text-[#4a7a2e] font-black'))}
    </tr>`).join('');

  /* WHAT THE READER HAS TO BE TOLD ONCE: every figure below is the VERIFIED
     part, so a batch with rows still to be signed will read higher the day
     they are. A reader taking a total away needs to know it is going to
     move; which row it is waiting on is in that cell's own hover. */
  const known   = rows.filter(r => r.verKnown);
  const pending = known.filter(r => r.verPending.length);
  const verNote = !rows.length ? ''
    : !known.length
      ? `<div class="text-[10px] font-bold text-[#a83020] mb-3">Verification state could not be read, so nothing below is held back. Every figure is the live ledger, checked or not.</div>`
      : pending.length
        ? `<div class="text-[10px] font-bold text-[#c07820] mb-3">Every figure below is the VERIFIED figure — a record nobody has signed off takes no part in it. ${fmtNum(pending.length)} of ${fmtNum(known.length)} batch${known.length === 1 ? '' : 'es'} still carry records waiting for a signature, so those figures will rise as they are signed. Point at one to see what it is still waiting for, or click it for the records behind it.</div>`
        : `<div class="text-[10px] font-bold text-[#4a7a2e] mb-3">✓ Every record behind the figures below has been signed off.</div>`;

  return `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4 gap-4 flex-wrap">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Life of Seedlings</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} batch${rows.length === 1 ? '' : 'es'}${scope ? ' · ' + _losEsc(scope) : ''}</div>
      </div>
      <div class="text-[10px] font-bold text-[#8a7a68] mb-3 no-print">Point at any figure to see the records behind it — click to open them in full.</div>
      ${verNote}
      <div class="los-wrap">
        <table class="report-table los-table">
          <colgroup>${LOS_COL_WIDTHS.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
          <thead>
            <tr>
              <th rowspan="2">Seed In Date</th>
              <th rowspan="2">Batch / Breed</th>
              <th rowspan="2">Supplier / MPOB Licence</th>
              <th rowspan="2">Age</th>
              <th colspan="4" class="los-grp">Seed In Details</th>
              <th rowspan="2" title="Every main-plot transplant this batch has made — the same total the batch report splits into its Main Plot and Main Plot (D-Tone) cards. Under the rule: Normal is the Main Plot card, a transplant out of an ordinary pre-nursery tray, and DT is the Main Plot (D-Tone) card, one out of the DOUBLE-TONE tray. The two add up to the total. Not the Double Tone Quantity in Nursery, which counts what is STANDING and can be above nought on a batch that has transplanted nothing.">Transplant Qty</th>
              <th colspan="4" class="los-grp">Culled Detail</th>
              <th rowspan="2">Transfer</th>
              <th rowspan="2">Total Sales</th>
              <th rowspan="2">Stock Calibration</th>
              <th rowspan="2" title="Transplant qty − 3rd culling − total sales + approved stock calibration: what the batch still has standing in the field. The 1st culling is not taken off, because it happened in the tray and the transplant quantity is already net of it; the 2nd culling never deducts, because the 3rd is keyed against the original transplanted figure and already contains it. A transfer moves seedlings between two plots of the same batch, so it is not part of this.">Balance</th>
            </tr>
            <tr>
              <th title="The delivery order quantity plus the FOC seeds that came with it">Seed Received (D/O) + FOC Qty</th>
              <th>Seed Damage</th>
              <th>Actual Planted</th>
              <th title="Actual planted − (seed received − seed damage). Negative means fewer seeds were planted than arrived.">Variance Seed In</th>
              <th title="Every 1st culling this batch has made. A 1st culling happens in a TRAY, and under the rule is that total split by which tray: Normal is an ordinary pre-nursery tray, DT is the DOUBLE-TONE tray. The two add up to the total.">1st Culled</th>
              <th>2nd Culled</th>
              <th>3rd Culled</th>
              <th title="1st culled + 3rd culled, the WHOLE 1st culling, d-tone tray included. The 2nd culled is not added: the 3rd is keyed against the original transplanted figure and already contains it — while no 3rd has been recorded, the 2nd stands in its place.">Total Culled (1st + 3rd)</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length ? body : `<tr><td colspan="17" class="py-10 text-[#8a7a68]">No batches match the selected filters.</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="4" class="uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td>${_losFig('received', '*', fmtNum(tot.received), 'text-[#c07820] font-black')}
              <div class="text-[9px] font-bold text-[#8a7a68]">${fmtNum(tot.doQty)} + FOC ${fmtNum(tot.focQty)}</div></td>
            <td>${_losFig('damaged', '*', fmtNum(tot.damaged), 'text-[#a83020] font-black')}</td>
            <td>${_losFig('planted', '*', fmtNum(tot.planted), 'font-black')}</td>
            <td>
              <div class="text-[#a83020] font-black">${tot.varDown ? '−' + fmtNum(Math.abs(tot.varDown)) : '0'}</div>
              <div class="text-[9px] font-bold text-[#8a7a68]">sum of all less received</div>
              <div class="text-[#4a7a2e] font-black mt-1">${tot.varUp ? '+' + fmtNum(tot.varUp) : '0'}</div>
              <div class="text-[9px] font-bold text-[#8a7a68]">sum of all more received</div>
            </td>
            ${_losSplitFoot('transTotal', tot.transTotal, 'text-[#3a7ab4] font-black',
              [['Normal', 'trans', tot.transMain], ['DT', 'dtone', tot.transDtone]])}
            ${_losSplitFoot('cull1Total', tot.cull1, 'text-[#a83020] font-black',
              [['Normal', 'cull1', tot.cull1Main], ['DT', 'cull1Dtone', tot.cull1Dtone]])}
            <td>${_losFig('cull2', '*', fmtNum(tot.cull2), 'text-[#a83020]')}</td>
            <td>${_losFig('cull3', '*', fmtNum(tot.cull3), 'text-[#a83020]')}</td>
            <td>${_losFig('cullTotal', '*', fmtNum(tot.cullTotal), 'text-[#a83020] font-black')}</td>
            <td>${_losFig('transfer', '*', fmtNum(tot.transfer), 'font-black')}</td>
            <td>${_losFig('sales', '*', fmtNum(tot.sales), 'text-[#4a7a2e] font-black')}</td>
            <td>${_losFig('calibration', '*', fmtSigned(tot.calibration), 'font-black')}</td>
            <td>${_losFig('balance', '*', fmtNum(tot.balance), 'text-[#4a7a2e] font-black')}</td>
          </tr>${pending.length ? `<tr><td colspan="17" class="text-left text-[9px] font-bold text-[#c07820] bg-[#fdf6e8]">These totals are the VERIFIED figures and will rise as the rest is signed off — ${_losHeldFootNote(tot, rows.length)}</td></tr>` : ''}</tfoot>` : ''}
        </table>
      </div>
    </div>`;
}

/* ── The Seed In detail, one table per breed ──────────────────────────────
   The same batches as the summary above, split by breed and showing only
   what came in: who supplied it, how much arrived, how much was damaged and
   how much of it was actually planted. With no breed picked every breed gets
   its own table; with one picked, only that one. The supplier filter has
   already narrowed the rows by the time they arrive here, which is what
   makes "same supplier, two breeds" read as two tables rather than one
   mixed list. */
const LOS_BREED_COL_WIDTHS = [13, 11, 24, 16, 12, 12, 12];

function _losBreedHtml(rows, breed, supplier) {
  if (!rows.length) return '';
  const groups = {};
  rows.forEach(r => { (groups[r.breed] = groups[r.breed] || []).push(r); });
  const names = Object.keys(groups).sort();
  return names.map(name => {
    const list = groups[name];
    const t = list.reduce((s, r) => ({
      received: s.received + r.received, damaged: s.damaged + r.damaged,
      planted: s.planted + r.planted,
      varDown: s.varDown + (r.variance < 0 ? r.variance : 0),
      varUp:   s.varUp   + (r.variance > 0 ? r.variance : 0)
    }), { received: 0, damaged: 0, planted: 0, varDown: 0, varUp: 0 });
    return `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4 gap-4 flex-wrap">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seed In Details — ${_losEsc(name)}</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(list.length)} batch${list.length === 1 ? '' : 'es'}${supplier ? ' · ' + _losEsc(supplier) : ''}</div>
      </div>
      <div class="los-wrap">
        <table class="report-table los-table">
          <colgroup>${LOS_BREED_COL_WIDTHS.map(w => `<col style="width:${w}%">`).join('')}</colgroup>

              <th rowspan="2">Seed In Date</th>
              <th rowspan="2">Batch</th>
              <th rowspan="2">Supplier / MPOB Licence</th>
              <th colspan="4" class="los-grp">Seed In Details</th>
            </tr>
            <tr>
              <th>Seed Received (D/O) + FOC Qty</th>
              <th>Seed Damage</th>
              <th>Actual Planted</th>
              <th>Variance Seed In</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(r => `
              <tr>
                <td>${fmtDate(r.seedsDate)}</td>
                <td class="font-black text-[#3d2610]">${_losEsc(r.batch)}</td>
                <td>
                  <div class="text-[10px] font-bold text-[#3d2610]">${_losEsc(r.supplier)}</div>
                  <div class="text-[9px] font-bold text-[#8a7a68]">${_losEsc(r.mpob)}</div>
                </td>
                <td>
                  ${_losFig('received', r.batch, fmtNum(r.received), 'text-[#c07820] font-black')}
                  ${_losFocSplit(r)}
                </td>
                ${_losCell('damaged', r.batch, r.damaged, 'text-[#a83020] font-black')}
                ${_losCell('planted', r.batch, r.planted, 'font-black')}
                <td>${_losFig('variance', r.batch,
                  (r.variance > 0 ? '+' : r.variance < 0 ? '−' : '') + fmtNum(Math.abs(r.variance)),
                  r.variance < 0 ? 'text-[#a83020] font-black' : r.variance > 0 ? 'text-[#4a7a2e] font-black' : 'text-[#8a7a68]')}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-[#c07820]">${fmtNum(t.received)}</td>
            <td class="text-[#a83020]">${fmtNum(t.damaged)}</td>

              <div class="text-[#a83020]">${t.varDown ? '−' + fmtNum(Math.abs(t.varDown)) : '0'}</div>
              <div class="text-[#4a7a2e]">${t.varUp ? '+' + fmtNum(t.varUp) : '0'}</div>
            </td>
