<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — MJM Nursery AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { background:#f8f4ec; margin:0; font-family:'Outfit', system-ui, sans-serif; color:#1a150d; }
  .bg-pattern { position:fixed; inset:0; background-image:radial-gradient(#e8dcc8 1px, transparent 1px); background-size:24px 24px; z-index:-2; opacity:.5; }
  .glass-panel { background-color:rgba(253, 250, 244, .95); backdrop-filter:blur(24px); border:1px solid #fff; box-shadow:0 25px 50px -12px rgba(61, 38, 16, .08); border-left:12px solid #6aa83c; }

  .input-style { border:1.5px solid #e8dcc8; background:#fff; padding:10px 12px; border-radius:12px; outline:none; width:100%; font-weight:600; font-size:13px; color:#1a150d; }
  .input-style:focus { border-color:#c07820; box-shadow:0 0 0 4px rgba(192, 120, 32, .15); }
  .label-style { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.15em; color:#8a7a68; margin-left:4px; margin-bottom:6px; display:block; }
  .btn-earth { background:linear-gradient(135deg, #6aa83c, #4a7a2e); color:white; font-weight:900; padding:12px 24px; border-radius:12px; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; box-shadow:0 8px 20px -4px rgba(74, 122, 46, .5); border:none; font-size:12px; }
  .btn-earth:hover { transform:translateY(-2px); }

  /* Report picker as a connected tab strip — one bar with dividers between
     tabs and the active one picked out by its own underline, not separate
     pill buttons with gaps between them. */
  .report-tab-bar { display:flex; flex-wrap:wrap; border:1px solid #e8dcc8; border-radius:12px; overflow:hidden; width:fit-content; max-width:100%; margin:0 auto; }
  .report-tab {
    padding:12px 20px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color:#8a7a68; background:#fdfaf4; border:none; border-right:1px solid #e8dcc8;
    border-bottom:3px solid transparent; cursor:pointer; transition:color .15s, background .15s, border-color .15s;
    white-space:nowrap;
  }
  .report-tab:last-child { border-right:none; }
  .report-tab:hover:not(.active) { color:#4a7a2e; background:#f5f0e4; }
  .report-tab.active { color:#3d2610; background:#fff; border-bottom-color:#4a7a2e; }

  table.report-table { width:100%; border-collapse:separate; border-spacing:0; }
  .report-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#8a7a68; padding:12px 14px; border-bottom:2px solid #e8dcc8; background:#fdfaf4; white-space:nowrap; }
  /* "th.text-right" outranks the plain "th" rule above (two selectors beat
     one), which a bare Tailwind ".text-right" utility on a <th> cannot —
     equal specificity, same rule wins, so a right-aligned header stayed
     left-aligned while its numbers underneath (plain <td>, nothing to
     out-rank) lined up fine. Without this, every right-aligned figure
     column in every report has a header that doesn't sit over its data. */
  .report-table th.text-right { text-align:right; }
  .report-table td { font-size:13px; font-weight:600; color:#1a150d; padding:14px; border-bottom:1px solid #f3efe6; }
  /* No hover-highlight — these rows aren't clickable, so a colour change on
     pointing at one only implied an interaction that wasn't there. */
  /* Numeric cells across every report use tabular-nums so digits align
     column-for-column and rows read as a clean matrix. */
  .report-table td, .report-table th { font-variant-numeric: tabular-nums; }
  /* The movement reports carry a dozen narrow figure columns. Centring the
     heading over its figures keeps each column reading as one block, and a
     long heading — "Transplanted from PN" — wraps onto a second line instead
     of stretching its column wide enough to hold it on one. Figures
     themselves are right-aligned — centring a number doesn't line its digits
     up the way it does a short heading, and a dozen centred columns of
     different widths was exactly what read as "hard to see". */
  .movement-table th { text-align:center; white-space:normal; line-height:1.3; max-width:96px; }
  .movement-table td { text-align:right; }
  .movement-table th:first-child, .movement-table th:nth-child(2), .movement-table th:nth-child(3) { text-align:left; max-width:none; }
  /* Label cells (group name, other-of, age) by class, not :nth-child — the
     group-name cell is a rowspan that's only emitted on a group's FIRST
     row, so every later row in a multi-row group has one fewer <td> before
     the figures. :nth-child(3) then landed on the B/F figure instead of
     Age on those rows, forcing that one numeric column left on every row
     but a group's first — the B/F column that looked "not right-aligned"
     while every other figure in the table was. */
  .movement-table td.col-label { text-align:left; max-width:none; }
  /* A visible rule between every column — a dozen unbroken figure columns
     otherwise blur into one wide field. */
  .movement-table th, .movement-table td { border-right:1px solid #efe6d4; }
  .movement-table th:last-child, .movement-table td:last-child { border-right:none; }
  /* The row divider (.report-table td's default border-bottom:1px solid
     #f3efe6) is lighter than the zebra stripe it sometimes sits on
     (#f0e6d2) — against that darker band it all but disappears. Darker
     here, so the line between rows stays visible whichever band it's on. */
  .movement-table td { border-bottom:1px solid #d9c8a3; }
  /* The header stays put while a long table scrolls past underneath it —
     wrapped in .movement-scroll below, which is what actually scrolls. */
  .movement-scroll { max-height:70vh; overflow-y:auto; }
  /* Only Pre-Nursery ever has a second ("Transfer Out") header row above the
     column names — Main Nursery's is always one row. Both cases need the
     LAST header row pinned with the shadow that marks the sticky edge; a
     first row that isn't also the last (Pre-Nursery's group row) sticks
     above it without its own shadow, so the two don't draw two edges. */
  .movement-table thead tr:first-child th { position:sticky; top:0; z-index:2; box-shadow:0 2px 0 #e8dcc8; }
  .movement-table thead tr:first-child:not(:last-child) th { box-shadow:none; }
  .movement-table thead tr:last-child:not(:first-child) th { position:sticky; top:33px; z-index:2; box-shadow:0 2px 0 #e8dcc8; }
  /* Seedling Sales grid: 14 columns (Year, 12 months, Total). Fix the
     layout so every month gets the same width regardless of value, and
     the year column stays narrow so it doesn't dominate the row. */
  .sales-table { table-layout: fixed; }
  .sales-table col.c-year  { width: 7%;  }
  .sales-table col.c-month { width: 6.5%; }
  .sales-table col.c-total { width: 9%;  }
  .sales-table th,
  .sales-table td { padding: 10px 8px; }
  .funnel-bar { height:14px; background:#f3efe6; border-radius:999px; overflow:hidden; display:flex; box-shadow:inset 0 1px 2px rgba(0,0,0,.05); }
  .funnel-seg { height:100%; transition:width .5s ease-out; }
  .seg-seeds   { background:#c07820; }
  .seg-planted { background:#6aa83c; }
  .seg-trans   { background:#3a7ab4; }
  .seg-cull    { background:#a83020; }

  /* Nursery multi-select chips */
  .nursery-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; background:#fff; border:1.5px solid #e8dcc8; cursor:pointer; font-size:11px; font-weight:700; color:#3d2610; user-select:none; }
  .nursery-chip:has(input:checked) { background:#e8f5da; border-color:#6aa83c; }
  .nursery-chip input { accent-color:#4a7a2e; }

  @media print {
    body { background:white; }
    .no-print, .glass-panel, header { box-shadow:none !important; border:none !important; }
    .no-print { display:none !important; }
    table { box-shadow:none !important; }
  }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="bg-pattern"></div>

<div class="w-full max-w-[1600px] mx-auto z-10 space-y-6 py-4">

  <!-- Header -->
  <div class="glass-panel p-6 rounded-[2rem] flex flex-col md:flex-row items-center justify-between gap-4 !border-[#3d2610]">
    <button onclick="window.location.href='operation_dashboard.html'" class="no-print text-[10px] font-bold text-[#8a7a68] hover:text-[#3d2610] uppercase tracking-widest bg-[#f8f4ec] hover:bg-[#e8dcc8] px-5 py-3 rounded-xl flex items-center gap-2 shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Back to Main Page
    </button>
    <h1 class="text-2xl md:text-3xl font-black uppercase tracking-widest text-[#3d2610]">📊 Operation Reports</h1>
    <button onclick="window.print()" class="no-print text-[10px] font-black text-white uppercase tracking-widest bg-[#3d2610] hover:bg-[#1a150d] px-5 py-3 rounded-xl shadow">Print / Export</button>
  </div>

  <!-- Forbidden state -->
  <div id="forbidden" class="glass-panel p-10 rounded-[2rem] hidden text-center">
    <div class="text-4xl mb-3">🔒</div>
    <h2 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">No Access</h2>
    <p class="text-xs text-[#8a7a68] mt-2">Ask an administrator to grant you access to the Operation module.</p>
  </div>

  <!-- space-y so the filter panel, the loading line and the report itself are
       never flush against one another, whichever of them is on screen. -->
  <div id="report-area" class="space-y-6">

    <!-- Report selector + filters -->
    <div class="glass-panel p-5 rounded-[2rem] no-print">
      <!-- Date/filter row first, then the report tabs, then the data below
           (outside this panel). f-report stays as the state the rest of the
           page reads (syncFilterVisibility, runReport, syncReportDefaults,
           …) exactly the way it read a <select>'s .value before; the tabs
           just keep it in sync now instead of a dropdown. Whichever filters
           the picked report needs sit centred in their own row — most
           reports only need one or two of them, and centring reads as
           "here's what's on offer" rather than a row anchored to the left
           with the rest of its width empty. -->
      <input type="hidden" id="f-report">
      <div class="flex flex-wrap gap-3 items-end justify-center mb-3">
        <!-- One date, not a range — every report is "as at" a day now. A
             report that needs a period (Movement's Culled/Transplanted/etc
             columns, "this month's activity") gets it derived from this one
             date's calendar month (monthStartOf()) rather than asking for a
             second field — see the f-from hidden input below and
             runReport(). -->
        <input type="hidden" id="f-from">
        <div class="f-range w-[9.5rem]">
          <label class="label-style !mb-1" id="f-to-label">As At</label>
          <input id="f-to" type="date" class="input-style">
        </div>
        <div class="f-sort hidden w-32">
          <label class="label-style !mb-1">Sort by</label>
          <div class="select-wrapper">
            <select id="f-sort" class="input-style">
              <option value="plot">Plot</option>
              <option value="batch">Batch</option>
            </select>
          </div>
        </div>
        <div class="f-nursery-inline hidden">
          <div class="flex items-center justify-between mb-1 gap-3">
            <span class="label-style !mb-0">Locations</span>
            <div class="flex gap-3 text-[10px] font-black uppercase tracking-widest">
              <button type="button" id="f-nurs-all" class="text-[#4a7a2e] hover:underline">All</button>
              <button type="button" id="f-nurs-none" class="text-[#a83020] hover:underline">Clear</button>
            </div>
          </div>
          <div id="f-nursery-chips" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="f-breed w-44">
          <label class="label-style !mb-1">Breed</label>
          <select id="f-breed" class="input-style">
            <option value="">All breeds</option>
          </select>
        </div>
        <div class="f-sales-mode hidden">
          <label class="label-style !mb-1">View</label>
          <div class="flex bg-white border border-[#e8dcc8] rounded-xl p-1">
            <button type="button" id="f-mode-table" class="px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest bg-[#3d2610] text-white">Table</button>
            <button type="button" id="f-mode-chart" class="px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-[#3d2610]">Chart</button>
          </div>
        </div>
        <!-- Normal flow, not pushed to the row's far edge — with Category
             and Report now sharing this row there's usually something
             right before it; forcing it to the edge just re-opens the same
             dead-space gap for reports with few filters. -->
        <button id="f-run" class="btn-earth">Run Report</button>
        <div class="w-full f-sales-years hidden">
          <div class="flex items-center justify-between mb-1">
            <span class="label-style !mb-0">Years</span>
            <div class="flex gap-3 text-[10px] font-black uppercase tracking-widest">
              <button type="button" id="f-yr-all" class="text-[#4a7a2e] hover:underline">All</button>
              <button type="button" id="f-yr-none" class="text-[#a83020] hover:underline">Clear</button>
            </div>
          </div>
          <div id="f-year-chips" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
      <!-- Tab bar after the date/filter row now — pick the date first (it's
           the one thing every report shares), then which report, then the
           data appears below. Centred (.report-tab-bar is width:fit-content
           + margin:auto), not stretched to the panel's full width. -->
      <div class="report-tab-bar" id="f-report-tabs"></div>
    </div>

    <!-- Loading state -->
    <div id="loading" class="text-center py-12 text-xs font-bold text-[#8a7a68] uppercase tracking-widest animate-pulse">Loading…</div>

    <!-- Report container -->
    <div id="report-output" class="hidden space-y-6"></div>

  </div>

</div>

<!-- Movement Report's Sold hover tooltip — same pattern as Tab 6's Sales
     tooltip in operation_batch_detail.html (see showT6SalesTip there). -->
<div id="mv-sales-tip" class="hidden fixed z-[9500] pointer-events-none bg-white border border-[#e8dcc8] rounded-2xl shadow-[0_12px_32px_rgba(26,21,13,0.25)] px-4 py-3 max-w-[340px]"></div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);

const STAGE_TYPES = {
  seeds:   ['Seeds_Received'],
  planted: ['Planted'],
  trans:   ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'],
  cull1:   ['1st_Culling'],
  cull2:   ['2nd_Culling'],
  cull3:   ['3rd_Culling']
};

function fmtNum(n)   { return (n || 0).toLocaleString(); }
function fmtPct(n)   { return (Math.max(0, Math.min(999, n || 0))).toFixed(2) + '%'; }
function fmtDate(d)  { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' }); }
// Same thousand-separator grouping as fmtNum, kept at 2 decimals — a
// subtotal like RM 33390.00 read as one long unbroken run of digits;
// toLocaleString groups it the same way fmtNum already groups quantities.
function fmtMoney(n) { return (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

async function loadBreeds() {
  const { data } = await _supabase.from('shared_breeds').select('name').order('name');
  const sel = document.getElementById('f-breed');
  (data || []).forEach(b => {
    const o = document.createElement('option');
    o.value = b.name; o.textContent = b.name;
    sel.appendChild(o);
  });
}

/**
 * Batch Production Summary
 *
 * Per batch, aggregate quantity_change by transaction_type group:
 *   seeds_in          = SUM(Seeds_Received)
 *   damaged           = ABS(SUM(Damaged_Seeds))   // not in funnel; shown for context
 *   planted           = SUM(Planted)
 *   transplanted      = SUM(Transplanted | _Premium | _DoubleTone)
 *   cull_1/2/3        = ABS(SUM(1st/2nd/3rd_Culling))
 *
 * Final alive  = transplanted − cull_1 − cull_2 − cull_3   (post-transplant losses only)
 * Survival %   = final alive / seeds_in × 100
 */
async function runBatchProduction() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  // No From — this report is every batch's whole funnel up to a point in
  // time, not a period, so there's only a To ("as at") to read.
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;

  // Fetch all batches up to the To date — anchor date is Seeds_Received transaction_date.
  // plot_name joins us to nursery (main-nursery drilldowns need it).
  const [logsRes, batchesRes, plotsRes] = await Promise.all([
    // Paged — a single request stops at 1000 rows, which quietly dropped the
    // older batches out of the funnel entirely.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      // breed_name comes off the log too — bulk-imported batches don't
      // have an operation_batches mirror row, so we can't rely on that
      // table alone to name the source.
      .select('batch_name, transaction_type, quantity_change, transaction_date, created_at, remark, plot_name, breed_name')
      // Only the funnel's types — the aggregation loop ignores everything
      // else anyway, and pulling the full table (photo rows, calibration,
      // audit notes…) was hammering the database on every report open.
      .in('transaction_type', ['Seeds_Received', 'Damaged_Seeds', 'Planted',
          'Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone',
          '1st_Culling', '2nd_Culling', '3rd_Culling'])
      .order('id', { ascending: true })),
    _supabase.from('operation_batches').select('name, breed_name, created_at'),
    _supabase.from('shared_plots').select('plot_name, nursery_name')
  ]);

  const { data: logs, error: logErr } = logsRes;
  if (logErr) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logErr.message}</div>`;
    return;
  }

  const batches = batchesRes.data || [];
  const meta = {};
  batches.forEach(b => { meta[b.name] = b; });

  // Nursery lookup — Pre-Nursery holding trays map to a virtual "Pre-Nursery"
  // slot; main-nursery plots resolve via shared_plots.nursery_name; anything
  // missing lands in "Unassigned" so it's still visible in the drilldown.
  const plotToNursery = {};
  (plotsRes.data || []).forEach(p => {
    if (p.plot_name) plotToNursery[p.plot_name] = p.nursery_name || 'Unassigned';
  });
  const nurseryOf = (plot) => {
    if (!plot) return 'Unassigned';
    if (PRE_NURSERY_PLOTS.includes(plot)) return 'Pre-Nursery';
    return plotToNursery[plot] || 'Unassigned';
  };

  // Group logs by batch. Also track per-batch damaged qty (for the seeds
  // drilldown) and raw records per stage (for the transplant / cull
  // drilldowns).
  const byBatch = {};
  (logs || []).forEach(l => {
    const b = l.batch_name; if (!b) return;
    if (!byBatch[b]) byBatch[b] = {
      batch_name: b,
      seeds: 0, planted: 0, trans: 0, cull1: 0, cull2: 0, cull3: 0,
      damaged: 0,
      seeds_date: null,
      log_breed: null,               // captured from any log with breed_name
      seedsLogs: [], transLogs: [], cull1Logs: [], cull2Logs: [], cull3Logs: []
    };
    const row = byBatch[b];
    if (!row.log_breed && l.breed_name) row.log_breed = l.breed_name;
    const qty = Number(l.quantity_change || 0);
    const t = l.transaction_type;
    if (STAGE_TYPES.seeds.includes(t))   { row.seeds   += qty; row.seeds_date = row.seeds_date || l.transaction_date || l.created_at; row.seedsLogs.push(l); }
    else if (t === 'Damaged_Seeds')      { row.damaged += Math.abs(qty); }
    else if (STAGE_TYPES.planted.includes(t)) row.planted += qty;
    else if (STAGE_TYPES.trans.includes(t))   { row.trans += qty; row.transLogs.push(l); }
    else if (STAGE_TYPES.cull1.includes(t))   { row.cull1 += Math.abs(qty); row.cull1Logs.push(l); }
    else if (STAGE_TYPES.cull2.includes(t))   { row.cull2 += Math.abs(qty); row.cull2Logs.push(l); }
    else if (STAGE_TYPES.cull3.includes(t))   { row.cull3 += Math.abs(qty); row.cull3Logs.push(l); }
  });

  // Filter by date (on Seeds_Received date, up to To) and breed.
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;

  let rows = Object.values(byBatch).map(r => {
    const m = meta[r.batch_name] || {};
    // Prefer the breed captured on the actual log rows — bulk-imported
    // batches don't have an operation_batches row to consult, but every
    // Seeds_Received log has breed_name filled in.
    r.breed_name = r.log_breed || m.breed_name || '—';
    r.batch_created_at = m.created_at || r.seeds_date;
    const finalAlive = Math.max(0, r.trans - r.cull1 - r.cull2 - r.cull3);
    const survival   = r.seeds > 0 ? (finalAlive / r.seeds) * 100 : 0;
    r.final_alive = finalAlive;
    r.survival_pct = survival;
    return r;
  });

  rows = rows.filter(r => {
    if (breed && r.breed_name !== breed) return false;
    // Completed — the batch was transplanted and everything from that
    // transplant has since been culled away, so there's nothing left for
    // this funnel to track. A batch that hasn't reached transplanting yet
    // also computes to 0 here but is very much still active, not
    // completed, so that's guarded separately (r.trans > 0).
    if (r.trans > 0 && r.final_alive === 0) return false;
    const anchor = r.seeds_date ? new Date(r.seeds_date).getTime()
                : (r.batch_created_at ? new Date(r.batch_created_at).getTime() : NaN);
    if (isNaN(anchor)) return true; // keep batches with no anchor date so users see them
    return anchor <= toTs;
  });

  rows.sort((a, b) => {
    const da = a.seeds_date ? new Date(a.seeds_date).getTime() : 0;
    const db = b.seeds_date ? new Date(b.seeds_date).getTime() : 0;
    return db - da;
  });

  // Stash drilldown data on window for the click-through modal below.
  // We only publish rows that survived the filter step so drilldowns
  // reflect exactly what the summary is counting.
  window._bpDetails = { rows, nurseryOf, filterTo: to, breed };

  // ── Render ──
  loading.classList.add('hidden');
  out.classList.remove('hidden');

  out.innerHTML = `
    <!-- Per-batch table -->

/**
 * Batch Double Tone
 *
 * Every batch with any Transplanted_DoubleTone qty, keyed to the date it was
 * keyed into the system (_logDate — the transplant's own "Date:" if one was
 * typed, else when the row was saved). Batch, Breed, Qty — nothing else, per
 * the request; this isn't the full funnel Batch Production Summary already
 * covers.
 */
async function runBatchDoubleTone() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;

  const [logsRes, batchesRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, transaction_date, created_at, remark, quantity_change, breed_name')
      .eq('transaction_type', 'Transplanted_DoubleTone')
      .order('id', { ascending: true })),
    _supabase.from('operation_batches').select('name, breed_name')
  ]);
  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logsRes.error.message}</div>`;
    return;
  }

  const batchBreed = {};
  (batchesRes.data || []).forEach(b => { batchBreed[b.name] = b.breed_name; });

  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;

  const byBatch = {};
  (logsRes.data || []).forEach(l => {
    const b = l.batch_name; if (!b) return;
    const d = _logDate(l);
    const ts = d ? new Date(d).getTime() : NaN;
    if (isFinite(ts) && (ts < fromTs || ts > toTs)) return;
    if (!byBatch[b]) byBatch[b] = { batch_name: b, qty: 0, date: d, breed: l.breed_name || batchBreed[b] || '—' };
    byBatch[b].qty += Number(l.quantity_change || 0);
    // Earliest keyed date represents the batch, same convention as Seeds In.
    if (d && (!byBatch[b].date || d < byBatch[b].date)) byBatch[b].date = d;
    if (!byBatch[b].breed || byBatch[b].breed === '—') byBatch[b].breed = l.breed_name || batchBreed[b] || '—';
  });

  let rows = Object.values(byBatch).filter(r => !breed || r.breed === breed);
  rows.sort((a, c) => String(c.date || '').localeCompare(String(a.date || '')));
  const total = rows.reduce((s, r) => s + r.qty, 0);

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Batch Double Tone</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} batch${rows.length === 1 ? '' : 'es'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr><th>Date</th><th>Batch</th><th>Breed</th><th class="text-right">Qty</th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td>${fmtDate(r.date)}</td>
                <td class="font-black text-[#3d2610]">${r.batch_name}</td>
                <td>${r.breed}</td>
                <td class="text-right text-[#7c3aed] font-black">${fmtNum(r.qty)}</td>
              </tr>`).join('') : `<tr><td colspan="4" class="text-center py-10 text-[#8a7a68]">No Double Tone batches match the selected filters.</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#7c3aed]">${fmtNum(total)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

/**
 * Seed Received
 *
 * Per batch, the D/O quantity and FOC% keyed on Seeds_Received (parsed from
 * the remark — the same "DO_Qty: N." / "Incl. P% FOC." markers Tab 1 writes,
 * see operation_batch_detail.html), plus Damaged_Seeds summed the same way
 * Batch Production Summary already does it. Grouped by month via _logDate on
 * the Seeds_Received transaction.
 */
const _RE_DO_QTY = /DO_Qty:\s*(\d+)/i;
const _RE_FOC_PCT = /Incl\.\s*([\d.]+)%\s*FOC/i;
async function runSeedReceived() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;

  const [logsRes, batchesRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, transaction_type, transaction_date, created_at, remark, quantity_change, breed_name')
      .in('transaction_type', ['Seeds_Received', 'Damaged_Seeds'])
      .order('id', { ascending: true })),
    _supabase.from('operation_batches').select('name, breed_name')
  ]);
  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logsRes.error.message}</div>`;
    return;
  }

  const batchBreed = {};
  (batchesRes.data || []).forEach(b => { batchBreed[b.name] = b.breed_name; });

  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;

  const byBatch = {};

  // Pass 1: Seeds_Received — this is what anchors a batch to the report and
  // to the date filter (a batch belongs to the month it was received in).
  (logsRes.data || []).forEach(l => {
    if (l.transaction_type !== 'Seeds_Received') return;
    const b = l.batch_name; if (!b) return;
    const d = _logDate(l);
    const ts = d ? new Date(d).getTime() : NaN;
    if (isFinite(ts) && (ts < fromTs || ts > toTs)) return;

    const row = byBatch[b] || (byBatch[b] = { batch_name: b, breed: '—', date: null, doQty: 0, focPct: null, damaged: 0 });
    if (!row.date || (d && d < row.date)) row.date = d;
    if ((!row.breed || row.breed === '—') && (l.breed_name || batchBreed[b])) row.breed = l.breed_name || batchBreed[b];
    const doMatch  = (l.remark || '').match(_RE_DO_QTY);
    const focMatch = (l.remark || '').match(_RE_FOC_PCT);
    // Legacy rows saved before the D/O·FOC split existed carry no DO_Qty
    // marker at all — the whole received qty was the D/O qty then, there
    // being no FOC concept yet to separate it from.
    row.doQty += doMatch ? parseInt(doMatch[1], 10) : Number(l.quantity_change || 0);
    if (row.focPct == null && focMatch) row.focPct = parseFloat(focMatch[1]);
  });

  // Pass 2: Damaged_Seeds — deliberately NOT bounded by the date filter
  // above, same as Batch Production Summary's own damage total: a batch's
  // damage can be logged days after intake, and it still belongs to that
  // batch's one row rather than needing a date of its own to qualify.
  (logsRes.data || []).forEach(l => {
    if (l.transaction_type !== 'Damaged_Seeds') return;
    const row = byBatch[l.batch_name];
    if (row) row.damaged += Math.abs(Number(l.quantity_change || 0));
  });

  let rows = Object.values(byBatch).filter(r => !breed || r.breed === breed);
  rows.sort((a, c) => String(c.date || '').localeCompare(String(a.date || '')));

  // Same "Calculated FOC Qty" formula Tab 1 (Seeds In) shows next to the FOC
  // Percent field it comes from — round(D/O qty × FOC% / 100) — so this
  // report's number matches the one the batch was actually keyed against.
  rows.forEach(r => { r.focQty = r.focPct != null ? Math.round(r.doQty * (r.focPct / 100)) : null; });

  const totals = rows.reduce((s, r) => ({
    doQty: s.doQty + r.doQty, focQty: s.focQty + (r.focQty || 0), damaged: s.damaged + r.damaged
  }), { doQty: 0, focQty: 0, damaged: 0 });

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seed Received</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} batch${rows.length === 1 ? '' : 'es'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Date</th><th>Batch</th><th>Breed</th>
            <th class="text-right">Seed Received (D/O)</th>
            <th class="text-right">FOC Qty</th>
            <th class="text-right">Seed Damage</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td>${fmtDate(r.date)}</td>
                <td class="font-black text-[#3d2610]">${r.batch_name}</td>
                <td>${r.breed}</td>
                <td class="text-right text-[#c07820] font-black">${fmtNum(r.doQty)}</td>
                <td class="text-right">${r.focQty != null
                  ? `<span class="font-black text-[#7c3aed]">${fmtNum(r.focQty)}</span>
                     <span class="block text-[9px] text-[#8a7a68] font-bold">${r.focPct.toFixed(2)}%</span>`
                  : '—'}</td>
                <td class="text-right ${r.damaged ? 'text-[#a83020] font-black' : 'text-[#8a7a68]'}">${r.damaged ? fmtNum(r.damaged) : '—'}</td>
              </tr>`).join('') : `<tr><td colspan="6" class="text-center py-10 text-[#8a7a68]">No seed receipts match the selected filters.</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#c07820]">${fmtNum(totals.doQty)}</td>
            <td class="text-right text-[#7c3aed]">${fmtNum(totals.focQty)}</td>
            <td class="text-right text-[#a83020]">${fmtNum(totals.damaged)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

// ── Report menu ───────────────────────────────────────────────────────────
// One flat row — every report is a tab, no Category tier to click through
// first. label is what the tab shows; hint is the fuller description (e.g.
// "by Plot / Batch") kept as the button's title (a hover tooltip) instead
// of dropped.
const REPORTS = [
  { value: 'batch_production',      label: 'Production Summary', hint: 'Batch Production Summary — the seeds → transplant → cull funnel, per batch' },
  { value: 'batch_double_tone',     label: 'Double Tone',        hint: 'Batch Double Tone — batch, breed, qty' },
  { value: 'seed_received',         label: 'Seed Received',      hint: 'Seed Received — D/O qty, FOC qty, seed damage, per batch' },
  { value: 'movement_report',       label: 'Movement Report',    hint: 'Movement Report — pick PN, BNN, UNN 1 and/or UNN 2 under Locations to see that location\'s data' },
  { value: 'transplanting_report',  label: 'Transplanting',      hint: 'Transplanting Report — date, maturity date, location' },
  { value: 'sales_listing',         label: 'Sales Listing',      hint: 'Sales Listing — line items or the year × month chart' },
];

// ── Report tabs ───────────────────────────────────────────────────────────
// f-report is a hidden input — the state the rest of the page reads
// (syncFilterVisibility, runReport, syncReportDefaults, …) exactly the way
// it read a <select>'s .value before. These tab buttons are just what keeps
// it in sync now, instead of a dropdown. Styled as one connected tab strip
// (.report-tab-bar / .report-tab, see <style>) — dividers between tabs and
// an underline on the active one, not separate pill buttons with gaps.
function renderReportTabs() {
  const rep  = document.getElementById('f-report').value;
  const wrap = document.getElementById('f-report-tabs');
  wrap.innerHTML = REPORTS.map(o => `
    <button type="button" onclick="selectReport('${o.value}')" title="${o.hint || ''}"
      class="report-tab${o.value === rep ? ' active' : ''}">${o.label}</button>
  `).join('');
}

// Which report tab was last open, so a browser refresh comes back to it
// instead of always landing on Production Summary — see bootstrap().
const LAST_REPORT_KEY = 'mjm_reports_last_tab';
function _rememberReport(report) {
  try { localStorage.setItem(LAST_REPORT_KEY, report); } catch (e) { /* private mode, etc — just don't persist */ }
}

function selectReport(report) {
  document.getElementById('f-report').value = report;
  _rememberReport(report);
  // Movement Report starts with every Location unticked — picked fresh
  // each time, not left however they were from a previous report/visit.
  if (report === 'movement_report') document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false);
  renderReportTabs();
  syncReportDefaults();
  syncFilterVisibility();
  runReport();
}
window.selectReport = selectReport;

/* The first day of the same calendar month as the given YYYY-MM-DD date, in
   the same format. There's only one visible date control (f-to, "As At")
   now; a report that wants a period reads this as its implicit From rather
   than a second field the user has to pick — "as at 15 Sep" means "this
   month, up to the 15th", not "since the batch began". */
function monthStartOf(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  // Built from the LOCAL year/month, as a plain string — not
  // `new Date(y, m, 1).toISOString()`, which converts that local midnight to
  // UTC and rolls it back a calendar day for anyone east of UTC (Malaysia is
  // UTC+8): "As At 23 Sep" came out with a B/F cutoff of 31 Aug instead of
  // 1 Sep, one real day short.
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-01`;
}

async function runReport() {
  // f-from is a hidden field now — kept in sync with f-to's own month
  // right before every run, so every report function below can go on
  // reading document.getElementById('f-from').value exactly as before.
  const toEl = document.getElementById('f-to');
  const fromEl = document.getElementById('f-from');
  if (toEl && fromEl) fromEl.value = monthStartOf(toEl.value);
  const which = document.getElementById('f-report').value;
  if (which === 'batch_production')      return runBatchProduction();
  if (which === 'batch_double_tone')     return runBatchDoubleTone();
  if (which === 'seed_received')         return runSeedReceived();
  if (which === 'movement_report')       return runMovementReportCombined();
  if (which === 'transplanting_report')  return runTransplantingReport();
  if (which === 'sales_listing')         return runSalesListing();
}

// ── Filter visibility by report type ─────────────────────────────────────────
function syncFilterVisibility() {
  const which     = document.getElementById('f-report').value;
  const isMovement = (which === 'movement_report');
  const isTrans   = (which === 'transplanting_report');
  const isBatch   = (which === 'batch_production');
  const isDTone   = (which === 'batch_double_tone');
  const isSeedRcv = (which === 'seed_received');
  const isSales   = (which === 'sales_listing');
  // Sales Listing carries two views that want different filters: the Table
  // (line items) wants a date range + nurseries, the Chart (the year×month
  // trend the old Seedling Sales report drew) wants a set of years instead.
  const isSalesTable = isSales && _salesViewMode !== 'chart';
  const isSalesChart = isSales && _salesViewMode === 'chart';
  const hasRange  = isBatch || isMovement || isTrans || isDTone || isSeedRcv || isSalesTable;
  document.querySelectorAll('.f-range').forEach(el         => el.classList.toggle('hidden', !hasRange));
  // No visible From anywhere — every report is one "As At" date. Movement
  // Report still shows the Culled/Transplanted/Damaged/etc columns as that
  // period's activity only, not a running total since the batch began, but
  // the period is now the As-At date's own calendar month (derived in
  // runReport(), see monthStartOf()) rather than a second field to pick.
  // Balance stays a true running total regardless of the period, so it
  // still answers "what's actually there right now" — see
  // runMovementReportCombined().
  const toLabel = document.getElementById('f-to-label');
  if (toLabel) toLabel.textContent = 'As At';
  document.querySelectorAll('.f-sort').forEach(el          => el.classList.toggle('hidden', !isMovement));
  // Locations (PN / BNN / UNN 1 / UNN 2) drives Movement Report directly now
  // — which of those are checked decides whether the Pre-Nursery section,
  // the Main Nursery section, or both, render. Transplanting and Sales
  // Listing (table view) use the same chips to filter their own rows by
  // destination nursery.
  document.querySelectorAll('.f-nursery-inline').forEach(el => el.classList.toggle('hidden', !(isMovement || isTrans || isSalesTable)));
  document.querySelectorAll('.f-breed').forEach(el         => el.classList.toggle('hidden', !(isBatch || isDTone || isSeedRcv || isTrans)));
  document.querySelectorAll('.f-sales-mode').forEach(el    => el.classList.toggle('hidden', !isSales));
  document.querySelectorAll('.f-sales-years').forEach(el   => el.classList.toggle('hidden', !isSalesChart));
}

// View mode (Table vs Chart) — used by Sales Listing; Table is the detailed
// line-item listing, Chart is the year×month trend the Seedling Sales report
// always drew (kept verbatim, see _renderSalesChart).
let _salesViewMode = 'table';
function _setSalesView(mode) {
  _salesViewMode = mode;
  const t = document.getElementById('f-mode-table');
  const c = document.getElementById('f-mode-chart');
  const active   = 'bg-[#3d2610] text-white';
  const inactive = 'text-[#3d2610]';
  t.className = `flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest ${mode === 'table' ? active : inactive}`;
  c.className = `flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest ${mode === 'chart' ? active : inactive}`;
  syncFilterVisibility();
}

// ── Nursery multi-select ─────────────────────────────────────────────────────
async function loadNurseryFilter() {
  const { data } = await _supabase.from('shared_plots').select('nursery_name');
  const names = new Set();
  (data || []).forEach(p => { if (p.nursery_name) names.add(p.nursery_name); });
  const wrap = document.getElementById('f-nursery-chips');
  wrap.innerHTML = '';
  // In the nursery's own order — PN, BNN, UNN 1, UNN 2 — not the alphabet's.
  // shared_plots never has a "Pre-Nursery" row (trays, not plots), so PN is
  // added by hand rather than found in the data — it's what a transplant
  // landing in a pre-nursery tray (Premium Care / Double Tone) is labelled,
  // see runTransplantingReport(), and this is how that gets filtered in or
  // out alongside BNN/UNN1/UNN2.
  const list = [...names].filter(n => !PRE_NURSERY_PLOTS.includes(n) && n !== 'Pre-Nursery');
  list.push('PN');
  list
    .sort((a, b) => nurseryRank(a) - nurseryRank(b) || String(a).localeCompare(String(b)))
    .forEach(n => {
    const safe = String(n).replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c]));
    const lbl = document.createElement('label');
    lbl.className = 'nursery-chip';
    lbl.innerHTML = `<input type="checkbox" class="f-nurs-cb" value="${safe}" checked>${safe}`;
    wrap.appendChild(lbl);
  });
  document.getElementById('f-nurs-all').onclick  = () => { document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = true); };
  document.getElementById('f-nurs-none').onclick = () => { document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false); };
}
function selectedNurseries() {
  return [...document.querySelectorAll('.f-nurs-cb:checked')].map(cb => cb.value);
}

/* Defaults that change with which report is now selected — run once per
   switch, not on every "Run Report" click, so re-running the same report
   never clobbers a date someone deliberately picked. */
const DATE_KEYED_REPORTS = new Set(['batch_production', 'batch_double_tone', 'seed_received',
  'transplanting_report', 'sales_listing', 'movement_report']);
function syncReportDefaults() {
  const which = document.getElementById('f-report').value;
  if (DATE_KEYED_REPORTS.has(which)) {
    // f-from is derived from this in runReport() — nothing to set here.
    document.getElementById('f-to').value = new Date().toISOString().slice(0, 10);
  }
  // "Sort by" only ever affects the Main Nursery section — Pre-Nursery
  // always groups by batch regardless (see buildMovementSection). Plot is
  // Main's more commonly checked default.
  if (_fSort && which === 'movement_report') _fSort.value = 'plot';
}

document.getElementById('f-run').addEventListener('click', runReport);
// The Report tabs call selectReport() directly on click (see their
// onclick=), which already does everything the old <select>'s 'change'
// listener did here — nothing left to wire up.
const _fSort = document.getElementById('f-sort');
if (_fSort) _fSort.addEventListener('change', runReport);

// ════════════════════════════════════════════════════════════════════════════
// Seedling Sales Report (year × month grid)
// ════════════════════════════════════════════════════════════════════════════
// Aggregates `shared_do_records.total_qty` by year and month of delivery_date,
// excluding cancelled DOs. Renders a year-by-year grid like the printed report,
// with a variance row at the bottom comparing the latest year to the previous.

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const _CHART_COLORS = ['#3a7ab4', '#c07820', '#4a7a2e', '#a83020', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ca8a04', '#0284c7', '#9333ea', '#dc2626'];

// Populate the year chip filter once the data has told us which years exist.
function _populateYearChips(years) {
  const wrap = document.getElementById('f-year-chips');
  if (!wrap) return;
  const existing = new Set([...wrap.querySelectorAll('input')].map(cb => cb.value));
  const incoming = new Set(years.map(String));
  // Only rebuild when the set of years actually changes
  if (existing.size === incoming.size && [...existing].every(v => incoming.has(v))) return;
  wrap.innerHTML = '';
  years.forEach(y => {
    const lbl = document.createElement('label');
    lbl.className = 'nursery-chip';
    lbl.innerHTML = `<input type="checkbox" class="f-yr-cb" value="${y}" checked>${y}`;
    wrap.appendChild(lbl);
  });
  document.getElementById('f-yr-all').onclick  = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = true);  };
  document.getElementById('f-yr-none').onclick = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = false); };
}
function _selectedYears() {
  return [...document.querySelectorAll('.f-yr-cb:checked')].map(cb => Number(cb.value));
}

// Simple SVG line chart of monthly sales, one line per selected year.
function _renderSalesChart(grid, years) {
  const W = 960, H = 460, PL = 60, PR = 20, PT = 30, PB = 50;
  const months = MONTHS_SHORT;
  const data = years.map(y => grid[y] || new Array(12).fill(0));
  const max = Math.max(1, ...data.flat());
  const niceMax = Math.ceil(max / 5000) * 5000 || max;
  const xStep = (W - PL - PR) / 11;
  const yPlot = (v) => PT + (H - PT - PB) * (1 - v / niceMax);
  const xPlot = (i) => PL + xStep * i;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:520px" preserveAspectRatio="xMidYMid meet">`;
  // Y gridlines + labels
  for (let i = 0; i <= 5; i++) {
    const y   = yPlot((niceMax * i) / 5);
    const val = Math.round((niceMax * i) / 5);
    svg += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e8dcc8" stroke-width="1"/>`;
    svg += `<text x="${PL - 10}" y="${y + 4}" text-anchor="end" fill="#8a7a68" font-size="11" font-weight="700">${fmtNum(val)}</text>`;
  }
  // X labels
  months.forEach((m, i) => {
    svg += `<text x="${xPlot(i)}" y="${H - PB + 22}" text-anchor="middle" fill="#3d2610" font-size="11" font-weight="700">${m}</text>`;
  });
  // Lines + dots
  data.forEach((vals, idx) => {
    const color = _CHART_COLORS[idx % _CHART_COLORS.length];
    const pts = vals.map((v, i) => `${xPlot(i)},${yPlot(v)}`).join(' ');
    svg += `<polyline points="${pts}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v, i) => {
      svg += `<circle cx="${xPlot(i)}" cy="${yPlot(v)}" r="4" fill="${color}"><title>${years[idx]} ${months[i]}: ${fmtNum(v)}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = years.map((y, i) => `
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white border border-[#e8dcc8] text-[11px] font-bold text-[#3d2610]">
      <span style="width:14px;height:14px;background:${_CHART_COLORS[i % _CHART_COLORS.length]};border-radius:3px;display:inline-block"></span>${y}
    </span>`).join('');

  return `<div class="flex flex-wrap gap-2 mb-4">${legend}</div>${svg}`;
}

async function runSeedlingSales() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const { data: dos, error } = await _supabase
    .from('shared_do_records')
    .select('delivery_date, total_qty, status, remark, do_number')
    .order('delivery_date', { ascending: true });

  if (error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load deliveries: ${error.message}</div>`;
    return;
  }

  // Build the full year × month grid (all years on record).
  const grid = {};
  (dos || []).forEach(d => {
    const cancelled = d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'));
    if (cancelled) return;
    // Same exclusion the Table view uses — a CAL- DO is a stock correction,
    // not a customer order, and Table/Chart are two views of the same
    // report so they need to agree on what counts as a sale.
    if (/^CAL-/i.test(d.do_number || '')) return;
    if (!d.delivery_date) return;
    const dt = new Date(d.delivery_date);
    if (isNaN(dt)) return;
    const y = dt.getFullYear();
    const m = dt.getMonth();
    if (!grid[y]) grid[y] = new Array(12).fill(0);
    grid[y][m] += Number(d.total_qty || 0);
  });

  const allYears = Object.keys(grid).map(Number).sort();
  if (!allYears.length) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No delivery records found.</div>`;
    return;
  }

  // Populate the year chip filter (idempotent — only rebuilds if the year set changed).
  _populateYearChips(allYears);

  // Years the user picked (default: every checkbox is checked on first load).
  let years = _selectedYears();
  if (!years.length) years = allYears;
  years.sort();

  const latest = years[years.length - 1];
  const prev   = years.length > 1 ? years[years.length - 2] : null;
  const rowTotal = (arr) => arr.reduce((s, v) => s + v, 0);

  // Year-by-year variance row (latest visible year vs the one before it).
  let varianceAbs = null, variancePct = null;
  if (prev != null) {
    varianceAbs = grid[latest].map((v, i) => v - grid[prev][i]);
    variancePct = grid[latest].map((v, i) => {
      const base = grid[prev][i];
      return (base === 0) ? null : ((v - base) / base) * 100;
    });
  }

  const fmtVarPct = (n) => (n == null) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cell = (n) => `<td class="text-right">${n === 0 ? '0' : fmtNum(n)}</td>`;
  const varCell = (n) => {
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${n > 0 ? '+' : ''}${fmtNum(n)}</td>`;
  };
  const varPctCell = (n) => {
    if (n == null) return `<td class="text-right text-[#8a7a68]">—</td>`;
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${fmtVarPct(n)}</td>`;
  };

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  const headerHtml = `
    <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
      <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seedlings Sales Report</h3>
      <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${years.length} year${years.length === 1 ? '' : 's'} · ${years[0]} – ${latest}</div>
    </div>`;

  const bodyHtml = (_salesViewMode === 'chart')
    ? _renderSalesChart(grid, years)
    : `
      <div class="overflow-x-auto">
        <table class="report-table sales-table">
          <colgroup>
            <col class="c-year">
            ${MONTHS_SHORT.map(() => '<col class="c-month">').join('')}
            <col class="c-total">
          </colgroup>
          <thead>
            <tr>
              <th>Year</th>
              ${MONTHS_SHORT.map(m => `<th class="text-right">${m}</th>`).join('')}
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${years.map(y => `
              <tr>
                <td class="font-black text-[#3d2610]">${y}</td>
                ${grid[y].map(v => cell(v)).join('')}
                <td class="text-right font-black text-[#3d2610]">${fmtNum(rowTotal(grid[y]))}</td>
              </tr>
            `).join('')}
            ${prev != null ? `
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">Variance<br><span class="text-[10px] font-bold text-[#8a7a68]">(${latest} vs ${prev})</span></td>
                ${varianceAbs.map(v => varCell(v)).join('')}
                ${varCell(rowTotal(varianceAbs))}
              </tr>
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">%</td>
                ${variancePct.map(p => varPctCell(p)).join('')}
                ${varPctCell(rowTotal(varianceAbs) / (rowTotal(grid[prev]) || 1) * 100)}
              </tr>
            ` : ''}
          </tbody>
        </table>
      </div>`;

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      ${headerHtml}
      ${bodyHtml}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════════════════
// Nursery Summary Report (per-nursery monthly movement for a chosen year)
// ════════════════════════════════════════════════════════════════════════════
// Per nursery (mapped via shared_plots.nursery_name + Pre-Nursery aliases):
//   Seeds In         = SUM(Seeds_Received)               — pre-nursery only
//   Transplanted In  = SUM(Transplanted*) into this nursery's plots
//   Transplanted Out = mirror of trans-in, credited to source nursery
//                      (best-effort: source assumed Pre-Nursery for transplants
//                      into Main; not perfectly resolvable from current schema)
//   Damaged          = ABS(SUM(Damaged_Seeds))
//   Culling          = ABS(SUM(1st/2nd/3rd_Culling))
//   Sold             = SUM(qty_n) on DO records, by plot_n's nursery (cancelled excluded)
//   Balance c/f      = Balance b/f + Seeds In + Trans In − Trans Out − Damaged − Culling − Sold

const PRE_NURSERY_PLOTS = ['Pre-Nursery', 'DOUBLE-TONE', 'PREMIUM CARE'];
const TRANSPLANT_TYPES  = ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'];

function ymKey(d) {
  if (!d) return null;
  const x = new Date(d);
  if (isNaN(x)) return null;
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`;
}


// ════════════════════════════════════════════════════════════════════════════
// Summary Report (group by Batch / Plot / Date)
// ════════════════════════════════════════════════════════════════════════════
// One universal column set; rows roll up to the chosen dimension:
//   By Plot  → one row per (Plot, Batch). Plot is shown once at the top of
//              each plot group, then individual batch rows underneath; a TOTAL
//              line closes each plot. Matches the supplied xlsx samples.
//   By Batch → one row per Batch (summed across plots).
//   By Date  → one row per calendar date.
//
// Columns: B/F · Seeds In · Planted · Transplanted · Premium · Double Tone ·
//          Damaged · 1st Cull · 2nd Cull · 3rd Cull · Sold · Closing
// B/F is the cumulative net of all transactions BEFORE the From date for the
// same (plot, batch) / batch / date key. Closing = B/F + inflow − outflow.

const SUMMARY_SKIP_TYPES = new Set([
  'Seed_Audit', 'Seed_Audit_Email', 'Seed_Audit_Note', 'Seed_Audit_Action',
  'Planting_Photo', 'Stock_Calibration'
]);

/* ── Reading a movement date out of a batch-report log ──────────────────────
   The batch report writes most movement rows WITHOUT transaction_date — the
   date the user keyed sits inside the remark instead:

     Transplanted / Premium / D-Tone  →  "... Date: 2026-03-04"
     1st Culling                      →  "... Date: 2026-03-04"
     2nd Culling                      →  "... CullDate: 2026-03-04"
     3rd Culling                      →  no date at all
     Seeds_Received / Planted         →  real transaction_date

   The report used to read transaction_date only, so every transplanting and
   culling row resolved to NaN and was skipped — which is why those columns
   read 0 while Sold (from the DO system, which does carry a date) did not.
   Resolve in the order the batch report actually records: the keyed date
   first, then the remark, then when the row was written. */
const _RE_LOG_DATE = /(?:Cull)?Date:\s*(\d{4}-\d{2}-\d{2})/i;
function _logDate(l) {
  if (l.transaction_date) return String(l.transaction_date).slice(0, 10);
  const m = l.remark ? String(l.remark).match(_RE_LOG_DATE) : null;
  if (m) return m[1];
  return l.created_at ? String(l.created_at).slice(0, 10) : null;
}

/* Supabase caps a single request at 1000 rows. The movement report reads the
   whole ledger, so it has to page or it silently reports on a fraction of the
   batches. */
async function fetchAllRows(buildQuery, pageSize = 1000) {
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await buildQuery().range(from, from + pageSize - 1);
    if (error) return { data: null, error };
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return { data: all, error: null };
}

/* A delivery order's plot and batch are typed by hand: "225.", " 225",
   "U15 (UPB PREMIER HYBRID)". Read them the way the batch report reads them,
   so a D/O line lands on the row the batch report already has rather than
   inventing one of its own. */
function _mvPlotKey(v) {
  return String(v == null ? '' : v).trim().toUpperCase()
    .replace(/^PLOT\s*:?\s*/, '')
    .split(/[\s(,\[]/)[0]
    .replace(/[^0-9A-Z\-]/g, '');
}
/* A batch is identified by its trailing digits, exactly as the batch report
   identifies it — "MJM-225", "225." and " 225 " are all batch 225. Something
   with no trailing digits at all ("24D") identifies no batch and returns '',
   so it can never be matched to one. */
function _mvBatchKey(v) {
  // Trailing punctuation first — "225." is still batch 225 — then the digits
  // it ends with.
  const cleaned = String(v == null ? '' : v).trim().replace(/[^0-9A-Za-z]+$/, '');
  const m = /(\d+)$/.exec(cleaned);
  return m ? String(parseInt(m[1], 10)) : '';
}


/* ════════════════════════════════════════════════════════════════════════════
   MOVEMENT REPORT

   One report, two sections — Pre-Nursery and Main Nursery hold different
   things and move them in different ways, and a single table that tried to
   serve both left most of its columns empty on every row, so each still
   gets its own table. Which section(s) actually render is driven by the
   Locations chips: PN shows Pre-Nursery, any of BNN/UNN1/UNN2 shows Main
   Nursery, both together show both, stacked.

     Pre-nursery   keyed by TRAY · batch. Seeds are planted into a tray, some
                   are culled, and the rest leave — to a main-nursery plot, or
                   to the Premium Care / Double Tone trays.
     Main nursery  keyed by PLOT · batch. Seedlings arrive from pre-nursery,
                   are culled twice more, sold, or transferred plot to plot.

   runMovementReportCombined() fetches the ledger once and builds the shared
   lookups once; buildMovementSection(scope, …) is the engine that turns
   that into one section's table — a column spec says what each column is
   called, which way it moves the balance, and how it is coloured.
════════════════════════════════════════════════════════════════════════════ */

/* Nurseries read in the order the nursery works in, not the order the
   alphabet happens to put them in. Anything not named here follows after.
   PN (Pre-Nursery) leads — it's the first stage a batch passes through. */
const NURSERY_ORDER = ['PN', 'BNN', 'UNN 1', 'UNN 2'];
function nurseryRank(n) {
  const k = _mvPlotKey(n);
  const i = NURSERY_ORDER.findIndex(x => _mvPlotKey(x) === k);
  return i === -1 ? NURSERY_ORDER.length : i;
}

/* sign: how the column moves the balance. 0 means shown but not counted —
   see Seed Damage, which never entered a tray to begin with. */
const MOVE_COLS = {
  // Premium Care and Double Tone no longer get their own Transfer Out
  // columns here — a transplant into either is just Transplanted Out
  // from the source tray, same as any other transplant (see the
  // Transplanted_Premium/Transplanted_DoubleTone branch below). The
  // receiving side (a Premium Care/D-Tone tray filling up) already reads
  // as ordinary Transfer In, with nothing special to call out either.
  pre: [
    { key: 'trIn',     label: 'Transfer In',      sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'planted',  label: 'Planted',          sign: +1, cls: 'text-[#c07820]' },
    { key: 'damaged',  label: 'Seed Damage',      sign:  0, cls: 'text-[#a83020]' },
    { key: 'cull1',    label: '1st Culled',       sign: -1, cls: 'text-[#a83020]' },
    { key: 'transOut', label: 'Transplanted Out', sign: -1, cls: 'text-[#a83020]' },
  ],
  main: [
    { key: 'trIn',    label: 'Transfer In',           sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'transIn', label: 'Transplanted from PN',  sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'sold',    label: 'Sold',                  sign: -1, cls: 'text-[#a83020]' },
    { key: 'cull3',   label: '3rd Culled',            sign: -1, cls: 'text-[#a83020]' },
    { key: 'trOut',   label: 'Transfer Out',          sign: -1, cls: 'text-[#a83020]' },
  ],
};

const emptyRow = (scope) => MOVE_COLS[scope].reduce((a, c) => { a[c.key] = 0; return a; }, {});

/**
 * What a row's movements come to.
 *
 * 2nd Culled never deducts here, B/F included — 2nd Culling is Tab 6's own
 * live snapshot as a batch works through 3rd Culling, not a separate loss
 * on top of it, and it doesn't get its own column here either (see
 * MOVE_COLS.main). 3rd Culled — once evidenced (see the MapQty: check
 * below) — is the actual, standing deduction.
 */
function netOfRow(scope, b) {
  return MOVE_COLS[scope].reduce((s, c) => s + c.sign * (b[c.key] || 0), 0);
}

/* "2 months". Age is measured from the batch's own planting date, so it reads
   the same whether the batch is still in a tray or long since out in a plot. */
function ageLabel(planted) {
  if (!planted) return '—';
  const d = new Date(planted);
  if (isNaN(d.getTime())) return '—';
  const now = new Date();
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m--;
  if (m < 0) m = 0;
  return m + (m === 1 ? ' month' : ' months');
}

// Every movement column's hover-tooltip data — Sold (Date/DO
// Number/Customer/Qty) and Transfer In / Transplanted from PN / 3rd
// Culled / Transfer Out (Date/label/Qty) — pooled across the whole run
// and referenced by index from each cell's markup. See fmtDetailCell()
// in buildMovementSection() and mvShowDetailTip() below.
let _mvDetailPool = [];

function mvShowDetailTip(anchorEl, idx) {
  const entry = _mvDetailPool[idx];
  if (!entry || !entry.rows || !entry.rows.length) return;
  const sorted = entry.rows.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  const total = sorted.reduce((s, r) => s + (r.qty || 0), 0);
  const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  let html = `<div class="text-[9px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${esc(entry.title)} — ${sorted.length} record${sorted.length === 1 ? '' : 's'}</div>`;
  sorted.forEach(r => {
    // Sold rows carry doNumber/customer (their own two-colour layout,
    // matching Tab 6's own Sales tooltip); every other column carries a
    // plain label instead ("B13", "Tray PREMIUM CARE") — or none at all
    // (3rd Culled: just date and qty), in which case that span is left
    // out rather than printed empty.
    html += (r.doNumber != null) ? `
      <div class="flex items-baseline gap-2 py-0.5 text-[11px] whitespace-nowrap">
        <span class="font-black text-[#3a7ab4]">${esc(r.doNumber)}</span>
        <span class="font-bold text-[#8a7a68]">${fmtDate(r.date)}</span>
        <span class="font-bold text-[#3d2610] uppercase truncate max-w-[140px]">${esc(r.customer)}</span>
        <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(r.qty)}</span>
      </div>` : `
      <div class="flex items-baseline gap-2 py-0.5 text-[11px] whitespace-nowrap">
        <span class="font-bold text-[#8a7a68]">${fmtDate(r.date)}</span>
        ${r.label ? `<span class="font-bold text-[#3d2610] truncate max-w-[160px]">${esc(r.label)}</span>` : ''}
        <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(r.qty)}</span>
      </div>`;
  });
  html += `
    <div class="flex items-baseline gap-2 border-t border-[#e8dcc8] mt-1.5 pt-1.5 text-[11px]">
      <span class="font-black text-[#3d2610] uppercase tracking-widest text-[9px]">Total</span>
      <span class="ml-auto font-black text-[#3a7ab4]">${fmtNum(total)}</span>
    </div>`;
  const tip = document.getElementById('mv-sales-tip');
  tip.innerHTML = html;
  tip.classList.remove('hidden');
  // Below the figure, clamped to the viewport; above it when there's no
  // room underneath — same placement rule as Tab 6's own sales tooltip.
  const a = anchorEl.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  let left = Math.min(Math.max(8, a.left), window.innerWidth - t.width - 8);
  let top  = a.bottom + 8;
  if (top + t.height > window.innerHeight - 8) top = Math.max(8, a.top - t.height - 8);
  tip.style.left = left + 'px';
  tip.style.top  = top + 'px';
}
function mvHideDetailTip() {
  document.getElementById('mv-sales-tip').classList.add('hidden');
}

async function runMovementReportCombined() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');
  _mvDetailPool = [];

  // PN drives the Pre-Nursery section, any of BNN/UNN1/UNN2 drives the Main
  // Nursery section — one Movement Report tab, the Locations chips decide
  // which section(s) actually render.
  const pickedLocs = selectedNurseries();
  const wantPre  = pickedLocs.includes('PN');
  const wantMain = pickedLocs.some(l => l !== 'PN');
  if (!wantPre && !wantMain) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">Tick a location under Locations — PN, BNN, UNN 1 or UNN 2 — to see Movement Report data.</div>`;
    return;
  }

  const fromStr = document.getElementById('f-from').value;
  const toStr   = document.getElementById('f-to').value;
  const fromMs  = fromStr ? new Date(fromStr).getTime() : -Infinity;
  const toMs    = toStr ? new Date(toStr).getTime() + 86400000 : Infinity;
  const groupBy = (document.getElementById('f-sort') || {}).value || 'plot';

  const [logsRes, dosRes, alsRes, plotsRes, traysRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('transaction_type, transaction_date, created_at, remark, plot_name, batch_name, quantity_change')
      .in('transaction_type', ['Seeds_Received', 'Planted', 'Transplanted',
          'Transplanted_Premium', 'Transplanted_DoubleTone', 'Damaged_Seeds',
          '1st_Culling', '2nd_Culling', '3rd_Culling', 'Cull3_Transfer'])
      .order('id', { ascending: true })),
    // do_number/al_number added for the Sold column's hover tooltip
    // (date · DO number · customer · qty) — see mvBuildSaleDetails().
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('do_number, al_number, delivery_date, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_al_orders').select('al_number, customer_name')),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    _supabase.from('operation_trays').select('tray_name, nursery_name').then(r => r, () => ({ data: [] }))
  ]);
  if (logsRes.error || dosRes.error || plotsRes.error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load data.</div>`;
    return;
  }

  const logs = logsRes.data || [];

  // ── Where each place belongs ──
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  // Trays are pre-nursery whatever nursery they sit in; their own nursery is
  // kept only so the pre-nursery list can be read in the same order.
  const trayNames = new Set();
  const trayNursery = {};
  ((traysRes && traysRes.data) || []).forEach(t => {
    if (!t.tray_name) return;
    trayNames.add(t.tray_name);
    trayNursery[t.tray_name] = t.nursery_name || '';
  });
  PRE_NURSERY_PLOTS.forEach(p => trayNames.add(p));
  const isTray = (name) => trayNames.has(name);

  // BNN/UNN1/UNN2 filter which main-nursery plots pass; PN plays no part in
  // this check (plotToLoc never returns "PN" — it only ever comes from
  // shared_plots.nursery_name, a real main-nursery name), so leaving PN in
  // the checked set is harmless here.
  const selectedLocs = new Set(pickedLocs);
  const passMain = (plot) => !!plot && !isTray(plot) && selectedLocs.has(plotToLoc[plot] || 'Unassigned');

  // ── When each batch was planted, for Age ──
  // The same source the batch list uses: the keyed date on Seeds_Received.
  const batchPlantedAt = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Seeds_Received') return;
    const k = _mvBatchKey(l.batch_name);
    const d = l.transaction_date || l.created_at;
    if (!k || !d) return;
    if (!batchPlantedAt[k] || String(d) < String(batchPlantedAt[k])) batchPlantedAt[k] = d;
  });

  // ── Every movement, as (scope, place, batch, column, qty) — built once
  //    from one fetch, so both sections come off the same pass over the
  //    ledger instead of fetching (and re-deriving the lookups above)
  //    twice. Each section later reads only the events tagged its way. ──
  const ev = [];
  const push = (sc, date, place, batch, col, qty) => {
    if (!place || !qty) return;
    ev.push({ sc, date, place, batch: batch || '—', col, qty });
  };
  const srcTrayOf = (l) => {
    const m = (l.remark || '').match(/from tray \[([^\]]+)\]/i);
    return m ? m[1].trim() : null;
  };

  // Records behind Transfer In / Transplanted from PN / 3rd Culled /
  // Transfer Out, for their own hover tooltips (see mvShowDetailTip()) —
  // the same idea as saleDetails above, one shared shape: date, qty, and
  // a short label already worded for the tooltip line. Keyed by
  // place::batch::col so each column's own figure has its own list.
  const colDetails = {};
  const pushDetail = (place, batch, col, date, qty, label) => {
    if (!place || !qty) return;
    const dk = place + '::' + (batch || '—') + '::' + col;
    (colDetails[dk] = colDetails[dk] || []).push({ date, qty, label });
  };

  // Damaged seeds carry no tray: they are counted at the batch as it is
  // planted and never enter one. Shown against the tray the batch was mostly
  // planted into, once, so the column is visible without being invented for
  // every tray the batch happens to occupy — and it does not move that tray's
  // balance, because those seeds were never standing in it.
  const batchHomeTray = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Planted' || !l.plot_name) return;
    const k = _mvBatchKey(l.batch_name);
    const q = Math.abs(l.quantity_change || 0);
    if (!batchHomeTray[k] || q > batchHomeTray[k].qty) batchHomeTray[k] = { tray: l.plot_name, qty: q };
  });

  logs.forEach(l => {
    if (SUMMARY_SKIP_TYPES.has(l.transaction_type)) return;
    const d = _logDate(l);
    const q = Math.abs(l.quantity_change || 0);
    const t = l.transaction_type;
    const b = l.batch_name;

    if (t === 'Planted')     { push('pre', d, l.plot_name, b, 'planted', q); return; }
    if (t === '1st_Culling') { push('pre', d, l.plot_name, b, 'cull1', q); return; }
    // 2nd_Culling isn't tracked in Main Nursery Movement at all — it's
    // Tab 6's own running snapshot toward 3rd Culling, not a separate,
    // standing deduction (see netOfRow above).
    if (t === '2nd_Culling') return;
    if (t === '3rd_Culling') {
      // Only counted once a drone map qty has actually been keyed — Tab 6
      // computes and saves a 3rd_Culling figure the moment Alive reaches
      // zero, whether or not anyone has actually counted/photographed it.
      // An un-evidenced "fully culled" record would otherwise zero out a
      // batch's standing balance here on nothing more than a formula.
      // MapQty: N is written into the remark by saveTab6() only when that
      // box actually has a number in it (see operation_batch_detail.html).
      const mapQtyMatch = (l.remark || '').match(/MapQty:\s*(\d+)/);
      if (mapQtyMatch && passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'cull3', q);
        pushDetail(l.plot_name, b, 'cull3', d, q, '');
      }
      return;
    }

    if (t === 'Damaged_Seeds') {
      const home = batchHomeTray[_mvBatchKey(b)];
      if (home) push('pre', d, home.tray, b, 'damaged', q);
      return;
    }

    if (t === 'Transplanted') {
      const src = srcTrayOf(l);
      if (src) push('pre', d, src, b, 'transOut', q);
      if (passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'transIn', q);
        pushDetail(l.plot_name, b, 'transIn', d, q, src ? `Tray ${src}` : '');
      }
      return;
    }

    if (t === 'Transplanted_Premium' || t === 'Transplanted_DoubleTone') {
      // The source tray's own loss reads as ordinary Transplanted Out —
      // no separate Premium Care/Double Tone column for it (see MOVE_COLS.pre).
      const src = srcTrayOf(l);
      if (src) push('pre', d, src, b, 'transOut', q);
      push('pre', d, l.plot_name, b, 'trIn', q);   // the receiving tray
      return;
    }

    if (t === 'Cull3_Transfer') {
      const from = (l.remark || '').match(/From:\s*\[([^\]|]+)\|/);
      if (passMain(l.plot_name)) {
        push('main', d, l.plot_name, b, 'trIn', q);
        pushDetail(l.plot_name, b, 'trIn', d, q, from ? from[1] : '');
      }
      if (from && passMain(from[1])) {
        push('main', d, from[1], b, 'trOut', q);
        pushDetail(from[1], b, 'trOut', d, q, l.plot_name);
      }
      return;
    }
  });

  // ── Sales, only against a plot·batch the batch report already has ──
  // Only worth doing when the Main Nursery section is actually wanted.
  const unmatchedSales = [];
  // Every DO line that lands as a Sold event, kept (not just traced) so
  // the Sold column's hover tooltip can show date/DO number/customer/qty
  // for each — see mvShowDetailTip(). Keyed the same simple way the row
  // itself will be looked up by: place + '::' + batch.
  const saleDetails = {};
  if (wantMain) {
    const customerByAl = {};
    (alsRes.data || []).forEach(a => { if (a.al_number) customerByAl[a.al_number] = a.customer_name || ''; });
    const realRows = new Map();
    ev.filter(e => e.sc === 'main').forEach(e => {
      const pk = _mvPlotKey(e.place), bk = _mvBatchKey(e.batch);
      if (!pk || !bk) return;
      if (!realRows.has(pk)) realRows.set(pk, new Map());
      if (!realRows.get(pk).has(bk)) realRows.get(pk).set(bk, { place: e.place, batch: e.batch });
    });
    // Diagnostic trace — every DO line that landed as a Sold event
    // for the main-nursery view. Open DevTools > Console and grep for
    // [mv:sales] to audit "which DO lines add up to N sold on plot X
    // batch Y". Grouped and totalled below the raw list.
    const _salesTrace = [];
    (dosRes.data || []).forEach(d => {
      if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
      for (let i = 1; i <= 5; i++) {
        const qty = Number(d[`qty_${i}`] || 0);
        if (!qty) continue;
        const plot = d[`plot_${i}`];
        if (!passMain(plot)) continue;
        const hit = (realRows.get(_mvPlotKey(plot)) || new Map()).get(_mvBatchKey(d[`batch_${i}`]));
        if (!hit) { unmatchedSales.push({ plot: plot || '—', batch: d[`batch_${i}`] || '—', qty }); continue; }
        ev.push({ sc: 'main', date: d.delivery_date || null, place: hit.place, batch: hit.batch, col: 'sold', qty });
        const dk = hit.place + '::' + hit.batch;
        (saleDetails[dk] = saleDetails[dk] || []).push({
          doNumber: d.do_number || '—', date: d.delivery_date || null,
          customer: customerByAl[d.al_number] || '—', qty
        });
        _salesTrace.push({
          do: d.do_number, line: i,
          plot: hit.place, batch: hit.batch,
          raw_plot: plot, raw_batch: d[`batch_${i}`], qty,
          delivery_date: d.delivery_date, status: d.status
        });
      }
    });
    const _byPB = {};
    _salesTrace.forEach(t => {
      const k = t.plot + ' · ' + t.batch;
      (_byPB[k] = _byPB[k] || []).push(t);
    });
    Object.keys(_byPB).sort().forEach(k => {
      const rows = _byPB[k];
      const total = rows.reduce((s, r) => s + r.qty, 0);
      console.log('[mv:sales]', k, '=', total, '(' + rows.length + ' DO line' + (rows.length===1?'':'s') + ')', rows);
    });
  }

  const ctx = { fromMs, toMs, fromStr, toStr, groupBy, plotToLoc, trayNursery, batchPlantedAt, saleDetails, colDetails };
  const sections = [];
  if (wantPre)  sections.push(buildMovementSection('pre',  ev.filter(e => e.sc === 'pre'),  { ...ctx, unmatchedSales: [] }));
  if (wantMain) sections.push(buildMovementSection('main', ev.filter(e => e.sc === 'main'), { ...ctx, unmatchedSales }));

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = sections.join('');
}

/**
 * Builds one Movement Report section (Pre-Nursery or Main Nursery) as an
 * HTML string, from events already filtered to that scope. Split out of
 * runMovementReportCombined() so both sections come off one fetch and one
 * pass over the ledger — see there — instead of each fetching (and
