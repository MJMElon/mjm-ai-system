 * re-deriving plotToLoc/trayNursery/batchPlantedAt) on its own.
 */
function buildMovementSection(scope, ev, ctx) {
  const { fromMs, toMs, fromStr, toStr, plotToLoc, trayNursery, batchPlantedAt, unmatchedSales, saleDetails, colDetails } = ctx;
  // Pre-Nursery reads naturally by Batch — one batch, several trays over its
  // life, and "Sort by" (Plot/Batch) is really a Main Nursery toggle (worth
  // it there: trace a transferred batch across every plot it now sits in).
  // Pre-Nursery ignores the shared dropdown and always groups by batch.
  const groupBy = scope === 'pre' ? 'batch' : ctx.groupBy;

  // ── Three buckets from the same events ──
  // `buc` is everything up to the As-At date, unrestricted by the implicit
  // From — this is what Balance/Batch Balance is netted from, because
  // "what's actually standing in this plot right now" can't correctly
  // ignore months before the one you happen to be looking at.
  // `per` is only events inside [month start, As At] — this is what fills
  // the visible Culled/Transplanted/Damaged/etc columns, so picking a date
  // in September shows September's culling to date, not everything since
  // the batch began.
  // `bf` is everything strictly BEFORE month start — the balance brought
  // forward into this month, shown in its own B/F column. Computed the same
  // way as `buc` (netOfRow over a fully cumulative bucket, just cut off
  // earlier) rather than derived as buc − per, so it's correct on its own
  // even in the one case where that arithmetic wouldn't cleanly reconcile:
  // netOfRow's "supersede" rule (a 3rd culling excludes the 2nd once
  // recorded) is evaluated separately for `buc` and `bf`, each its own
  // honest cumulative total, not a subtraction that could inherit an edge
  // case from the other side of the cut.
  const SEP = '\x01';
  const buc = {}, per = {}, bf = {}, meta = {};
  for (const e of ev) {
    const ts = e.date ? new Date(e.date).getTime() : NaN;
    if (!isFinite(ts) || ts > toMs) continue;
    const k = e.place + SEP + e.batch;
    meta[k] = meta[k] || { place: e.place, batch: e.batch };
    if (!buc[k]) buc[k] = emptyRow(scope);
    buc[k][e.col] += e.qty;
    if (ts >= fromMs) {
      if (!per[k]) per[k] = emptyRow(scope);
      per[k][e.col] += e.qty;
    } else {
      if (!bf[k]) bf[k] = emptyRow(scope);
      bf[k][e.col] += e.qty;
    }
  }

  let rows = [];
  for (const k of Object.keys(buc)) {
    const closing = netOfRow(scope, buc[k]);
    const periodRow = per[k] || emptyRow(scope);
    // A batch/plot pair still shows if there's anything to actually see:
    // either it has movement THIS period (batch 242 in B4 — culled and
    // sold out, both in September, Balance ends at 0 but the row still
    // earns its place), or something's still standing (closing !== 0).
    // Neither — a batch whose only activity was months ago and has sat at
    // 0 ever since, with nothing happening as at the date picked — has
    // nothing to report and stays hidden, same as before.
    const hasPeriodActivity = MOVE_COLS[scope].some(c => (periodRow[c.key] || 0) !== 0);
    if (closing === 0 && !hasPeriodActivity) continue;
    const bfClosing = netOfRow(scope, bf[k] || emptyRow(scope));
    // Same window as periodRow's own figures (fromMs..toMs) — every
    // tooltip has to list exactly what its own column's number is made
    // of, not this batch/plot's whole history on that column.
    const inPeriod = (arr) => (arr || []).filter(r => {
      const ts = r.date ? new Date(r.date).getTime() : NaN;
      return isFinite(ts) && ts >= fromMs && ts <= toMs;
    });
    const sales = saleDetails ? inPeriod(saleDetails[meta[k].place + '::' + meta[k].batch]) : [];
    const details = {};
    if (colDetails) {
      ['trIn', 'transIn', 'cull3', 'trOut'].forEach(col => {
        const dk = meta[k].place + '::' + meta[k].batch + '::' + col;
        details[col] = inPeriod(colDetails[dk]);
      });
    }
    rows.push({ ...meta[k], ...periodRow, closing, bf: bfClosing, sales, details,
                age: ageLabel(batchPlantedAt[_mvBatchKey(meta[k].batch)]) });
  }

  const _natCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  const locOfRow = (r) => scope === 'pre'
    ? (trayNursery[r.place] || 'Pre-Nursery')
    : (plotToLoc[r.place] || 'Unassigned');
  rows.sort((a, c) => (groupBy === 'batch'
    // A transferred batch sits in several plots, often in several nurseries;
    // keeping it under one heading is the whole point of this view.
    ? _natCmp(a.batch, c.batch) ||
      nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(a.place, c.place)
    : nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(locOfRow(a), locOfRow(c)) ||
      _natCmp(a.place, c.place) || _natCmp(a.batch, c.batch)));

  const cols = MOVE_COLS[scope];
  const placeLabel = scope === 'pre' ? 'Tray No' : 'Plot';
  const firstLabel  = groupBy === 'batch' ? 'Batch' : placeLabel;
  const secondLabel = groupBy === 'batch' ? placeLabel : 'Batch';
  const title = scope === 'pre' ? 'Pre-Nursery Movement' : 'Main Nursery Movement';

  if (!rows.length) {
    return `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No ${
      scope === 'pre' ? 'pre-nursery' : 'main nursery'} movement found in this period.</div>`;
  }

  const fmtCell = (n, cls) => `<td class="${cls || ''}">${n ? fmtNum(n) : '0'}</td>`;
  // A cell hovers to a tooltip listing what its number is made of, when
  // there's something behind it — a plain number otherwise, same as any
  // other cell. The rows are pushed into the shared pool and referenced
  // by index rather than embedding the data in the attribute itself, so
  // a customer name or a plot name with a quote in it can't break the
  // markup. Sold reads r.sales (Date/DO Number/Customer/Qty); the other
  // wired columns read r.details[col] (Date/label/Qty) — see the
  // pushDetail() calls above and DETAIL_TITLES below.
  const DETAIL_TITLES = { trIn: 'Transfer In', transIn: 'Transplanted from PN', cull3: '3rd Culled', trOut: 'Transfer Out' };
  const fmtDetailCell = (r, c) => {
    const n = r[c.key];
    const rowsForTip = c.key === 'sold' ? r.sales : (r.details && r.details[c.key]);
    if (!n || !rowsForTip || !rowsForTip.length) return fmtCell(n, c.cls);
    const title = c.key === 'sold' ? 'Sold' : DETAIL_TITLES[c.key];
    const idx = _mvDetailPool.push({ title, rows: rowsForTip }) - 1;
    return `<td class="${c.cls || ''}"><span class="cursor-help border-b border-dotted border-current"
      onmouseenter="mvShowDetailTip(this, ${idx})" onmouseleave="mvHideDetailTip()">${fmtNum(n)}</span></td>`;
  };

  // ── Body: a section per nursery, a group per tray/plot ──
  // Grouped by whichever the reader asked for. By batch, a batch that has
  // been transferred shows every plot it now sits in under one heading —
  // which is the only way to see where a batch actually IS.
  const keyOf   = (r) => (groupBy === 'batch' ? r.batch : r.place);
  const otherOf = (r) => (groupBy === 'batch' ? r.place : r.batch);
  const groups = [];
  rows.forEach(r => {
    const last = groups[groups.length - 1];
    if (last && last.key === keyOf(r)) last.list.push(r);
    else groups.push({ key: keyOf(r), loc: locOfRow(r), list: [r] });
  });

  const totalCols = 6 + cols.length; // Place/Batch, Age, B/F, cols, Batch Balance, Balance
  const bodyHtml = [];
  let lastLoc = null;
  let band = false;
  groups.forEach(g => {
    if (groupBy !== 'batch' && g.loc !== lastLoc) {
      lastLoc = g.loc;
      // !text-left — .movement-table td defaults every cell to text-align:right
      // (it's mostly a numbers table), which otherwise beats a plain
      // text-left utility class on specificity alone.
      bodyHtml.push(`<tr style="background:#f3ede1"><td colspan="${totalCols}"
        class="font-black text-base !text-left uppercase tracking-widest text-[#3d2610] py-2">${g.loc}</td></tr>`);
    }
    const bal = g.list.reduce((s, r) => s + r.closing, 0);
    // Alternating band per ROW (not per group) — every line gets its own
    // dark/light step, so a batch with several tray/plot rows still shows
    // each one distinctly instead of one solid block of colour.
    g.list.forEach((r, i) => {
      band = !band;
      const zebra = band ? ' style="background:#f0e6d2"' : '';
      // The group key and the group's Balance are shown once per group, not
      // once per row — a real rowspan cell, vertically centred, instead of
      // text pinned to the group's first row with blank cells trailing
      // under it (which read as stuck at the top, not "one merged value").
      bodyHtml.push(`<tr${zebra}>
        ${i === 0 ? `<td rowspan="${g.list.length}" class="col-label font-black text-[#8a7a68] align-middle">${g.key}</td>` : ''}
        <td class="col-label">${otherOf(r) || '—'}</td>
        <td class="col-label text-[#8a7a68] text-xs whitespace-nowrap">${r.age}</td>
        ${fmtCell(r.bf, 'text-[#8a7a68] font-black')}
        ${cols.map(c => fmtDetailCell(r, c)).join('')}
        ${fmtCell(r.closing, 'text-[#4a7a2e] font-black')}
        ${i === 0 ? `<td rowspan="${g.list.length}" class="font-black text-[#8a7a68] align-middle">${fmtNum(bal)}</td>` : ''}
      </tr>`);
    });
  });

  // ── Grand total ──
  const grand = rows.reduce((s, r) => {
    cols.forEach(c => { s[c.key] += r[c.key] || 0; });
    s.closing += r.closing;
    s.bf += r.bf || 0;
    return s;
  }, { closing: 0, bf: 0, ...emptyRow(scope) });

  // A grouped header row only where two columns belong together.
  const grouped = cols.some(c => c.grp);
  let groupRow = '';
  if (grouped) {
    const cells = [];
    let i = 0;
    while (i < cols.length) {
      const g = cols[i].grp;
      if (!g) { cells.push('<th></th>'); i++; continue; }
      let n = 0;
      while (i + n < cols.length && cols[i + n].grp === g) n++;
      cells.push(`<th colspan="${n}" class="text-center text-[#c07820]">${g}</th>`);
      i += n;
    }
    groupRow = `<tr><th colspan="4"></th>${cells.join('')}<th colspan="2"></th></tr>`;
  }

  const rangeLabel = fromStr && toStr
    ? `${fmtDate(fromStr)} – ${fmtDate(toStr)} · Balance as at ${fmtDate(toStr)}`
    : (toStr ? `Balance as at ${fmtDate(toStr)}` : 'Balance as at today');
  const unmatchedHtml = unmatchedSales.length ? `
      <div class="mt-4 rounded-2xl border border-[#f0b429] bg-[#fffbeb] p-4">
        <div class="text-[11px] font-black text-[#7a4a10] uppercase tracking-widest mb-2">
          ${unmatchedSales.length} delivery order line${unmatchedSales.length === 1 ? '' : 's'} not matched to a batch report
        </div>
        <div class="text-[10px] font-bold text-[#8a7a68] mb-2">
          These are left out of the table above. The plot or batch on the delivery order does not
          exist in any batch report, so there is no row for the sale to belong to.
        </div>
        <div class="flex flex-wrap gap-2">
          ${unmatchedSales.map(u => `<span class="inline-block bg-white border border-[#e8dcc8] rounded-lg px-2.5 py-1 text-[11px] font-bold text-[#3d2610]">
             ${u.plot} · batch ${u.batch} · ${fmtNum(u.qty)}</span>`).join('')}
        </div>
      </div>` : '';

  return `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">${title}</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${rangeLabel}</div>
      </div>

      <div class="overflow-x-auto movement-scroll">
        <table class="report-table movement-table">
          <thead>
            ${groupRow}
            <tr>
              <th>${firstLabel}</th>
              <th>${secondLabel}</th>
              <th>Age</th>
              <th>B/F</th>
              ${cols.map(c => `<th>${c.label}</th>`).join('')}
              <th>Batch Balance</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody>
            ${bodyHtml.join('')}
            <tr style="background:#fdf3e6">
              <td class="font-black text-[#3d2610]">GRAND TOTAL</td>
              <td></td><td></td>
              ${fmtCell(grand.bf, 'text-[#8a7a68] font-black')}
              ${cols.map(c => fmtCell(grand[c.key], (c.cls || '') + ' font-black')).join('')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black')}
            </tr>
          </tbody>
        </table>
      </div>

      ${unmatchedHtml}
    </div>
  `;
}

/**
 * Transplanting Report
 *
 * One row per Transplanted / Transplanted_Premium / Transplanted_DoubleTone
 * log line: when it moved, where to, and — since a seedling is treated as
 * mature roughly 9 months after being put out — when it's due. Nursery-
 * filterable the same way Movement Report's Main Nursery section already is
 * — the same Locations chips, PN included (see runMovementReportCombined).
 */
async function runTransplantingReport() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;
  const selectedLocs = new Set(selectedNurseries());

  const [logsRes, plotsRes, batchesRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('batch_name, transaction_date, created_at, remark, plot_name, quantity_change, breed_name')
      .in('transaction_type', ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'])
      .order('id', { ascending: true })),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    _supabase.from('operation_batches').select('name, breed_name')
  ]);
  if (logsRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logsRes.error.message}</div>`;
    return;
  }

  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  const batchBreed = {};
  (batchesRes.data || []).forEach(b => { batchBreed[b.name] = b.breed_name; });

  const maturityOf = (d) => {
    const dt = new Date(d);
    if (isNaN(dt)) return null;
    dt.setMonth(dt.getMonth() + 9);
    return dt.toISOString().slice(0, 10);
  };

  let rows = (logsRes.data || []).map(l => {
    const date = _logDate(l);
    // A transplant can land in a pre-nursery tray (Premium Care / Double
    // Tone) rather than a main-nursery plot — those trays are never a row
    // in shared_plots, so plotToLoc[...] would silently fall through to
    // "Unassigned". PRE_NURSERY_PLOTS is the same list runMovementReport
    // already uses to recognise them; label them "PN" instead.
    const nursery = PRE_NURSERY_PLOTS.includes(l.plot_name) ? 'PN' : (plotToLoc[l.plot_name] || 'Unassigned');
    return {
      date, maturity: date ? maturityOf(date) : null,
      nursery,
      plot: l.plot_name || '—', batch: l.batch_name || '—',
      breed: l.breed_name || batchBreed[l.batch_name] || '—',
      qty: Number(l.quantity_change || 0)
    };
  }).filter(r => {
    const ts = r.date ? new Date(r.date).getTime() : NaN;
    // A row with no usable date at all can't be placed within a chosen
    // range — leave it out rather than guess which month it belongs to.
    if (from || to) { if (!isFinite(ts) || ts < fromTs || ts > toTs) return false; }
    if (selectedLocs.size && !selectedLocs.has(r.nursery)) return false;
    if (breed && r.breed !== breed) return false;
    return true;
  });

  rows.sort((a, c) => String(c.date || '').localeCompare(String(a.date || '')));
  const total = rows.reduce((s, r) => s + r.qty, 0);

  loading.classList.add('hidden');
  out.classList.remove('hidden');
  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Transplanting Report</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} record${rows.length === 1 ? '' : 's'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Transplanting Date</th><th>Maturity Date</th><th>Location</th><th>Plot</th><th>Batch</th><th>Breed</th><th class="text-right">Qty</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td>${fmtDate(r.date)}</td>
                <td class="text-[#c07820] font-black">${fmtDate(r.maturity)}</td>
                <td class="font-black text-[#3a7ab4]">${r.nursery}</td>
                <td>${r.plot}</td>
                <td class="font-black">${r.batch}</td>
                <td>${r.breed}</td>
                <td class="text-right font-black">${fmtNum(r.qty)}</td>
              </tr>`).join('') : `<tr><td colspan="7" class="text-center py-10 text-[#8a7a68]">No transplant records match the selected filters.</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="6" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(total)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

/**
 * Sales Listing
 *
 * Table view: one row per Delivery Order collection line — the same
 * plot_N / qty_N / batch_N lines the batch report's own Sales figure reads,
 * with the same single-line-DO qty fallback — grouped by customer (read off
 * the linked Approval Letter, same as the DO List does it), with a subtotal
 * per customer and a grand total at the end. Unit Price also comes from the
 * AL (shared_al_orders.price_per_unit — the price the sales website order
 * carried through to the AL).
 *
 * Chart view reuses runSeedlingSales() / _renderSalesChart from the old
 * Seedling Sales report, with one change: it now excludes CAL- calibration
 * DOs too, same as the Table view, so the two match — a month's Chart bar
 * and its Table "Total Sold" used to disagree by whatever CAL- volume fell
 * in that month, which is the same reason the 3rd Culling Sales figure
 * elsewhere in this system counts CAL- as a sale ("what is left in the
 * plot") while this listing doesn't (it's asking what customers actually
 * ordered, the same question operation_stock_sales.js's Order & Collection
 * dashboard asks).
 */
async function runSalesListing() {
  if (_salesViewMode === 'chart') return runSeedlingSales();

  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;
  const selectedLocs = new Set(selectedNurseries());

  const [dosRes, alsRes, plotsRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('id, do_number, al_number, delivery_date, total_qty, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_al_orders').select('al_number, customer_name, price_per_unit')),
    _supabase.from('shared_plots').select('plot_name, nursery_name')
  ]);
  if (dosRes.error) {
    loading.classList.add('hidden'); out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load delivery records: ${dosRes.error.message}</div>`;
    return;
  }

  const alByNumber = {};
  (alsRes.data || []).forEach(a => { if (a.al_number) alByNumber[a.al_number] = a; });
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });

  // ── Flatten every DO into its individual collection lines ──
  const lines = [];
  (dosRes.data || []).forEach(d => {
    if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
    if (/^CAL-/i.test(d.do_number || '')) return; // a stock correction, not a customer sale
    const ts = d.delivery_date ? new Date(d.delivery_date).getTime() : NaN;
    if (from || to) { if (!isFinite(ts) || ts < fromTs || ts > toTs) return; }

    let filled = 0;
    for (let i = 1; i <= 5; i++) if (String(d[`plot_${i}`] || '').trim()) filled++;

    const al = d.al_number ? alByNumber[d.al_number] : null;
    const customer   = (al && al.customer_name) || d.remark || 'Unknown';
    const unitPrice  = al ? Number(al.price_per_unit || 0) : null;

    for (let i = 1; i <= 5; i++) {
      const plot = d[`plot_${i}`];
      if (!String(plot || '').trim()) continue;
      let qty = Number(d[`qty_${i}`] || 0);
      // Same fallback the batch report's own Sales figure uses: a single-
      // line DO whose per-line qty was never keyed reads its total instead.
      const fallback = (!qty && filled === 1);
      if (fallback) qty = Number(d.total_qty || 0);
      if (!qty) continue;
      const loc = plotToLoc[plot] || 'Unassigned';
      if (selectedLocs.size && !selectedLocs.has(loc)) continue;
      lines.push({
        date: d.delivery_date, customer, doNumber: d.do_number,
        qty, nursery: loc, plot, batch: d[`batch_${i}`] || '—',
        unitPrice
      });
    }
  });

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  if (!lines.length) {
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No sales found for the selected filters.</div>`;
    return;
  }

  // ── Group by customer, ordered by whoever sold the most ──
  const byCustomer = {};
  lines.forEach(l => { (byCustomer[l.customer] = byCustomer[l.customer] || []).push(l); });
  const customers = Object.keys(byCustomer).sort((a, b) =>
    byCustomer[b].reduce((s, l) => s + l.qty, 0) - byCustomer[a].reduce((s, l) => s + l.qty, 0));

  const grandTotal  = lines.reduce((s, l) => s + l.qty, 0);
  const anyPriced   = lines.some(l => l.unitPrice != null);
  const grandAmount = lines.reduce((s, l) => s + (l.unitPrice != null ? l.unitPrice * l.qty : 0), 0);
  // Customer isn't its own column — it's the group-header row above each
  // customer's lines, so it never needed a column of its own.
  const colCount    = anyPriced ? 7 : 6;

  const rowsHtml = customers.map(cust => {
    const rows = byCustomer[cust].slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
    const custQty = rows.reduce((s, l) => s + l.qty, 0);
    const custAmt = rows.reduce((s, l) => s + (l.unitPrice != null ? l.unitPrice * l.qty : 0), 0);
    return `
      <tr style="background:#f3ede1"><td colspan="${colCount}" class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${cust}</td></tr>
      ${rows.map(l => `
        <tr>
          <td>${fmtDate(l.date)}</td>
          <td class="font-black text-[#3a7ab4]">${l.doNumber || '—'}</td>
          <td>${l.nursery}</td>
          <td>${l.plot}</td>
          <td>${l.batch}</td>
          <td class="text-right font-black">${fmtNum(l.qty)}</td>
          ${anyPriced ? `<td class="text-right">${l.unitPrice != null ? 'RM ' + fmtMoney(l.unitPrice) : '—'}</td>` : ''}
        </tr>`).join('')}
      <tr style="background:#fdfaf4">
        <td colspan="5" class="text-right font-black text-[10px] uppercase tracking-widest text-[#8a7a68]">Subtotal — ${cust}</td>
        <td class="text-right font-black text-[#4a7a2e]">${fmtNum(custQty)}</td>
        ${anyPriced ? `<td class="text-right font-black text-[#4a7a2e]">RM ${fmtMoney(custAmt)}</td>` : ''}
      </tr>`;
  }).join('');

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Sales Listing</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(lines.length)} line${lines.length === 1 ? '' : 's'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="report-table">
          <thead><tr>
            <th>Collection Date</th><th>DO Number</th><th>Nursery</th><th>Plot</th><th>Batch</th>
            <th class="text-right">Sold Qty</th>${anyPriced ? '<th class="text-right">Unit Price</th>' : ''}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot><tr class="font-black bg-[#fdf3e6]">
            <td colspan="5" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total Sold</td>
            <td class="text-right text-[#4a7a2e]">${fmtNum(grandTotal)}</td>
            ${anyPriced ? `<td class="text-right text-[#4a7a2e]">RM ${fmtMoney(grandAmount)}</td>` : ''}
          </tr></tfoot>
        </table>
      </div>
    </div>
  `;
}

async function bootstrap() {
  await MJMAccess.load(_supabase);
  if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
  if (!MJMAccess.canAccess('reports')) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('report-area').classList.add('hidden');
    document.getElementById('forbidden').classList.remove('hidden');
    return;
  }
  // The Report tabs don't exist until renderReportTabs() builds them — do
  // that before anything reads f-report.value. Reopens whichever tab was
  // last selected (see selectReport()) — a refresh used to always land
  // back on Production Summary regardless of what was actually open.
  let DEFAULT_REPORT = 'batch_production';
  try {
    const remembered = localStorage.getItem(LAST_REPORT_KEY);
    if (remembered && REPORTS.some(r => r.value === remembered)) DEFAULT_REPORT = remembered;
  } catch (e) { /* private mode, etc — falls back to the plain default */ }
  document.getElementById('f-report').value = DEFAULT_REPORT;
  renderReportTabs();

  const todayStr = new Date().toISOString().slice(0, 10);
  const fTo = document.getElementById('f-to');
  fTo.value = todayStr;
  // Reports look at what has actually happened — future dates make no
  // sense. f-from is hidden and derived from f-to (see runReport()), so
  // only f-to needs a bound.
  fTo.max = todayStr;
  await Promise.all([loadBreeds(), loadNurseryFilter()]);
  // Same rule as selectReport() — a refresh landing straight back on
  // Movement Report still starts with Locations unticked, not whatever
  // loadNurseryFilter()'s chips default to.
  if (DEFAULT_REPORT === 'movement_report') document.querySelectorAll('.f-nurs-cb').forEach(cb => cb.checked = false);
  _setSalesView('table');
  document.getElementById('f-mode-table').addEventListener('click', () => { _setSalesView('table'); runReport(); });
  document.getElementById('f-mode-chart').addEventListener('click', () => { _setSalesView('chart'); runReport(); });
  document.addEventListener('change', e => {
    if (e.target && (e.target.classList.contains('f-yr-cb') || e.target.classList.contains('f-nurs-cb'))) runReport();
  });
  syncFilterVisibility();
  runReport();
}

bootstrap();

// ── Batch Production drilldown modal ─────────────────────────────
// A single centred modal reused for the Seeds Received / Transplanted /
// Culled tiles. Content is regenerated on every open so we always
// reflect the active date+breed filter.
// Persist the active drilldown's Year + Month picks so onchange handlers
// on the modal's dropdowns can re-render without re-fetching.
let _bpDrillState = { kind: null, year: '', month: '' };

const _BP_MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Extract raw records for the active drilldown kind. Each record must
// carry a `date` so we can build Year / Month filters and re-filter
// without re-querying the DB.
function _bpDrillCollect(kind, D) {
  const rows = D.rows || [];
  const list = [];
  if (kind === 'seeds') {
    rows.forEach(r => {
      const seedsQty = r.seedsLogs.reduce((s, l) => s + Number(l.quantity_change || 0), 0) || r.seeds;
      list.push({
        date:     r.seeds_date,
        breed:    r.breed_name,
        batch:    r.batch_name,
        received: seedsQty,
        damaged:  r.damaged || 0
      });
    });
  } else if (kind === 'trans') {
    rows.forEach(r => r.transLogs.forEach(l => list.push({
      // The keyed transplanting date, not when the row happened to be written.
      date:    _logDate(l),
      batch:   r.batch_name,
      breed:   r.breed_name,
      plot:    l.plot_name || '—',
      nursery: D.nurseryOf(l.plot_name),
      qty:     Number(l.quantity_change || 0)
    })));
  } else if (kind === 'cull') {
    const push = (r, l, stage) => list.push({
      date:    _logDate(l),
      stage,
      batch:   r.batch_name,
      breed:   r.breed_name,
      plot:    l.plot_name || '—',
      nursery: stage === '1st' ? 'Pre-Nursery' : D.nurseryOf(l.plot_name),
      qty:     Math.abs(Number(l.quantity_change || 0))
    });
    rows.forEach(r => {
      r.cull1Logs.forEach(l => push(r, l, '1st'));
      r.cull2Logs.forEach(l => push(r, l, '2nd'));
      r.cull3Logs.forEach(l => push(r, l, '3rd'));
    });
  }
  return list;
}

// Render the Year/Month picker bar for the active drilldown. `all` is the
// full extracted set (pre-filter) so we can offer only years/months that
// actually have records — no dead selections.
function _bpDrillFilterBar(all) {
  const years = new Set(), months = new Set();
  all.forEach(x => {
    if (!x.date) return;
    const d = new Date(x.date);
    if (isNaN(d)) return;
    years.add(d.getFullYear());
    months.add(d.getMonth());
  });
  const yearOpts = ['<option value="">All years</option>']
    .concat(Array.from(years).sort((a,b) => b-a)
      .map(y => `<option value="${y}"${String(y) === String(_bpDrillState.year) ? ' selected' : ''}>${y}</option>`))
    .join('');
  const monthOpts = ['<option value="">All months</option>']
    .concat(Array.from(months).sort((a,b) => a-b)
      .map(m => `<option value="${m}"${String(m) === String(_bpDrillState.month) ? ' selected' : ''}>${_BP_MONTH_NAMES[m]}</option>`))
    .join('');
  return `
    <div class="flex items-center gap-2 flex-wrap mb-3">
      <span class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mr-1">Filter</span>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Year
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_bpDrillSetFilter('year', this.value)">${yearOpts}</select>
      </label>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Month
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_bpDrillSetFilter('month', this.value)">${monthOpts}</select>
      </label>
      ${(_bpDrillState.year || _bpDrillState.month !== '') ? `
        <button type="button" onclick="_bpDrillClearFilter()" class="text-[10px] font-black text-[#a83020] uppercase tracking-widest hover:underline ml-1">Clear</button>
      ` : ''}
    </div>`;
}

function _bpDrillSetFilter(key, value) {
  _bpDrillState[key] = value;
  _bpDrillRender();
}
function _bpDrillClearFilter() {
  _bpDrillState.year = ''; _bpDrillState.month = '';
  _bpDrillRender();
}

function _bpDrillApplyFilter(all) {
  const y = _bpDrillState.year, m = _bpDrillState.month;
  if (!y && m === '') return all.slice();
  return all.filter(x => {
    if (!x.date) return false;
    const d = new Date(x.date);
    if (isNaN(d)) return false;
    if (y && d.getFullYear() !== Number(y)) return false;
    if (m !== '' && d.getMonth() !== Number(m)) return false;
    return true;
  });
}

function openBpDrill(kind) {
  if (!window._bpDetails) return;
  _bpDrillState = { kind, year: '', month: '' };
  _bpDrillRender();
  document.getElementById('bp-drill-modal').classList.remove('hidden');
  document.getElementById('bp-drill-modal').classList.add('flex');
}

function _bpDrillRender() {
  const D = window._bpDetails; if (!D) return;
  const kind = _bpDrillState.kind;
  const rangeLabel = [
    D.filterFrom ? 'From ' + fmtDate(D.filterFrom) : '',
    D.filterTo   ? 'to '   + fmtDate(D.filterTo)   : '',
    D.breed || ''
  ].filter(Boolean).join(' · ') || 'All time';

  const allList = _bpDrillCollect(kind, D);
  const list    = _bpDrillApplyFilter(allList);

  // Filter chip text so the count line reads honestly.
  const activeYear  = _bpDrillState.year;
  const activeMonth = _bpDrillState.month;
  const filterNote = (activeYear || activeMonth !== '') ?
    ` · Filtered: ${activeMonth !== '' ? _BP_MONTH_NAMES[Number(activeMonth)] : ''} ${activeYear || ''}`.trim() : '';

  const barHtml = _bpDrillFilterBar(allList);

  let title = '', bodyInner = '';
  if (kind === 'seeds') {
    title = 'Seeds Received · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const totRcv = list.reduce((s, x) => s + x.received, 0);
    const totDmg = list.reduce((s, x) => s + x.damaged,  0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} batch${list.length === 1 ? '' : 'es'}${filterNote}</div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Breed (Source)</th><th>Batch</th>
            <th class="text-right">Qty Received</th><th class="text-right">Damaged</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td>${x.breed}</td>
                <td class="font-black">${x.batch}</td>
                <td class="text-right text-[#c07820] font-black">${fmtNum(x.received)}</td>
                <td class="text-right ${x.damaged ? 'text-[#a83020] font-black' : 'text-[#8a7a68]'}">${x.damaged ? fmtNum(x.damaged) : '—'}</td>
              </tr>`).join('') : '<tr><td colspan="5" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Totals</td>
            <td class="text-right text-[#c07820]">${fmtNum(totRcv)}</td>
            <td class="text-right text-[#a83020]">${fmtNum(totDmg)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }
  else if (kind === 'trans') {
    title = 'Transplanted · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const roll = {};
    list.forEach(x => { roll[x.nursery] = (roll[x.nursery] || 0) + x.qty; });
    const rollRows = Object.entries(roll).sort((a, b) => b[1] - a[1]);
    const total = list.reduce((s, x) => s + x.qty, 0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} transplant record${list.length === 1 ? '' : 's'}${filterNote}</div>
      <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        ${rollRows.map(([n, q]) => `
          <div class="bg-[#eef5fc] border border-[#bee3f8] rounded-xl px-3 py-2">
            <div class="text-[9px] font-black text-[#3a7ab4] uppercase tracking-widest">${n}</div>
            <div class="text-lg font-black text-[#3a7ab4]">${fmtNum(q)}</div>
          </div>`).join('') || '<div class="text-[10px] text-[#8a7a68] uppercase tracking-widest col-span-full">No transplant records for the selected filter.</div>'}
      </div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Batch</th><th>Breed (Source)</th>
            <th>Nursery</th><th>Plot</th><th class="text-right">Qty</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td class="font-black">${x.batch}</td>
                <td>${x.breed}</td>
                <td class="font-black text-[#3a7ab4]">${x.nursery}</td>
                <td>${x.plot}</td>
                <td class="text-right text-[#3a7ab4] font-black">${fmtNum(x.qty)}</td>
              </tr>`).join('') : '<tr><td colspan="6" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="5" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(total)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }
  else if (kind === 'cull') {
    title = 'Culled (1 + 2 + 3) · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const roll = {};
    list.forEach(x => {
      if (!roll[x.nursery]) roll[x.nursery] = { total: 0, '1st': 0, '2nd': 0, '3rd': 0 };
      roll[x.nursery].total    += x.qty;
      roll[x.nursery][x.stage] += x.qty;
    });
    const rollEntries = Object.entries(roll).sort((a, b) => b[1].total - a[1].total);
    const total = list.reduce((s, x) => s + x.qty, 0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} culling record${list.length === 1 ? '' : 's'}${filterNote}</div>
      <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        ${rollEntries.map(([n, v]) => `
          <div class="bg-[#fff5f5] border border-[#f8d7da] rounded-xl px-3 py-2">
            <div class="text-[9px] font-black text-[#a83020] uppercase tracking-widest">${n}</div>
            <div class="text-lg font-black text-[#a83020]">${fmtNum(v.total)}</div>
            <div class="text-[9px] font-bold text-[#8a7a68] mt-0.5">1st ${fmtNum(v['1st'])} · 2nd ${fmtNum(v['2nd'])} · 3rd ${fmtNum(v['3rd'])}</div>
          </div>`).join('') || '<div class="text-[10px] text-[#8a7a68] uppercase tracking-widest col-span-full">No culling records for the selected filter.</div>'}
      </div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Stage</th><th>Batch</th><th>Breed (Source)</th>
            <th>Nursery</th><th>Plot</th><th class="text-right">Culled Qty</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td class="font-black text-[#a83020]">${x.stage}</td>
                <td class="font-black">${x.batch}</td>
                <td>${x.breed}</td>
                <td class="font-black text-[#a83020]">${x.nursery}</td>
                <td>${x.plot}</td>
                <td class="text-right text-[#a83020] font-black">${fmtNum(x.qty)}</td>
              </tr>`).join('') : '<tr><td colspan="7" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="6" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#a83020]">${fmtNum(total)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }

  document.getElementById('bp-drill-title').textContent = title;
  document.getElementById('bp-drill-body').innerHTML   = barHtml + bodyInner;
}
window._bpDrillSetFilter   = _bpDrillSetFilter;
window._bpDrillClearFilter = _bpDrillClearFilter;

function closeBpDrill() {
  const m = document.getElementById('bp-drill-modal');
  if (!m) return;
  m.classList.add('hidden');
  m.classList.remove('flex');
}

window.openBpDrill  = openBpDrill;
window.closeBpDrill = closeBpDrill;
</script>

<!-- Batch Production drilldown modal — reused across Seeds Received / Transplanted / Culled tiles. -->
<div id="bp-drill-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/60 p-4" onclick="if(event.target===this)closeBpDrill()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-6 py-4 border-b border-[#e8dcc8] bg-gradient-to-r from-[#f8f4ec] to-white">
      <div class="text-base font-black text-[#3d2610] uppercase tracking-widest" id="bp-drill-title">Detail</div>
      <button onclick="closeBpDrill()" class="w-9 h-9 rounded-lg bg-[#e8dcc8]/60 hover:bg-[#e8dcc8] text-[#3d2610] text-xl leading-none flex items-center justify-center transition-colors">×</button>
    </div>
    <div class="p-5 overflow-y-auto" id="bp-drill-body"></div>
  </div>
</div>


<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
