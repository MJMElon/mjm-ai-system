<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- This page carries every line of its own code inline, so the PAGE is the
     deploy: a cached copy is yesterday's routing, for ever. GitHub Pages has
     no build step and nowhere to set a real header, so these three metas are
     the only lever. One hard reload per machine picks them up; after that it
     stays fresh by itself. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Nursery Reporting System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%236366f1%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_staff_gate.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#f1f5f9; margin:0; }
  .section-label { font-size:11px; font-weight:900; color:#1e293b; text-transform:uppercase;
                    letter-spacing:.1em; margin:30px 2px 14px; }
  .section-label:first-of-type { margin-top:0; }
  .door-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
  .door { display:flex; flex-direction:column; align-items:center; text-align:center;
          gap:14px; padding:30px 20px; border-radius:24px;
          background:white; border:1.5px solid #e0e7ff; text-decoration:none; transition:all .15s; }
  .door:hover { border-color:#a5b4fc; transform:translateY(-2px); box-shadow:0 10px 24px -6px rgba(99,102,241,.28); }
  .door-ico { width:72px; height:72px; border-radius:20px; display:grid; place-items:center; flex-shrink:0; }
  .door-ico svg { width:36px; height:36px; }
  .door-name { font-size:13.5px; font-weight:900; color:#1e293b; text-transform:uppercase; letter-spacing:.06em; }
  .door-sub { font-size:11.5px; font-weight:600; line-height:1.4; color:#64748b; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- Standardised MJM Nursery AI ribbon — see shared/shared_ribbon.js -->
<div id="mjm-ribbon"></div>
<script src="../shared/shared_ribbon.js"></script>

<div id="loading" class="max-w-[860px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="forbidden" class="max-w-[860px] mx-auto px-6 py-16 hidden">
  <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center shadow">
    <div class="text-4xl mb-3">🔒</div>
    <h2 class="text-lg font-black text-slate-800 uppercase tracking-widest">Access Denied</h2>
    <p class="text-xs text-slate-500 mt-2">You do not have access to the Nursery Reporting System.</p>
    <a href="../index.html" class="inline-block mt-6 text-[10px] font-bold text-emerald-700 uppercase tracking-widest bg-emerald-50 border border-emerald-200 rounded-full px-4 py-2 no-underline">Back to Module Selection</a>
  </div>
</div>

<div id="main" class="max-w-[860px] mx-auto px-4 md:px-6 py-7 hidden">

  <div class="text-[22px] font-black text-slate-800 mb-6">Nursery Reporting System</div>

  <!-- The modules this system has today. Nursery Payroll System is the
       first of them — moved here from its own tile on the hub, same
       module key (npayroll), so nobody's access moved on the day this
       shipped. The next report-shaped module this system grows joins it
       here rather than getting a hub tile of its own. -->
  <div class="section-label">Modules</div>
  <div class="door-grid" id="modules-grid">
    <a class="door" id="door-payroll" href="../npayroll/npayroll_dashboard.html">
      <span class="door-ico" style="background:#e0e7ff;color:#4f46e5;">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="9" width="24" height="16" rx="3"/>
          <circle cx="17" cy="17" r="4"/>
          <path d="M9.5 17h1M23.5 17h1"/>
        </svg>
      </span>
      <span class="door-name">Nursery Payroll System</span>
      <span class="door-sub">Worker register, pay periods, payslips</span>
    </a>
  </div>

  <!-- Shown only to users who may change other people's access -- the
       same test every other module's own door uses. One Module Assess
       Control for the whole system now, rather than one per module
       inside it: a new report-shaped module joins this same screen. -->
  <div class="section-label">System Setting</div>
  <div class="door-grid">
    <a class="door hidden" id="door-user-access" href="reporting_user_access.html">
      <span class="door-ico" style="background:#fdeaea;color:#b91c4a;">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="17" cy="11.2" r="4.5"/>
          <path d="M6.3 29c0-5.3 4.3-8.4 10.7-8.4s10.7 3.1 10.7 8.4"/>
        </svg>
      </span>
      <span class="door-name">Module Assess Control</span>
      <span class="door-sub">Who may open each module and what each one offers</span>
    </a>
  </div>

</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('npayroll')) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('forbidden').classList.remove('hidden');
      return;
    }

    if (MJMAccess.isAdminOf('npayroll') || MJMAccess.canManageUsers()) {
      document.getElementById('door-user-access').classList.remove('hidden');
    }

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  } catch (e) {
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
