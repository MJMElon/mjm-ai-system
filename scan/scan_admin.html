<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>555 MJM Team — Manage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%238b5cf6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2713%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EFC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#faf5ff; margin:0; }
  .card { background:white; border:1px solid #ede9fe; border-radius:20px; box-shadow:0 4px 16px rgba(139,92,246,.08); }

  /* Every door this page offers — FC Portal, Worker Portal, Admin Portal,
     Audit Portal, Worker System, Settings — used to be two different
     things: a pair of oversized "visit X portal" bars, and a separate row
     of small square tiles underneath for everything else. Nothing said
     why some doors were twice the size of others, and there was nowhere
     left to put Admin Portal and Audit Portal when they moved in. One
     grid of equal tiles under a plain greeting reads as what it is: six
     doors into six rooms, none of them the "real" one. */
  .welcome { font-size:22px; font-weight:900; color:#1e293b; margin:4px 2px 18px; }
  .door-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .door { display:flex; flex-direction:column; align-items:center; text-align:center;
          gap:10px; padding:22px 16px; border-radius:22px;
          background:white; border:1.5px solid #ede9fe; text-decoration:none; transition:all .15s; }
  .door:hover { border-color:#c4b5fd; transform:translateY(-2px); box-shadow:0 10px 24px -6px rgba(139,92,246,.28); }
  .door-ico { width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:25px; background:#f5f3ff; }
  .door-name { font-size:12px; font-weight:900; color:#1e293b; text-transform:uppercase; letter-spacing:.08em; }
  .door-sub { font-size:10.5px; font-weight:600; line-height:1.4; color:#8b8396; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- Standardised MJM Nursery AI ribbon — see shared/shared_ribbon.js.
     data-logo="off" drops the [AI] square; the wordmark beside it is then
     replaced below with the portal's own three-line mark. Only this page does
     that: every other module keeps the standard ribbon. -->
<div id="mjm-ribbon" data-logo="off" data-brand="" data-center=" "></div>
<script src="../shared/shared_ribbon.js"></script>
<script src="../shared/shared_fc_brand.js" data-portal="Team" data-sub="Manage"></script>

<div id="loading" class="max-w-[860px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[860px] mx-auto px-4 md:px-6 py-7 hidden">

  <div class="welcome" id="welcome-heading">Welcome!</div>

  <!-- Six doors, one grid. FC Portal and Worker Portal are the same site's
       two front doors (e-mail + password, or just the PIN on a worker's
       row in Worker System); Admin Portal and Audit Portal are two other
       systems entirely, moved in here so a person with more than one of
       these does not also need to remember more than one way to reach
       them. Worker System and Settings are tools, not portals, and sit in
       the same grid rather than a tier of their own — a reader should not
       have to work out why some doors are bigger than others. -->
  <div class="door-grid">
    <a class="door" id="fc-portal-link" href="https://scan.mjmnursery.com" target="_blank" rel="noopener">
      <span class="door-ico" style="background:#ede9fe;">📱</span>
      <span class="door-name">FC Portal</span>
      <span class="door-sub">E-mail &amp; password sign-in</span>
    </a>
    <a class="door" id="worker-portal-link" href="https://scan.mjmnursery.com/#/worker" target="_blank" rel="noopener">
      <span class="door-ico" style="background:#d1fae5;">🪪</span>
      <span class="door-name">Worker Portal</span>
      <span class="door-sub">PIN sign-in, no e-mail needed</span>
    </a>
    <a class="door" id="admin-portal-link" href="https://mobile.mjmnursery.com" target="_blank" rel="noopener">
      <span class="door-ico" style="background:#cffafe;">🧾</span>
      <span class="door-name">Admin Portal</span>
      <span class="door-sub">DO issuing, consent, booking</span>
    </a>
    <a class="door" id="audit-portal-link" href="../audit/audit_admin.html">
      <span class="door-ico" style="background:#ffedd5;">📋</span>
      <span class="door-name">Audit Portal</span>
      <span class="door-sub">Plot audits &amp; sign-off</span>
    </a>
    <a class="door" id="tool-workers" href="scan_workers.html">
      <span class="door-ico" style="background:#fef3c7;">👷</span>
      <span class="door-name">Worker System</span>
      <span class="door-sub">The payroll register — PINs live here</span>
    </a>
    <a class="door" id="tool-access" href="scan_settings_hub.html">
      <span class="door-ico" style="background:#f5f3ff;">⚙️</span>
      <span class="door-name">Settings</span>
      <span class="door-sub">FC, Worker, Admin &amp; Auditor setting</span>
    </a>
  </div>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = (id) => document.getElementById(id);

/* The phone app is a different site, so a fresh URL each time — the portal is
   a PWA and a cached shell that names chunks which no longer exist is how it
   comes up broken after a deploy. Same trick the module card uses. */
$('fc-portal-link').addEventListener('click', (e) => {
  e.currentTarget.href = 'https://scan.mjmnursery.com/?cb=' + Date.now();
});
/* The worker portal is a route inside that same PWA, so it needs the same
   fresh URL — and the query goes BEFORE the hash, or the router reads the
   cache-buster as part of the route and lands nowhere. */
$('worker-portal-link').addEventListener('click', (e) => {
  e.currentTarget.href = 'https://scan.mjmnursery.com/?cb=' + Date.now() + '#/worker';
});

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }

    /* This page carries three different claims now: scan-module admins (the
       FC/Worker doors and the two tools), and separately anyone holding
       Admin Portal or Audit Portal access, which moved onto this grid and
       does not depend on scan access at all — an Admin Portal supervisor
       with no scan access of their own must still reach this page to find
       their one door. Refused only when a login holds NONE of the three.

       WHICH portal is the point, same as it always was here: a Field
       Conductor who types the Manage URL wants the app, not this page, and
       scanHome() sends them there. Somebody holding none of the three goes
       back to the hub instead of a dead end. */
    const hasManage = MJMAccess.canScanArea('manage');
    const hasAdminPortal = MJMAccess.canScanArea('admin_portal');
    const hasAuditPortal = MJMAccess.canScanArea('audit_portal');
    if (!hasManage && !hasAdminPortal && !hasAuditPortal) {
      const home = MJMAccess.scanHome();
      window.location.replace(home || '../index.html');
      return;
    }

    const u = MJMAccess.user();
    if (u) $('welcome-heading').textContent = 'Welcome, ' + (u.full_name || u.email || '') + '!';

    // User Access writes other people's permissions, which the database policy
    // only lets a user-manager do — so it is not offered to anyone else.
    /* Each door on this page, by its own tick on Setting. Every one of them
       falls back to the rule that governed it before that screen existed, so
       nobody's access changed on the day the ticks arrived — see
       canScanArea() in shared/shared_access.js. Admin Portal and Audit
       Portal moved onto this page from the hub, so their fallback is the
       same module check the hub used to gate their own cards with —
       nobody's access changed the day they moved either. */
    if (!MJMAccess.canScanArea('setting')) $('tool-access').classList.add('hidden');
    if (!MJMAccess.canScanArea('workers')) $('tool-workers').classList.add('hidden');
    if (!MJMAccess.canScanArea('fc')) $('fc-portal-link').classList.add('hidden');
    if (!MJMAccess.canScanArea('worker')) $('worker-portal-link').classList.add('hidden');
    if (!hasAdminPortal) $('admin-portal-link').classList.add('hidden');
    if (!hasAuditPortal) $('audit-portal-link').classList.add('hidden');

    /* Audit tile is split the same way it was on the hub: an admin lands on
       the back-end page, everyone else goes straight to the to-do list
       that is the screen built for a phone in a nursery. Routed on the
       EXPLICIT audit module level so this agrees with the audit guards
       (isAuditAdmin / requireAdmin), not the profile-level role fallback —
       see index.html's own former copy of this comment. */
    if (hasAuditPortal && !MJMAccess.isAdminOf('audit')) {
      $('audit-portal-link').setAttribute('href', '../audit/audit_home.html');
    }

    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
  } catch (e) {
    if (e && e.message === 'NO_OPS_ACCESS') return;
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     Nelos is a tool that follows the person, not a feature of one module:
     anyone who holds it gets the circle on every page they can reach, and
     the dock itself decides — no session or no Nelos and it never draws.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
