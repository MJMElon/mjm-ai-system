<!-- THE PAGE IS THE DEPLOY. Every line of this screen's code is inline, so a
     browser holding yesterday's copy keeps yesterday's rules on screen while
     the office believes it has changed them — and a permission screen is the
     worst place in the system for that. See "A page that caches cannot
     deliver a fix" in CLAUDE.md: these three metas are the only lever, the
     site being GitHub Pages with no build step and nowhere to set a header.
     One hard reload per machine to pick them up in the first place. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

  /* The parts of the record form, nested under Record work. Indented to line

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                             .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* The five things a person opens in the portal. `key` is what canScan() reads
   on the phone (permissions.scan_actions.<key>.view) and what the nursery list
   is filed under (permissions.scan_nurseries.<key>).

   Labels are Title Case throughout — every word capitalised bar the ones
   inside brackets that are not, and DO stays an abbreviation. Five settings
   in a column read as a set or as five unrelated things, and the difference
   is entirely whether they are written the same way. */
const PAGES = [
  { key:'barcode',     label:'Scan Barcode Counter' },
  { key:'do',          label:'Issue Collection DO' },
  { key:'maintenance', label:'Maintenance',
    /* What a person may do inside Maintenance, beyond opening it.

       ONLY the three that are genuinely about the person. Which parts the
       RECORD FORM offers — the schedule, batch selection, worker selection,
       GPS, photos, the remark — used to be ticked here as well, and they are
       not a question about a person at all: they are how this company records
       maintenance, the same for everyone doing it. They live in one place
       now, System Setting → Portal View & Function, and this screen no longer
       asks the same question a second time in a way that could disagree.

       Signing off is different, and stays here. Verifying, correcting,
       removing and taking the month away are things one person may do and
       the next may not, which is exactly what a per-person screen is for.

       ── Do not put `record` back in this list without reading this ──

       When Record work left it, the seeding below stopped writing the key —
       and the phone was still reading it with canScan, which is all-or-
       nothing per page: once a person's maintenance entry exists, a key not
       named in it is OFF. So every row saved here afterwards lost Record Work
       with no tick left anywhere to give it back, and switching it ON for the
       company did nothing, because canScan reads the company's veto and not
       its ON. The phone answers `record` through canMaintFn now, the same way
       it answers the other six. Adding a tick here again would be an explicit
       answer that beats the company switch — which is fine, but it is a
       decision, not a tidy-up. */
    actions:[
      { key:'verify', label:'Verify work done',
        desc:'Sign off a record a worker made, so the office can see it was checked' },
      /* dflt:false on both, and it does two jobs. It renders the box unticked
         until somebody ticks it, matching canMaintCorrect exactly — the tick
         is the only thing that says yes. And it keeps them out of the seeding
         below, so merely OPENING somebody's row does not write an answer into
         it. */
      { key:'edit', label:'Edit work done', dflt:false,
        desc:'Correct a record already saved — the plot, the batch, the quantity, the remark' },
      /* Its own tick, not a corner of Edit. Correcting a figure and removing
         the morning it was recorded for are different acts with different
         consequences, and somebody trusted to fix a typo is not automatically
         somebody trusted to make a record disappear. */
      { key:'delete', label:'Delete work done', dflt:false,
        desc:'Remove a record from the books altogether. It does not come back' },
      /* The Transplanting Job sheet's own, and deliberately NOT part of Edit
         work done above.

         A transplanting record is the crew for a plot, and the payroll
         divides that plot's quantity among exactly the names ticked on it —
         so reopening one moves a day's pay from one person to another, after
         the claim has been read and possibly after it has been paid.
         Correcting a quantity on a spraying record is bookkeeping; this is
         not, and the two should not be answered by one box.

         Saved transplanting records are read-only for everybody else, which
         is the point: dflt:false keeps the box unticked and keeps the key out
         of the seeding below, so the tick is the only thing that says yes and
         the screen shows exactly who has it. */
      { key:'transplant_edit', label:'Edit transplanting record', dflt:false,
        desc:'Reopen a saved Transplanting Job record and change who is credited. Without this, '
           + 'a transplanting record cannot be altered once it is saved' },
      { key:'export', label:'Download the month',
        desc:'Take the nursery\u2019s records away as a spreadsheet' }
    ] },
  { key:'palms',       label:'PALMS (Plot Status Update)' },
  { key:'culling',     label:'Culling Calculator' },
];

/* ── The Admin Portal's screens ──────────────────────────────────────────
 *
 * mobile.mjmnursery.com. Stored the way every OTHER module on this site
 * stores per-page access — `mobile_actions.<key>.view`, mirrored to
 * `mobile_pages.<key>` — and read back with MJMAccess.canDo('mobile', key,
 * 'view'). That is deliberately not a new shape: shared_module_access.js has
 * written exactly this for every module with its own User Access screen since
 * it was written, the Admin Portal simply never had one.
 *
 * SEAL MANAGEMENT IS THE PORTAL'S OWN SCREEN, not the hub module of the same
 * name. The Admin Portal grew a `seal.html` of its own, so this tick governs
 * that — the seals are received and scanned in the field, which is where that
 * screen is. `seal/seal_dashboard.html` on the hub is a different screen with
 * a module of its own (`modules.seal`), granted on the main User Access as it
 * always was, and this does not touch it.
 */
const ADMIN_PAGES = [
  { key:'do_signing', label:'Issue Collection DO',
    desc:'Issue a delivery order and take the customer’s signature on the phone' },
  { key:'consent',    label:'Customer Consent',
    desc:'The consent form, and the seal ranges allocated against it' },
  { key:'booking',    label:'Customer Collection Time Slot Booking',
    desc:'Book and reschedule a customer’s collection slot' },
  { key:'seal',       label:'Seal Management',
    desc:'The seal stickers on the phone — what came in, and what went out on a DO' },
];

/* ── The Auditor Portal's four audits ────────────────────────────────────
 *
 * THE SAME KEYS THE AUDIT MODULE ALREADY READS. audit/audit_user_access.html
 * is the module's own screen and writes `audit_actions` / `audit_pages`
 * through shared_module_access.js; this writes the same keys with the same
 * meaning, so the two screens are two doors onto one answer rather than two
 * answers. Change a label here and change it there.
 *
 * Verify audit results and the Audit Report are deliberately NOT here: they
 * are the back office's business, they are on that screen, and the office
 * asked for the four audits and their two actions. A tick left off this
 * screen is still set on the module's own one; a tick DUPLICATED badly is how
 * two screens come to disagree.
 */
const AUDIT_PAGES = [
  { key:'plot_audit',  label:'Plot Condition Audit',
    desc:'Pest, animal and disease infestation, and leaf condition' },
  { key:'height',      label:'Seedling Height Audit',
    desc:'Three sampled heights per plot, with photo evidence' },
  { key:'papan',       label:'Plot Signboard Audit',
    desc:'Height, accuracy and visibility of every papan tanda' },
  { key:'maintenance', label:'Maintenance Audit',
    desc:'Verify completed manuring, weeding, racun and interrow work' },
].map((p) => ({ ...p, actions: [
  { key:'record', label:'Record a new audit', desc:'Walk the plot and submit the audit' },
  { key:'edit',   label:'Edit past audits',   desc:'Change an audit already submitted' },
  /* SPLIT OUT OF `edit`, which used to read "Edit & delete past audits".
     `fallbackTo` is what keeps every answer the office has already given:
     a row saved under the old combined tick carries `edit` and no `delete`,
     and until somebody saves it again the old answer is what both this
     screen and the phone read. Reading an absent `delete` as off would draw
     a tick nobody set; reading it as on would hand back a deletion the
     office had deliberately closed. */
  { key:'delete', label:'Delete past audits', desc:'Remove an audit from the books altogether. It does not come back',
    fallbackTo:'edit' },
]}));

/* The five PORTALS a person can be sent to, and what they may open in each.
 *
 * It used to be five flat doors — the back office, the two phone apps, the
 * worker register and this screen — in no particular order, with the FC
 * Portal the only one carrying anything inside it. The office asked for it to
 * read the way the company is actually arranged: one block per portal, and
 * underneath each the things that portal offers.
 *
 * So Worker System and Setting are no longer siblings of the back office they
 * live in; they are nested under it, which is where somebody looking for them
 * goes. And the Admin Portal and Auditor Portal, whose doors have been on the
 * 555 MJM Team page all along, are on the screen that is supposed to grant
 * them — `admin_portal` and `audit_portal` were already real keys read by
 * canScanArea(), set by nothing.
 *
 * Stored as permissions.scan_areas.<key>.view, with the FC Portal's nursery
 * list under scan_area_nurseries.fc. Read by MJMAccess.canScanArea() in
 * shared/shared_access.js, which is also where the fallback lives: an absent
 * answer means nobody has been asked about this person yet, and the rule that
 * governed the door before this screen existed answers instead. Nobody loses
 * anything on the day this ships.
 *
 * `store` is which module's per-page keys the ticks inside a block write.
 * Absent means the block has no pages at all.
 */
const AREAS = [
  { key:'manage',  label:'Worker Portal Manage',
    desc:'The back office on this site — the portal doors and the two tools under them. Without it, opening this site sends them straight to whichever portal they hold below',
    children: [
      { key:'workers', label:'Worker System',
        desc:'The register of workers — who is on the books, their section and their PIN' },
      { key:'setting', label:'User Access Setting',
        desc:'This screen. Who may open what, for everybody' },
    ] },
  { key:'fc',      label:'555 FC Portal',
    desc:'The Field Conductor’s phone app at scan.mjmnursery.com, signed in with this e-mail account',
    nurseries: true, store: 'scan', pages: PAGES },
  { key:'admin_portal', label:'Admin Portal',
    desc:'mobile.mjmnursery.com — DO issuing, consent and booking, signed in with this e-mail account',
    store: 'mobile', pages: ADMIN_PAGES },
  { key:'worker',  label:'555 Worker Portal',
    desc:'The worker’s phone app, entered with the PIN on their row of the payroll register',
    /* Maintenance is the one thing the Worker Portal offers, and it is NOT a
       tick on this screen — it cannot be. A worker signs in with a PIN, so
       the modules on their phone hang off THEIR row of the payroll register,
       not off an e-mail account's permissions. There are two places that
       answer it and this is neither, so the row says which, rather than
       offering a tick that nothing would ever read. */
    notes: [
      { label:'Maintenance',
        desc:'Not set here. The company switch is System Setting → Portal View & Function; '
           + 'the worker’s own answer is Worker Portal → Settings, on their row. Off beats on' },
    ] },
  { key:'audit_portal', label:'Auditor Portal',
    desc:'Plot audits and sign-off, on an auditor’s phone',
    store: 'audit', pages: AUDIT_PAGES },
];

/* Every block that carries pages, by the module its ticks are stored under.
   `scan` keeps its own rules — see openRow — and the other two follow
   shared_module_access.js, which is what their own screens use. */
const STORES = ['mobile', 'audit'];
const areasOfStore = (store) => AREAS.filter((a) => a.store === store);

/* Every `scan_areas` tick on the screen, portals and the doors nested under
   them alike. Flat, because every rule about them — the fallback, the
   seeding, the save — is about the TICK and not about where it is drawn. */
const ALL_AREAS = AREAS.reduce((all, a) => all.concat([a], a.children || []), []);

let profiles = [];        // everyone who holds the scan module
/* The nurseries this screen offers, in the order System Setting → Location
   shows them: [{ code, name, value }].

   They come from the SAME place that card does — operation_nurseries, plus the
   sections the register has always had — and no longer from the distinct
   nursery names on shared_plots. Plots are where work happens, not the list of
   nurseries: a nursery with no plots yet could not be granted to anybody, and
   PN and UNE were missing from this screen entirely for exactly that reason.

   `code` is what a chip reads — PN, BNN, UNN1 — matching the Location card.
   `value` is what a tick SAVES, and it is the register's own name ("UNN 1",
   spaces and all) because that is what is already stored in every saved row.
   Saving the code instead would be a silent rename of everybody's access. */
let nurseries = [];
let openUid = null;       // the row expanded right now
let draft = null;         // that row's permissions, being edited

const initials = (p) => (String(p.full_name || p.email || '?').trim().split(/\s+/)
  .map((s) => s[0]).slice(0, 2).join('') || '?').toUpperCase();

function flash(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.classList.add('hidden'), 2600);
}

/* ---- reading a person's current state ----
   Both fall back the same way the phone does, so what is shown here is what
   the Field Conductor actually gets. */

// canScan fails OPEN on a page nobody has configured: somebody who has never
// been through this screen keeps the access they had, rather than losing it.
function pageOn(perms, key) {
  const acts = (perms.scan_actions || {})[key];
  return acts ? !!acts.view : true;
}

/* Exactly what canScan() on the phone concludes, and it has to be exactly
   that or this screen lies.
 
   A page nobody has configured fails OPEN there — somebody who has never been
   through this screen keeps the access they had. So the ticks must show ON
   for that person, because that is what they actually have. Showing them off
   and then saving would quietly take away the Record Work button from every
   Field Conductor whose access was opened only to grant them the new Verify
   tick, which is a trap laid for whoever opens this screen next.
 
   Once a page HAS been configured, an absent action is off.

   …unless the action names its own default. The switches added under
   Maintenance did not exist when most of these rows were saved, so an absent
   answer there is not a decision anybody made — it is a question nobody was
   asked. `dflt` is what to do about that, and it is the same answer the phone
   gives (Barcode_Counter src/modules/maintenance/functions.js). Actions
   without one are the three that were here first and keep the older rule
   exactly, because changing what they mean would change saved access. */
function actionOn(perms, page, action, dflt) {
  const acts = (perms.scan_actions || {})[page];
  if (!acts) return dflt === undefined ? true : !!dflt;
  const v = acts[action];
  if (v === undefined) return dflt === undefined ? false : !!dflt;
  return !!v;
}

/* Every tick on a page — the ones nested under Record work as well — as one
   flat list. Seeding and saving do not care about the nesting; only the
   drawing does. */
function flatActions(pg) {
  return (pg.actions || []).reduce(
    (all, ac) => all.concat([ac], ac.children || []), []);
}

/* ---- the Admin Portal's and the Auditor Portal's pages ----

   A DIFFERENT RULE FROM THE FC PORTAL'S, and it has to be: those two store
   their ticks the way every module with its own User Access screen stores
   them, and this screen must conclude exactly what that screen and
   MJMAccess.canDo() conclude or it lies about what it is showing.

   This is effectiveActions() out of shared/shared_module_access.js, which is
   the original. An entry saved for the page decides; with none, the MODULE
   level decides, and an action that is not admin-only comes with the page —
   which is how both modules behaved before per-page access existed. */
function modPage(perms, store, pg) {
  const saved = (perms[store + '_actions'] || {})[pg.key];
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
    const out = { view: !!saved.view };
    /* `fallbackTo` is an action SPLIT OUT of another one — see ADMIN_PAGES /
       AUDIT_PAGES. A row saved before the split answered the OLD tick, so
       that is what is read until somebody saves this row again. The same
       line is in shared_module_access.js, which is that module's own screen,
       and in canAuditAction on the phone. All three have to agree or the
       screen draws one answer and the app obeys another. */
    (pg.actions || []).forEach((a) => {
      const key = (a.fallbackTo && !(a.key in saved)) ? a.fallbackTo : a.key;
      out[a.key] = out.view && !!saved[key];
    });
    return out;
  }
  const lvl = String(((perms.modules || {})[store]) || 'none');
  const view = lvl !== 'none';
  const out = { view };
  (pg.actions || []).forEach((a) => { out[a.key] = view && (a.adminOnly ? lvl === 'admin' : true); });
  return out;
}

/* Write what the panel is SHOWING for one store into the draft, in full.
   Called the moment a tick in that store is pressed and never before, so a
   row nobody has touched keeps no entry and goes on being answered by the
   module level — this screen does not turn an unasked question into a
   decision just because somebody opened the row. */
function settleStore(store) {
  draft[store + '_actions'] = draft[store + '_actions'] || {};
  areasOfStore(store).forEach((area) => {
    (area.pages || []).forEach((pg) => {
      draft[store + '_actions'][pg.key] = modPage(draft, store, pg);
    });
  });
}

/* `<module>_pages` is the mirror `<module>_actions` is read beside — see
   shared/shared_module_access.js, which writes both on every save. Only the
   pages this screen draws are touched; anything that module's own screen
   knows about and this one does not is left exactly as it was. */
function mirrorStorePages(next, store) {
  const acts = next[store + '_actions'];
  if (!acts) return;
  next[store + '_pages'] = next[store + '_pages'] || {};
  areasOfStore(store).forEach((area) => {
    (area.pages || []).forEach((pg) => {
      const entry = acts[pg.key];
      if (!entry) return;
      next[store + '_pages'][pg.key] = entry.view ? 'normal' : 'none';
    });
  });
}

/* Is this door open to them?
 *
 * Has to conclude exactly what MJMAccess.canScanArea() concludes, or this
 * screen lies about what it is showing. An absent answer is not "no" — it is
 * "nobody has been asked", and the rule that governed the door before this
 * screen existed answers instead. Kept as its own copy rather than calling
 * MJMAccess: that reads the SIGNED-IN user's permissions, and this screen is
 * looking at somebody else's. */
function areaOn(perms, key) {
  const entry = (perms.scan_areas || {})[key];
  if (entry && entry.view !== undefined) return !!entry.view;

  const mods = perms.modules || {};
  /* Only the three levels shared_access.js will accept. Anything else is
     dropped by its normalize() and reads as no module at all, so a row saying
     "Admin" with a capital A has no scan module as far as every office page
     is concerned — and this screen must say the same rather than showing a
     tick for access that is not really there. */
  const lvl = moduleLevel(mods.scan);
  switch (key) {
    case 'manage':  return lvl === 'admin' || !!perms.manage_users;
    case 'fc':      return !!lvl && lvl !== 'none';
    case 'worker':  return false;
    case 'workers': {
      if (perms.manage_users) return true;
      const np = String(mods.npayroll || '').toLowerCase();
      if (!np || np === 'none') return false;
      const acts = (perms.npayroll_actions || {}).workers;
      return acts ? !!acts.view : true;
    }
    case 'setting': return !!perms.manage_users;
    /* Admin Portal and Audit Portal moved onto the 555 MJM Team page from the
       hub, where each had its own module-level card, and canScanArea() falls
       back to that same check — "nobody's access changed the day they moved".
       THIS COPY HAD NEITHER CASE, which did not matter while they were on no
       access screen and mattered the moment they were: `default: false` read
       every Admin Portal person as holding nothing, so their own block drew
       closed and the pages inside it could not be reached at all. */
    case 'admin_portal': return moduleLevel(mods.mobile) !== 'none';
    case 'audit_portal': return moduleLevel(mods.audit) !== 'none';
    default:        return false;
  }
}

/* What shared_access.js's normalize() would make of a module level: anything
   that is not one of the three it accepts is dropped there, so a row saying
   "Admin" with a capital A holds no module as far as every office page is
   concerned — and this screen has to say the same rather than showing a tick
   for access that is not really there. */
function moduleLevel(raw) {
  const lvl = String(raw == null ? '' : raw);
  return ['admin', 'normal', 'none'].indexOf(lvl) === -1 ? 'none' : lvl;
}

/* The same nursery is spelt differently in different places — the register
   says "UNN 1", a saved row may say "UNN1". Compare on letters and digits
   alone, so one tick governs both.

   SHARED RULE. The phone has its own copy as `nurseryKey` in
   Barcode_Counter src/lib/access.js. Change one, change the other. */
function nurseryKey(name) {
  return String(name == null ? '' : name).replace(/[^a-z0-9]/gi, '').toUpperCase();
}

/** null means every nursery. */
function areaNurseries(perms, key) {
  const per = perms.scan_area_nurseries || {};
  return Array.isArray(per[key]) ? per[key] : null;
}

/* A page's nurseries, inside the FC Portal.
 *
 * ABSENT MEANS "the same as the portal", not "all". That is the hierarchy the
 * five sections are for: the FC Portal says which nurseries this person works
 * in, and a page may narrow it further but never widen it.
 *
 * Backwards compatible on purpose. Nobody has an area list yet, so an absent
 * page list falls through to an absent area list, which means every nursery —
 * exactly what it meant before this existed. The legacy single list still
 * answers ahead of that for anyone never re-saved.
 */
function pageNurseries(perms, key) {
  /* The portal's own list, and nothing narrower. There is no per-module list
     to read any more — the screen that set one is gone — so a row saved with
     one before that is simply passed over rather than migrated: it is not
     read, it costs nothing where it sits, and the next Save drops it.
     
     `key` is kept in the signature because the callers name the page they are
     asking about, and a function that stops taking the argument reads as
     though every page must get the same answer for some deeper reason than
     "that is what the office decided". */
  const area = areaNurseries(perms, 'fc');
  if (area) return area;
  if (Array.isArray(perms.plot_status_nurseries)) return perms.plot_status_nurseries;
  return null;
}

/* ---- the list ---- */
function rowHtml(p) {
  const open = openUid === p.id;
  return `
    <div class="u-row" data-uid="${esc(p.id)}">
      <div class="flex items-center gap-3.5">
        <div class="avatar">${esc(initials(p))}</div>
        <div class="flex-1 min-w-0">
          <div class="font-black text-slate-800 text-[14px] truncate">${esc(p.full_name || '(no name)')}</div>
          <div class="text-[11.5px] text-slate-400 truncate">${esc(p.email || '—')}</div>
        </div>
        <button class="btn btn-edit ${open ? 'btn-x' : ''}" data-edit="${esc(p.id)}"
                ${open ? 'title="Close" aria-label="Close"' : ''}>${open ? '&#10005;' : 'Edit Access'}</button>
      </div>
      ${open ? panelHtml() : ''}
    </div>`;
}

function panelHtml() {
  return '<div class="panel space-y-2.5">' +
    AREAS.map(areaBlockHtml).join('') +
    `<div class="flex items-center justify-end gap-2 pt-1">
       <button class="btn btn-ghost" data-cancel="1">Cancel</button>
       <button class="btn btn-save" id="save-btn">Save</button>
     </div>` +
    '</div>';
}

/* One PORTAL: its tick, whatever doors are nested under it, the nurseries it
   is confined to — the FC Portal alone, because that is the only list
   anything reads — and the pages inside it.

   Nested doors and pages are DRAWN while the portal is off and merely
   hidden, never left out. Switching the portal back on has to put back the
   answers that were there, not an empty space. */
function areaBlockHtml(area) {
  const on = areaOn(draft, area.key);
  const list = areaNurseries(draft, area.key);
  const all = list === null;
  /* Matched on letters and digits alone, the same way the phone matches them
     (Barcode_Counter src/lib/access.js `nurseryKey`). A row saved as "UNN 1"
     and a chip valued "UNN1" are the same nursery, and a tick that failed to
     show for one spelling would be taken away the moment Save was pressed. */
  const chosen = new Set(all ? [] : list.map(nurseryKey));
  return `
    <div class="area-block ${on ? 'on' : ''}">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" class="chk mt-0.5" data-area="${area.key}" ${on ? 'checked' : ''}>
        <span class="min-w-0">
          <span class="block text-[14px] font-black text-slate-800">${esc(area.label)}</span>
          <span class="block text-[11px] text-slate-400 leading-snug">${esc(area.desc || '')}</span>
        </span>
      </label>

      ${(area.children && area.children.length) ? `
        <div class="area-pages ${on ? '' : 'hidden'}">
          <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
            What they may open in it
          </div>
          <div class="space-y-2.5">${area.children.map(childAreaHtml).join('')}</div>
        </div>` : ''}

      ${area.nurseries ? `
      <div class="mt-2.5 ${on ? '' : 'hidden'}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nurseries</div>
        <div class="flex flex-wrap gap-2">
          <label class="nur ${all ? 'sel' : ''}">
            <input type="checkbox" data-anall="${area.key}" ${all ? 'checked' : ''}> All
          </label>
          ${nurseries.map((n) => {
            const sel = !all && chosen.has(nurseryKey(n.value));
            return `
            <label class="nur ${sel ? 'sel' : ''}" title="${esc(n.name)}">
              <input type="checkbox" data-narea="${area.key}" data-nname="${esc(n.value)}"
                     ${sel ? 'checked' : ''}>
              ${esc(n.code)}
            </label>`; }).join('')}
        </div>
      </div>` : ''}

      ${(area.pages && area.pages.length) ? `
        <div class="area-pages ${on ? '' : 'hidden'}">
          <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
            What they may open in it
          </div>
          <div class="space-y-2.5">${area.pages.map(
            (pg) => (area.store === 'scan' ? pageBlockHtml(pg) : modPageBlockHtml(area, pg))
          ).join('')}</div>
        </div>` : ''}

      ${(area.notes && area.notes.length) ? `
        <div class="area-pages ${on ? '' : 'hidden'}">
          <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
            What they may open in it
          </div>
          <div class="space-y-2.5">${area.notes.map(noteRowHtml).join('')}</div>
        </div>` : ''}
    </div>`;
}

/* A door nested inside a portal — Worker System and User Access Setting,
   inside Worker Portal Manage. The same `scan_areas` tick as the portal
   above it, with the same fallback; only where it is drawn has changed. */
function childAreaHtml(child) {
  const on = areaOn(draft, child.key);
  return `
    <div class="page-block ${on ? 'on' : ''}">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" class="chk mt-0.5" data-area="${child.key}" ${on ? 'checked' : ''}>
        <span class="min-w-0">
          <span class="block text-[13px] font-black text-slate-800">${esc(child.label)}</span>
          <span class="block text-[11px] text-slate-400 leading-snug">${esc(child.desc || '')}</span>
        </span>
      </label>
    </div>`;
}

/* Something a portal offers that is NOT decided here — the Worker Portal's
   Maintenance. Drawn as a row so the portal's contents are complete, and with
   no checkbox at all, because the one thing worse than no tick is a tick
   nothing reads. It says where the answer actually lives. */
function noteRowHtml(note) {
  return `
    <div class="page-block" style="opacity:.75;">
      <div class="flex items-start gap-3">
        <span class="mt-0.5 text-[13px] leading-none text-slate-300">—</span>
        <span class="min-w-0">
          <span class="block text-[13px] font-black text-slate-600">${esc(note.label)}</span>
          <span class="block text-[11px] text-slate-400 leading-snug">${esc(note.desc || '')}</span>
        </span>
      </div>
    </div>`;
}

/* A page of the Admin Portal or the Auditor Portal: the same drawing as an FC
   Portal page, reading and writing the keys that module's OWN User Access
   screen uses. `data-mpage` / `data-mact` carry the store so one handler
   serves both. */
function modPageBlockHtml(area, pg) {
  const eff = modPage(draft, area.store, pg);
  return `
    <div class="page-block ${eff.view ? 'on' : ''}">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" class="chk mt-0.5" data-mpage="${pg.key}" data-mstore="${area.store}"
               ${eff.view ? 'checked' : ''}>
        <span class="min-w-0">
          <span class="block text-[13px] font-black text-slate-800">${esc(pg.label)}</span>
          <span class="block text-[11px] text-slate-400 leading-snug">${esc(pg.desc || '')}</span>
        </span>
      </label>

      ${(pg.actions && pg.actions.length) ? `
      <div class="mt-2.5 ${eff.view ? '' : 'hidden'}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">What they may do</div>
        <div class="space-y-2">
          ${pg.actions.map((ac) => `
            <label class="flex items-start gap-2.5 cursor-pointer">
              <input type="checkbox" class="chk mt-0.5" data-mact="${ac.key}"
                     data-mactpage="${pg.key}" data-mstore="${area.store}"
                     ${eff[ac.key] ? 'checked' : ''}>
              <span class="min-w-0">
                <span class="block text-[12.5px] font-black text-slate-700">${esc(ac.label)}</span>
                <span class="block text-[11px] text-slate-400 leading-snug">${esc(ac.desc || '')}</span>
              </span>
            </label>`).join('')}
        </div>
      </div>` : ''}
    </div>`;
}


/* One tick, and whatever is nested under it. Recursive so Record work's five
   are drawn by the same code as Record work itself — one row, one rule about
   what a row looks like. Children are drawn but hidden while the parent is
   off, rather than left out: switching Record work back on should put back
   the answers that were there, not an empty space. */
function actionRowHtml(pg, ac) {
  const on = actionOn(draft, pg.key, ac.key, ac.dflt);
  return `
    <label class="flex items-start gap-2.5 cursor-pointer">
      <input type="checkbox" class="chk mt-0.5" data-act="${pg.key}" data-actkey="${ac.key}"
             ${on ? 'checked' : ''}>
      <span class="min-w-0">
        <span class="block text-[12.5px] font-black text-slate-700">${esc(ac.label)}</span>
        <span class="block text-[11px] text-slate-400 leading-snug">${esc(ac.desc || '')}</span>
      </span>
    </label>
    ${(ac.children && ac.children.length) ? `
      <div class="act-kids ${on ? '' : 'hidden'}">
        ${ac.children.map((k) => actionRowHtml(pg, k)).join('')}
      </div>` : ''}`;
}

/* One nursery list per portal, and none per module.
   
   Every module used to carry its own row of nursery chips — "Same as portal"
   and then the portal's own nurseries, to narrow one module further than the
   rest. Nobody narrowed one. What it produced instead was the same question
   asked five times down a screen where the answer at the top already decided
   it, and five chances to leave a module pointing at a nursery the portal no
   longer holds.
   
   The nurseries ticked on the portal now govern everything inside it: which
   nursery is selected is which nursery's data a module shows. A row already
   saved with its own list is not read any more — pageNurseries falls through
   to the portal's — so nothing has to be cleaned up before this reads right. */
function pageBlockHtml(pg) {
  const on = pageOn(draft, pg.key);
  return `
    <div class="page-block ${on ? 'on' : ''}">
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" class="chk" data-page="${pg.key}" ${on ? 'checked' : ''}>
        <span class="block text-[13px] font-black text-slate-800 min-w-0">${esc(pg.label)}</span>
      </label>

      ${(pg.actions && pg.actions.length) ? `
      <div class="mt-2.5 ${on ? '' : 'hidden'}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">What they may do</div>
        <div class="space-y-2">
          ${pg.actions.map((ac) => actionRowHtml(pg, ac)).join('')}
        </div>
      </div>` : ''}

    </div>`;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = profiles.filter((p) => !q
    || String(p.full_name || '').toLowerCase().includes(q)
    || String(p.email || '').toLowerCase().includes(q));
  $('empty').classList.toggle('hidden', shown.length > 0);
  $('list').innerHTML = shown.map(rowHtml).join('');
}

/* ---- editing ---- */
function openRow(uid) {
  const p = profiles.find((x) => x.id === uid);
  if (!p) return;
  // A copy: nothing reaches the person's row until Save.
  draft = JSON.parse(JSON.stringify(p.permissions || {}));
  draft.scan_actions = draft.scan_actions || {};
  draft.scan_nurseries = draft.scan_nurseries || {};
  draft.scan_areas = draft.scan_areas || {};
  draft.scan_area_nurseries = draft.scan_area_nurseries || {};

  /* The five doors, settled the same way and for the same reason as the pages
     below: areaOn() falls back to whatever governed each door before this
     screen existed, so what is drawn is what this person actually holds — and
     saving must record that rather than turning an unasked question into a no.
     Somebody who could open Worker System yesterday must still be able to
     after an admin opens their row and presses Save without touching it. */
  /* The nested doors as well as the portals. Worker System and Setting moved
     INSIDE Worker Portal Manage on screen and nowhere else — they are the
     same two `scan_areas` ticks they always were, and a seeding that walked
     only the top level would stop recording them and quietly take them away
     from everybody whose row was opened. */
  ALL_AREAS.forEach((a) => {
    const entry = draft.scan_areas[a.key];
    draft.scan_areas[a.key] = { ...(entry || {}), view: areaOn(draft, a.key) };
  });

  /* Settle what the panel SHOWS into the draft the moment the row is opened,
     so Save records what the admin was looking at.

     canScan fails open, so a page nobody has configured renders ticked. It
     used to be saved as false: opening somebody's row and pressing Save with
     no changes at all silently took away every page they had. Writing the
     displayed value in first is what makes the panel honest. */
  PAGES.forEach((pg) => {
    const acts = draft.scan_actions[pg.key];
    /* Seed from what this person effectively has, not from an empty object:
       actionOn() reads an unconfigured page as every action on, so the ticks
       start where their access already is and saving changes only what was
       actually touched. */
    const seeded = { ...(acts || {}), view: acts ? !!acts.view : true };
    /* Seed the OLD actions — record, verify, export — because canScan reads a
       page all-or-nothing: once an entry exists, anything not named in it is
       off, so leaving them out of a saved row takes them away.

       The newer switches, the ones carrying a `dflt`, are deliberately NOT
       seeded. They have their own per-key default in the app, so an absent one
       means "nobody has decided about this person" — and that is exactly what
       System Setting's company-wide switch acts on. Writing today's default in
       here would turn every person the admin merely LOOKED at into somebody
       with an explicit answer, and the company switch would then reach fewer
       people every time this screen was opened. An explicit value is written
       the moment somebody actually ticks one. */
    flatActions(pg).forEach((ac) => {
      if (ac.dflt !== undefined) return;
      if (seeded[ac.key] === undefined) seeded[ac.key] = actionOn(draft, pg.key, ac.key, ac.dflt);
    });
    draft.scan_actions[pg.key] = seeded;
  });

  /* Settle the pre-per-page list, and drop it.

     It used to be copied onto all five pages. Its home is the FC Portal now:
     that is what it always meant — the nurseries this person works in — and
     one list on the portal with the pages following it says so, where five
     identical copies said it five times and drifted apart the first time
     anybody edited one.

     It has to be settled somewhere, not merely read: "All" means removing the
     entry, and while the old list survived it would answer in its place and
     the tick would come straight back off. The panel has to be reading only
     what the panel writes. */
  if (Array.isArray(draft.plot_status_nurseries)) {
    if (!Array.isArray(draft.scan_area_nurseries.fc)) {
      draft.scan_area_nurseries.fc = draft.plot_status_nurseries.slice();
    }
    delete draft.plot_status_nurseries;
  }

  openUid = uid;
  render();
}
function closeRow() { openUid = null; draft = null; render(); }

document.addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]');
  if (edit) { const uid = edit.dataset.edit; return uid === openUid ? closeRow() : openRow(uid); }
  if (e.target.closest('[data-cancel]')) return closeRow();
  if (e.target.id === 'save-btn') return save();
});

document.addEventListener('change', (e) => {
  if (!draft) return;
  const t = e.target;

  if (t.dataset.area) {
    draft.scan_areas = draft.scan_areas || {};
    const entry = draft.scan_areas[t.dataset.area] || {};
    entry.view = t.checked;
    draft.scan_areas[t.dataset.area] = entry;
    return render();
  }
  if (t.dataset.anall) {
    // "All" is the ABSENCE of a list, so a nursery added next month is
    // included without anybody re-ticking every person.
    const key = t.dataset.anall;
    draft.scan_area_nurseries = draft.scan_area_nurseries || {};
    if (t.checked) delete draft.scan_area_nurseries[key];
    else draft.scan_area_nurseries[key] = nurseries.map((n) => n.value);
    return render();
  }
  if (t.dataset.narea) {
    const key = t.dataset.narea;
    draft.scan_area_nurseries = draft.scan_area_nurseries || {};
    /* Coming out of "All" by picking one: that nursery becomes the whole
       selection there and then, rather than making somebody untick All (which
       selects everything) and then untick the rest. */
    if (!Array.isArray(draft.scan_area_nurseries[key])) {
      draft.scan_area_nurseries[key] = [t.dataset.nname];
    } else {
      draft.scan_area_nurseries[key] = [...document.querySelectorAll('[data-narea="' + key + '"]')]
        .filter((cb) => cb.checked).map((cb) => cb.dataset.nname);
    }
    /* Any per-module list left over from when modules had their own nurseries
       is dropped as soon as the portal's list is touched. Nothing reads it —
       every module follows the portal now — and a stale list sitting in the
       row is a thing somebody reads later and believes. */
    if (key === 'fc') PAGES.forEach((pg) => { delete draft.scan_nurseries[pg.key]; });
    return render();
  }

  if (t.dataset.page) {
    const acts = draft.scan_actions[t.dataset.page] || {};
    acts.view = t.checked;
    draft.scan_actions[t.dataset.page] = acts;
    return render();
  }

  /* The Admin Portal's and the Auditor Portal's pages. Settling the whole
     store first is what keeps "nobody has been asked" meaning that: until a
     tick in it is pressed the row carries no entry at all and the module
     level answers, exactly as it does today. The moment one IS pressed the
     block becomes explicit in full — which is what that module's own User
     Access screen does on every save, so the two agree. */
  if (t.dataset.mpage) {
    settleStore(t.dataset.mstore);
    draft[t.dataset.mstore + '_actions'][t.dataset.mpage].view = t.checked;
    return render();
  }
  if (t.dataset.mact) {
    settleStore(t.dataset.mstore);
    draft[t.dataset.mstore + '_actions'][t.dataset.mactpage][t.dataset.mact] = t.checked;
    return render();
  }
  if (t.dataset.act) {
    const acts = draft.scan_actions[t.dataset.act] || {};
    acts[t.dataset.actkey] = t.checked;
    draft.scan_actions[t.dataset.act] = acts;
    return render();
  }
  if (t.id === 'q') render();
});
$('q').addEventListener('input', render);

async function save() {
  const p = profiles.find((x) => x.id === openUid);
  if (!p || !draft) return;

  /* Nobody may close their own Setting door. It is the only way back in, and
     an admin who unticks it on their own row has to be let back in by hand
     from the database. The worker portal refuses the same thing for the same
     reason — see worker_set_portal in shared/create_worker_portal.sql. */
  const me = MJMAccess.user();
  if (me && me.id === p.id && !((draft.scan_areas || {}).setting || {}).view) {
    flash('You cannot switch Setting off for yourself — it is the way back in.');
    return;
  }

  const btn = $('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  /* Every page is already explicitly recorded — openRow() writes the
     displayed value in, including the ones that were only ticked because
     canScan fails open. So the draft is the truth and nothing is re-derived
     here; deriving it again is exactly how the false-for-everything bug got
     in. */
  const next = { ...(p.permissions || {}), ...draft };
  /* The two stores that keep a `_pages` mirror beside their `_actions`. A
     store nobody touched has no entry in the draft, so this writes nothing
     for it — which is the whole point of settling on first touch. */
  STORES.forEach((store) => mirrorStorePages(next, store));
  /* The single pre-per-page list is dropped once this person has been saved
     here: it is only a fallback for anyone who has NOT been, and leaving it
     behind would keep answering for pages set to All. */
  delete next.plot_status_nurseries;

  const { error } = await _supabase.from('shared_profiles')
    .update({ permissions: next }).eq('id', p.id);

  btn.disabled = false; btn.textContent = 'Save';
  if (error) { flash('Could not save: ' + error.message); return; }
  p.permissions = next;
  closeRow();
  flash('Saved for ' + (p.full_name || p.email || 'user'));
}

/* The nursery chips, built the way System Setting → Location builds its row.
 *
 * Four sources, and each is there because leaving it out loses something:
 *
 *   1. operation_nurseries — the register. This is the answer to "what
 *      nurseries are there", and the whole point of the change.
 *   2. KEEP_NURSERIES — the four sections the register files people under
 *      whether or not the nursery table carries them. The table holds three
 *      today and the register uses four; a screen showing only what came back
 *      would be quietly missing one.
 *   3. UNE — the Estate, same reasoning, and the Location card adds it the
 *      same way.
 *   4. Anything already saved on somebody's row. A nursery retired from the
 *      register but still ticked for six people must stay visible, or an admin
 *      cannot see what they hold and cannot take it away. Access nobody can
 *      see is the thing this screen exists to prevent.
 *
 * Ordered by location — Pre Nursery, Main Nursery, Estate, then anything in
 * none of them — so the row reads in the same order as the card it comes from.
 */
function buildNurseries(register, people) {
  const LOC = window.MJMWorkerLocations;
  const named = new Map();                          // code → register name
  (register || []).forEach((n) => {
    const c = LOC.code(n.name);
    if (c) named.set(c, String(n.name || '').trim());
  });

  const codes = [];
  const add = (c) => { if (c && !codes.includes(c)) codes.push(c); };
  LOC.KEEP_NURSERIES.forEach((k) => add(k.code));
  [...named.keys()].forEach(add);
  add('UNE');

  /* What people already hold, whatever the register says today. Kept under
     its own name too, so the chip saves back exactly the spelling that is
     already in the row rather than renaming it on the next Save. */
  (people || []).forEach((p) => {
    const per = (p.permissions || {}).scan_area_nurseries || {};
    Object.keys(per).forEach((k) => {
      if (!Array.isArray(per[k])) return;
      per[k].forEach((name) => {
        const c = LOC.code(name);
        if (!c) return;
        if (!named.has(c)) named.set(c, String(name).trim());
        add(c);
      });
    });
  });

  const { locations, unplaced } = LOC.group(codes);
  return locations.reduce((all, l) => all.concat(l.codes), []).concat(unplaced)
    .map((c) => ({ code: c, name: named.get(c) || c, value: named.get(c) || c }));
}

/* ---- boot ---- */
(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    $('loading').classList.add('hidden');
    /* Setting is its own tick now, falling back to Manage Users for anybody
       nobody has set one for. Kept as canScanArea rather than canManageUsers
       so this screen answers to the same rule it writes — an admin who takes
       Setting away from themselves loses it, which is honest, and the row
       above refuses to be the one that does it. */
    if (!MJMAccess.canScanArea('setting')) { $('forbidden').classList.remove('hidden'); return; }

    const [reg, people] = await Promise.all([
      _supabase.from('operation_nurseries').select('name,license').order('name'),
      _supabase.from('shared_profiles').select('id, email, full_name, permissions')
        .order('full_name', { ascending: true }),
    ]);

    /* Only people the main User Access has opened one of these portals for.
       Setting up pages for somebody who cannot open any of them is a setting
       with no effect, and a list of every account to scroll past.

       THREE MODULES, not one. It was `scan` alone, from when this screen
       governed the FC Portal and the back office and nothing else. It now
       carries the Admin Portal and the Auditor Portal too, and an Admin
       Portal person with no scan access of their own — which is an ordinary
       thing to be, and scan_admin.html says so in its own words — would have
       been missing from the one screen that grants them anything. */
    const PORTAL_MODULES = ['scan', 'mobile', 'audit'];
    profiles = (((people && people.data) || [])).filter((p) => {
      const mods = (p.permissions || {}).modules || {};
      return PORTAL_MODULES.some((m) => {
        const lvl = mods[m];
        return lvl && String(lvl).toLowerCase() !== 'none';
      });
    });

    nurseries = buildNurseries((reg && reg.data) || [], profiles);

    render();
    $('main').classList.remove('hidden');
  } catch (e) {
    console.warn(e);
    $('loading').classList.add('hidden');
    $('forbidden').classList.remove('hidden');
  }
})();
</script>
