<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The page itself must not go stale. Every script here is cache-busted with
     a ?v= that lives IN THIS FILE, so a cached copy of the page goes on asking
     for the OLD script for ever and a deploy never reaches anybody. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Module Assess Control — Seal Manage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d9488%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_staff_gate.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=4"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
MJMModuleAccess.init({
  module: 'seal',
  title:  'Seal Manage',
  moduleLabel: 'Seal Manage',
  icon:   '🏷️',
  accent: 'teal',
  back:   { href: 'seal_dashboard.html', label: 'Back' },
  note:   `Seal at HQ (ordering, receiving and packing a delivery), settling a missed-scan
           gap and Settings had no ticks of their own before this — anybody opened for Seal
           Manage at all could already do every one of them. Each tick below defaults to
           exactly that, so nobody loses anything the day this ships; tick one explicitly
           to hand it to, or take it from, a particular person.`,
  pages: [
    { key:'nursery', label:'Seal at MJM Nursery', desc:'Seal with Customer, Seal in Nursery Cabinet, Seal used — and settling a missed-scan gap',
      actions:[
        { key:'settle', label:'Key a DO to settle a missed scan', desc:'Say which DO a seal that went out unscanned actually left on, closing the gap and its NELOS case',
          fallbackTo:'view' }
      ]},
    { key:'hq', label:'Seal at HQ', desc:'Ordering seals from the supplier, receiving them, and packing a delivery to the nursery',
      actions:[
        { key:'manage', label:'Order, receive & pack deliveries', desc:'Place a new seal order, receive seals into the HQ cabinet, pack and confirm a delivery to site',
          highlight:true, chip:'Seal at HQ', fallbackTo:'view' }
      ]},
    { key:'report', label:'Report', desc:'Every seal number from the first to the latest, and where each one is now' },
    { key:'nelos', label:'NELOS', desc:'Every case a seal check has opened — missed scans, stock mismatches and the rest' },
    { key:'settings', label:'Settings', desc:'Whether a seal is checked against received stock, and which NELOS queue a seal case opens in',
      actions:[
        { key:'manage', label:'Open Settings', desc:'Change the stock check and the NELOS queue for seal cases',
          adminOnly:true, highlight:true, chip:'Settings' }
      ]}
  ]
});
</script>
</body>
</html>
